lass=\"translation\">献公灭掉虢国，五年之后，又攻取虞国。“亡”是使灭亡；“举”是攻取。这里保留本篇“五年”的记载，不与其他史书混写。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>荀息牵马操璧而前曰：“璧则犹是也，而马齿加长（zhǎng）矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">荀息牵马、拿玉走上前，说：“宝玉还是原来的宝玉，只是马的年龄增加了。”“操”是拿着；“马齿”代指年龄。当初送出的礼物，果然又回到晋国。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">晋国策划并实施侵略，《谷梁传》却把议论重点放在虞公为什么帮助别人拆掉自己的屏障。追究虞公贪利、误判的责任，不等于晋国没有侵略责任。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/虞師晉師滅夏陽\" target=\"_blank\" rel=\"noopener\">《虞师晋师灭夏阳》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.shidianguji.com/book/NA00011/chapter/1mgp8v33u8gmc\" target=\"_blank\" rel=\"noopener\">《谷梁注疏》卷七\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-17", "volume": 3, "volume_title": "卷三 · 周文", "number": 17, "title": "晋献公杀世子申生", "file": "卷三/17-晋献公杀世子申生.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《晋献公杀世子申生》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第17篇\u003cbr>选自《礼记·檀（tán）弓上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公听信骊姬谗言，认定世子申生想加害自己，准备杀他。《礼记》把申生描写为不愿伤父亲之心、也不愿背负罪名出走的人；以下心理理由属于文中人物的话，不能当作已经证实的内心实录。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献公将杀其世子申生。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公准备杀死世子申生。“世子”是诸侯预定的继承人。正文最后写自尽，标题归责于献公，不是说他亲自动手。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公子重（chóng）耳谓之曰：“子盖（hé）言子之志于公乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳对他说：“您为什么不向父亲说明自己的真实心意呢？”重耳是申生异母弟，后来成为晋文公。“子”是尊称；“盖”通“盍”，何不；“志”是心意。重耳劝他申辩受诬陷之事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>世子曰：“不可。君安骊（lí）姬，是我伤公之心也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生说：“不行。父亲依恋骊姬，以她为安；如果我揭露她，就是伤父亲的心。”按文中解释，他担心骊姬受罚会使父亲失去所爱。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“然则盖（hé）行乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳说：“既然如此，为什么不离开呢？”“行”是出走、逃往别国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>世子曰：“不可。君谓我欲杀君也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生说：“不行。父亲认为我想杀害他。”这里的“君”既是国君，也是父亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“天下岂有无父之国哉？我何行如之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“天下难道有哪个国家的人没有父亲吗？我又能逃到哪里？”“如”是到、往。他担心各国都会憎恶谋害父亲的人。这是人物的顾虑，不等于客观上必然无处可去。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使人辞于狐突曰：“申生有罪，不念伯氏之言也，以至于死。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生派人向狐突告别：“申生有过错，没有把您的话放在心上，以致落到将死的地步。”狐突是老师，“伯氏”是对他的称呼。“辞”是告别。按旧注，狐突早先劝他避祸；此处自责没有听劝，不是承认谋害父亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“申生不敢爱其死。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“申生不敢因为爱惜生命而逃避死亡。”“爱”是爱惜、吝惜，不是喜爱死亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽然，吾君老矣，子少（shào），国家多难（nàn）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虽然如此，国君已年老，儿子还年幼，国家又有许多危难。”“虽然”是虽然如此；“子”指骊姬之子奚齐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“伯氏不出而图吾君。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您又没有出来为国君谋划国事。”“出”是出来任事；“图”是谋划。按旧注，狐突当时称病不出，申生为此担忧。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“伯氏苟出而图吾君，申生受赐而死。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您若肯出来为国君谋划国事，申生就是蒙受您的恩惠而死了。”“苟”是如果；“赐”是恩惠。这是在托付后事，希望狐突辅政。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>再拜稽（qǐ）首，乃卒。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生拜了两次，叩头至地，随后死去。“再拜”是拜两次；“稽首”是郑重叩首礼。按旧注，随后自缢而死。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是以为恭世子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此被称为“恭世子”。“恭”是谥号，突出恭敬、顺从。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你的质疑：\u003c/strong>“没有是否正义了。”\u003c/p>\n\u003cp class=\"translation\">父亲听信谗言、冤枉儿子，讨论却集中在儿子如何维护父亲感受和名誉。受到伤害的人不应因此承担替伤害者维持名誉的全部责任。理解申生的感情，不等于赞成牺牲生命；他有理由申辩、离开和保全自己。\u003c/p>\n\u003cp class=\"translation\">旧注也批评他不申辩而死，使父亲陷于杀子之不义，所以只谥“恭”而非“孝”。但这一理由仍以君父名誉为中心，不能取代对申生是否遭到公正对待的追问。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>你的问题：\u003c/strong>“这是西汉儒家瞎编的吧？”\u003c/p>\n\u003cp class=\"translation\">申生之死也见于《左传》《史记》，但这些文献可能沿用共同材料，不能算多份完全独立证据。具体对话与心理不能当作现场实录；叙事可能经过传述、选择和伦理化整理，目前不能据此断定是西汉某人凭空捏造。应说“《礼记》把申生描写成这样”，而不是断言真实申生必然如此想。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/晉獻公殺世子申生\" target=\"_blank\" rel=\"noopener\">《晋献公杀世子申生》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/08\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷八\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.shidianguji.com/mid-page/7371189612309463077\" target=\"_blank\" rel=\"noopener\">《左传》僖公相关记载\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-18", "volume": 3, "volume_title": "卷三 · 周文", "number": 18, "title": "曾子易箦", "file": "卷三/18-曾子易箦.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《曾子易箦（zé）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第18篇\u003cbr>选自《礼记·檀弓上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">曾子就是曾参，孔子的弟子。本文传述他临终听童子指出自己使用大夫规格的床席，便坚持更换，以求合乎礼制的故事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子寝疾，病。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子卧病在床，病情已经很重。“寝疾”是卧病；“病”进一步表示病势沉重，不是简单重复。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乐（yuè）正子春坐于床下，曾元、曾申坐于足，童子隅（yú）坐而执烛。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">弟子乐正子春坐在床旁，曾子的两个儿子曾元、曾申坐在床脚边，童子坐在角落里拿着照明的烛。“乐正”是姓氏；“隅”是角落；“执”是拿着。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>童子曰：“华而睆（huǎn），大夫之箦（zé）与（yú）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">童子说：“这么华美光洁，是大夫使用的床席吧？”“箦”指竹席或竹编床面；“与”通“欤”。这句点出床席的身份规格。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子春曰：“止！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子春说：“别说了！”按旧注，他担心曾子病重，不能再搬动身体换席。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子闻之，瞿（qú）然曰：“呼（hū）！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子听见，惊觉起来，发出“啊”的一声。“瞿然”是惊觉的样子；旧注将“呼”解释为虚弱的出声。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“华而睆，大夫之箦与？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">童子又说：“这么华美光洁，是大夫使用的床席吧？”通常理解为童子重复前话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“然。斯季孙之赐也，我未之能易也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“是的。这是季孙送给我的，我还没能换掉。”季孙是鲁国卿大夫家族之称。“斯”是这；“易”是更换；“未之能易”即未能易之。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“元，起易箦！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“曾元，起来，把床席换掉！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾元曰：“夫子之病革（jí）矣，不可以变。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾元说：“您的病已经很危急，不能再搬动身体了。”“夫子”是尊称，这里指父亲；“革”读jí，是危急；“变”指搬动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“幸而至于旦，请敬易之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“希望能等到天亮，到时再让我恭敬地替您更换。”“幸”表示希望；“旦”是天亮。他并非拒绝更换，而是担心父亲此刻承受不住。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“尔之爱我也，不如彼。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“你这样爱我，还不如那个童子。”“尔”是你；“彼”指童子。按文中判断，儿子顾惜身体，童子则提醒纠正不合礼之处。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君子之爱人也以德，细人之爱人也以姑息。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“君子爱人，会帮助他成就德行；见识狭小的人爱人，只求让他眼前安适。”“细人”是文中贬称；“姑息”在这里侧重迁就、苟求眼前安适。这是曾子在故事中的价值判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“吾何求哉？吾得正而毙（bì）焉，斯已矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我还求什么？能合乎正礼而死，就够了。”“正”在本篇具体指合乎礼制，不等于现代公平正义；“毙”是死亡；“斯已矣”是这样就够了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>举扶而易之，反席未安而没（mò）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">众人抬扶曾子，换掉床席；让他重新躺下，还没安顿好，他就去世。“反”通“返”；“没”通“殁”。原文写换席后随即去世，没有明确证明换席就是死因。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你的问题：\u003c/strong>“大夫赐的席不能用，为什么已经睡了呢？不能死的时候用吗？”\u003c/p>\n\u003cp class=\"translation\">正文承认已经使用，只说“未之能易”，没有充分交代此前为何不换。上一轮把它概括为“没有大夫身份就一概不能用”过于简单，应以此处修订为准。\u003c/p>\n\u003cp class=\"translation\">《礼记正义》补充解释：未病之时尚可睡用，病重时应改正；因为身体虚弱，所以一拖再拖。这接近“平时尚可用，但不应以这种状态临终”的解释。它是旧注替故事作的说明，正文没有明确写出这条完整规则。若觉得为身份规格冒搬动风险很牵强，这个疑问仍然成立。\u003c/p>\n\u003cp class=\"translation\">可以分别判断：坚持自己认定的原则是否值得尊重，以及原则维护的身份等级是否合理。理解文章赞扬什么，不要求接受全部价值判断。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/曾子易簀\" target=\"_blank\" rel=\"noopener\">《曾子易箦》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/09\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷九\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-19", "volume": 3, "volume_title": "卷三 · 周文", "number": 19, "title": "有子之言似夫子", "file": "卷三/19-有子之言似夫子.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《有子之言似夫子》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第19篇\u003cbr>选自《礼记·檀弓上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">有子、曾子、子游都是孔子弟子。曾子转述“丧欲速贫，死欲速朽”，有子觉得不符合孔子一贯主张，由此引出对说话语境的讨论。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子问于曾子曰：“问丧（sàng）于夫子乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子问曾子：“您从老师那里听说过关于失去官位的话吗？”有子名有若；夫子指孔子。第二个“问”，旧注认为应作“闻”；“丧”是失去官位，不是办丧事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“闻之矣：丧欲速贫，死欲速朽。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“听过：失去官位，希望赶快贫穷；死后，希望赶快腐朽。”“速”是赶快；“朽”是腐烂。单独这样转述，很容易产生误解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“是非君子之言也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“这不是君子应说的话！”“是”是这，“非”是不是，要拆开理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“参（shēn）也闻诸夫子也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“我曾参是亲自从老师那里听来的！”“诸”相当于“之于”，“闻诸夫子”是从孔子那里听到。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子又曰：“是非君子之言也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子再次说：“这不是君子应说的话！”他认为把它当一般主张，与孔子思想不符。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“参也与子游闻之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“我和子游一起听到的。”子游名言偃，是另一位在场者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“然！然则夫子有为（wèi）言之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“这样啊！那么老师一定是针对具体情况才说的。”“有为言之”是有所针对而说。他调整了判断：话可能说过，但必须联系当时事情理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子以斯言告于子游。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子把有子的话告诉子游。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子游曰：“甚哉！有子之言似夫子也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子游说：“有子的见解真像老师啊！”赞扬他理解孔子说话用意的能力。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔者夫子居于宋，见桓（huán）司马自为石椁（guǒ），三年而不成。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以前老师住在宋国，看见桓司马为自己造石椁，三年还没完成。”桓司马即桓魋（tuí），是宋国司马；“椁”是套在棺外的外棺。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫子曰：‘若是其靡（mí）也，死不如速朽之愈也！’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“老师说：‘要是这样奢侈浪费，死后还不如赶快腐朽来得好！’”“靡”是奢侈耗费；“愈”是更好。批评的是为防腐朽而过度耗费，并非普遍提倡速朽。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“死之欲速朽，为桓司马言之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓希望死后赶快腐朽，是针对桓司马说的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“南宫敬叔反，必载宝而朝（cháo）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“南宫敬叔返回鲁国后，朝见国君总要带着宝物。”他是鲁国大夫。“反”通“返”。为何带宝，旧说不同：有说行贿求复位，也有说怕再被逐而随身携财；原文未明确交代。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫子曰：‘若是其货也，丧（sàng）不如速贫之愈也？’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“老师说：‘如果这样看重财货，失位后还不如赶快贫穷来得好！’”这是针对敬叔对财货的依赖、追逐，不是劝所有失位者变穷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“丧之欲速贫，为敬叔言之也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓失位后希望赶快贫穷，是针对南宫敬叔说的！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子以子游之言告于有子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子把子游的解释告诉有子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“然！吾固曰非夫子之言也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“正是这样！我本来就说，这不是老师的主张。”“固”是本来。他不再否认说过这些话，而是否认脱离语境后的字面意义代表孔子的一般主张。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“子何以知之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子问：“您凭什么知道？”“何以”就是以何、凭什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“夫子制于中都，四寸之棺，五寸之椁，以斯知不欲速朽也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“老师治理中都时，规定棺板厚四寸、椁板厚五寸，由此知道他不主张死者赶快腐朽。”中都是鲁国城邑。这是本文给出的行为依据。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔者夫子失鲁司寇，将之荆（jīng），盖（gài）先之以子夏，又申之以冉（rǎn）有，以斯知不欲速贫也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以前老师失去鲁国司寇职位，准备前往楚国，大概先派子夏去，随后又派冉有去，由此知道他不主张失位后赶快贫穷。”“之”是往；“荆”指楚；“申”是再次、重复。按旧注，先遣弟子是考察能否任职、安排去处。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">确认“某人说过”，不等于已弄懂“他是什么意思”。要核对针对的人和事，也要区分通常主张与两种不理想情况之间的比较。故事以有子为能理解孔子者，这是传文的叙事安排，不是对每位弟子理解能力的全面评估。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>词语记录：\u003c/strong>申 shēn：再次、重复。例句“又申之以冉有”，意思是随后又派冉有前去，已收入词表第48条。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/有子之言似夫子\" target=\"_blank\" rel=\"noopener\">《有子之言似夫子》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記纂言_(四庫全書本)/卷14下\" target=\"_blank\" rel=\"noopener\">吴澄《礼记纂言》卷十四下\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-20", "volume": 3, "volume_title": "卷三 · 周文", "number": 20, "title": "公子重耳对秦客", "file": "卷三/20-公子重耳对秦客.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《公子重（chóng）耳对秦客》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第20篇\u003cbr>选自《礼记·檀弓下》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公去世时，重耳正在狄地避难。秦穆公派使者吊唁，同时劝他抓住机会回国争取君位；本文记述重耳与舅犯商量后如何答复。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献公之丧（sāng），秦穆公使人吊公子重耳，且曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公去世，秦穆公派人慰问公子重耳，并让使者转达自己的话。“吊”是吊唁；“且”说明还有其他事情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“寡人闻之，亡国恒于斯，得国恒于斯。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说，失去政权常在这种时候，得到政权也常在这种时候。”“斯”指旧君去世、新君继位的交接时期。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽吾子俨（yǎn）然在忧服之中，丧（sàng）亦不可久也，时亦不可失也，孺（rú）子其图之！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虽然您肃穆地服丧，但流亡失位不能长久持续，机会也不能错过，您还是考虑吧！”“吾子”是尊称；“忧服”指服丧；这里“丧”读sàng，指流亡失位，不是劝缩短服丧。“图”是考虑。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以告舅犯。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳把话告诉舅犯。舅犯即狐偃，字子犯，是舅舅和谋臣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>舅犯曰：“孺子其辞焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">舅犯说：“您应当谢绝！”“辞”是推辞、拒绝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“丧（sàng）人无宝，仁亲以为宝。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“流亡者没有什么可以作宝物，应把仁爱亲人、实行仁义作为珍守的东西。”舅犯将话题由如何取得君位，转到如何保持品行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“父死之谓何？又因以为利，而天下其孰（shú）能说（shuō）之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“父亲去世，是怎样一件大事？还借此为自己谋利，天下谁能替这种做法辩解？”“因”是借着；“说”是解释、辩解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“孺子其辞焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您还是谢绝吧！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公子重耳对客曰：“君惠吊亡臣重耳，身丧（sàng）父死，不得与（yù）于哭泣之哀，以为君忧。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳回答使者：“承蒙贵国国君施恩，慰问流亡之臣重耳。我流亡在外，父亲去世，却不能回国参与哭泣哀悼，让贵国国君担忧。”“亡臣”是自称；“与”通“预”，参与。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“父死之谓何？或敢有他志，以辱君义？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“父亲去世，是怎样一件大事？我岂敢另有图谋，辱没贵国国君的好意？”“他志”指借机争位的打算，是委婉拒绝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>稽（qǐ）颡（sǎng）而不拜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳以额头叩地表示哀痛，却不完成拜谢礼节。“颡”是额头。按本文解释，他没有以继承人身份接受建议，所以不完成相应拜谢。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>哭而起，起而不私。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他哭着起身，也不与使者私下商谈。“不私”着重指不私谈回国争位，不是绝不说任何话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子显以致命于穆公。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">使者子显回去，把答复和表现报告给穆公。“致命”是复命。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>穆公曰：“仁夫（fú）！公子重耳！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">穆公说：“公子重耳真仁厚啊！”“夫”是感叹语气词。这是文中人物的评价。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫稽颡而不拜，则未为后也，故不成拜。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他叩额却不完成拜礼，说明没有以继承人自居，所以不完成拜谢。”“后”是继承人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“哭而起，则爱父也；起而不私，则远（yuàn）利也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“哭着起身，是爱父亲；起身不私谈，是远离私利。”“远利”是使自己远离利益诱惑。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">不私谈争位是故事记述的行为，“因此证明内心远离私利”则是穆公的解释。也可以从政治交涉理解为维护名声、避免贸然承诺，但不能由此断定他一定是假装。本篇重复讲解已合并，保留同一份正文。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/公子重耳對秦客\" target=\"_blank\" rel=\"noopener\">《公子重耳对秦客》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/12\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷十二\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-21", "volume": 3, "volume_title": "卷三 · 周文", "number": 21, "title": "杜蒉扬觯", "file": "卷三/21-杜蒉扬觯.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《杜蒉（kuài）扬觯（zhì）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第21篇\u003cbr>选自《礼记·檀弓下》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋国大夫知悼子去世，尚未下葬，晋平公却与臣下饮酒奏乐。掌管膳食的杜蒉听到钟声，进去罚两位陪侍者和自己喝酒，促使平公承认过错。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>知（zhì）悼子卒，未葬。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">知悼子去世，尚未安葬。按郑玄注，他是荀盈；知是氏，也写作智，读zhì，悼是谥号，子是尊称。不能把他误作知罃。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>平公饮酒，师旷（kuàng）、李调侍。鼓钟。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋平公饮酒，师旷、李调陪侍，敲钟奏乐。师旷是乐官，李调是近臣；“鼓”是敲击。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>杜蒉自外来，闻钟声，曰：“安在？”曰：“在寝。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">杜蒉从外面进来，听见钟声，问：“在哪里？”有人说：“在寝宫。”问的是国君在哪里饮酒奏乐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>杜蒉入寝，历阶而升。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">杜蒉进入寝宫，沿台阶登堂。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>酌（zhuó）曰：“旷饮（yìn）斯！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">斟酒说：“师旷，喝下这杯！”“酌”是斟酒；“斯”指这杯。此处是罚酒，“饮”按使人饮酒用法读yìn。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>又酌曰：“调饮（yìn）斯！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">又斟酒说：“李调，喝下这杯！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>又酌，堂上北面坐饮（yǐn）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">再斟一杯，自己在堂上面向北方、朝国君方向跪坐喝下。“坐”指跪坐，也罚自己一杯。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>降，趋而出。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">下台阶，快步退出。他没有先说明理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>平公呼而进之，曰：“蒉，曩（nǎng）者尔心或开予，是以不与尔言。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">平公叫他回来：“杜蒉，刚才我想你大概有什么要提醒我，所以没有先与你说话。”“曩者”是刚才；“予”是我；“开”是启发开导。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“尔饮（yìn）旷何也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你为什么罚师旷喝酒？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“子卯不乐（yuè）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">杜蒉说：“子日、卯日，国君尚且不奏乐。”按旧注，桀亡于乙卯、纣死于甲子，所以这两类日子要警戒，不奏乐；这是旧注对礼俗的说明。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“知悼子在堂，斯其为子卯也大矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今知悼子灵柩还在堂上，这比子卯之忌更重大！”按本文礼制，重臣去世未葬，更不应奏乐宴饮。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“旷也，太师也，不以诏（zhào）。是以饮（yìn）之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“师旷是乐官之长，却不以此提醒国君，所以罚他喝酒。”“诏”是告知，不专指帝王下诏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“尔饮（yìn）调何也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你为什么罚李调？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“调也，君之亵（xiè）臣也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“李调是您亲近的臣子。”“亵臣”指亲近、受宠的臣子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“为（wèi）一饮一食，亡（wàng）君之疾。是以饮（yìn）之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“为了贪图一点酒食，忘了国君的过失，所以罚他。”“亡”通“忘”；“疾”是毛病、过失，不是生病。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“尔饮（yǐn）何也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你自己为什么也喝？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“蒉也，宰夫也，非刀匕（bǐ）是共（gōng），又敢与（yù）知（zhī）防，是饮（yìn）之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我是管膳食的宰夫，没有只管刀勺饮食，却敢参与防止国君过失的事，所以也罚自己。”“共”通“供”；“与”是参与；“知”是掌管、过问；“防”是防范、纠正过失。他以越职自谦，缓和劝谏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>平公曰：“寡人亦有过焉。酌而饮（yìn）寡人！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">平公说：“我也有过错。斟酒，也罚我一杯！”饮酒奏乐的本人承认责任。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>杜蒉洗而扬觯（zhì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">杜蒉洗净酒器，举杯献给平公。“扬”是举；“觯”是酒器。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公谓侍者曰：“如我死，则必无废是爵也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">平公对侍者说：“即使我死了，也一定不要废弃这杯酒所代表的规矩！”“爵”指酒器，旧注认为要留下举杯仪节作为警戒。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>至于今，既毕献，斯扬觯，谓之“杜举”。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">直到记述者的时代，向国君与宾客献酒完毕，便举起这杯酒，称作“杜举”。“今”不是今天；“杜举”以杜蒉命名。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你问“知”是什么意思：\u003c/strong>在“知悼子”里，知读zhì，是氏名，亦写智；他名荀盈，也称知盈、智盈。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>你又问“知防”：\u003c/strong>这里的知读zhī，意思是掌管、过问。“与知防”是参与防范、纠正国君过失，并不是家族称谓。\u003c/p>\n\u003cp class=\"translation\">这篇先追问臣子为何没有提醒，再让国君自行认过。杜蒉不直接罚国君，却促使平公说出“寡人亦有过焉”。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/杜蕢揚觶\" target=\"_blank\" rel=\"noopener\">《杜蒉扬觯》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/13\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷十三\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-22", "volume": 3, "volume_title": "卷三 · 周文", "number": 22, "title": "晋献文子成室", "file": "卷三/22-晋献文子成室.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《晋献文子成室》\u003c/h1>\n\u003cp class=\"translation\">选自《礼记·檀弓下》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋时，晋国赵文子赵武的新居落成，诸大夫前往庆贺，张老说了一段祝辞。文子不只回应房屋之美，还把愿望落在保全自身、善终承祭上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献文子成室，晋大夫发焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国人庆贺赵文子的新居落成，晋国大夫们送礼前往。“献”旧注释为贺，“发”是馈送贺礼；文子就是赵武。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>张老曰：“美哉，轮焉！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">张老说：“多么美啊，高大壮盛！”“轮”形容房屋高大。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>美哉，奂（huàn）焉！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“多么美啊，鲜明宽敞！”“奂”形容壮丽。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>歌于斯，哭于斯，聚国族于斯！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“在这里举行礼乐，在这里办理丧祭，在这里聚集国中宗族！”“歌”“哭”分别指庆礼、丧礼等家族活动，不是临时命令他唱歌哭泣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>文子曰：“武也，得歌于斯，哭于斯，聚国族于斯，是全要领（quán yāo lǐng）以从先大夫于九京（jiǔ jīng）也!”北面再拜稽首（qǐ shǒu）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文子说：“我武如果能在这里举行礼乐、办理丧祭、聚集国中宗族，那就是能够保全腰与颈，追随先大夫安葬于九京了！”说完，面向北方，两次下拜，叩头至地。武是赵文子的名；“全要领”指保全身首、免遭刑戮；九京是晋卿大夫墓地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君子谓之善颂善祷。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文中的“君子”认为，这叫善于祝颂，也善于祈愿。张老的祝辞含有长久保家之意，文子的回答则表示愿以善终来承受这份祝愿。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">篇名沿用《晋献文子成室》；“献”旧注释为贺，不是赵武的另一个谥号。张老将庆贺、丧祭、宗族相聚连在一起，是祝愿这座宅第及其家族长久安定；文子回答“全要领”，则把这份祝愿落实到免遭刑戮、保家善终。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷3)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷3\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003cp class=\"translation\">“献，犹贺也”等旧注参照\u003ca href=\"https://ctext.org/wiki.pl?chapter=322380&amp;if=gb&amp;remap=gb\" target=\"_blank\" rel=\"noopener\">《礼记正义·檀弓下》\u003c/a>。\u003c/p>\n\u003c/details>"}];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderNav(){let q=$('search').value.trim(),v=$('volumeFilter').value;let output='';for(let vol of [1,2,3]){if(v!=='all'&&Number(v)!==vol)continue;let all=DATA.filter(x=>x.volume===vol);let rows=all.filter(x=>(x.ready||$('showPending').checked||q)&&(!q||x.title.includes(q)));if(!rows.length&&q)continue;output+=`<h3 class="volume-heading">${esc(all[0].volume_title)}<span class="volume-count">${all.length}篇 · 已收录${all.filter(x=>x.ready).length}篇</span></h3>`;output+=rows.map(x=>`<button class="${x.id===current?'active ':''}${x.ready?'':'pending'}" data-id="${x.id}" ${x.id===current?'aria-current="page"':''}><span class="page">第${x.number}篇 · ${x.ready?(x.text_origin||'已收录'):'尚未收录'}</span>${esc(x.title)}</button>`).join('')||'<p class="empty">本卷暂无已收录正文</p>';} $('nav').innerHTML=output||'<p class="empty">没有找到匹配篇目</p>';for(let b of $('nav').querySelectorAll('button'))b.onclick=()=>openArticle(b.dataset.id,false);}
function openArticle(id,restore){let row=DATA.find(x=>x.id===id)||ready[0];current=row.id;location.hash=row.id;writeStore('zhou-last',row.id);$('meta').textContent=`${row.volume_title} / 第${row.number}篇 · ${row.ready?(row.text_origin||'已收录'):'尚未收录'}`;
$('article').innerHTML=row.ready?row.html:`<div class="pending-view"><h1>《${esc(row.title)}》</h1><p class="notice">目录已核对，本篇完整旧译文尚未找回。本页未用摘要或重新翻译来代替旧稿。</p><p>可以从目录选择标有“已收录”的篇目阅读。</p></div>`;
let i=ready.findIndex(x=>x.id===row.id);$('prev').disabled=i<=0;$('next').disabled=i<0||i===ready.length-1;$('position').textContent=i<0?'待找回':`${i+1} / ${ready.length}`;$('prev').onclick=()=>openArticle(ready[i-1].id,false);$('next').onclick=()=>openArticle(ready[i+1].id,false);document.body.classList.remove('menu-open');$('menu').setAttribute('aria-expanded','false');renderNav();requestAnimationFrame(()=>window.scrollTo(0,restore?(Number(readStore('zhou-scroll-'+row.id))||0):0));}
$('volumeFilter').onchange=renderNav;$('search').oninput=renderNav;$('showPending').onchange=renderNav;$('menu').onclick=()=>{let yes=document.body.classList.toggle('menu-open');$('menu').setAttribute('aria-expanded',String(yes));};
$('smaller').onclick=()=>{font=Math.max(16,font-1);document.documentElement.style.setProperty('--font',font+'px');writeStore('zhou-font',font)};$('larger').onclick=()=>{font=Math.min(30,font+1);document.documentElement.style.setProperty('--font',font+'px');writeStore('zhou-font',font)};
$('toggleTrans').onclick=()=>{hide=!hide;document.body.classList.toggle('hide-translations',hide);$('toggleTrans').textContent=hide?'显示译文':'隐藏译文';$('toggleTrans').setAttribute('aria-pressed',String(hide))};$('print').onclick=()=>{document.querySelectorAll('details').forEach(x=>x.open=true);window.print()};window.addEventListener('scroll',()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>writeStore('zhou-scroll-'+current,String(window.scrollY)),200);let h=document.documentElement.scrollHeight-innerHeight;$('progress').style.width=(h>0?window.scrollY/h*100:0)+'%';},{passive:true});
$('closeMenu').onclick=$('backdrop').onclick=()=>{document.body.classList.remove('menu-open');$('menu').setAttribute('aria-expanded','false')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closeMenu').click()});
let first=location.hash.slice(1)||readStore('zhou-last')||ready[0].id;openArticle(first,true);
</script></body></html>
