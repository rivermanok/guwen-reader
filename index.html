y": false}, {"id": "v02-13", "volume": 2, "volume_title": "卷二 · 周文", "number": 13, "title": "子产却楚逆女以兵", "file": "卷二/13-子产却楚逆女以兵.md", "ready": true, "markdown": "# 《子产却楚逆女（nǚ）以兵》\n\n卷二 · 周文 · 第13篇\n选自《左传·昭公元年》。\n\n题目可以拆开理解：“却”，使退却、阻止；“逆女”，迎娶女子；“以兵”，带着武装人员。合起来就是：**子产阻止楚国借迎亲之名，带兵进入郑国。**“以兵”说的是楚国迎亲的方式。\n\n## 背景简介\n\n事情发生在公元前541年。子产是郑国执政大夫；楚国公子围当时担任令尹，后来成为楚灵王。这篇写的，就是双方围绕“能不能带兵入城迎亲”进行的一场交涉。下面按原文逐句讲。\n\n**楚公子围聘（pìn）于郑，且娶于公孙段氏。**\n\n楚国的公子围到郑国进行外交访问，同时要迎娶郑国大夫公孙段家的女儿。\n\n“聘”是诸侯国之间的正式访问。“公子围”是楚国王族，名叫围。“且”是并且，说明他这一次兼办访问和迎亲两件事。\n\n**伍举为介（jiè）。**\n\n伍举担任副使。\n\n伍举是楚国大夫。“介”是辅助正使办理外交事务的人。\n\n**将入馆，郑人恶（wù）之。**\n\n楚国一行准备入住城内的宾馆，郑国人对此感到不安。\n\n“馆”是接待外国使者的馆舍。“恶”在这里有厌恶、忌惮的意思。联系后文，郑国担心的是这些楚国武装人员入城后会造成威胁。\n\n**使行人子羽与之言，乃馆于外。**\n\n郑国派负责外交的官员子羽去同楚国人交涉，于是楚国一行住在了城外。\n\n“行人”是外交官职的名称。“子羽”是郑国大夫公孙挥的字。这里没有写出交涉的具体内容，只交代结果：楚国人暂时没有进入城内。\n\n**既聘，将以众逆。**\n\n外交访问结束后，公子围准备带领大批武装随从进城迎亲。\n\n“既”是已经、结束以后；“以”是率领；“众”在这里指随行的武装人员；“逆”是迎接，承接前面的婚事，就是迎亲。\n\n**子产患之，使子羽辞曰：**\n\n子产担心这件事，派子羽前去拒绝，说。\n\n“患”是以此为忧。“辞”是推辞、拒绝。具体出面交涉的是子羽，背后作出决策的是子产。\n\n**“以敝（bì）邑褊（biǎn）小，不足以容从（zòng）者，请墠（shàn）听命！”**\n\n“因为我们这个小国地方狭窄，容纳不下贵方这么多随从，请允许我们在城外清理一块场地，听候安排，举行迎亲仪式。”\n\n“敝邑”是对自己国家的谦称；“褊小”是狭小；“从者”是随从。“墠”是经过清理的平地，这里指在城外清理场地。\n\n子羽给出的表面理由是：**地方太小，接待不下。**实际提出的条件是：迎亲可以，在城外举行。\n\n**令尹使太宰伯州犁对曰：**\n\n令尹公子围派太宰伯州犁回答说。\n\n“令尹”是楚国执掌军政的最高官职，这里就是公子围。“太宰”是官名，伯州犁是担任这一官职的楚国大夫。\n\n**“君辱贶（kuàng）寡大夫围，谓围：‘将使丰氏抚有而室。’”**\n\n“贵国国君屈尊赐予敝国大夫围这桩婚事，对围说：‘将让丰氏的女儿成为你的妻室。’”\n\n“君”指郑国国君。“辱”是表示承蒙对方屈尊的客套话；“贶”是赐予；“寡大夫”是对本国大夫的谦称。\n\n“丰氏”指公孙段所属的家族，在这里代指他家的女儿。“抚有而室”是成为你的妻室，其中“而”通“尔”，意思是“你”。\n\n伯州犁先强调：这桩婚姻是郑国国君已经答应的。\n\n**“围布几（jī）筵（yán），告于庄、共（gōng）之庙而来。”**\n\n“围已经摆设好祭祀用的几案和席子，在楚庄王、楚共王的宗庙里禀告过，才到这里来。”\n\n“几”是小桌、凭几；“筵”是席子。“庄、共”是楚庄王和楚共王。\n\n这句话是在增加婚事的分量：已经正式告过祖先，不能随意处置。\n\n**“若野赐之，是委君贶于草莽（mǎng）也！”**\n\n“如果在郊野把新娘交给围，就是把贵国国君的赏赐丢在草丛里！”\n\n“野”指城外。“委”是丢弃、弃置。“君贶”指郑国国君赐予的婚姻。\n\n他的意思是：你们让我们在城外迎亲，连贵国国君自己的体面也受损。\n\n**“是寡大夫不得列于诸卿也！”**\n\n“这就使敝国大夫围不能与其他卿大夫并列了！”\n\n也就是：别人能够按身份、礼仪正式迎娶，围却只能在野外接亲，岂不是被降低了身份？\n\n**“不宁唯是，又使围蒙其先君，将不得为寡君老，其蔑（miè）以复矣。”**\n\n“不仅如此，还会使围成为欺骗先君的人，将没有资格再做敝国国君的大臣，恐怕也无法回去复命了。”\n\n“不宁唯是”是不仅如此。“蒙”是欺骗、蒙蔽：已经向先君禀告要正式迎娶，结果却在野外接亲，便被他说成欺骗了先君。\n\n“寡君”指楚国国君；“老”在这里指重臣；“蔑”是无、没有；“复”是复命。\n\n伯州犁把后果一层层加重：从有失体面，说到辱没祖先，再说到无法继续为臣。\n\n**“唯大夫图之！”**\n\n“希望大夫好好考虑这件事！”\n\n“大夫”是对子羽说的。“图”是考虑、谋划。这句客气话里带着施压的意味。\n\n**子羽曰：“小国无罪，恃（shì）实其罪。”**\n\n子羽说：“小国本来没有罪，依赖大国，倒真成了它的罪过。”\n\n“恃”是依赖、倚仗。\n\n这句话带着反讽：**我们相信大国会保护我们，难道反而因为这份相信，要遭受灾祸吗？**\n\n**“将恃大国之安靖己，而无乃包藏祸心以图之。”**\n\n“本来打算依靠大国使自己安定，恐怕大国却暗藏害人的心思，来算计小国吧？”\n\n“安靖己”是使自己安定。“无乃……”，是“恐怕……吧”。“图之”的“图”在这里是图谋、算计，“之”指小国。\n\n子羽在这里点出了真正的疑虑：你们带这么多兵进来，究竟是迎亲，还是另有打算？\n\n但他仍用“恐怕”来表达，没有把推测直接说成已经发生的事实。\n\n**“小国失恃而惩诸侯，使莫不憾（hàn）者，距违君命，而有所壅（yōng）塞不行是惧！”**\n\n“我们担心的是：小国失去了可以依靠的大国，这件事又使其他诸侯引以为戒，人人心怀怨恨，进而抗拒、违背贵国国君的命令，最终使贵国的命令受到阻碍，不能推行。”\n\n这一句很长，意思是顺着推下来的：\n\n小国受害，便不再信任楚国；其他诸侯看到，也会警惕、怨恨楚国；楚国再发号施令，大家就不肯服从。\n\n“惩”是警戒、引以为戒；“憾”是怨恨；“距”通“拒”，是抗拒。\n\n“……是惧”是“所害怕的是……”的意思。子羽把郑国的拒绝说成了对楚国的提醒：**你们今天若借婚事伤害郑国，损失的会是诸侯对楚国的信任。**\n\n**“不然，敝邑，馆人之属也，其敢爱丰氏之祧（tiāo）？”**\n\n“要不是有这样的顾虑，我们小国不过是替贵国照管馆舍的人，哪里敢吝惜丰氏的宗庙，不让你们进去迎亲呢？”\n\n“馆人”是管理馆舍的人。把郑国说成楚国的“馆人”，是外交上的谦辞。\n\n“其敢”是哪里敢；“爱”是吝惜、舍不得；“祧”本指祭祀远祖的庙，这里指丰氏的宗庙，也是举行婚礼的场所。\n\n这句话把立场说清楚了：并非不让你们入内迎亲，郑国顾虑的是带兵入城。\n\n**伍举知其有备也，请垂櫜（gāo）而入。**\n\n伍举知道郑国已经有了防备，便请求让随从垂下弓袋入城。\n\n“其”指郑国。“櫜”是收藏弓箭等物的袋子。“垂櫜”表示收起武器、解除临战姿态，以示没有敌意。\n\n这时楚方作出了实际让步：要入城，就先改变武装戒备的状态。\n\n**许之。**\n\n郑国同意了这个请求。\n\n## 阅读提示\n\n这篇最值得留意的是，**子产守住了“入城必须消除军事威胁”这个条件，同时给迎亲留下了余地。**楚方一直强调婚礼、身份、祖先；子羽则把交涉拉回到小国安全和大国信用上。最后，双方用“垂櫜而入”解决了眼前的冲突。\n\n原文核对：[古文岛《子产却楚逆女以兵》](https://m.gushiwen.cn/shiwenv_664e33a624c2.aspx)。\n\n", "html": "\u003ch1>《子产却楚逆女（nǚ）以兵》\u003c/h1>\n\u003cp class=\"translation\">卷二 · 周文 · 第13篇\u003cbr>选自《左传·昭公元年》。\u003c/p>\n\u003cp class=\"translation\">题目可以拆开理解：“却”，使退却、阻止；“逆女”，迎娶女子；“以兵”，带着武装人员。合起来就是：\u003cstrong>子产阻止楚国借迎亲之名，带兵进入郑国。\u003c/strong>“以兵”说的是楚国迎亲的方式。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">事情发生在公元前541年。子产是郑国执政大夫；楚国公子围当时担任令尹，后来成为楚灵王。这篇写的，就是双方围绕“能不能带兵入城迎亲”进行的一场交涉。下面按原文逐句讲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚公子围聘（pìn）于郑，且娶于公孙段氏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国的公子围到郑国进行外交访问，同时要迎娶郑国大夫公孙段家的女儿。\u003c/p>\n\u003cp class=\"translation\">“聘”是诸侯国之间的正式访问。“公子围”是楚国王族，名叫围。“且”是并且，说明他这一次兼办访问和迎亲两件事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>伍举为介（jiè）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">伍举担任副使。\u003c/p>\n\u003cp class=\"translation\">伍举是楚国大夫。“介”是辅助正使办理外交事务的人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>将入馆，郑人恶（wù）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国一行准备入住城内的宾馆，郑国人对此感到不安。\u003c/p>\n\u003cp class=\"translation\">“馆”是接待外国使者的馆舍。“恶”在这里有厌恶、忌惮的意思。联系后文，郑国担心的是这些楚国武装人员入城后会造成威胁。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使行人子羽与之言，乃馆于外。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国派负责外交的官员子羽去同楚国人交涉，于是楚国一行住在了城外。\u003c/p>\n\u003cp class=\"translation\">“行人”是外交官职的名称。“子羽”是郑国大夫公孙挥的字。这里没有写出交涉的具体内容，只交代结果：楚国人暂时没有进入城内。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既聘，将以众逆。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">外交访问结束后，公子围准备带领大批武装随从进城迎亲。\u003c/p>\n\u003cp class=\"translation\">“既”是已经、结束以后；“以”是率领；“众”在这里指随行的武装人员；“逆”是迎接，承接前面的婚事，就是迎亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产患之，使子羽辞曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产担心这件事，派子羽前去拒绝，说。\u003c/p>\n\u003cp class=\"translation\">“患”是以此为忧。“辞”是推辞、拒绝。具体出面交涉的是子羽，背后作出决策的是子产。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“以敝（bì）邑褊（biǎn）小，不足以容从（zòng）者，请墠（shàn）听命！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因为我们这个小国地方狭窄，容纳不下贵方这么多随从，请允许我们在城外清理一块场地，听候安排，举行迎亲仪式。”\u003c/p>\n\u003cp class=\"translation\">“敝邑”是对自己国家的谦称；“褊小”是狭小；“从者”是随从。“墠”是经过清理的平地，这里指在城外清理场地。\u003c/p>\n\u003cp class=\"translation\">子羽给出的表面理由是：\u003cstrong>地方太小，接待不下。\u003c/strong>实际提出的条件是：迎亲可以，在城外举行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>令尹使太宰伯州犁对曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">令尹公子围派太宰伯州犁回答说。\u003c/p>\n\u003cp class=\"translation\">“令尹”是楚国执掌军政的最高官职，这里就是公子围。“太宰”是官名，伯州犁是担任这一官职的楚国大夫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君辱贶（kuàng）寡大夫围，谓围：‘将使丰氏抚有而室。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“贵国国君屈尊赐予敝国大夫围这桩婚事，对围说：‘将让丰氏的女儿成为你的妻室。’”\u003c/p>\n\u003cp class=\"translation\">“君”指郑国国君。“辱”是表示承蒙对方屈尊的客套话；“贶”是赐予；“寡大夫”是对本国大夫的谦称。\u003c/p>\n\u003cp class=\"translation\">“丰氏”指公孙段所属的家族，在这里代指他家的女儿。“抚有而室”是成为你的妻室，其中“而”通“尔”，意思是“你”。\u003c/p>\n\u003cp class=\"translation\">伯州犁先强调：这桩婚姻是郑国国君已经答应的。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“围布几（jī）筵（yán），告于庄、共（gōng）之庙而来。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“围已经摆设好祭祀用的几案和席子，在楚庄王、楚共王的宗庙里禀告过，才到这里来。”\u003c/p>\n\u003cp class=\"translation\">“几”是小桌、凭几；“筵”是席子。“庄、共”是楚庄王和楚共王。\u003c/p>\n\u003cp class=\"translation\">这句话是在增加婚事的分量：已经正式告过祖先，不能随意处置。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若野赐之，是委君贶于草莽（mǎng）也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果在郊野把新娘交给围，就是把贵国国君的赏赐丢在草丛里！”\u003c/p>\n\u003cp class=\"translation\">“野”指城外。“委”是丢弃、弃置。“君贶”指郑国国君赐予的婚姻。\u003c/p>\n\u003cp class=\"translation\">他的意思是：你们让我们在城外迎亲，连贵国国君自己的体面也受损。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“是寡大夫不得列于诸卿也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这就使敝国大夫围不能与其他卿大夫并列了！”\u003c/p>\n\u003cp class=\"translation\">也就是：别人能够按身份、礼仪正式迎娶，围却只能在野外接亲，岂不是被降低了身份？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不宁唯是，又使围蒙其先君，将不得为寡君老，其蔑（miè）以复矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不仅如此，还会使围成为欺骗先君的人，将没有资格再做敝国国君的大臣，恐怕也无法回去复命了。”\u003c/p>\n\u003cp class=\"translation\">“不宁唯是”是不仅如此。“蒙”是欺骗、蒙蔽：已经向先君禀告要正式迎娶，结果却在野外接亲，便被他说成欺骗了先君。\u003c/p>\n\u003cp class=\"translation\">“寡君”指楚国国君；“老”在这里指重臣；“蔑”是无、没有；“复”是复命。\u003c/p>\n\u003cp class=\"translation\">伯州犁把后果一层层加重：从有失体面，说到辱没祖先，再说到无法继续为臣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“唯大夫图之！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“希望大夫好好考虑这件事！”\u003c/p>\n\u003cp class=\"translation\">“大夫”是对子羽说的。“图”是考虑、谋划。这句客气话里带着施压的意味。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子羽曰：“小国无罪，恃（shì）实其罪。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子羽说：“小国本来没有罪，依赖大国，倒真成了它的罪过。”\u003c/p>\n\u003cp class=\"translation\">“恃”是依赖、倚仗。\u003c/p>\n\u003cp class=\"translation\">这句话带着反讽：\u003cstrong>我们相信大国会保护我们，难道反而因为这份相信，要遭受灾祸吗？\u003c/strong>\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“将恃大国之安靖己，而无乃包藏祸心以图之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“本来打算依靠大国使自己安定，恐怕大国却暗藏害人的心思，来算计小国吧？”\u003c/p>\n\u003cp class=\"translation\">“安靖己”是使自己安定。“无乃……”，是“恐怕……吧”。“图之”的“图”在这里是图谋、算计，“之”指小国。\u003c/p>\n\u003cp class=\"translation\">子羽在这里点出了真正的疑虑：你们带这么多兵进来，究竟是迎亲，还是另有打算？\u003c/p>\n\u003cp class=\"translation\">但他仍用“恐怕”来表达，没有把推测直接说成已经发生的事实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“小国失恃而惩诸侯，使莫不憾（hàn）者，距违君命，而有所壅（yōng）塞不行是惧！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们担心的是：小国失去了可以依靠的大国，这件事又使其他诸侯引以为戒，人人心怀怨恨，进而抗拒、违背贵国国君的命令，最终使贵国的命令受到阻碍，不能推行。”\u003c/p>\n\u003cp class=\"translation\">这一句很长，意思是顺着推下来的：\u003c/p>\n\u003cp class=\"translation\">小国受害，便不再信任楚国；其他诸侯看到，也会警惕、怨恨楚国；楚国再发号施令，大家就不肯服从。\u003c/p>\n\u003cp class=\"translation\">“惩”是警戒、引以为戒；“憾”是怨恨；“距”通“拒”，是抗拒。\u003c/p>\n\u003cp class=\"translation\">“……是惧”是“所害怕的是……”的意思。子羽把郑国的拒绝说成了对楚国的提醒：\u003cstrong>你们今天若借婚事伤害郑国，损失的会是诸侯对楚国的信任。\u003c/strong>\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不然，敝邑，馆人之属也，其敢爱丰氏之祧（tiāo）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“要不是有这样的顾虑，我们小国不过是替贵国照管馆舍的人，哪里敢吝惜丰氏的宗庙，不让你们进去迎亲呢？”\u003c/p>\n\u003cp class=\"translation\">“馆人”是管理馆舍的人。把郑国说成楚国的“馆人”，是外交上的谦辞。\u003c/p>\n\u003cp class=\"translation\">“其敢”是哪里敢；“爱”是吝惜、舍不得；“祧”本指祭祀远祖的庙，这里指丰氏的宗庙，也是举行婚礼的场所。\u003c/p>\n\u003cp class=\"translation\">这句话把立场说清楚了：并非不让你们入内迎亲，郑国顾虑的是带兵入城。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>伍举知其有备也，请垂櫜（gāo）而入。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">伍举知道郑国已经有了防备，便请求让随从垂下弓袋入城。\u003c/p>\n\u003cp class=\"translation\">“其”指郑国。“櫜”是收藏弓箭等物的袋子。“垂櫜”表示收起武器、解除临战姿态，以示没有敌意。\u003c/p>\n\u003cp class=\"translation\">这时楚方作出了实际让步：要入城，就先改变武装戒备的状态。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国同意了这个请求。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">这篇最值得留意的是，\u003cstrong>子产守住了“入城必须消除军事威胁”这个条件，同时给迎亲留下了余地。\u003c/strong>楚方一直强调婚礼、身份、祖先；子羽则把交涉拉回到小国安全和大国信用上。最后，双方用“垂櫜而入”解决了眼前的冲突。\u003c/p>\n\u003cp class=\"translation\">原文核对：\u003ca href=\"https://m.gushiwen.cn/shiwenv_664e33a624c2.aspx\" target=\"_blank\" rel=\"noopener\">古文岛《子产却楚逆女以兵》\u003c/a>。\u003c/p>\n\u003c/details>"}, {"id": "v02-14", "volume": 2, "volume_title": "卷二 · 周文", "number": 14, "title": "子革对灵王", "file": "卷二/14-子革对灵王.md", "ready": false}, {"id": "v02-15", "volume": 2, "volume_title": "卷二 · 周文", "number": 15, "title": "子产论政宽猛", "file": "卷二/15-子产论政宽猛.md", "ready": false}, {"id": "v02-16", "volume": 2, "volume_title": "卷二 · 周文", "number": 16, "title": "吴许越成", "file": "卷二/16-吴许越成.md", "ready": false}, {"id": "v03-01", "volume": 3, "volume_title": "卷三 · 周文", "number": 1, "title": "祭公谏征犬戎", "file": "卷三/01-祭公谏征犬戎.md", "ready": false}, {"id": "v03-02", "volume": 3, "volume_title": "卷三 · 周文", "number": 2, "title": "召公谏厉王止谤", "file": "卷三/02-召公谏厉王止谤.md", "ready": false}, {"id": "v03-03", "volume": 3, "volume_title": "卷三 · 周文", "number": 3, "title": "襄王不许请隧", "file": "卷三/03-襄王不许请隧.md", "ready": false}, {"id": "v03-04", "volume": 3, "volume_title": "卷三 · 周文", "number": 4, "title": "单子知陈必亡", "file": "卷三/04-单子知陈必亡.md", "ready": false}, {"id": "v03-05", "volume": 3, "volume_title": "卷三 · 周文", "number": 5, "title": "展禽论祀爰居", "file": "卷三/05-展禽论祀爰居.md", "ready": false}, {"id": "v03-06", "volume": 3, "volume_title": "卷三 · 周文", "number": 6, "title": "里革断罟匡君", "file": "卷三/06-里革断罟匡君.md", "ready": false}, {"id": "v03-07", "volume": 3, "volume_title": "卷三 · 周文", "number": 7, "title": "敬姜论劳逸", "file": "卷三/07-敬姜论劳逸.md", "ready": false}, {"id": "v03-08", "volume": 3, "volume_title": "卷三 · 周文", "number": 8, "title": "叔向贺贫", "file": "卷三/08-叔向贺贫.md", "ready": false}, {"id": "v03-09", "volume": 3, "volume_title": "卷三 · 周文", "number": 9, "title": "王孙圉论楚宝", "file": "卷三/09-王孙圉论楚宝.md", "ready": false}, {"id": "v03-10", "volume": 3, "volume_title": "卷三 · 周文", "number": 10, "title": "诸稽郢行成于吴", "file": "卷三/10-诸稽郢行成于吴.md", "ready": false}, {"id": "v03-11", "volume": 3, "volume_title": "卷三 · 周文", "number": 11, "title": "申胥谏许越成", "file": "卷三/11-申胥谏许越成.md", "ready": false}, {"id": "v03-12", "volume": 3, "volume_title": "卷三 · 周文", "number": 12, "title": "春王正月", "file": "卷三/12-春王正月.md", "ready": false}, {"id": "v03-13", "volume": 3, "volume_title": "卷三 · 周文", "number": 13, "title": "宋人及楚人平", "file": "卷三/13-宋人及楚人平.md", "ready": false}, {"id": "v03-14", "volume": 3, "volume_title": "卷三 · 周文", "number": 14, "title": "吴子使札来聘", "file": "卷三/14-吴子使札来聘.md", "ready": true, "markdown": "# 《吴子使札（zhá）来聘（pìn）》\n\n卷三 · 周文 · 第14篇\n选自《公羊传·襄公二十九年》。\n\n## 背景简介\n\n公元前544年，吴国公子季札出使鲁国，《春秋》记为“吴子使札来聘”。《公羊传》借解释这句话，追述季札让位的故事，说明为什么赞扬他；文中有关王室亲属关系的叙述，应按《公羊传》自身的说法理解。\n\n**吴子使札来聘。**\n\n吴国国君派季札到鲁国进行正式外交访问。“使”是派遣；“聘”是诸侯国之间的正式访问；“来”以鲁国为立场。这一句是《春秋》的经文，下面是《公羊传》的解释。\n\n**吴无君，无大夫，此何以有君、有大夫？**\n\n吴国本来不被承认为有合乎礼制的国君和大夫，为什么这里却承认它有国君、有大夫呢？这里不是说吴国实际上没有统治者和官员，而是《公羊传》从中原礼制立场出发，不肯给予它同等的名分。\n\n**贤季子也。**\n\n因为要表彰季子贤德。“贤”在这里是动词，意思是认为他贤明、赞扬他。“季子”就是季札。\n\n**何贤乎季子？让国也。其让国奈何？**\n\n为什么赞扬季札呢？因为他辞让国君之位。他辞让王位的事情是怎样的呢？这里的“国”主要指国君之位和统治权。\n\n**谒（yè）也，余祭（yú zhài）也，夷昧（yí mèi）也，与季子同母者四。**\n\n谒、余祭、夷昧，加上季札，是同一个母亲所生的四兄弟。“谒”通常又称诸樊；季札是其中最小的弟弟。\n\n**季子弱而才，兄弟皆爱之，同欲立之以为君。**\n\n季札年纪小，却很有才干，哥哥们都喜爱他，都想拥立他做国君。“弱”指年少；“立”是拥立。\n\n**谒曰：“今若是迮（zé）而与季子国，季子犹不受也。”**\n\n谒说：“现在如果这样仓促地把王位交给季札，他还是不会接受的。”“迮”在这里指仓促；“与”是给予。\n\n**“请无与子而与弟，弟兄迭（dié）为君，而致国乎季子。”**\n\n“请大家不要把王位传给自己的儿子，而要传给弟弟，兄弟依次做国君，最后把王位传到季札手里。”“无”相当于“毋”，不要；“迭”是轮流、更替；“致”是交付。\n\n**皆曰：“诺。”**\n\n大家都说：“好。”\n\n**故诸为君者，皆轻死为勇。**\n\n因此，先后做国君的几个哥哥，都把死亡看得很轻，以勇敢赴险为荣。按照文中的解释，他们急于让王位早日传到季札手里，甚至不惜自己的生命。\n\n**饮食必祝（zhù）曰：“天苟有吴国，尚速有悔于予身！”**\n\n每次饮食祭祷时，他们一定祈求：“上天如果真想保全吴国，希望灾祸赶快降到我身上吧！”“苟”是如果；“尚”表示希望；“悔”在这里指灾祸；“予”是我。这段突出哥哥们想传位的心愿，不能据此认定死亡由祈祷造成。\n\n**故谒也死，余祭也立；余祭也死，夷昧也立；夷昧也死，则国宜之季子者也。**\n\n于是，谒死后余祭即位，余祭死后夷昧即位；夷昧死后，按原来的安排，王位就应该传给季札了。“之”是到、往。\n\n**季子使（shì）而亡（wáng）焉。**\n\n季札却借出使的机会避开了继位。“使”指出使；“亡”是逃避、离开，不是死亡。\n\n**僚（liáo）者，长（zhǎng）庶也，即之。**\n\n僚是庶出的长子，便登上了王位。按《公羊传》本篇及旧注，僚是季札的异母兄。“庶”指妾所生；“即之”就是即位。\n\n**季子使而反，至，而君之尔。**\n\n季札出使回来，到了吴国，便承认僚为国君，仅此而已。“反”通“返”；“君之”是把他当作国君。他没有因为原来的安排而争夺王位。\n\n**阖庐（hé lǘ）曰：“先君之所以不与子国，而与弟者，凡为（wèi）季子故也。”**\n\n阖庐说：“先前几位国君之所以不把王位传给儿子，而传给弟弟，全都是为了季札。”阖庐就是公子光，按本篇旧注是谒的长子；文章用他后来的称号称呼他。\n\n**“将从先君之命与（yú）！则国宜之季子者也。”**\n\n“如果遵从先君的安排，那么王位就应该归季札。”“与”通“欤”，是语气词。\n\n**“如不从先君之命与！则我宜立者也。僚恶（wū）得为君乎？”**\n\n“如果不遵从先君的安排，那么就应该由我即位。僚怎么能做国君呢？”这是阖庐为自己提出的继承理由，不能直接当成已经证明的公正结论。\n\n**于是使专诸刺僚，而致国乎季子。**\n\n于是，阖庐派专诸刺杀了僚，随后要把王位交给季札。专诸是执行刺杀的刺客。\n\n**季子不受，曰：“尔弑（shì）吾君，吾受尔国，是吾与尔为篡（cuàn）也。”**\n\n季札不肯接受，说：“你杀了我的国君，如果我接受你交来的王位，那就是我与你一起篡夺王位。”“尔”是你；“弑”指臣下杀君主、子女杀父母；“篡”是以不正当手段夺取君位。\n\n**“尔杀吾兄，吾又杀尔，是父子兄弟相杀，终身无已也。”**\n\n“你杀了我的兄长，如果我再杀你，就会变成父子兄弟之间互相残杀，一辈子没有停止的时候。”按本篇的亲属关系，僚是季札的兄长，阖庐是其侄子。“已”是停止。\n\n**去之延陵，终身不入吴国。**\n\n于是季札离开，前往延陵，终身不再进入吴国朝廷。“之”是到、往。延陵本在吴国境内，旧注因而把“不入吴国”解释为不入吴国朝廷。\n\n**故君子以其不受为义，以其不杀为仁。**\n\n因此，君子认为他不接受王位合乎道义，不杀阖庐是仁厚。\n\n**贤季子，则吴何以有君、有大夫？**\n\n既然赞扬的是季札，那么为什么连吴国的国君和大夫也获得承认呢？\n\n**以季子为臣，则宜有君者也。**\n\n既然承认季札有资格做臣子，那么相应地，也应该承认他所侍奉的国君。这是《公羊传》对君臣名分的解释。\n\n**札者何？吴季子之名也。**\n\n“札”是什么？是吴国季子的名字。\n\n**《春秋》贤者不名，此何以名？**\n\n按照《公羊传》的解释，《春秋》对贤者通常不直呼其名，为什么这里直接写“札”呢？“不名”指不用本名直称，以示尊重。\n\n**许夷狄（yí dí）者，不壹（yī）而足也。**\n\n对于被视为夷狄的人，给予认可时，不会一下子就给足全部礼遇。“许”是认可、赞许。“不壹而足”在这里指不一次给予充分认可，体现了本文的华夷等级立场。\n\n**季子者，所贤也，曷（hé）为不足乎季子？**\n\n季札既然受到赞扬，为什么还不肯给他充分的礼遇呢？“曷为”是为什么。\n\n**许人臣者必使臣，许人子者必使子也。**\n\n认可一个做臣子的人，必须让他守住臣子的名分；认可一个做儿子的人，必须让他守住儿子的名分。按旧注，不能把季札个人抬得很高，却将他的君父仍置于低下地位；褒扬仍受君臣、父子关系约束。\n\n## 阅读讨论\n\n**你的问题：**“该季札当了，他不当，还跑，才有了后来的悲剧。他有责任，为什么要表扬他？”\n\n《公羊传》着重赞扬个人不贪权、不受弑君之利、不继续亲族相残的操守；你的质疑则追问继位责任和政治后果。两次拒绝应分开：第一次轮到继位而退避，确实可以追问他是否放弃了稳定局面的责任；第二次拒绝弑君后送来的王位，有避免认可暴力夺位的理由。季札退避给继承争议留下空间，但刺杀由阖庐决定，也无法确定季札即位就一定避免所有争斗。个人保持清白，不能自动等同于尽到公共责任。\n\n## 核对来源\n\n- [《吴子使札来聘》原文](https://zh.wikisource.org/zh/吳子使札來聘)\n- [《公羊传注疏》卷二十一](https://zh.wikisource.org/wiki/春秋公羊傳注疏_(四庫全書本)/卷21)\n", "html": "\u003ch1>《吴子使札（zhá）来聘（pìn）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第14篇\u003cbr>选自《公羊传·襄公二十九年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前544年，吴国公子季札出使鲁国，《春秋》记为“吴子使札来聘”。《公羊传》借解释这句话，追述季札让位的故事，说明为什么赞扬他；文中有关王室亲属关系的叙述，应按《公羊传》自身的说法理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴子使札来聘。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴国国君派季札到鲁国进行正式外交访问。“使”是派遣；“聘”是诸侯国之间的正式访问；“来”以鲁国为立场。这一句是《春秋》的经文，下面是《公羊传》的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴无君，无大夫，此何以有君、有大夫？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴国本来不被承认为有合乎礼制的国君和大夫，为什么这里却承认它有国君、有大夫呢？这里不是说吴国实际上没有统治者和官员，而是《公羊传》从中原礼制立场出发，不肯给予它同等的名分。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>贤季子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因为要表彰季子贤德。“贤”在这里是动词，意思是认为他贤明、赞扬他。“季子”就是季札。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何贤乎季子？让国也。其让国奈何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么赞扬季札呢？因为他辞让国君之位。他辞让王位的事情是怎样的呢？这里的“国”主要指国君之位和统治权。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谒（yè）也，余祭（yú zhài）也，夷昧（yí mèi）也，与季子同母者四。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">谒、余祭、夷昧，加上季札，是同一个母亲所生的四兄弟。“谒”通常又称诸樊；季札是其中最小的弟弟。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子弱而才，兄弟皆爱之，同欲立之以为君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札年纪小，却很有才干，哥哥们都喜爱他，都想拥立他做国君。“弱”指年少；“立”是拥立。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谒曰：“今若是迮（zé）而与季子国，季子犹不受也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">谒说：“现在如果这样仓促地把王位交给季札，他还是不会接受的。”“迮”在这里指仓促；“与”是给予。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“请无与子而与弟，弟兄迭（dié）为君，而致国乎季子。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“请大家不要把王位传给自己的儿子，而要传给弟弟，兄弟依次做国君，最后把王位传到季札手里。”“无”相当于“毋”，不要；“迭”是轮流、更替；“致”是交付。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>皆曰：“诺。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">大家都说：“好。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故诸为君者，皆轻死为勇。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，先后做国君的几个哥哥，都把死亡看得很轻，以勇敢赴险为荣。按照文中的解释，他们急于让王位早日传到季札手里，甚至不惜自己的生命。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>饮食必祝（zhù）曰：“天苟有吴国，尚速有悔于予身！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">每次饮食祭祷时，他们一定祈求：“上天如果真想保全吴国，希望灾祸赶快降到我身上吧！”“苟”是如果；“尚”表示希望；“悔”在这里指灾祸；“予”是我。这段突出哥哥们想传位的心愿，不能据此认定死亡由祈祷造成。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故谒也死，余祭也立；余祭也死，夷昧也立；夷昧也死，则国宜之季子者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，谒死后余祭即位，余祭死后夷昧即位；夷昧死后，按原来的安排，王位就应该传给季札了。“之”是到、往。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子使（shì）而亡（wáng）焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札却借出使的机会避开了继位。“使”指出使；“亡”是逃避、离开，不是死亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>僚（liáo）者，长（zhǎng）庶也，即之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">僚是庶出的长子，便登上了王位。按《公羊传》本篇及旧注，僚是季札的异母兄。“庶”指妾所生；“即之”就是即位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子使而反，至，而君之尔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札出使回来，到了吴国，便承认僚为国君，仅此而已。“反”通“返”；“君之”是把他当作国君。他没有因为原来的安排而争夺王位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>阖庐（hé lǘ）曰：“先君之所以不与子国，而与弟者，凡为（wèi）季子故也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">阖庐说：“先前几位国君之所以不把王位传给儿子，而传给弟弟，全都是为了季札。”阖庐就是公子光，按本篇旧注是谒的长子；文章用他后来的称号称呼他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“将从先君之命与（yú）！则国宜之季子者也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果遵从先君的安排，那么王位就应该归季札。”“与”通“欤”，是语气词。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“如不从先君之命与！则我宜立者也。僚恶（wū）得为君乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果不遵从先君的安排，那么就应该由我即位。僚怎么能做国君呢？”这是阖庐为自己提出的继承理由，不能直接当成已经证明的公正结论。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是使专诸刺僚，而致国乎季子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，阖庐派专诸刺杀了僚，随后要把王位交给季札。专诸是执行刺杀的刺客。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子不受，曰：“尔弑（shì）吾君，吾受尔国，是吾与尔为篡（cuàn）也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札不肯接受，说：“你杀了我的国君，如果我接受你交来的王位，那就是我与你一起篡夺王位。”“尔”是你；“弑”指臣下杀君主、子女杀父母；“篡”是以不正当手段夺取君位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“尔杀吾兄，吾又杀尔，是父子兄弟相杀，终身无已也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你杀了我的兄长，如果我再杀你，就会变成父子兄弟之间互相残杀，一辈子没有停止的时候。”按本篇的亲属关系，僚是季札的兄长，阖庐是其侄子。“已”是停止。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>去之延陵，终身不入吴国。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是季札离开，前往延陵，终身不再进入吴国朝廷。“之”是到、往。延陵本在吴国境内，旧注因而把“不入吴国”解释为不入吴国朝廷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故君子以其不受为义，以其不杀为仁。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，君子认为他不接受王位合乎道义，不杀阖庐是仁厚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>贤季子，则吴何以有君、有大夫？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">既然赞扬的是季札，那么为什么连吴国的国君和大夫也获得承认呢？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以季子为臣，则宜有君者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">既然承认季札有资格做臣子，那么相应地，也应该承认他所侍奉的国君。这是《公羊传》对君臣名分的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>札者何？吴季子之名也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“札”是什么？是吴国季子的名字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《春秋》贤者不名，此何以名？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按照《公羊传》的解释，《春秋》对贤者通常不直呼其名，为什么这里直接写“札”呢？“不名”指不用本名直称，以示尊重。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许夷狄（yí dí）者，不壹（yī）而足也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">对于被视为夷狄的人，给予认可时，不会一下子就给足全部礼遇。“许”是认可、赞许。“不壹而足”在这里指不一次给予充分认可，体现了本文的华夷等级立场。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子者，所贤也，曷（hé）为不足乎季子？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札既然受到赞扬，为什么还不肯给他充分的礼遇呢？“曷为”是为什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许人臣者必使臣，许人子者必使子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">认可一个做臣子的人，必须让他守住臣子的名分；认可一个做儿子的人，必须让他守住儿子的名分。按旧注，不能把季札个人抬得很高，却将他的君父仍置于低下地位；褒扬仍受君臣、父子关系约束。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你的问题：\u003c/strong>“该季札当了，他不当，还跑，才有了后来的悲剧。他有责任，为什么要表扬他？”\u003c/p>\n\u003cp class=\"translation\">《公羊传》着重赞扬个人不贪权、不受弑君之利、不继续亲族相残的操守；你的质疑则追问继位责任和政治后果。两次拒绝应分开：第一次轮到继位而退避，确实可以追问他是否放弃了稳定局面的责任；第二次拒绝弑君后送来的王位，有避免认可暴力夺位的理由。季札退避给继承争议留下空间，但刺杀由阖庐决定，也无法确定季札即位就一定避免所有争斗。个人保持清白，不能自动等同于尽到公共责任。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh/吳子使札來聘\" target=\"_blank\" rel=\"noopener\">《吴子使札来聘》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/春秋公羊傳注疏_(四庫全書本)/卷21\" target=\"_blank\" rel=\"noopener\">《公羊传注疏》卷二十一\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-15", "volume": 3, "volume_title": "卷三 · 周文", "number": 15, "title": "郑伯克段于鄢", "file": "卷三/15-郑伯克段于鄢.md", "ready": true, "markdown": "# 《郑伯克段于鄢（yān）》\n\n卷三 · 周文 · 第15篇\n选自《谷梁传·隐公元年》。\n\n## 背景简介\n\n公元前722年，郑庄公与弟弟共叔段发生冲突，最终在鄢地击败了他。《左传》着重叙述经过，本篇逐字解释《春秋》的经文，尤其批评郑庄公；两传对段的结局也不同，《左传》说出奔，《谷梁传》按杀弟解释。\n\n**克者何？能也。**\n\n“克”是什么意思？是“能够”的意思。\n\n**何能也？能杀也。**\n\n能够做什么呢？能够杀死段。这是《谷梁传》对“克”的解释，不能与《左传》的“出奔”混为同一种记载。\n\n**何以不言杀？见（xiàn）段之有徒众也。**\n\n为什么不直接写“杀”，而写“克”？是为了显示段拥有一批追随者。“见”是显示；“徒众”是部众。段已有势力，需要动用力量击败他。\n\n**段，郑伯弟也。**\n\n段是郑庄公的弟弟。“伯”是爵位。\n\n**何以知其为弟也？**\n\n怎么知道段是郑庄公的弟弟呢？这里讨论的是如何从简短经文判断二人的关系。\n\n**杀世子、母弟目君；以其目君，知其为弟也。**\n\n按《谷梁传》理解的记事规则，杀世子或同母弟弟，要明确点出国君；这里明确写“郑伯”，所以知道段是他的弟弟。“母弟”是同母弟弟；“目君”是明确指称国君，让他直接承担责任。这是传文的解释方法。\n\n**段，弟也，而弗（fú）谓弟；公子也，而弗谓公子，贬之也。**\n\n段是国君的弟弟，却不称“弟”；是先君的儿子，却不称“公子”，是在贬斥他。“弗”是不。\n\n**段失子弟之道矣。**\n\n段已经违背做儿子、做弟弟应有的道理。这里批评他争权作乱的行为。\n\n**贱段而甚郑伯也。**\n\n经文既贬斥段，又更严厉地责备郑庄公。“贱”是贬低；“甚”是深责、严厉谴责，已收入词表。\n\n**何甚乎郑伯？**\n\n为什么严厉责备郑庄公呢？\n\n**甚郑伯之处（chǔ）心积虑，成于杀也。**\n\n因为郑庄公长期存心谋划，最终要达到杀死弟弟的目的。“处心积虑”带贬义。按传文及旧注，他没有及早约束、教导，而是放任弟弟发展罪过，最后除掉他。这属于传文对人物动机的判断。\n\n**于鄢，远也。**\n\n“在鄢地”，说明段已经逃得很远。《谷梁传》认为特意写地点，是突出段退走后仍遭追赶。\n\n**犹曰取之其母之怀中，而杀之云尔，甚之也。**\n\n这就像说，从母亲怀里把他抓出来杀掉，是在严厉谴责郑庄公。这是比喻，强调同母骨肉之亲，不是说段真的躲在母亲怀里。\n\n**然则为郑伯者，宜奈何？**\n\n既然如此，郑庄公应该怎样处理呢？\n\n**缓追，逸贼，亲亲之道也。**\n\n放慢追赶，让作乱者逃走，才是亲爱亲人的做法。“逸”是使他逃脱，放一条生路；“贼”指作乱的段；“亲亲”是亲爱亲人。本文主张解除叛乱威胁后，不必赶尽杀绝。\n\n## 阅读提示\n\n段作乱有罪，庄公是否也曾放任事情恶化，是本篇追问的问题。但“处心积虑”是《谷梁传》的动机判断，不能直接当成已独立证实的心理事实。\n\n## 核对来源\n\n- [《谷梁传·郑伯克段于鄢》](https://zh.wikisource.org/wiki/穀梁傳/鄭伯克段于鄢)\n- [《春秋谷梁注疏》卷一](https://www.shidianguji.com/book/NA00011/chapter/1mgp8una9ujo3)\n", "html": "\u003ch1>《郑伯克段于鄢（yān）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第15篇\u003cbr>选自《谷梁传·隐公元年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前722年，郑庄公与 《谷梁传》认为特意写地点，是突出段退走后仍遭追赶。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>犹曰取之其母之怀中，而杀之云尔，甚之也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这就像说，从母亲怀里把他抓出来杀掉，是在严厉谴责郑庄公。这是比喻，强调同母骨肉之亲，不是说段真的躲在母亲怀里。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>然则为郑伯者，宜奈何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">既然如此，郑庄公应该怎样处理呢？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>缓追，逸贼，亲亲之道也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">放慢追赶，让作乱者逃走，才是亲爱亲人的做法。“逸”是使他逃脱，放一条生路；“贼”指作乱的段；“亲亲”是亲爱亲人。本文主张解除叛乱威胁后，不必赶尽杀绝。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">段作乱有罪，庄公是否也曾放任事情恶化，是本篇追问的问题。但“处心积虑”是《谷梁传》的动机判断，不能直接当成已独立证实的心理事实。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/穀梁傳/鄭伯克段于鄢\" target=\"_blank\" rel=\"noopener\">《谷梁传·郑伯克段于鄢》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.shidianguji.com/book/NA00011/chapter/1mgp8una9ujo3\" target=\"_blank\" rel=\"noopener\">《春秋谷梁注疏》卷一\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-16", "volume": 3, "volume_title": "卷三 · 周文", "number": 16, "title": "虞师晋师灭夏阳", "file": "卷三/16-虞师晋师灭夏阳.md", "ready": true, "markdown": "# 《虞（yú）师晋师灭夏阳》\n\n卷三 · 周文 · 第16篇\n选自《谷梁传·僖公二年》。\n\n## 背景简介\n\n晋献公想攻打虢国，谋臣荀息建议用宝玉、良马换取虞国借道。虞、虢两国相互依存，宫之奇反对借道，虞公却没有听从；本文借解释《春秋》的记事用语追述此事。\n\n**虞师、晋师灭夏阳。**\n\n虞国和晋国的军队攻陷夏阳。“师”是军队；夏阳是城邑。这一句是《春秋》经文，以下是《谷梁传》的解释。\n\n**非国而曰灭，重夏阳也。**\n\n夏阳不是国家，却用“灭”字记载，是为了突出它的重要性。\n\n**虞无师，其曰师，何也？**\n\n按《谷梁传》的称谓规则，虞国这样的国家，其军队通常不称“师”，这里为什么称“虞师”？不是说它实际上没有军队。\n\n**以其先晋，不可以不言师也。**\n\n因为经文把虞国列在晋国前面，所以也要使用“师”这个称谓。\n\n**其先晋，何也？为主乎灭夏阳也。**\n\n为什么把虞国列在前面？是要突出它在攻灭夏阳这件事上的主要责任，不是说军事实力更强。\n\n**夏阳者，虞、虢（guó）之塞（sài）邑也。**\n\n夏阳是关系到虞、虢两国安全的要塞城邑。\n\n**灭夏阳，而虞、虢举矣。**\n\n夏阳被攻陷，虞、虢两国也就面临被攻取的命运。“举”是攻取，不是说两国当天同时灭亡。\n\n**虞之为主乎灭夏阳，何也？**\n\n为什么要把虞国看作主要责任者呢？下面讲事情经过。\n\n**晋献公欲伐虢，荀（xún）息曰：“君何不以屈（qū）产之乘（shèng）、垂棘之璧（bì），而借道乎虞也？”**\n\n晋献公想攻打虢国，荀息说：“您为什么不用屈地的良马、垂棘的宝玉作礼物，向虞国借路呢？”荀息是晋国大夫。“乘”指四匹马；“璧”是玉器；“借道”是请对方允许军队过境。\n\n**公曰：“此晋国之宝也。如受吾币，而不借吾道，则如之何？”**\n\n献公说：“这些都是晋国的宝物。如果虞国收了礼，却不肯借路，那怎么办？”“币”是礼物。\n\n**荀息曰：“此小国之所以事大国也。”**\n\n荀息说：“这样的宝物，本来是小国用来侍奉大国的。”他的意思是，小国反而接受大国重礼，就不能不有所回报。\n\n**“彼不借吾道，必不敢受吾币。”**\n\n“它如果不肯借路，就一定不敢收我们的礼物。”\n\n**“如受吾币而借吾道，则是我取之中府而藏之外府，取之中厩（jiù）而置之外厩也！”**\n\n“如果它收礼并借路，那不过是把宝玉从宫内库房移到外面库房，把良马从宫内马棚移到外面马棚罢了！”荀息已经把虞国看成可以吞并的地方，宝物将来还会取回。\n\n**公曰：“宫之奇存焉，必不使受之也。”**\n\n献公说：“虞国还有宫之奇，他一定不会让虞公收礼。”宫之奇是虞国大夫。\n\n**荀息曰：“宫之奇之为人也，达心而懦（nuò）；又少（shào）长（zhǎng）于君。”**\n\n荀息说：“宫之奇明白事理，却性格软弱，又是从小与虞公一起长大的。”“达心”是心思通达、看得明白。\n\n**“达心，则其言略；懦，则不能强（qiǎng）谏；少长于君，则君轻之。”**\n\n“因为自己明白，所以说话简略；因为软弱，所以不能坚持强硬地劝谏；因为从小熟识，所以国君反而不重视他。”这是荀息对宫之奇的判断。\n\n**“且夫玩好（hào）在耳目之前，而患在一国之后，此中知（zhì）以上乃能虑之。”**\n\n“况且宝物的享受就在眼前，祸患却关系到整个国家以后的命运，只有中等智慧以上的人才能考虑到。”“玩好”是珍贵赏玩物；“知”通“智”。\n\n**“臣料虞君中知以下也。”**\n\n“我估计虞公的智慧还在中等以下。”荀息认为他会被眼前利益吸引。\n\n**公遂借道而伐虢。**\n\n于是献公依计借道伐虢。这句先概括结果，后面再补述经过。\n\n**宫之奇谏曰：“晋国之使者，其辞卑而币重，必不便于虞。”**\n\n宫之奇劝谏：“晋国使者言辞谦卑，礼物却很贵重，这件事一定对虞国不利。”“便”是有利。强国反常地谦卑、送重礼，必有所图。\n\n**虞公弗（fú）听，遂受其币，而借之道。**\n\n虞公不听劝，接受礼物，允许晋军过境。“弗”是不。\n\n**宫之奇又谏曰：“语曰：‘唇亡则齿寒。’其斯之谓与（yú）？”**\n\n宫之奇再劝：“俗话说，嘴唇没有了，牙齿就会受寒，说的不正是现在这种情况吗？”虢国如唇，虞国如齿，灭虢也会失去自己的屏障。\n\n**挈（qiè）其妻子以奔曹。**\n\n宫之奇带着妻子和儿女，逃往曹国。“挈”是带领；“妻子”指妻子和孩子。\n\n**献公亡虢，五年，而后举虞。**\n\n献公灭掉虢国，五年之后，又攻取虞国。“亡”是使灭亡；“举”是攻取。这里保留本篇“五年”的记载，不与其他史书混写。\n\n**荀息牵马操璧而前曰：“璧则犹是也，而马齿加长（zhǎng）矣。”**\n\n荀息牵马、拿玉走上前，说：“宝玉还是原来的宝玉，只是马的年龄增加了。”“操”是拿着；“马齿”代指年龄。当初送出的礼物，果然又回到晋国。\n\n## 阅读提示\n\n晋国策划并实施侵略，《谷梁传》却把议论重点放在虞公为什么帮助别人拆掉自己的屏障。追究虞公贪利、误判的责任，不等于晋国没有侵略责任。\n\n## 核对来源\n\n- [《虞师晋师灭夏阳》](https://zh.wikisource.org/wiki/虞師晉師滅夏陽)\n- [《谷梁注疏》卷七](https://www.shidianguji.com/book/NA00011/chapter/1mgp8v33u8gmc)\n", "html": "\u003ch1>《虞（yú）师晋师灭夏阳》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第16篇\u003cbr>选自《谷梁传·僖公二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公想攻打虢国，谋臣荀息建议用宝玉、良马换取虞国借道。虞、虢两国相互依存，宫之奇反对借道，虞公却没有听从；本文借解释《春秋》的记事用语追述此事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞师、晋师灭夏阳。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞国和晋国的军队攻陷夏阳。“师”是军队；夏阳是城邑。这一句是《春秋》经文，以下是《谷梁传》的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>非国而曰灭，重夏阳也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏阳不是国家，却用“灭”字记载，是为了突出它的重要性。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞无师，其曰师，何也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按《谷梁传》的称谓规则，虞国这样的国家，其军队通常不称“师”，这里为什么称“虞师”？不是说它实际上没有军队。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以其先晋，不可以不言师也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因为经文把虞国列在晋国前面，所以也要使用“师”这个称谓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其先晋，何也？为主乎灭夏阳也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么把虞国列在前面？是要突出它在攻灭夏阳这件事上的主要责任，不是说军事实力更强。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夏阳者，虞、虢（guó）之塞（sài）邑也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏阳是关系到虞、虢两国安全的要塞城邑。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>灭夏阳，而虞、虢举矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏阳被攻陷，虞、虢两国也就面临被攻取的命运。“举”是攻取，不是说两国当天同时灭亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞之为主乎灭夏阳，何也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么要把虞国看作主要责任者呢？下面讲事情经过。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献公欲伐虢，荀（xún）息曰：“君何不以屈（qū）产之乘（shèng）、垂棘之璧（bì），而借道乎虞也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公想攻打虢国，荀息说：“您为什么不用屈地的良马、垂棘的宝玉作礼物，向虞国借路呢？”荀息是晋国大夫。“乘”指四匹马；“璧”是玉器；“借道”是请对方允许军队过境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“此晋国之宝也。如受吾币，而不借吾道，则如之何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">献公说：“这些都是晋国的宝物。如果虞国收了礼，却不肯借路，那怎么办？”“币”是礼物。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>荀息曰：“此小国之所以事大国也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">荀息说：“这样的宝物，本来是小国用来侍奉大国的。”他的意思是，小国反而接受大国重礼，就不能不有所回报。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“彼不借吾道，必不敢受吾币。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“它如果不肯借路，就一定不敢收我们的礼物。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“如受吾币而借吾道，则是我取之中府而藏之外府，取之中厩（jiù）而置之外厩也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果它收礼并借路，那不过是把宝玉从宫内库房移到外面库房，把良马从宫内马棚移到外面马棚罢了！”荀息已经把虞国看成可以吞并的地方，宝物将来还会取回。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“宫之奇存焉，必不使受之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">献公说：“虞国还有宫之奇，他一定不会让虞公收礼。”宫之奇是虞国大夫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>荀息曰：“宫之奇之为人也，达心而懦（nuò）；又少（shào）长（zhǎng）于君。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">荀息说：“宫之奇明白事理，却性格软弱，又是从小与虞公一起长大的。”“达心”是心思通达、看得明白。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“达心，则其言略；懦，则不能强（qiǎng）谏；少长于君，则君轻之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因为自己明白，所以说话简略；因为软弱，所以不能坚持强硬地劝谏；因为从小熟识，所以国君反而不重视他。”这是荀息对宫之奇的判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“且夫玩好（hào）在耳目之前，而患在一国之后，此中知（zhì）以上乃能虑之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且宝物的享受就在眼前，祸患却关系到整个国家以后的命运，只有中等智慧以上的人才能考虑到。”“玩好”是珍贵赏玩物；“知”通“智”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“臣料虞君中知以下也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我估计虞公的智慧还在中等以下。”荀息认为他会被眼前利益吸引。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公遂借道而伐虢。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是献公依计借道伐虢。这句先概括结果，后面再补述经过。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宫之奇谏曰：“晋国之使者，其辞卑而币重，必不便于虞。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇劝谏：“晋国使者言辞谦卑，礼物却很贵重，这件事一定对虞国不利。”“便”是有利。强国反常地谦卑、送重礼，必有所图。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞公弗（fú）听，遂受其币，而借之道。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞公不听劝，接受礼物，允许晋军过境。“弗”是不。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宫之奇又谏曰：“语曰：‘唇亡则齿寒。’其斯之谓与（yú）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇再劝：“俗话说，嘴唇没有了，牙齿就会受寒，说的不正是现在这种情况吗？”虢国如唇，虞国如齿，灭虢也会失去自己的屏障。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>挈（qiè）其妻子以奔曹。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇带着妻子和儿女，逃往曹国。“挈”是带领；“妻子”指妻子和孩子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>献公亡虢，五年，而后举虞。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">献公灭掉虢国，五年之后，又攻取虞国。“亡”是使灭亡；“举”是攻取。这里保留本篇“五年”的记载，不与其他史书混写。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>荀息牵马操璧而前曰：“璧则犹是也，而马齿加长（zhǎng）矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">荀息牵马、拿玉走上前，说：“宝玉还是原来的宝玉，只是马的年龄增加了。”“操”是拿着；“马齿”代指年龄。当初送出的礼物，果然又回到晋国。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">晋国策划并实施侵略，《谷梁传》却把议论重点放在虞公为什么帮助别人拆掉自己的屏障。追究虞公贪利、误判的责任，不等于晋国没有侵略责任。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/虞師晉師滅夏陽\" target=\"_blank\" rel=\"noopener\">《虞师晋师灭夏阳》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.shidianguji.com/book/NA00011/chapter/1mgp8v33u8gmc\" target=\"_blank\" rel=\"noopener\">《谷梁注疏》卷七\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-17", "volume": 3, "volume_title": "卷三 · 周文", "number": 17, "title": "晋献公杀世子申生", "file": "卷三/17-晋献公杀世子申生.md", "ready": true, "markdown": "# 《晋献公杀世子申生》\n\n卷三 · 周文 · 第17篇\n选自《礼记·檀（tán）弓上》。\n\n## 背景简介\n\n晋献公听信骊姬谗言，认定世子申生想加害自己，准备杀他。《礼记》把申生描写为不愿伤父亲之心、也不愿背负罪名出走的人；以下心理理由属于文中人物的话，不能当作已经证实的内心实录。\n\n**晋献公将杀其世子申生。**\n\n晋献公准备杀死世子申生。“世子”是诸侯预定的继承人。正文最后写自尽，标题归责于献公，不是说他亲自动手。\n\n**公子重（chóng）耳谓之曰：“子盖（hé）言子之志于公乎？”**\n\n重耳对他说：“您为什么不向父亲说明自己的真实心意呢？”重耳是申生异母弟，后来成为晋文公。“子”是尊称；“盖”通“盍”，何不；“志”是心意。重耳劝他申辩受诬陷之事。\n\n**世子曰：“不可。君安骊（lí）姬，是我伤公之心也。”**\n\n申生说：“不行。父亲依恋骊姬，以她为安；如果我揭露她，就是伤父亲的心。”按文中解释，他担心骊姬受罚会使父亲失去所爱。\n\n**曰：“然则盖（hé）行乎？”**\n\n重耳说：“既然如此，为什么不离开呢？”“行”是出走、逃往别国。\n\n**世子曰：“不可。君谓我欲杀君也。”**\n\n申生说：“不行。父亲认为我想杀害他。”这里的“君”既是国君，也是父亲。\n\n**“天下岂有无父之国哉？我何行如之？”**\n\n“天下难道有哪个国家的人没有父亲吗？我又能逃到哪里？”“如”是到、往。他担心各国都会憎恶谋害父亲的人。这是人物的顾虑，不等于客观上必然无处可去。\n\n**使人辞于狐突曰：“申生有罪，不念伯氏之言也，以至于死。”**\n\n申生派人向狐突告别：“申生有过错，没有把您的话放在心上，以致落到将死的地步。”狐突是老师，“伯氏”是对他的称呼。“辞”是告别。按旧注，狐突早先劝他避祸；此处自责没有听劝，不是承认谋害父亲。\n\n**“申生不敢爱其死。”**\n\n“申生不敢因为爱惜生命而逃避死亡。”“爱”是爱惜、吝惜，不是喜爱死亡。\n\n**“虽然，吾君老矣，子少（shào），国家多难（nàn）。”**\n\n“虽然如此，国君已年老，儿子还年幼，国家又有许多危难。”“虽然”是虽然如此；“子”指骊姬之子奚齐。\n\n**“伯氏不出而图吾君。”**\n\n“您又没有出来为国君谋划国事。”“出”是出来任事；“图”是谋划。按旧注，狐突当时称病不出，申生为此担忧。\n\n**“伯氏苟出而图吾君，申生受赐而死。”**\n\n“您若肯出来为国君谋划国事，申生就是蒙受您的恩惠而死了。”“苟”是如果；“赐”是恩惠。这是在托付后事，希望狐突辅政。\n\n**再拜稽（qǐ）首，乃卒。**\n\n申生拜了两次，叩头至地，随后死去。“再拜”是拜两次；“稽首”是郑重叩首礼。按旧注，随后自缢而死。\n\n**是以为恭世子也。**\n\n因此被称为“恭世子”。“恭”是谥号，突出恭敬、顺从。\n\n## 阅读讨论\n\n**你的质疑：**“没有是否正义了。”\n\n父亲听信谗言、冤枉儿子，讨论却集中在儿子如何维护父亲感受和名誉。受到伤害的人不应因此承担替伤害者维持名誉的全部责任。理解申生的感情，不等于赞成牺牲生命；他有理由申辩、离开和保全自己。\n\n旧注也批评他不申辩而死，使父亲陷于杀子之不义，所以只谥“恭”而非“孝”。但这一理由仍以君父名誉为中心，不能取代对申生是否遭到公正对待的追问。\n\n**你的问题：**“这是西汉儒家瞎编的吧？”\n\n申生之死也见于《左传》《史记》，但这些文献可能沿用共同材料，不能算多份完全独立证据。具体对话与心理不能当作现场实录；叙事可能经过传述、选择和伦理化整理，目前不能据此断定是西汉某人凭空捏造。应说“《礼记》把申生描写成这样”，而不是断言真实申生必然如此想。\n\n## 核对来源\n\n- [《晋献公杀世子申生》](https://zh.wikisource.org/wiki/晉獻公殺世子申生)\n- [《礼记正义》卷八](https://zh.wikisource.org/wiki/禮記正義/08)\n- [《左传》僖公相关记载](https://www.shidianguji.com/mid-page/7371189612309463077)\n", "html": "\u003ch1>《晋献公杀世子申生》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第17篇\u003cbr>选自《礼记·檀（tán）弓上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公听信骊姬谗言，认定世子申生想加害自己，准备杀他。《礼记》把申生描写为不愿伤父亲之心、也不愿背负罪名出走的人；以下心理理由属于文中人物的话，不能当作已经证实的内心实录。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献公将杀其世子申生。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公准备杀死世子申生。“世子”是诸侯预定的继承人。正文最后写自尽，标题归责于献公，不是说他亲自动手。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公子重（chóng）耳谓之曰：“子盖（hé）言子之志于公乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳对他说：“您为什么不向父亲说明自己的真实心意呢？”重耳是申生异母弟，后来成为晋文公。“子”是尊称；“盖”通“盍”，何不；“志”是心意。重耳劝他申辩受诬陷之事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>世子曰：“不可。君安骊（lí）姬，是我伤公之心也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生说：“不行。父亲依恋骊姬，以她为安；如果我揭露她，就是伤父亲的心。”按文中解释，他担心骊姬受罚会使父亲失去所爱。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“然则盖（hé）行乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳说：“既然如此，为什么不离开呢？”“行”是出走、逃往别国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>世子曰：“不可。君谓我欲杀君也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生说：“不行。父亲认为我想杀害他。”这里的“君”既是国君，也是父亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“天下岂有无父之国哉？我何行如之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“天下难道有哪个国家的人没有父亲吗？我又能逃到哪里？”“如”是到、往。他担心各国都会憎恶谋害父亲的人。这是人物的顾虑，不等于客观上必然无处可去。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使人辞于狐突曰：“申生有罪，不念伯氏之言也，以至于死。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生派人向狐突告别：“申生有过错，没有把您的话放在心上，以致落到将死的地步。”狐突是老师，“伯氏”是对他的称呼。“辞”是告别。按旧注，狐突早先劝他避祸；此处自责没有听劝，不是承认谋害父亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“申生不敢爱其死。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“申生不敢因为爱惜生命而逃避死亡。”“爱”是爱惜、吝惜，不是喜爱死亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽然，吾君老矣，子少（shào），国家多难（nàn）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虽然如此，国君已年老，儿子还年幼，国家又有许多危难。”“虽然”是虽然如此；“子”指骊姬之子奚齐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“伯氏不出而图吾君。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您又没有出来为国君谋划国事。”“出”是出来任事；“图”是谋划。按旧注，狐突当时称病不出，申生为此担忧。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“伯氏苟出而图吾君，申生受赐而死。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您若肯出来为国君谋划国事，申生就是蒙受您的恩惠而死了。”“苟”是如果；“赐”是恩惠。这是在托付后事，希望狐突辅政。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>再拜稽（qǐ）首，乃卒。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申生拜了两次，叩头至地，随后死去。“再拜”是拜两次；“稽首”是郑重叩首礼。按旧注，随后自缢而死。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是以为恭世子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此被称为“恭世子”。“恭”是谥号，突出恭敬、顺从。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你的质疑：\u003c/strong>“没有是否正义了。”\u003c/p>\n\u003cp class=\"translation\">父亲听信谗言、冤枉儿子，讨论却集中在儿子如何维护父亲感受和名誉。受到伤害的人不应因此承担替伤害者维持名誉的全部责任。理解申生的感情，不等于赞成牺牲生命；他有理由申辩、离开和保全自己。\u003c/p>\n\u003cp class=\"translation\">旧注也批评他不申辩而死，使父亲陷于杀子之不义，所以只谥“恭”而非“孝”。但这一理由仍以君父名誉为中心，不能取代对申生是否遭到公正对待的追问。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>你的问题：\u003c/strong>“这是西汉儒家瞎编的吧？”\u003c/p>\n\u003cp class=\"translation\">申生之死也见于《左传》《史记》，但这些文献可能沿用共同材料，不能算多份完全独立证据。具体对话与心理不能当作现场实录；叙事可能经过传述、选择和伦理化整理，目前不能据此断定是西汉某人凭空捏造。应说“《礼记》把申生描写成这样”，而不是断言真实申生必然如此想。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/晉獻公殺世子申生\" target=\"_blank\" rel=\"noopener\">《晋献公杀世子申生》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/08\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷八\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.shidianguji.com/mid-page/7371189612309463077\" target=\"_blank\" rel=\"noopener\">《左传》僖公相关记载\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-18", "volume": 3, "volume_title": "卷三 · 周文", "number": 18, "title": "曾子易箦", "file": "卷三/18-曾子易箦.md", "ready": true, "markdown": "# 《曾子易箦（zé）》\n\n卷三 · 周文 · 第18篇\n选自《礼记·檀弓上》。\n\n## 背景简介\n\n曾子就是曾参，孔子的弟子。本文传述他临终听童子指出自己使用大夫规格的床席，便坚持更换，以求合乎礼制的故事。\n\n**曾子寝疾，病。**\n\n曾子卧病在床，病情已经很重。“寝疾”是卧病；“病”进一步表示病势沉重，不是简单重复。\n\n**乐（yuè）正子春坐于床下，曾元、曾申坐于足，童子隅（yú）坐而执烛。**\n\n弟子乐正子春坐在床旁，曾子的两个儿子曾元、曾申坐在床脚边，童子坐在角落里拿着照明的烛。“乐正”是姓氏；“隅”是角落；“执”是拿着。\n\n**童子曰：“华而睆（huǎn），大夫之箦（zé）与（yú）？”**\n\n童子说：“这么华美光洁，是大夫使用的床席吧？”“箦”指竹席或竹编床面；“与”通“欤”。这句点出床席的身份规格。\n\n**子春曰：“止！”**\n\n子春说：“别说了！”按旧注，他担心曾子病重，不能再搬动身体换席。\n\n**曾子闻之，瞿（qú）然曰：“呼（hū）！”**\n\n曾子听见，惊觉起来，发出“啊”的一声。“瞿然”是惊觉的样子；旧注将“呼”解释为虚弱的出声。\n\n**曰：“华而睆，大夫之箦与？”**\n\n童子又说：“这么华美光洁，是大夫使用的床席吧？”通常理解为童子重复前话。\n\n**曾子曰：“然。斯季孙之赐也，我未之能易也。”**\n\n曾子说：“是的。这是季孙送给我的，我还没能换掉。”季孙是鲁国卿大夫家族之称。“斯”是这；“易”是更换；“未之能易”即未能易之。\n\n**“元，起易箦！”**\n\n“曾元，起来，把床席换掉！”\n\n**曾元曰：“夫子之病革（jí）矣，不可以变。”**\n\n曾元说：“您的病已经很危急，不能再搬动身体了。”“夫子”是尊称，这里指父亲；“革”读jí，是危急；“变”指搬动。\n\n**“幸而至于旦，请敬易之。”**\n\n“希望能等到天亮，到时再让我恭敬地替您更换。”“幸”表示希望；“旦”是天亮。他并非拒绝更换，而是担心父亲此刻承受不住。\n\n**曾子曰：“尔之爱我也，不如彼。”**\n\n曾子说：“你这样爱我，还不如那个童子。”“尔”是你；“彼”指童子。按文中判断，儿子顾惜身体，童子则提醒纠正不合礼之处。\n\n**“君子之爱人也以德，细人之爱人也以姑息。”**\n\n“君子爱人，会帮助他成就德行；见识狭小的人爱人，只求让他眼前安适。”“细人”是文中贬称；“姑息”在这里侧重迁就、苟求眼前安适。这是曾子在故事中的价值判断。\n\n**“吾何求哉？吾得正而毙（bì）焉，斯已矣。”**\n\n“我还求什么？能合乎正礼而死，就够了。”“正”在本篇具体指合乎礼制，不等于现代公平正义；“毙”是死亡；“斯已矣”是这样就够了。\n\n**举扶而易之，反席未安而没（mò）。**\n\n众人抬扶曾子，换掉床席；让他重新躺下，还没安顿好，他就去世。“反”通“返”；“没”通“殁”。原文写换席后随即去世，没有明确证明换席就是死因。\n\n## 阅读讨论\n\n**你的问题：**“大夫赐的席不能用，为什么已经睡了呢？不能死的时候用吗？”\n\n正文承认已经使用，只说“未之能易”，没有充分交代此前为何不换。上一轮把它概括为“没有大夫身份就一概不能用”过于简单，应以此处修订为准。\n\n《礼记正义》补充解释：未病之时尚可睡用，病重时应改正；因为身体虚弱，所以一拖再拖。这接近“平时尚可用，但不应以这种状态临终”的解释。它是旧注替故事作的说明，正文没有明确写出这条完整规则。若觉得为身份规格冒搬动风险很牵强，这个疑问仍然成立。\n\n可以分别判断：坚持自己认定的原则是否值得尊重，以及原则维护的身份等级是否合理。理解文章赞扬什么，不要求接受全部价值判断。\n\n## 核对来源\n\n- [《曾子易箦》](https://zh.wikisource.org/wiki/曾子易簀)\n- [《礼记正义》卷九](https://zh.wikisource.org/wiki/禮記正義/09)\n", "html": "\u003ch1>《曾子易箦（zé）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第18篇\u003cbr>选自《礼记·檀弓上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">曾子就是曾参，孔子的弟子。本文传述他临终听童子指出自己使用大夫规格的床席，便坚持更换，以求合乎礼制的故事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子寝疾，病。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子卧病在床，病情已经很重。“寝疾”是卧病；“病”进一步表示病势沉重，不是简单重复。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乐（yuè）正子春坐于床下，曾元、曾申坐于足，童子隅（yú）坐而执烛。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">弟子乐正子春坐在床旁，曾子的两个儿子曾元、曾申坐在床脚边，童子坐在角落里拿着照明的烛。“乐正”是姓氏；“隅”是角落；“执”是拿着。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>童子曰：“华而睆（huǎn），大夫之箦（zé）与（yú）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">童子说：“这么华美光洁，是大夫使用的床席吧？”“箦”指竹席或竹编床面；“与”通“欤”。这句点出床席的身份规格。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子春曰：“止！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子春说：“别说了！”按旧注，他担心曾子病重，不能再搬动身体换席。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子闻之，瞿（qú）然曰：“呼（hū）！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子听见，惊觉起来，发出“啊”的一声。“瞿然”是惊觉的样子；旧注将“呼”解释为虚弱的出声。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“华而睆，大夫之箦与？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">童子又说：“这么华美光洁，是大夫使用的床席吧？”通常理解为童子重复前话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“然。斯季孙之赐也，我未之能易也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“是的。这是季孙送给我的，我还没能换掉。”季孙是鲁国卿大夫家族之称。“斯”是这；“易”是更换；“未之能易”即未能易之。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“元，起易箦！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“曾元，起来，把床席换掉！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾元曰：“夫子之病革（jí）矣，不可以变。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾元说：“您的病已经很危急，不能再搬动身体了。”“夫子”是尊称，这里指父亲；“革”读jí，是危急；“变”指搬动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“幸而至于旦，请敬易之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“希望能等到天亮，到时再让我恭敬地替您更换。”“幸”表示希望；“旦”是天亮。他并非拒绝更换，而是担心父亲此刻承受不住。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“尔之爱我也，不如彼。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“你这样爱我，还不如那个童子。”“尔”是你；“彼”指童子。按文中判断，儿子顾惜身体，童子则提醒纠正不合礼之处。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君子之爱人也以德，细人之爱人也以姑息。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“君子爱人，会帮助他成就德行；见识狭小的人爱人，只求让他眼前安适。”“细人”是文中贬称；“姑息”在这里侧重迁就、苟求眼前安适。这是曾子在故事中的价值判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“吾何求哉？吾得正而毙（bì）焉，斯已矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我还求什么？能合乎正礼而死，就够了。”“正”在本篇具体指合乎礼制，不等于现代公平正义；“毙”是死亡；“斯已矣”是这样就够了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>举扶而易之，反席未安而没（mò）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">众人抬扶曾子，换掉床席；让他重新躺下，还没安顿好，他就去世。“反”通“返”；“没”通“殁”。原文写换席后随即去世，没有明确证明换席就是死因。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你的问题：\u003c/strong>“大夫赐的席不能用，为什么已经睡了呢？不能死的时候用吗？”\u003c/p>\n\u003cp class=\"translation\">正文承认已经使用，只说“未之能易”，没有充分交代此前为何不换。上一轮把它概括为“没有大夫身份就一概不能用”过于简单，应以此处修订为准。\u003c/p>\n\u003cp class=\"translation\">《礼记正义》补充解释：未病之时尚可睡用，病重时应改正；因为身体虚弱，所以一拖再拖。这接近“平时尚可用，但不应以这种状态临终”的解释。它是旧注替故事作的说明，正文没有明确写出这条完整规则。若觉得为身份规格冒搬动风险很牵强，这个疑问仍然成立。\u003c/p>\n\u003cp class=\"translation\">可以分别判断：坚持自己认定的原则是否值得尊重，以及原则维护的身份等级是否合理。理解文章赞扬什么，不要求接受全部价值判断。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/曾子易簀\" target=\"_blank\" rel=\"noopener\">《曾子易箦》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/09\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷九\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-19", "volume": 3, "volume_title": "卷三 · 周文", "number": 19, "title": "有子之言似夫子", "file": "卷三/19-有子之言似夫子.md", "ready": true, "markdown": "# 《有子之言似夫子》\n\n卷三 · 周文 · 第19篇\n选自《礼记·檀弓上》。\n\n## 背景简介\n\n有子、曾子、子游都是孔子弟子。曾子转述“丧欲速贫，死欲速朽”，有子觉得不符合孔子一贯主张，由此引出对说话语境的讨论。\n\n**有子问于曾子曰：“问丧（sàng）于夫子乎？”**\n\n有子问曾子：“您从老师那里听说过关于失去官位的话吗？”有子名有若；夫子指孔子。第二个“问”，旧注认为应作“闻”；“丧”是失去官位，不是办丧事。\n\n**曰：“闻之矣：丧欲速贫，死欲速朽。”**\n\n曾子说：“听过：失去官位，希望赶快贫穷；死后，希望赶快腐朽。”“速”是赶快；“朽”是腐烂。单独这样转述，很容易产生误解。\n\n**有子曰：“是非君子之言也！”**\n\n有子说：“这不是君子应说的话！”“是”是这，“非”是不是，要拆开理解。\n\n**曾子曰：“参（shēn）也闻诸夫子也！”**\n\n曾子说：“我曾参是亲自从老师那里听来的！”“诸”相当于“之于”，“闻诸夫子”是从孔子那里听到。\n\n**有子又曰：“是非君子之言也！”**\n\n有子再次说：“这不是君子应说的话！”他认为把它当一般主张，与孔子思想不符。\n\n**曾子曰：“参也与子游闻之。”**\n\n曾子说：“我和子游一起听到的。”子游名言偃，是另一位在场者。\n\n**有子曰：“然！然则夫子有为（wèi）言之也。”**\n\n有子说：“这样啊！那么老师一定是针对具体情况才说的。”“有为言之”是有所针对而说。他调整了判断：话可能说过，但必须联系当时事情理解。\n\n**曾子以斯言告于子游。**\n\n曾子把有子的话告诉子游。\n\n**子游曰：“甚哉！有子之言似夫子也。”**\n\n子游说：“有子的见解真像老师啊！”赞扬他理解孔子说话用意的能力。\n\n**“昔者夫子居于宋，见桓（huán）司马自为石椁（guǒ），三年而不成。”**\n\n“以前老师住在宋国，看见桓司马为自己造石椁，三年还没完成。”桓司马即桓魋（tuí），是宋国司马；“椁”是套在棺外的外棺。\n\n**“夫子曰：‘若是其靡（mí）也，死不如速朽之愈也！’”**\n\n“老师说：‘要是这样奢侈浪费，死后还不如赶快腐朽来得好！’”“靡”是奢侈耗费；“愈”是更好。批评的是为防腐朽而过度耗费，并非普遍提倡速朽。\n\n**“死之欲速朽，为桓司马言之也。”**\n\n“所谓希望死后赶快腐朽，是针对桓司马说的。”\n\n**“南宫敬叔反，必载宝而朝（cháo）。”**\n\n“南宫敬叔返回鲁国后，朝见国君总要带着宝物。”他是鲁国大夫。“反”通“返”。为何带宝，旧说不同：有说行贿求复位，也有说怕再被逐而随身携财；原文未明确交代。\n\n**“夫子曰：‘若是其货也，丧（sàng）不如速贫之愈也？’”**\n\n“老师说：‘如果这样看重财货，失位后还不如赶快贫穷来得好！’”这是针对敬叔对财货的依赖、追逐，不是劝所有失位者变穷。\n\n**“丧之欲速贫，为敬叔言之也！”**\n\n“所谓失位后希望赶快贫穷，是针对南宫敬叔说的！”\n\n**曾子以子游之言告于有子。**\n\n曾子把子游的解释告诉有子。\n\n**有子曰：“然！吾固曰非夫子之言也。”**\n\n有子说：“正是这样！我本来就说，这不是老师的主张。”“固”是本来。他不再否认说过这些话，而是否认脱离语境后的字面意义代表孔子的一般主张。\n\n**曾子曰：“子何以知之？”**\n\n曾子问：“您凭什么知道？”“何以”就是以何、凭什么。\n\n**有子曰：“夫子制于中都，四寸之棺，五寸之椁，以斯知不欲速朽也。”**\n\n有子说：“老师治理中都时，规定棺板厚四寸、椁板厚五寸，由此知道他不主张死者赶快腐朽。”中都是鲁国城邑。这是本文给出的行为依据。\n\n**“昔者夫子失鲁司寇，将之荆（jīng），盖（gài）先之以子夏，又申之以冉（rǎn）有，以斯知不欲速贫也。”**\n\n“以前老师失去鲁国司寇职位，准备前往楚国，大概先派子夏去，随后又派冉有去，由此知道他不主张失位后赶快贫穷。”“之”是往；“荆”指楚；“申”是再次、重复。按旧注，先遣弟子是考察能否任职、安排去处。\n\n## 阅读讨论\n\n确认“某人说过”，不等于已弄懂“他是什么意思”。要核对针对的人和事，也要区分通常主张与两种不理想情况之间的比较。故事以有子为能理解孔子者，这是传文的叙事安排，不是对每位弟子理解能力的全面评估。\n\n**词语记录：**申 shēn：再次、重复。例句“又申之以冉有”，意思是随后又派冉有前去，已收入词表第48条。\n\n## 核对来源\n\n- [《有子之言似夫子》](https://zh.wikisource.org/wiki/有子之言似夫子)\n- [吴澄《礼记纂言》卷十四下](https://zh.wikisource.org/wiki/禮記纂言_(四庫全書本)/卷14下)\n", "html": "\u003ch1>《有子之言似夫子》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第19篇\u003cbr>选自《礼记·檀弓上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">有子、曾子、子游都是孔子弟子。曾子转述“丧欲速贫，死欲速朽”，有子觉得不符合孔子一贯主张，由此引出对说话语境的讨论。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子问于曾子曰：“问丧（sàng）于夫子乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子问曾子：“您从老师那里听说过关于失去官位的话吗？”有子名有若；夫子指孔子。第二个“问”，旧注认为应作“闻”；“丧”是失去官位，不是办丧事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“闻之矣：丧欲速贫，死欲速朽。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“听过：失去官位，希望赶快贫穷；死后，希望赶快腐朽。”“速”是赶快；“朽”是腐烂。单独这样转述，很容易产生误解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“是非君子之言也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“这不是君子应说的话！”“是”是这，“非”是不是，要拆开理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“参（shēn）也闻诸夫子也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“我曾参是亲自从老师那里听来的！”“诸”相当于“之于”，“闻诸夫子”是从孔子那里听到。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子又曰：“是非君子之言也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子再次说：“这不是君子应说的话！”他认为把它当一般主张，与孔子思想不符。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“参也与子游闻之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子说：“我和子游一起听到的。”子游名言偃，是另一位在场者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“然！然则夫子有为（wèi）言之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“这样啊！那么老师一定是针对具体情况才说的。”“有为言之”是有所针对而说。他调整了判断：话可能说过，但必须联系当时事情理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子以斯言告于子游。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子把有子的话告诉子游。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子游曰：“甚哉！有子之言似夫子也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子游说：“有子的见解真像老师啊！”赞扬他理解孔子说话用意的能力。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔者夫子居于宋，见桓（huán）司马自为石椁（guǒ），三年而不成。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以前老师住在宋国，看见桓司马为自己造石椁，三年还没完成。”桓司马即桓魋（tuí），是宋国司马；“椁”是套在棺外的外棺。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫子曰：‘若是其靡（mí）也，死不如速朽之愈也！’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“老师说：‘要是这样奢侈浪费，死后还不如赶快腐朽来得好！’”“靡”是奢侈耗费；“愈”是更好。批评的是为防腐朽而过度耗费，并非普遍提倡速朽。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“死之欲速朽，为桓司马言之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓希望死后赶快腐朽，是针对桓司马说的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“南宫敬叔反，必载宝而朝（cháo）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“南宫敬叔返回鲁国后，朝见国君总要带着宝物。”他是鲁国大夫。“反”通“返”。为何带宝，旧说不同：有说行贿求复位，也有说怕再被逐而随身携财；原文未明确交代。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫子曰：‘若是其货也，丧（sàng）不如速贫之愈也？’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“老师说：‘如果这样看重财货，失位后还不如赶快贫穷来得好！’”这是针对敬叔对财货的依赖、追逐，不是劝所有失位者变穷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“丧之欲速贫，为敬叔言之也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓失位后希望赶快贫穷，是针对南宫敬叔说的！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子以子游之言告于有子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子把子游的解释告诉有子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“然！吾固曰非夫子之言也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“正是这样！我本来就说，这不是老师的主张。”“固”是本来。他不再否认说过这些话，而是否认脱离语境后的字面意义代表孔子的一般主张。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曾子曰：“子何以知之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曾子问：“您凭什么知道？”“何以”就是以何、凭什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有子曰：“夫子制于中都，四寸之棺，五寸之椁，以斯知不欲速朽也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有子说：“老师治理中都时，规定棺板厚四寸、椁板厚五寸，由此知道他不主张死者赶快腐朽。”中都是鲁国城邑。这是本文给出的行为依据。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔者夫子失鲁司寇，将之荆（jīng），盖（gài）先之以子夏，又申之以冉（rǎn）有，以斯知不欲速贫也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以前老师失去鲁国司寇职位，准备前往楚国，大概先派子夏去，随后又派冉有去，由此知道他不主张失位后赶快贫穷。”“之”是往；“荆”指楚；“申”是再次、重复。按旧注，先遣弟子是考察能否任职、安排去处。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">确认“某人说过”，不等于已弄懂“他是什么意思”。要核对针对的人和事，也要区分通常主张与两种不理想情况之间的比较。故事以有子为能理解孔子者，这是传文的叙事安排，不是对每位弟子理解能力的全面评估。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>词语记录：\u003c/strong>申 shēn：再次、重复。例句“又申之以冉有”，意思是随后又派冉有前去，已收入词表第48条。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/有子之言似夫子\" target=\"_blank\" rel=\"noopener\">《有子之言似夫子》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記纂言_(四庫全書本)/卷14下\" target=\"_blank\" rel=\"noopener\">吴澄《礼记纂言》卷十四下\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-20", "volume": 3, "volume_title": "卷三 · 周文", "number": 20, "title": "公子重耳对秦客", "file": "卷三/20-公子重耳对秦客.md", "ready": true, "markdown": "# 《公子重（chóng）耳对秦客》\n\n卷三 · 周文 · 第20篇\n选自《礼记·檀弓下》。\n\n## 背景简介\n\n晋献公去世时，重耳正在狄地避难。秦穆公派使者吊唁，同时劝他抓住机会回国争取君位；本文记述重耳与舅犯商量后如何答复。\n\n**晋献公之丧（sāng），秦穆公使人吊公子重耳，且曰：**\n\n晋献公去世，秦穆公派人慰问公子重耳，并让使者转达自己的话。“吊”是吊唁；“且”说明还有其他事情。\n\n**“寡人闻之，亡国恒于斯，得国恒于斯。”**\n\n“我听说，失去政权常在这种时候，得到政权也常在这种时候。”“斯”指旧君去世、新君继位的交接时期。\n\n**“虽吾子俨（yǎn）然在忧服之中，丧（sàng）亦不可久也，时亦不可失也，孺（rú）子其图之！”**\n\n“虽然您肃穆地服丧，但流亡失位不能长久持续，机会也不能错过，您还是考虑吧！”“吾子”是尊称；“忧服”指服丧；这里“丧”读sàng，指流亡失位，不是劝缩短服丧。“图”是考虑。\n\n**以告舅犯。**\n\n重耳把话告诉舅犯。舅犯即狐偃，字子犯，是舅舅和谋臣。\n\n**舅犯曰：“孺子其辞焉！”**\n\n舅犯说：“您应当谢绝！”“辞”是推辞、拒绝。\n\n**“丧（sàng）人无宝，仁亲以为宝。”**\n\n“流亡者没有什么可以作宝物，应把仁爱亲人、实行仁义作为珍守的东西。”舅犯将话题由如何取得君位，转到如何保持品行。\n\n**“父死之谓何？又因以为利，而天下其孰（shú）能说（shuō）之？”**\n\n“父亲去世，是怎样一件大事？还借此为自己谋利，天下谁能替这种做法辩解？”“因”是借着；“说”是解释、辩解。\n\n**“孺子其辞焉！”**\n\n“您还是谢绝吧！”\n\n**公子重耳对客曰：“君惠吊亡臣重耳，身丧（sàng）父死，不得与（yù）于哭泣之哀，以为君忧。”**\n\n重耳回答使者：“承蒙贵国国君施恩，慰问流亡之臣重耳。我流亡在外，父亲去世，却不能回国参与哭泣哀悼，让贵国国君担忧。”“亡臣”是自称；“与”通“预”，参与。\n\n**“父死之谓何？或敢有他志，以辱君义？”**\n\n“父亲去世，是怎样一件大事？我岂敢另有图谋，辱没贵国国君的好意？”“他志”指借机争位的打算，是委婉拒绝。\n\n**稽（qǐ）颡（sǎng）而不拜。**\n\n重耳以额头叩地表示哀痛，却不完成拜谢礼节。“颡”是额头。按本文解释，他没有以继承人身份接受建议，所以不完成相应拜谢。\n\n**哭而起，起而不私。**\n\n他哭着起身，也不与使者私下商谈。“不私”着重指不私谈回国争位，不是绝不说任何话。\n\n**子显以致命于穆公。**\n\n使者子显回去，把答复和表现报告给穆公。“致命”是复命。\n\n**穆公曰：“仁夫（fú）！公子重耳！”**\n\n穆公说：“公子重耳真仁厚啊！”“夫”是感叹语气词。这是文中人物的评价。\n\n**“夫稽颡而不拜，则未为后也，故不成拜。”**\n\n“他叩额却不完成拜礼，说明没有以继承人自居，所以不完成拜谢。”“后”是继承人。\n\n**“哭而起，则爱父也；起而不私，则远（yuàn）利也。”**\n\n“哭着起身，是爱父亲；起身不私谈，是远离私利。”“远利”是使自己远离利益诱惑。\n\n## 阅读提示\n\n不私谈争位是故事记述的行为，“因此证明内心远离私利”则是穆公的解释。也可以从政治交涉理解为维护名声、避免贸然承诺，但不能由此断定他一定是假装。本篇重复讲解已合并，保留同一份正文。\n\n## 核对来源\n\n- [《公子重耳对秦客》](https://zh.wikisource.org/wiki/公子重耳對秦客)\n- [《礼记正义》卷十二](https://zh.wikisource.org/wiki/禮記正義/12)\n", "html": "\u003ch1>《公子重（chóng）耳对秦客》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第20篇\u003cbr>选自《礼记·檀弓下》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公去世时，重耳正在狄地避难。秦穆公派使者吊唁，同时劝他抓住机会回国争取君位；本文记述重耳与舅犯商量后如何答复。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献公之丧（sāng），秦穆公使人吊公子重耳，且曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公去世，秦穆公派人慰问公子重耳，并让使者转达自己的话。“吊”是吊唁；“且”说明还有其他事情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“寡人闻之，亡国恒于斯，得国恒于斯。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说，失去政权常在这种时候，得到政权也常在这种时候。”“斯”指旧君去世、新君继位的交接时期。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽吾子俨（yǎn）然在忧服之中，丧（sàng）亦不可久也，时亦不可失也，孺（rú）子其图之！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虽然您肃穆地服丧，但流亡失位不能长久持续，机会也不能错过，您还是考虑吧！”“吾子”是尊称；“忧服”指服丧；这里“丧”读sàng，指流亡失位，不是劝缩短服丧。“图”是考虑。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以告舅犯。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳把话告诉舅犯。舅犯即狐偃，字子犯，是舅舅和谋臣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>舅犯曰：“孺子其辞焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">舅犯说：“您应当谢绝！”“辞”是推辞、拒绝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“丧（sàng）人无宝，仁亲以为宝。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“流亡者没有什么可以作宝物，应把仁爱亲人、实行仁义作为珍守的东西。”舅犯将话题由如何取得君位，转到如何保持品行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“父死之谓何？又因以为利，而天下其孰（shú）能说（shuō）之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“父亲去世，是怎样一件大事？还借此为自己谋利，天下谁能替这种做法辩解？”“因”是借着；“说”是解释、辩解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“孺子其辞焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您还是谢绝吧！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公子重耳对客曰：“君惠吊亡臣重耳，身丧（sàng）父死，不得与（yù）于哭泣之哀，以为君忧。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳回答使者：“承蒙贵国国君施恩，慰问流亡之臣重耳。我流亡在外，父亲去世，却不能回国参与哭泣哀悼，让贵国国君担忧。”“亡臣”是自称；“与”通“预”，参与。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“父死之谓何？或敢有他志，以辱君义？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“父亲去世，是怎样一件大事？我岂敢另有图谋，辱没贵国国君的好意？”“他志”指借机争位的打算，是委婉拒绝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>稽（qǐ）颡（sǎng）而不拜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">重耳以额头叩地表示哀痛，却不完成拜谢礼节。“颡”是额头。按本文解释，他没有以继承人身份接受建议，所以不完成相应拜谢。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>哭而起，起而不私。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他哭着起身，也不与使者私下商谈。“不私”着重指不私谈回国争位，不是绝不说任何话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子显以致命于穆公。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">使者子显回去，把答复和表现报告给穆公。“致命”是复命。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>穆公曰：“仁夫（fú）！公子重耳！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">穆公说：“公子重耳真仁厚啊！”“夫”是感叹语气词。这是文中人物的评价。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫稽颡而不拜，则未为后也，故不成拜。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他叩额却不完成拜礼，说明没有以继承人自居，所以不完成拜谢。”“后”是继承人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“哭而起，则爱父也；起而不私，则远（yuàn）利也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“哭着起身，是爱父亲；起身不私谈，是远离私利。”“远利”是使自己远离利益诱惑。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">不私谈争位是故事记述的行为，“因此证明内心远离私利”则是穆公的解释。也可以从政治交涉理解为维护名声、避免贸然承诺，但不能由此断定他一定是假装。本篇重复讲解已合并，保留同一份正文。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/公子重耳對秦客\" target=\"_blank\" rel=\"noopener\">《公子重耳对秦客》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/禮記正義/12\" target=\"_blank\" rel=\"noopener\">《礼记正义》卷十二\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-21", "volume": 3, "volume_title": "卷三 · 周文", "number": 21, "title": "杜蒉扬觯", "file": "卷三/21-杜蒉扬觯.md", "ready": true, "markdown": "# 《杜蒉（kuài）扬觯（zhì）》\n\n卷三 · 周文 · 第21篇\n选自《礼记·檀弓下》。\n\n## 背景简介\n\n晋国大夫知悼子去世，尚未下葬，晋平公却与臣下饮酒奏乐。掌管膳食的杜蒉听到钟声，进去罚两位陪侍者和自己喝酒，促使平公承认过错。\n\n**知（zhì）悼子卒，未葬。**\n\n知悼子去世，尚未安葬。按郑玄注，他是荀盈；知是氏，也写作智，读zhì，悼是谥号，子是尊称。不能把他误作知罃。\n\n**平公饮酒，师旷（kuàng）、李调侍。鼓钟。**\n\n晋平公饮酒，师旷、李调陪侍，敲钟奏乐。师旷是乐官，李调是近臣；“鼓”是敲击。\n\n**杜蒉自外来，闻钟声，曰：“安在？”曰：“在寝。”**\n\n杜蒉从外面进来，听见钟声，问：“在哪里？”有人说：“在寝宫。”问的是国君在哪里饮酒奏乐。\n\n**杜蒉入寝，历阶而升。**\n\n杜蒉进入寝宫，沿台阶登堂。\n\n**酌（zhuó）曰：“旷饮（yìn）斯！”**\n\n斟酒说：“师旷，喝下这杯！”“酌”是斟酒；“斯”指这杯。此处是罚酒，“饮”按使人饮酒用法读yìn。\n\n**又酌曰：“调饮（yìn）斯！”**\n\n又斟酒说：“李调，喝下这杯！”\n\n**又酌，堂上北面坐饮（yǐn）之。**\n\n再斟一杯，自己在堂上面向北方、朝国君方向跪坐喝下。“坐”指跪坐，也罚自己一杯。\n\n**降，趋而出。**\n\n下台阶，快步退出。他没有先说明理由。\n\n**平公呼而进之，曰：“蒉，曩（nǎng）者尔心或开予，是以不与尔言。”**\n\n平公叫他回来：“杜蒉，刚才我想你大概有什么要提醒我，所以没有先与你说话。”“曩者”是刚才；“予”是我；“开”是启发开导。\n\n**“尔饮（yìn）旷何也？”**\n\n“你为什么罚师旷喝酒？”\n\n**曰：“子卯不乐（yuè）。”**\n\n杜蒉说：“子日、卯日，国君尚且不奏乐。”按旧注，桀亡于乙卯、纣死于甲子，所以这两类日子要警戒，不奏乐；这是旧注对礼俗的说明。\n\n**“知悼子在堂，斯其为子卯也大矣！”**\n\n“如今知悼子灵柩还在堂上，这比子卯之忌更重大！”按本文礼制，重臣去世未葬，更不应奏乐宴饮。\n\n**“旷也，太师也，不以诏（zhào）。是以饮（yìn）之也。”**\n\n“师旷是乐官之长，却不以此提醒国君，所以罚他喝酒。”“诏”是告知，不专指帝王下诏。\n\n**“尔饮（yìn）调何也？”**\n\n“你为什么罚李调？”\n\n**曰：“调也，君之亵（xiè）臣也。”**\n\n“李调是您亲近的臣子。”“亵臣”指亲近、受宠的臣子。\n\n**“为（wèi）一饮一食，亡（wàng）君之疾。是以饮（yìn）之也。”**\n\n“为了贪图一点酒食，忘了国君的过失，所以罚他。”“亡”通“忘”；“疾”是毛病、过失，不是生病。\n\n**“尔饮（yǐn）何也？”**\n\n“你自己为什么也喝？”\n\n**曰：“蒉也，宰夫也，非刀匕（bǐ）是共（gōng），又敢与（yù）知（zhī）防，是饮（yìn）之也。”**\n\n“我是管膳食的宰夫，没有只管刀勺饮食，却敢参与防止国君过失的事，所以也罚自己。”“共”通“供”；“与”是参与；“知”是掌管、过问；“防”是防范、纠正过失。他以越职自谦，缓和劝谏。\n\n**平公曰：“寡人亦有过焉。酌而饮（yìn）寡人！”**\n\n平公说：“我也有过错。斟酒，也罚我一杯！”饮酒奏乐的本人承认责任。\n\n**杜蒉洗而扬觯（zhì）。**\n\n杜蒉洗净酒器，举杯献给平公。“扬”是举；“觯”是酒器。\n\n**公谓侍者曰：“如我死，则必无废是爵也！”**\n\n平公对侍者说：“即使我死了，也一定不要废弃这杯酒所代表的规矩！”“爵”指酒器，旧注认为要留下举杯仪节作为警戒。\n\n**至于今，既毕献，斯扬觯，谓之“杜举”。**\n\n直到记述者的时代，向国君与宾客献酒完毕，便举起这杯酒，称作“杜举”。“今”不是今天；“杜举”以杜蒉命名。\n\n## 阅读讨论\n\n**你问“知”是什么意思：**在“知悼子”里，知读zhì，是氏名，亦写智；他名荀盈，也称知盈、智盈。\n\n**你又问“知防”：**这里的知读zhī，意思是掌管、过问。“与知防”是参与防范、纠正国君过失，并不是家族称谓。\n\n这篇先追问臣子为何没有提醒，再让国君自行认过。杜蒉不直接罚国君，却促使平公说出“寡人亦有过焉”。\n\n## 核对来源\n\n- [《杜蒉扬觯》](https://zh.wikisource.org/wiki/杜蕢揚觶)\n- [《礼记正义》卷十三](https://zh.wikisource.org/wiki/禮記正義/13)\n", "html": "\u003ch1>
