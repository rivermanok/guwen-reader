\u003cp class=\"original\">\u003cstrong>故《夏令》曰：‘九月除道，十月成梁。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以《夏令》说：‘九月整治道路，十月修成桥梁。’”这里引用古代时令规定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其时儆（jǐng）曰：‘收而场功，偫（zhì）而畚（běn）挶（jū），营室之中，土功其始，火之初见，期于司里。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“到时又告诫说：‘收拾好你们场上的农事，备好你们的畚箕和抬土器具；营室星黄昏居中，土木工程就应开始；大火星初见时，到司里那里集合。’”“而”通“尔”，是你们；“偫”是备办；“营室”是星宿名。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>此先王所以不用财贿，而广施德于天下者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这就是先王不另费财物、却能广施恩惠于天下的办法。”指顺应时令安排事务，而非真的所有工程都不需资源。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今陈国火朝觌（zhāo dí）矣，而道路若塞，野场若弃，泽不陂障，川无舟梁，是废先王之教也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在陈国大火星已在清晨出现，路却像被堵塞，田野场圃像被抛弃，泽没有堤障，河没有舟桥，这是废弃先王的教导。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“《周制》有之曰：‘列树以表道，立鄙食以守路，国有郊牧，疆有寓望，薮（sǒu）有圃草，囿（yòu）有林池，所以御灾也，其余无非谷土，民无悬耜（sì），野无奥草。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“周代制度有这样的规定：‘路旁种树以标示道路，边地设饮食处以守护交通，城外有牧场，边境有客舍和候望之所，草泽有茂草，苑囿有林木池水，用来防备灾患；其余都是种谷的土地，百姓没有闲置悬挂的农具，野外没有丛生的荒草。’”“耜”是农具，“奥草”指深草。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不夺民时，不蔑民功。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘不侵夺农时，不轻弃百姓劳动的成果。’”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有优无匮，有逸无罢（pí）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘物资充裕而不匮乏，劳逸有节而不疲困。’”“罢”通“疲”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>国有班事，县有序民。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘城邑各项事务有分工，郊县服役的人民有次序。’”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今陈国道路不可知，田在草间，功成而不收，民罢（pí）于逸乐，是弃先王之法制也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在陈国的道路难以辨认，田地埋在荒草之间，庄稼成熟却不收获，百姓疲于为上位者的享乐服劳役，这是抛弃先王的法制。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“周之《秩官》有之曰：‘敌国宾至，关尹以告，行理以节逆之，候人为导，卿出郊劳（jiāo lào），门尹除门，宗祝执祀，司里授馆，司徒具徒，司空视途，司寇诘奸（jié jiān），虞人入材，甸人积薪，火师监燎（liáo），水师监濯，膳宰致飧（sūn），廪（lǐn）人献饩（xì），司马陈刍（chú），工人展车，百官以物至，宾入如归。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“周代《秩官》规定：‘地位相等的国家有宾客到来，关尹报告，行理拿符节迎接，候人在前引路，卿到郊外慰劳，门尹清扫门户，宗伯祝官主持祭礼，司里安排馆舍，司徒备役人，司空查看道路，司寇查禁奸盗，虞人供木材，甸人积柴薪，火师管理照明，水师管理洗濯，膳宰送熟食，廪人献粮牲，司马备马草，工人检查车辆，百官各带所需物品到位，宾客进入就像回家。’”“敌国”是地位相等的国家，“逆”是迎接；这些官名在这里分别以接待职责说明。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是故小大莫不怀爱。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘所以无论大国小国的来宾，都怀念爱重这样的接待。’”也可兼指来宾中职位高低者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其贵国之宾至，则以班加一等，益虔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘更尊贵国家的宾客到来，就提高承办官员的等级，加倍恭敬。’”“以班加一等”指接待规格提高。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>至于王使，则皆官正莅（lì）事，上卿监之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘至于周王的使者来，则各部门长官亲自办事，由上卿督察。’”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若王巡守，则君亲监之。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘如果是王亲自巡察，则由诸侯国君亲自督察接待。’”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今虽朝也不才，有分族于周，承王命以为过宾于陈，而司事莫至，是蔑先王之官也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今我朝虽然不才，也是周王室同族，奉王命借道陈国，各主管官员却没有一个到来，这是轻慢先王设置的官职。”朝是单襄公的自称。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“《先王之令》有之曰：‘天道赏善而罚淫，故凡我造国，无从非彝（yí），无即慆（tāo）淫，各守尔典，以承天休。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“先王的命令规定：‘天道奖赏善行、惩罚过度失常；凡我们治国的人，不要追随不合常法的行为，不要放纵怠慢，各守你们的常典，来承受上天的福佑。’”“彝”是常法，“慆淫”是怠慢放纵。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今陈侯不念胤（yìn）续之常，弃其伉俪（kàng lì）妃嫔，而帅其卿佐以淫于夏氏，不亦渎姓矣乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今陈侯不顾正常延续后嗣的伦常，抛弃自己的妻妾，率领卿佐到夏氏淫乱，不是亵渎族姓了吗？”这是单襄公按当时宗法婚姻秩序提出的指责。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>陈，我大姬之后也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“陈国是我们周王室大姬的后代。”大姬是周武王之女，嫁给陈国始封君。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>弃衮冕（gǔn miǎn）而南冠以出，不亦简彝（yí）乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他抛开衮衣礼冠，戴着楚冠外出，不是轻慢常法吗？”这里把服制也纳入政治礼制。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是又犯先王之令也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这又违反了先王的命令。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔先王之教，懋（mào）帅其德也，犹恐殒越。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前人们遵循先王的教导，努力奉行其德行，尚且担心失足败亡。”“懋”是勉力，“帅”通“率”，指遵循。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若废其教而弃其制，蔑其官而犯其令，将何以守国？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果废弃其教导、抛弃其制度、轻慢其官职、违反其命令，将靠什么守国呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>居大国之间，而无此四者，其能久乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“处在大国之间，又没有这四方面的根本，还能长久吗？”大国主要指晋、楚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>六年，单（shàn）子如楚。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周定王六年，单襄公前往楚国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>八年，陈侯杀于夏氏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">定王八年，陈灵公在夏氏家中被杀。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>九年，楚子入陈。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">定王九年，楚王进入陈国。最后几句以随后事件回应前文判断，不是单襄公当场说出的预言细节。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">文章把道路、农业、接待礼仪和国君私行归入一套政治秩序，并不只是看见一次怠慢就无端断言亡国。结尾“楚子入陈”也不等于陈国从此永久消失；要区分这次军事占领与此后陈国的延续。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷3)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷3\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v03-05", "volume": 3, "volume_title": "卷三 · 周文", "number": 5, "title": "展禽论祀爰居", "file": "卷三/05-展禽论祀爰居.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《展禽论祀爰（yuán）居》\u003c/h1>\n\u003cp class=\"translation\">选自《国语·鲁语上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋时，一只名叫爰居的海鸟停在鲁国东门外，臧文仲命人祭祀它。展禽认为不应无故增添国家祭祀，转而列举祭祀制度所认可的功德与对象。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>海鸟曰“爰（yuán）居”，止于鲁东门之外二日。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">一种叫“爰居”的海鸟，在鲁国东门外停留了两天。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臧（zāng）文仲使国人祭之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁国大夫臧文仲让国人祭祀它。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>展禽曰：“越哉，臧（zāng）孙之为政也！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">展禽说：“臧孙这样处理政事，太越礼了！”展禽即柳下惠；臧孙指臧文仲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫祀，国之大节也，而节，政之所成也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“祭祀是国家的重要制度，而制度是政事得以成立的基础。”“节”在这里指节制、制度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故慎制祀以为国典。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此要谨慎确立祭祀，把它作为国家的常典。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今无故而加典，非政之宜也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在无缘无故增加祭祀常典，不是施政应有的做法。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫圣王之制祀也，法施于民则祀之，以死勤事则祀之，以劳定国则祀之，能御大灾则祀之，能捍大患则祀之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“圣王规定祭祀：法度有利于人民的，就祭祀他；尽力办事而死的，就祭祀他；劳苦安定国家的，就祭祀他；能抵御大灾、捍卫大患的，就祭祀他。”以下“祀之”是说将有功者列为祭祀对象。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>非是族也，不在祀典。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不属于这些类别，就不在祭祀常典中。”“族”在这里是类。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔烈山氏之有天下也，其子曰柱，能植百谷百蔬。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前烈山氏统治天下，他的后代有名叫柱的，能够种植各种谷物蔬菜。”这是展禽引用的上古农业起源叙事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夏之兴也，周弃继之，故祀以为稷（jì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“夏兴起时，周人的先祖弃继承了这项事业，因此把他们作为谷神祭祀。”“稷”是谷神，弃即后稷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>共工（gōng gōng）氏之伯九有（bà jiǔ yǒu）也，其子曰后土，能平九土，故祀以为社。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“共工氏称霸九州时，他的后代后土能够治理九州土地，所以把他作为土神祭祀。”“社”是土神，“九有”指九州。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>黄帝能成命百物，以明民共财（gōng cái）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“黄帝能确定万物的名目，使百姓明白如何供给财用。”“共”通“供”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>颛顼（zhuān xū）能修之，帝喾（kù）能序三辰以固民，尧能单均（dān jūn）刑法以仪民，舜勤民事而野死，鲧（gǔn）障洪水而殛（jí）死，禹能以德修鲧（gǔn）之功，契（xiè）为司徒而民辑，冥勤其官而水死，汤以宽治民而除其邪，稷（jì）勤百谷而山死，文王以文昭，武王去民之秽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“颛顼能够修明黄帝的事业；帝喾能排定日月星辰的运行时序以安民；尧能尽力公平施行刑法来规范人民；舜勤于民事而死于郊野；鲧筑障治洪水而被诛；禹能以德改进、完成鲧的事业；契任司徒使百姓和睦；冥尽职而死于水；汤宽厚治民、除掉邪暴；后稷勤于农事而死于山野；文王以文德显明；武王去除人民遭受的污秽祸害。”这是原文汇列的功德谱系，不是现代考证后的上古人物年表。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故有虞氏禘（dì）黄帝而祖颛顼（zhuān xū），郊尧而宗舜；夏后氏禘（dì）黄帝而祖颛顼（zhuān xū），郊鲧（gǔn）而宗禹；商人禘（dì）舜而祖契（xiè），郊冥而宗汤；周人禘（dì）喾（kù）而郊稷（jì），祖文王而宗武王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以有虞氏以禘祭黄帝、祖祭颛顼、郊祭尧、宗祭舜；夏后氏禘祭黄帝、祖祭颛顼、郊祭鲧、宗祭禹；商人禘祭舜、祖祭契、郊祭冥、宗祭汤；周人禘祭帝喾、郊祭后稷、祖祭文王、宗祭武王。”禘、郊、祖、宗是不同等级和方式的祭礼；“商人禘舜”旧注认为“舜”当作“喾”，这里保留底本文字并说明异文。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>幕，能帅颛顼（zhuān xū）者也，有虞氏报焉；杼（zhù），能帅禹者也，夏后氏报焉；上甲微，能帅契（xiè）者也，商人报焉；高圉（yǔ）、太王，能帅稷（jì）者也，周人报焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“幕能遵循颛顼的德业，有虞氏报祭他；杼能遵循禹的德业，夏后氏报祭他；上甲微能遵循契的德业，商人报祭他；高圉、太王能遵循后稷的德业，周人报祭他们。”这里“报”指报答祖先功德的祭礼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>凡禘（dì）、郊、祖、宗、报，此五者，国之典祀也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“禘、郊、祖、宗、报，这五种都是国家的常典祭祀。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>加之以社稷（jì）山川之神，皆有功烈于民者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“再加上社稷山川之神，也都是对百姓有功绩的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及前哲令德之人，所以为民质也；及天之三辰，民所以瞻仰也；及地之五行，所以生殖也；及九州名山川泽，所以出财用也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“还有古代有美德的贤人，是百姓的榜样；天上的日月星辰，是人民瞻仰辨时所依；地上的五行，是万物生殖所凭；九州的名山大川与湖泽，是财物资用的来源。”“质”在这里指准则、凭信，“五行”指水火木金土。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>非是，不在祀典。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不是这些，就不在祭祀常典中。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今海鸟至，己不知而祀之，以为国典，难以为仁且知（rén qiě zhì）矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在海鸟来了，自己还不了解便祭祀它，列为国家常典，很难说既仁爱又明智。”“知”在这里通“智”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫仁者讲功，而知者（zhì zhě）处物。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“仁爱的人讲求有益于民的功绩，明智的人能够审处事物。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>无功而祀之，非仁也；不知而不问，非知（fēi zhì）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“没有功劳就祭祀它，不是仁；不知道又不询问，不是智。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今兹海其有灾乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在海上恐怕要发生灾害了吧？”“其”表示推测。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫广川之鸟兽，恒知而避其灾也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“大水域的鸟兽，往往预先察知灾害而避开。”这是展禽对海鸟来处的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是岁也，海多大风，冬暖。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这一年，海上果然多大风，冬天气温偏暖。这是叙述者补记的结果。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>文仲闻柳下季之言，曰：“信吾过也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">臧文仲听到柳下季的话，说：“确实是我的过错。”柳下季也是展禽的称号。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子之言，不可不法也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“季先生的话，不能不作为准则。”“法”是效法、作为法则。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使书以为三筴（cè）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是让人写成三份简册保存。“筴”在这里指简册，并不是三条计策。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">上古人物、世系与祭礼的叙述具有传统解释的性质，有些地方与其他典籍不同。译文依本文说明人物所举的例子，不据此断言所有传说都已有同时代史料证实；展禽的重点是祭祀必须有理由，而非凡异鸟都该受到祭祀。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷3)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷3\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v03-06", "volume": 3, "volume_title": "卷三 · 周文", "number": 6, "title": "里革断罟匡君", "file": "卷三/06-里革断罟匡君.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《里革断罟（gǔ）匡君》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第6篇\u003cbr>选自《国语·鲁语上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">故事发生在春秋时期鲁宣公在位期间（公元前608—前591年）。鲁宣公在泗水捕鱼，大夫里革认为他的行为违反了保护鱼类繁殖的时令规定，便割断渔网，劝谏国君。这篇文章反映了春秋时期关于自然资源利用和君主行为规范的观念。\u003c/p>\n\u003ch2>一、里革割断鲁宣公的渔网\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>宣公夏滥于泗（sì）渊，里革断其罟（gǔ）而弃之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁宣公在夏天到泗水的深潭里下网捕鱼。里革见了，便割断他的渔网，把网扔到一边。\u003c/p>\n\u003cp class=\"translation\">“滥”在这里指下网捕鱼；“罟”是渔网；“匡”是纠正、规劝，也是题目中“匡君”的意思。里革不是普通百姓，而是鲁国的大夫，他竟然敢直接割断国君的渔网。\u003c/p>\n\u003ch2>二、里革讲述古代的捕鱼制度\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>曰：“古者大寒降，土蛰（zhé）发，水虞（yú）于是乎讲罛（gū）罶（liǔ），取名鱼，登川禽，而尝之寝庙，行诸国人，助宣气也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">里革说：“古时候，到了大寒时节，地下冬眠的动物开始活动，管理水产的官员便安排捕鱼的工具，捕捉大鱼和水中的其他动物，用来祭祀祖先，并将这种做法推行于百姓，以帮助阳气舒展。”\u003c/p>\n\u003cp class=\"translation\">“水虞”是负责管理河流、湖泊及水产资源的官员；“讲”是研究、安排、准备；“罛罶”是捕鱼工具，罛是大渔网，罶是捕鱼的竹笼；“名鱼”是大鱼；“寝庙”是祭祀祖先的宗庙；“宣气”是古人认为顺应时令，可以帮助阳气宣发。这里讲的是古人关于季节和自然运行的认识，并不等同于现代生态学。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>鸟兽孕，水虫成；兽虞于是乎禁罝（jū）罗，矠（shuò）鱼鳖以为夏槁（gǎo），助生阜（fù）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“当鸟兽进入怀孕繁殖的季节，水中的鱼鳖已经长成，管理鸟兽的官员便禁止使用捕兽、捕鸟的网，只允许捕取鱼鳖，制成夏天食用的鱼干，以帮助鸟兽繁殖生长。”\u003c/p>\n\u003cp class=\"translation\">“兽虞”是管理鸟兽的官员；“罝罗”是捕兽和捕鸟的网；“矠”是用长矛一类的工具刺取；“槁”是干燥的食物，这里指鱼干；“阜”是繁盛、增多。这里的逻辑是：鸟兽正在繁殖，就暂时停止捕猎鸟兽，改为利用已经长成的水产。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>鸟兽成，水虫孕；水虞于是乎禁罜䍡（zhǔ lù），设阱（jǐng）鄂，以实庙庖（páo），畜功用也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“等到鸟兽长成、水中的鱼鳖开始繁殖时，管理水产的官员就禁止使用小渔网，改为设置捕兽的陷阱，以供应宗庙厨房，储备生活所需的物资。”\u003c/p>\n\u003cp class=\"translation\">“罜䍡”是小渔网；“阱”是陷阱；“鄂”是捕兽器具；“庖”是厨房；“畜”是积蓄、储备。前后两段合起来，描述了一套轮换利用自然资源的制度：鸟兽繁殖时，减少捕猎鸟兽；鱼鳖繁殖时，减少捕鱼。\u003c/p>\n\u003ch2>三、古代保护幼小生物的规定\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>且夫山不槎（chá）蘖（niè），泽不伐夭（yāo），鱼禁鲲（kūn）鲕（ér），兽长麑（ní）䴠（yǎo），鸟翼鷇（kòu）卵，虫舍蚳（chí）蝝（yuán），蕃（fán）庶物也，古之训也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“而且，在山上不砍伐新生的树枝，在水泽中不割取幼嫩的草木；捕鱼时不捕捞鱼卵和小鱼，捕猎时要让幼小的鹿成长；鸟类要保护雏鸟和鸟卵，昆虫也要留下幼虫和虫卵。这些都是为了使万物繁衍兴盛，是古代传下来的教诲。”\u003c/p>\n\u003cp class=\"translation\">“槎蘖”是砍伐新生的枝芽；“夭”是尚未长成的幼嫩草木；“鲲鲕”是鱼卵和小鱼，这里的“鲲”不是《庄子》中那条巨大的鲲；“麑䴠”是幼鹿一类的动物；“鷇卵”是刚孵出的雏鸟和鸟卵；“蚳蝝”是蚁卵和蝗虫幼虫一类的小生命；“蕃庶”是繁殖众多。这段把保护动物幼体、鱼卵、树木嫩芽等放进了同一套规范之中。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今鱼方别孕，不教鱼长，又行网罟，贪无艺也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今鱼类正处于繁殖的时候，你却不让鱼长大，又下网捕鱼，这种贪求实在没有限度！”\u003c/p>\n\u003cp class=\"translation\">“方”是正在；“别孕”是分别孕育、进入繁殖阶段；“教”是使、让；“艺”是限度、准则。“贪无艺也”是里革对鲁宣公最直接的批评：他不仅说国君违反时令，而且把这种行为上升为贪欲没有节制。\u003c/p>\n\u003ch2>四、鲁宣公接受劝谏\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>公闻之，曰：“吾过而里革匡我，不亦善乎！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁宣公听了以后说：“我犯了错误，而里革能够纠正我，这不是很好吗！”\u003c/p>\n\u003cp class=\"translation\">“过”是犯错误；“匡”是纠正。这里的鲁宣公并没有因为里革割断渔网而处罚他，反而承认了自己的错误。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“是良罟也，为我得法。使有司藏之，使吾无忘谂（shěn）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这真是一张好渔网啊！它让我懂得了正确的法度。让主管官员把它收藏起来，使我永远不要忘记这次劝告。”\u003c/p>\n\u003cp class=\"translation\">“良罟”是好渔网，不是因为网的质量好，而是因为这张被割断的网让国君获得了教训；“得法”是明白了正确的法度；“有司”是主管某项事务的官员；“谂”是劝告、规谏。鲁宣公想把断网保存起来，作为自己接受批评的纪念。\u003c/p>\n\u003ch2>五、师存提出更高明的建议\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>师存侍，曰：“藏罟不如寘（zhì）里革于侧之不忘也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐师师存在旁边侍奉，说：“把渔网收藏起来，还不如让里革留在您身边，这样才更不会忘记他的劝告。”\u003c/p>\n\u003cp class=\"translation\">“师存”是鲁国的乐师，名存；“寘”同“置”，安置、放置；“于侧”是在身边。鲁宣公认为，保存一张断网，就能够提醒自己不要再犯错误。但师存认为：一件物品只能提醒你过去犯过什么错误，一个敢于直言的大臣，却能帮助你避免未来的错误。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>关于春秋时期的资源保护规范：\u003c/strong> 里革所说的制度体现了按季节捕猎、保护幼体的观念。不过，这段话是《国语》记载的历史言论，不能直接证明当时所有诸侯国都严格执行这些规定；古人的时令观念也不等同于现代生态学。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>关于里革为什么敢割断国君的渔网：\u003c/strong> 这涉及春秋时期大夫对国君的规谏责任。值得注意的是，里革不仅提出意见，而且直接采取了行动。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>关于师存为何认为留下里革比保存渔网更重要：\u003c/strong> 真正有效的政治监督，不是让国君偶尔想起一次错误，而是让敢于纠正错误的人始终能够发言。这是对篇末议论的理解，并非原文直接写出的制度结论。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>关于对话的历史真实性：\u003c/strong> 《国语》中的这段对话是否完全保留了春秋时期的原话，目前无法证实。我们可以确定它表达了《国语》所保存和呈现的一种政治观念，但不宜把每句对话都视为未经加工的现场记录。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/里革斷罟匡君\" target=\"_blank\" rel=\"noopener\">《里革断罟匡君》原文\u003c/a>\u003c/li>\u003c/ul>\n\u003cp class=\"translation\">本文由本会话已有逐句讲解整理，仅统一段落版式、移除纸本定位信息，保留原有译意和词释。底本偶有异文，如“阱／穽”“蘖／櫱”；正文保留本会话讲解采用的字形。\u003c/p>\n\u003c/details>"}, {"id": "v03-07", "volume": 3, "volume_title": "卷三 · 周文", "number": 7, "title": "敬姜论劳逸", "file": "卷三/07-敬姜论劳逸.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《敬姜论劳逸》\u003c/h1>\n\u003cp class=\"translation\">选自《国语·鲁语下》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋末年，鲁国大夫公父文伯退朝回家，看见母亲敬姜仍在纺绩，认为她不必如此操劳。敬姜从天子、诸侯到庶民的职责谈起，告诫儿子不可因家境优裕而懈怠。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公父（gōng fǔ）文伯退朝，朝其母（cháo qí mǔ），其母方绩，文伯曰：“以歜（chù）之家而主犹绩，惧干季孙之怒也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">公父文伯退朝，进见母亲，母亲正在纺麻；文伯说：“像歜这样的家境，母亲却还亲自纺绩，我怕触怒季孙。”歜是文伯的名；季孙是鲁国执政卿；“绩”是把麻纤维接续成线。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其以歜（chù）为不能事主乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他恐怕会认为我不能奉养母亲吧？”“主”在这里尊称母亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其母叹曰：“鲁其亡乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">母亲叹息说：“鲁国恐怕要败亡了吧？”这是借危言警醒儿子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使僮子备官而未之闻耶？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“竟让一个无知孩子占着官位，却连这些道理都没听说过吗？”“僮子”在这里是责其幼稚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>居，吾语女（rǔ）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“坐下，我告诉你。”“女”通“汝”，“居”是坐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔圣王之处民也，择瘠（jí）土而处之，劳其民而用之，故长王（cháng wàng）天下。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前圣王安置百姓，选贫瘠的土地让他们居住，使人民勤劳并加以任用，所以能长久统治天下。”“王”在这里用作动词。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫民劳则思，思则善心生；逸则淫，淫则忘善；忘善则恶心生。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“人民勤劳就会思考，思考便生善心；安逸就容易放纵，放纵就忘记善行，忘记善行便生恶心。”这是敬姜提出的劳逸观。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>沃土之民不材，淫也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“沃土上的人不能成材，是因为放纵。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>瘠（jí）土之民，莫不向义，劳也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“瘠土上的人向往道义，是因为勤劳。”这两句是她的概括判断，不宜当作现代对地域与人品关系的客观定律。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是故天子大采（dà cǎi）朝日（cháo rì），与三公九卿，祖识地德，日中考政，与百官之政事。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以天子穿五彩礼服祭日，与三公九卿学习察知土地生养万物的规律；中午考察政事，与百官讨论政务。”“大采”指五彩礼服，“祖识”旧注释为习知。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>师尹惟旅牧相，宣序民事。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“同大夫、众士、州牧、国相等官员，宣布、安排人民事务。”“师尹”“惟旅”“牧”“相”在这里指不同职司的官员。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>少采（shào cǎi）夕月，与太史司载纠虔天刑。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“傍晚穿三彩礼服祭月，与太史和掌天文时历者恭敬考察天道法则。”“少采”指三彩服饰，“天刑”在这里是天道法则。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>日入，监九御（jiǔ yù），使洁奉禘（dì）郊之粢盛（zī chéng），而后即安。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“日落时查看宫中九御，命她们洁净备办禘祭、郊祭的谷物，然后才休息。”“九御”是宫中女官，“粢盛”是祭粮。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>诸侯朝修天子之业命，昼考其国职，夕省其典刑，夜儆（jǐng）百工，使无慆（tāo）淫，而后即安。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯早晨修习天子所命的职事，白天考察本国政务，傍晚省察常法，夜里警戒百官，使他们不怠慢放纵，然后才休息。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>卿大夫朝考其职，昼讲其庶政，夕序其业，夜庀（pǐ）其家事，而后即安。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“卿大夫早晨考查职务，白天研究各项政事，傍晚安排事务，夜里料理家事，然后才休息。”“庀”是治理、备办。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>士朝受业，昼而讲贯，夕而习复，夜而计过，无憾，而后即安。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“士早晨接受职事，白天研究贯通，傍晚反复学习，夜里检点过失，没有遗憾，然后才休息。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自庶人以下，明而动，晦而休，无日以怠。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从普通百姓以下，天亮便劳作，天黑便休息，没有一天懈怠。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王后亲织玄紞（dǎn），公侯之夫人，加之纮（hóng）、綖（yán）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“王后亲织冠上悬垂的玄色紞；公侯夫人还要制作冠缨和冠上的覆盖物。”“紞”“纮”“綖”都是冠饰。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>卿之内子为大带，命妇成祭服。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“卿的正妻制作大带，受命大夫的妻子完成祭服。”“内子”指卿的正妻，“命妇”这里指受命者之妻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>列士之妻，加之以朝服。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“列士的妻子，还要制作朝服。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自庶士以下，皆衣其夫（yì qí fū）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从庶士以下的妻子，都要给丈夫制作衣服。”“衣”在这里用作动词。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>社而赋事，烝（zhēng）而献功，男女（rǔ）效绩，愆（qiān）则有辟（bì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“春季社祭时布置农桑任务，冬季烝祭时报告成果，男女都呈验功绩，有过失就有处罚。”“愆”是过失，“辟”是刑罚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>古之制也！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这是古代的制度！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君子劳心，小人劳力，先王之训也！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“君子用心力，普通百姓用体力，这是先王的教导！”这里“君子”“小人”按当时社会分工和地位而言。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自上以下，谁敢淫心舍力？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从上到下，谁敢放纵心志、抛开应尽的劳作？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今我寡也，尔又在下位，朝夕处事，犹恐忘先人之业。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在我是寡妇，你又处在下大夫的职位，我们早晚办事，尚且担心忘掉先人的事业。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>况有怠惰，其何以避辟（bì）？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“何况若再懈怠，靠什么避免刑罚呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾冀而朝夕修我，曰：‘必无废先人。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我希望你早晚提醒我，说：‘一定不要荒废先人的事业。’”“而”通“尔”，“修”在这里取警戒、提醒之意。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>尔今曰：‘胡不自安？’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你现在却说：‘为什么不自己安逸些？’”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以是承君之官，余惧穆伯之绝祀也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“抱着这样的想法去承担国君的官职，我担心穆伯要断绝祭祀了！”穆伯是文伯之父；绝祀在当时意味着家族败亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>仲尼闻之曰：“弟子志之（zhì zhī），季氏之妇不淫矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">仲尼听说后说：“弟子们记住，季氏家的这位妇人不放纵啊！”这是篇末以孔子名义作出的评价，“志”通“识”，是记住。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">文章反对的是以富贵为理由逃避职责。它又把劳动、伦理和等级制度连在一起，包含“瘠土向义”等概括，阅读时不必把这些判断全盘当成今天的事实或生活准则。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷3)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷3\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v03-08", "volume": 3, "volume_title": "卷三 · 周文", "number": 8, "title": "叔向贺贫", "file": "卷三/08-叔向贺贫.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《叔向贺贫》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第8篇\u003cbr>选自《国语·晋语八》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋时期，晋国大夫叔向去见韩宣子，韩宣子正在为家中财产不足而忧愁。叔向却向他表示祝贺，并借晋国几个卿族的兴衰，说明自己为什么这样说。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>叔向见韩宣子。宣子忧贫，叔向贺之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向去见韩宣子。韩宣子为贫穷而忧愁，叔向却向他表示祝贺。\u003c/p>\n\u003cp class=\"translation\">韩宣子名叫韩起，是晋国的卿。这里的“贫”，要结合他的身份理解：他觉得自己的财产不足以维持卿的地位和交往，并不是说已经没有饭吃。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宣子曰：“吾有卿之名而无其实，无以从二三子，吾是以忧。子贺我，何故？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">韩宣子说：“我有卿的名位，却没有与之相称的财产，没有办法跟其他几位卿一样应付各种往来，所以才发愁。您却祝贺我，这是为什么？”\u003c/p>\n\u003cp class=\"translation\">“实”在这里指财产。“二三子”指其他几位卿；“从”是跟随，具体指跟得上他们的赠送、交际等开支。“吾是以忧”就是“吾以是忧”：我因此忧愁。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“昔栾（luán）武子无一卒（zú）之田，其宫不备其宗器。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向回答：“从前，栾武子的田地连一卒应有的份额都不够，他家中连祭祀祖先所用的器具都没有配备齐全。”\u003c/p>\n\u003cp class=\"translation\">栾武子就是晋国的卿栾书。“卒”是古代的军队编制，通常以一百人为一卒；“一卒之田”指与这一编制相应的田地份额。“宗器”是宗庙祭器。\u003c/p>\n\u003cp class=\"translation\">这两句话强调的是：以栾武子的身份衡量，他的家产并不丰厚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“宣其德行（xíng），顺其宪则，使越于诸侯。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“但是，他发扬自己的德行，遵守法度，使自己的美名传扬于诸侯之间。”\u003c/p>\n\u003cp class=\"translation\">“宣”是发扬；“宪则”是法度、准则；“越”在这里是传播、传扬。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“诸侯亲之，戎（róng）狄怀之，以正晋国，行刑不疚（jiù），以免于难（nàn）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯亲近他，戎狄也归附他；他凭着这样的德行治理晋国，施行刑罚没有造成祸患，因此得以免遭灾难。”\u003c/p>\n\u003cp class=\"translation\">“怀”是归附；“正”是治理。“不疚”按这里的旧注，是没有造成祸害、弊病。\u003c/p>\n\u003cp class=\"translation\">这里是在讲叔向对栾武子的评价：财产虽少，却能凭德行获得支持，保全自己。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“及桓子骄泰奢侈，贪欲无艺，略则行志，假货居贿（huì）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“到了他的儿子栾桓子，却骄横放纵、奢侈无度，贪欲没有止境，违犯法度，任意行事，又通过借贷聚敛财物。”\u003c/p>\n\u003cp class=\"translation\">栾桓子就是栾黡（yǎn）。\u003c/p>\n\u003cp class=\"translation\">“泰”在这里有放纵的意思；“艺”是限度；“略则”是违犯法则；“行志”是放任自己的意愿。\u003c/p>\n\u003cp class=\"translation\">“居”是积聚，“贿”是财物，并不专指今天所说的贿赂。“假货居贿”，这里理解为通过借贷聚敛财富。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“宜及于难，而赖武之德，以没（mò）其身。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他本来应该遭遇灾祸，却依靠父亲栾武子留下的德泽，得以善终。”\u003c/p>\n\u003cp class=\"translation\">“宜”是按理应当；“赖”是依靠；“没其身”在这里指得以善终、安然度过余生。\u003c/p>\n\u003cp class=\"translation\">叔向认为，栾桓子能够保全自己，靠的是父亲积累下来的声望和恩德。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“及怀子改桓之行（xìng），而修武之德，可以免于难，而离桓之罪，以亡于楚。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“到了栾怀子，他改变了父亲栾桓子的行为，修习祖父栾武子的德行，本来可以免于灾祸，却受到父亲罪恶的牵累，逃亡到了楚国。”\u003c/p>\n\u003cp class=\"translation\">栾怀子就是栾盈，是栾黡的儿子、栾书的孙子。\u003c/p>\n\u003cp class=\"translation\">“离”通“罹”，是遭受；“亡”是逃亡，这里不是死亡。\u003c/p>\n\u003cp class=\"translation\">这句话把三代人连起来了：栾武子的德泽，保护了儿子栾桓子；栾桓子的恶行，又牵累了儿子栾怀子。\u003c/p>\n\u003cp class=\"translation\">这是叔向在文中提出的解释，实际政治斗争的原因还需要结合其他史料考察。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫郤（xì）昭子，其富半公室，其家半三军。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“再说那个郤昭子，他的财富相当于晋国公室的一半，他家中的人众相当于三军的一半。”\u003c/p>\n\u003cp class=\"translation\">郤昭子就是晋国的卿郤至。“公室”指国君之家；“家”在这里指卿大夫家族所属的人众。\u003c/p>\n\u003cp class=\"translation\">这句话着重表现郤氏财力和势力之大，其中的“半”不宜直接当作经过核算的统计数字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“恃（shì）其富宠，以泰于国，其身尸于朝（cháo），其宗灭于绛（jiàng）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他依仗自己的财富和受到的宠信，在国内骄横放纵，结果自身被杀，陈尸于朝廷，宗族也在绛都遭到灭亡。”\u003c/p>\n\u003cp class=\"translation\">“恃”是依仗；“宠”是宠信；“尸”在这里作动词，指陈尸、暴露尸体。“绛”是晋国都城的名称。\u003c/p>\n\u003cp class=\"translation\">叔向用这个例子说明：财富和权势，并不能保证一个家族安全。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不然，夫八郤，五大夫三卿，其宠大矣，一朝而灭，莫之哀也，惟无德也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不然的话，看看郤氏八个人，五个做大夫，三个做卿，受到的尊宠已经够大了，却一下子遭到覆灭，没有人哀怜他们，正是因为他们没有德行。”\u003c/p>\n\u003cp class=\"translation\">“不然”承接前面的论述，有反问、推进论证的作用：如果不是因为缺德，那么如此显赫的家族，为什么覆灭后竟无人哀怜？\u003c/p>\n\u003cp class=\"translation\">“莫之哀”就是“莫哀之”：没有人哀怜他们。“一朝”形容时间很短。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今吾子有栾武子之贫，吾以为能其德矣，是以贺。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今您有栾武子那样的清贫，我认为您也能够实行他那样的德行，所以才来祝贺。”\u003c/p>\n\u003cp class=\"translation\">“吾子”是对对方的敬称；“能其德”是能够实行、具备他那样的德行；“是以”是因此。\u003c/p>\n\u003cp class=\"translation\">叔向说到这里，才直接回答了韩宣子最初的问题：我祝贺您，是因为我期待您能够像栾武子那样，清贫而有德。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若不忧德之不建，而患货之不足，将吊不暇，何贺之有？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果您不忧虑德行没有建立起来，却只担心财产不够，那么我哀怜您还来不及，又有什么值得祝贺的呢？”\u003c/p>\n\u003cp class=\"translation\">“患”是担忧；“货”是财物；“吊”在这里是哀怜、慰问；“不暇”是来不及。\u003c/p>\n\u003cp class=\"translation\">“何贺之有”就是“有何贺”：有什么可祝贺的？\u003c/p>\n\u003cp class=\"translation\">这一句把叔向的用意说透了：他借祝贺来劝诫韩宣子，应当把心思放在建立德行上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宣子拜稽（qǐ）首焉，曰：“起也将亡，赖子存之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">韩宣子向叔向下拜叩头，说：“我韩起差一点就要走向败亡，幸亏您使我得以保全。”\u003c/p>\n\u003cp class=\"translation\">“稽首”是一种隆重的跪拜礼，头叩到地上。“起”是韩宣子的自称。\u003c/p>\n\u003cp class=\"translation\">“存之”是使之存续、使之保全。他认为叔向的话及时纠正了自己的想法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“非起也敢专承之，其自桓叔以下，嘉吾子之赐。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这番教诲，我韩起不敢独自承受；从桓叔以下的历代祖先，都会感激您的恩赐。”\u003c/p>\n\u003cp class=\"translation\">“专承”是独自承受；“嘉”是赞美、感激；“赐”指叔向给予的教诲。\u003c/p>\n\u003cp class=\"translation\">这里的“桓叔”指韩氏所追溯的祖先曲沃桓叔，与前文的栾桓子不是同一个人。韩宣子的意思是：您的话能够帮助我保全家族，所以受益的不只是我个人。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### “没其身”不能只解释为“一辈子”\u003c/p>\n\u003cp class=\"translation\">本会话初译为“终其一生”，随后经追问修订。这里的“没其身”是“得以善终、安然度过余生”，单说“一辈子”没有表达出这个意思。整句是：本来应该遭遇灾祸，却靠着父亲栾武子留下的德泽，得以善终。正文采用最后修订。\u003c/p>\n\u003cp class=\"translation\">### 德行与家族牵累\u003c/p>\n\u003cp class=\"translation\">叔向自己举出的一个复杂之处是：栾怀子已经改过修德，却仍受到父辈的牵累。因此，文中的“德”还包含家族几代人积累的声望、恩怨和政治关系；文章也不能简单概括为“有德就必定免灾”。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/叔向賀貧\" target=\"_blank\" rel=\"noopener\">《叔向贺贫》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/國語/卷14\" target=\"_blank\" rel=\"noopener\">《国语》卷十四原文及旧注\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-09", "volume": 3, "volume_title": "卷三 · 周文", "number": 9, "title": "王孙圉论楚宝", "file": "卷三/09-王孙圉论楚宝.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《王孙圉（yǔ）论楚宝》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第9篇\u003cbr>选自《国语·楚语下》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋时期，楚国大夫王孙圉出使晋国，晋定公设宴招待他。席间，赵简子询问楚国宝玉“白珩”的情况，王孙圉借此谈起：什么才值得一个国家视为珍宝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王孙圉（yǔ）聘于晋，定公飨（xiǎng）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">王孙圉出使晋国，晋定公设宴款待他。\u003c/p>\n\u003cp class=\"translation\">“聘”是诸侯国之间的正式外交访问。“飨”是设宴招待。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>赵简子鸣玉以相（xiàng），问于王孙圉曰：“楚之白珩（héng）犹在乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">赵简子佩戴着叮当作响的玉饰，担任宴会的相礼者，问王孙圉：“楚国的白珩还在吗？”\u003c/p>\n\u003cp class=\"translation\">赵简子就是晋国的卿赵鞅（yāng）。“相”是辅助主持礼仪；“鸣玉”是使佩玉发出声响。\u003c/p>\n\u003cp class=\"translation\">“白珩”是楚国的一件白玉宝物。“珩”本指组玉佩上部的横玉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“然。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">王孙圉回答：“是的，还在。”\u003c/p>\n\u003cp class=\"translation\">“然”在这里表示肯定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>简子曰：“其为宝也，几何矣？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">赵简子说：“它被当作宝物，已经有多少年了？”\u003c/p>\n\u003cp class=\"translation\">“几何”是“多少”。这里依据《国语》旧注“几何世也”，理解为询问它作为传世宝物已有多久；也有译本把这句解释为询问价值。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“未尝为宝。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">王孙圉说：“我们从来没有把它当作国家的珍宝。”\u003c/p>\n\u003cp class=\"translation\">“未尝”是从来没有。“为宝”是把它视为珍宝。\u003c/p>\n\u003cp class=\"translation\">他没有顺着对方的话介绍白珩，而是开始说明楚国认为什么最宝贵。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“楚之所宝者，曰观射（yì）父（fǔ），能作训辞，以行事于诸侯，使无以寡君为口实。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“楚国所珍视的人，有一位叫观射父。他能够拟定合乎礼义的外交辞令，用来处理与诸侯之间的事务，使别人找不到指责我国国君的话柄。”\u003c/p>\n\u003cp class=\"translation\">观射父是楚国大夫。“父”在这个人名中读fǔ。\u003c/p>\n\u003cp class=\"translation\">“训辞”指合乎典章、礼义的言辞，这里主要说外交辞令；“寡君”是使臣对本国国君的谦称；“口实”是供人议论、指责的话柄。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“又有左史倚相（xiàng），能道训典，以叙百物，以朝（zhāo）夕献善败于寡君，使寡君无忘先王之业。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“又有一位左史，叫倚相，能够讲述古代的典章训诫，条理分明地说明各种事务，早晚向我国国君陈说历史上成功和失败的事，使国君不忘先王的事业。”\u003c/p>\n\u003cp class=\"translation\">“左史”是史官。“道”是讲述；“训典”是具有训诫意义的典籍、典章；“百物”在这里泛指各种事务。\u003c/p>\n\u003cp class=\"translation\">“善败”指成功与失败的事迹。史官的作用，在这里也包括提供历史经验，提醒国君。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“又能上下说（yuè）于鬼神，顺道（dǎo）其欲恶（wù），使神无有怨痛于楚国。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他又能够使上下诸神悦纳楚国，顺应、疏导神灵的好恶，使神灵不对楚国怀有怨恨。”\u003c/p>\n\u003cp class=\"translation\">“说”通“悦”；“道”通“导”；“欲恶”是喜好与厌恶。\u003c/p>\n\u003cp class=\"translation\">这句话反映了当时的宗教观念：懂得祭祀礼仪、能够处理人与鬼神关系，也被认为是重要的才能。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“又有薮（sǒu）曰云，连徒洲，金、木、竹、箭之所生也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“楚国又有一片叫作‘云’的大泽，与徒洲相连，那里出产金属、木材、竹子和箭竹。”\u003c/p>\n\u003cp class=\"translation\">“薮”是草木繁茂的大泽。“云”指云梦泽一带；“徒洲”是洲名。“金”泛指金属；“箭”在这里指适合制箭的竹类。\u003c/p>\n\u003cp class=\"translation\">“云，连徒洲”也有版本连写为“云连徒洲”，这里采用分开的断句。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“龟、珠、角、齿、皮、革、羽、毛，所以备赋，以戒不虞者也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“那里出产的龟甲、珍珠、兽角、象牙、兽皮、皮革、鸟羽和牦牛尾毛等，是用来备办军需、防备意外变故的物资。”\u003c/p>\n\u003cp class=\"translation\">“所以”在这里是用来……的东西；“赋”指兵赋、军事所需的征发和物资；“戒”是戒备、防备。\u003c/p>\n\u003cp class=\"translation\">“不虞”是没有预料到的事情，常指意外的变故或灾患。这些物产各有用途，并不是说每一样都直接用于作战。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“所以共（gōng）币帛（bó），以宾享于诸侯者也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“它们也可以用来备办礼物，供楚国与诸侯进行聘问、馈赠等礼仪往来。”\u003c/p>\n\u003cp class=\"translation\">“共”通“供”，是供给；“币帛”泛指礼物，其中“币”不是今天专指货币的意思。“享”在这里有进献的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若诸侯之好（hǎo）币具，而导之以训辞，有不虞之备，而皇神相（xiàng）之，寡君其可以免罪于诸侯，而国民保焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果与诸侯友好往来的礼物准备齐全，又以合宜的外交辞令办理交涉；国内有防备意外的准备，又得到神灵的帮助，那么我国国君大概就能避免受到诸侯的责难，国家和人民也能得到保全。”\u003c/p>\n\u003cp class=\"translation\">“好币”是用于友好往来的礼物；“具”是齐备；“皇神”是大神；“相”在这里是帮助、保佑。\u003c/p>\n\u003cp class=\"translation\">“免罪于诸侯”指不因外交失当等原因而招致诸侯责难。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“此楚国之宝也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这些，才是楚国的珍宝。”\u003c/p>\n\u003cp class=\"translation\">这里的“这些”，包括前面说的贤能之臣，以及能够支持外交、军备和国家日常需要的物产。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若夫白珩，先王之玩也，何宝之焉？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至于白珩，不过是先王赏玩的东西，哪里值得把它当作国家的珍宝呢？”\u003c/p>\n\u003cp class=\"translation\">“若夫”是至于；“玩”指供人赏玩的器物；“宝之”是把它当作珍宝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“圉闻国之宝，六而已。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说，一个国家值得珍视的宝物，只有六类。”\u003c/p>\n\u003cp class=\"translation\">“圉”是王孙圉自称其名；“而已”是罢了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“明王圣人能制议百物，以辅相（xiàng）国家，则宝之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“贤明的君王、圣智之人，能够裁定、筹议各种事务，辅助治理国家，就把他们视为珍宝。”\u003c/p>\n\u003cp class=\"translation\">“制议”是裁定、筹议；“辅相”是辅助。“宝”作动词，意思是珍视、以之为宝。\u003c/p>\n\u003cp class=\"translation\">这一句有版本只写“圣能制议百物”，这里采用“明王圣人”的文字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“玉足以庇荫（yìn）嘉谷，使无水旱之灾，则宝之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“玉如果能够庇护庄稼，使它们免受水灾、旱灾，就把它视为珍宝。”\u003c/p>\n\u003cp class=\"translation\">“嘉谷”是良好的谷物、庄稼。\u003c/p>\n\u003cp class=\"translation\">按照旧注，这里说的是祭祀所用的玉。它反映了古人用玉祭神、祈求丰收的信仰，不能理解为玉本身具有防治水旱的作用。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“龟足以宪臧（zāng）否（pǐ），则宝之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“龟甲如果能够通过占卜显示吉凶，就把它视为珍宝。”\u003c/p>\n\u003cp class=\"translation\">“宪”在这里可理解为显示、表明；“臧否”本指善恶、好坏，在占卜语境中指吉凶。\u003c/p>\n\u003cp class=\"translation\">古人用龟甲占卜，把它当作判断事情是否适宜的依据。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“珠足以御火灾，则宝之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“珠如果能够抵御火灾，就把它视为珍宝。”\u003c/p>\n\u003cp class=\"translation\">“御”是抵御、防止。\u003c/p>\n\u003cp class=\"translation\">旧注以珠为“水精”，因而认为它能够御火。这也是当时的观念，并不是现代意义上的防火方法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“金足以御兵乱，则宝之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“金属如果能够用来抵御战争、平定祸乱，就把它视为珍宝。”\u003c/p>\n\u003cp class=\"translation\">“金”指可以制造兵器的金属。“兵乱”指战争和武装祸乱。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“山林薮（sǒu）泽足以备财用，则宝之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“山林湖泽如果能够供给国家所需的物资，就把它们视为珍宝。”\u003c/p>\n\u003cp class=\"translation\">“财用”是物资和用度。这里承接前面对楚国物产的介绍。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若夫哗（huá）嚣（xiāo）之美，楚虽蛮夷，不能宝也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至于那些叮当作响、只供炫耀的美玉，楚国虽然被称作蛮夷，也不会把它们当作国家的珍宝。”\u003c/p>\n\u003cp class=\"translation\">“哗嚣”是喧响，这里呼应开头赵简子的“鸣玉以相”。\u003c/p>\n\u003cp class=\"translation\">“楚虽蛮夷”是外交辞令中的自谦，接着却说“不能宝也”，话里带着讽刺：楚国知道什么值得珍视，也看得出什么只是用来炫耀的装饰。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">全文从“白珩还在不在”讲到“什么才是国宝”，判断的依据始终是：能否帮助国家处理事务、抵御灾患、保全民众。不过，其中关于玉、龟、珠的说法仍然属于当时的祭祀、占卜观念，阅读时可以把它的价值判断与具体知识分开理解。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hant/國語/卷18\" target=\"_blank\" rel=\"noopener\">《国语》卷十八原文及旧注\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.gushiwen.cn/shiwenv_3d2b400ebe8e.aspx\" target=\"_blank\" rel=\"noopener\">《王孙圉论楚宝》原文\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-10", "volume": 3, "volume_title": "卷三 · 周文", "number": 10, "title": "诸稽郢行成于吴", "file": "卷三/10-诸稽郢行成于吴.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《诸稽（jī）郢（yǐng）行成于吴》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第10篇\u003cbr>选自《国语·吴语》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋末期，吴王夫差出兵攻打越国，越王勾践准备迎战。大夫文种建议暂时求和，等待吴国衰弱的机会，勾践于是派诸稽郢前去交涉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴王夫差起师伐越，越王句（gōu）践起师逆之江。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴王夫差出兵攻打越国，越王勾践也调集军队，在江边迎战。\u003c/p>\n\u003cp class=\"translation\">“起师”是出兵；“逆”是迎接，这里指迎战。“句践”就是“勾践”，本篇保留“句”的写法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大夫种（zhǒng）乃献谋曰：“夫吴之与越，唯天所授；王其无庸战！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">大夫文种于是献计说：“吴国和越国之间，最终谁能取胜，要看上天把胜利授予谁。大王还是不要急着交战！”\u003c/p>\n\u003cp class=\"translation\">“种”就是文种。“其”表示劝告；“无庸”是不必、用不着。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫申胥（xū）、华（huà）登简服吴国之士于甲兵，而未尝有所挫也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“申胥和华登训练吴国士兵，使他们熟习军事，还没有遭受过挫败。”\u003c/p>\n\u003cp class=\"translation\">“申胥”就是伍子胥；华登也是吴国大夫。“简服”按旧注理解为训练、使之熟习；“甲兵”在这里泛指军事作战。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫一人善射，百夫决（jué）拾，胜未可成。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“一个人善于射箭，就会带动许多人戴上射箭护具，跟着学习。面对这样的吴军，我们还不能保证取胜。”\u003c/p>\n\u003cp class=\"translation\">“决”是射箭时保护手指的扳指；“拾”是保护手臂的护具。这里借射箭作比：将领善于用兵，士卒也会受到训练和带动。\u003c/p>\n\u003cp class=\"translation\">“成”在这里有确定、保证的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫谋，必素见成事焉，而后履之，不可以授命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“凡是谋划一件事，必须预先看出成功的把握，然后才去实行，不能轻率地拿性命冒险。”\u003c/p>\n\u003cp class=\"translation\">“素”是预先；“履”是实行；“授命”在这里指把性命交出去，冒死行事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“王不如设戎（róng），约辞行成，以喜其民，以广侈（chǐ）吴王之心。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“大王不如部署军队自守，用谦卑的言辞去求和，让吴国百姓高兴，同时助长吴王骄傲自大的心理。”\u003c/p>\n\u003cp class=\"translation\">“戎”指军队；“约辞”是谦卑的言辞；“行成”就是求和。“广侈”是使之膨胀、使之更加骄纵。\u003c/p>\n\u003cp class=\"translation\">这里已把求和的目的说出来了：保住越国，也让吴王放松警惕。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“吾以卜之于天，天若弃吴，必许吾成，而不吾足也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们可以借此试探天意。如果上天要抛弃吴国，吴王一定会答应我们求和，并认为我们不值得担忧。”\u003c/p>\n\u003cp class=\"translation\">“卜”本指占卜，这里有试探、观察的意思。“不吾足”是“不足吾”的倒装，意思是不把我们当作值得重视的对手。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“将必宽然有伯（bà）诸侯之心焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他一定会放下对越国的戒心，转而想着称霸诸侯。”\u003c/p>\n\u003cp class=\"translation\">“宽然”是宽缓、松懈的样子。“伯”通“霸”，这里作动词，指称霸。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“既罢（pí）弊其民，而天夺之食，安受其烬（jìn），乃无有命矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“等他使百姓疲惫困苦，上天又使吴国粮食歉收，我们便可以从容收取它剩下的力量；那时吴国也就失去天命了。”\u003c/p>\n\u003cp class=\"translation\">“罢”通“疲”；“弊”是困敝。“烬”本指燃烧后的余物，这里比喻吴国衰败后残存的力量。\u003c/p>\n\u003cp class=\"translation\">这段是文种提出的战略判断和预期，不能直接当作已经发生的事实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>越王许诺，乃命诸稽（jī）郢（yǐng）行成于吴，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">越王答应了，于是命令诸稽郢到吴国求和。诸稽郢向吴方陈述说：\u003c/p>\n\u003cp class=\"translation\">诸稽郢是越国大夫，“诸稽”是复姓，“郢”是名。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“寡君句践使下臣郢，不敢显然布币行礼，敢私告于下执事曰：”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我国国君勾践派遣我这个小臣郢前来，不敢公开陈列礼物、举行正式礼仪，只敢私下向大王手下办事的官员陈告：”\u003c/p>\n\u003cp class=\"translation\">“布币”是陈列礼物。“下执事”指对方手下办事的人，是一种谦恭的外交说法，借向臣下陈告来向吴王传话。\u003c/p>\n\u003cp class=\"translation\">从这里开始，他转述勾践的话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔者越国见祸，得罪于天王。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前越国遭受灾祸，得罪了天王。”\u003c/p>\n\u003cp class=\"translation\">“天王”在这里是对吴王夫差的尊称。称吴王为“天王”，把对方抬到了极高的位置。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“天王亲趋玉趾（zhǐ），以心孤句践，而又宥（yòu）赦之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“天王亲自劳驾出兵，心中原已弃绝勾践，后来却又宽恕、赦免了我。”\u003c/p>\n\u003cp class=\"translation\">“玉趾”是对对方脚步的敬称，“亲趋玉趾”相当于亲自劳驾。“孤”按旧注作弃绝讲；“宥赦”是宽恕、赦免。\u003c/p>\n\u003cp class=\"translation\">这句话先提过去的战争，再强调吴王曾经饶恕越国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君王之于越也，繄（yī）起死人而肉（ròu）白骨也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“大王对于越国的恩德，真如使死人复活、使白骨重新长出血肉一样。”\u003c/p>\n\u003cp class=\"translation\">“繄”在这里有“是、实在是”的意思。“起”和“肉”都是使动用法：使死人起来，使白骨生肉。\u003c/p>\n\u003cp class=\"translation\">这是极力称颂对方保全越国的恩情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“孤不敢忘天灾，其敢忘君王之大赐乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我不敢忘记上天降下的灾祸，又怎么敢忘记大王给予的厚恩呢？”\u003c/p>\n\u003cp class=\"translation\">这里的“孤”是勾践的自称，与上一句“孤句践”的“孤”意思不同。“其敢”是哪里敢。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今句践申祸无良，草鄙之人，敢忘天王之大德，而思边垂之小怨，以重（chóng）得罪于下执事？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今我勾践又遭灾祸，实在是自己不好。我这个草野鄙陋的人，哪里敢忘记天王的大恩，却计较边境上的小小怨隙，以至再次得罪您的属下呢？”\u003c/p>\n\u003cp class=\"translation\">“申”是重复、再次；“无良”是不好，是自责之辞；“边垂”就是边境。\u003c/p>\n\u003cp class=\"translation\">他把吴王保全越国说成“大德”，把边境冲突说成“小怨”，借此表明越国不敢报复。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“句践用帅二三之老，亲委重罪，顿颡（sǎng）于边。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此，勾践率领几位老臣，亲自前来承认重罪，在边境叩头请罪。”\u003c/p>\n\u003cp class=\"translation\">“用”是因此；“帅”通“率”；“委重罪”是把重大罪责归到自己身上；“顿颡”是以额头叩地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今君王不察，盛怒属（zhǔ）兵，将残伐越国。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今大王没有体察我们的心意，盛怒之下集结军队，将要攻打、毁灭越国。”\u003c/p>\n\u003cp class=\"translation\">“察”是体察、明察；“属兵”是会集军队；“残伐”是摧残、攻伐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“越国固贡献之邑也，君王不以鞭棰（chuí）使之，而辱军士使寇令焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“越国本来就是向您进贡的属邑，大王不用鞭子驱使我们，反而劳烦将士，向我们施行讨伐敌寇的军令。”\u003c/p>\n\u003cp class=\"translation\">“固”是本来；“鞭棰”是鞭子、棍棒；“辱”是劳烦对方的客套说法。\u003c/p>\n\u003cp class=\"translation\">这句话的意思是：越国既然已经臣服，您直接命令就可以了，何必再把我们当敌国讨伐？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“句践请盟。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“勾践请求订立盟约。”\u003c/p>\n\u003cp class=\"translation\">下面开始提出具体的臣服条件。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“一介嫡（dí）女，执箕（jī）帚（zhǒu）以晐（gāi）姓于王宫；”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“愿送上一名嫡出的女儿，拿着簸箕、扫帚，在大王宫中侍奉，充列后宫。”\u003c/p>\n\u003cp class=\"translation\">“一介”在这里是一人；“嫡女”是正妻所生的女儿；“执箕帚”以打扫的劳作表示卑下的侍奉。\u003c/p>\n\u003cp class=\"translation\">“晐”是完备，“晐姓”是充备宫中诸姓女子之列，是送女入宫的谦辞。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“一介嫡男，奉槃（pán）匜（yí）以随诸御。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“愿送上一名嫡出的儿子，捧着洗手用的盘和匜，跟随大王的侍从，供您使唤。”\u003c/p>\n\u003cp class=\"translation\">“槃”同“盘”，用来承接水；“匜”是注水的器具；“诸御”指近侍。\u003c/p>\n\u003cp class=\"translation\">这两句提出以亲生子女入吴宫侍奉，表示服从。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“春秋贡献，不解（xiè）于王府。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“每年按时向王府进贡，决不懈怠。”\u003c/p>\n\u003cp class=\"translation\">“春秋”在这里泛指按年、按时；“解”通“懈”，是懈怠。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“天王岂辱裁之？亦征诸侯之礼也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“天王能否屈尊裁定、接受这些条件？这也符合天子向诸侯征收贡赋的礼制。”\u003c/p>\n\u003cp class=\"translation\">“裁”是裁定；“征”是征收。\u003c/p>\n\u003cp class=\"translation\">这仍是在抬高吴王：越国向您进贡，正像诸侯向天子进贡一样。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫谚（yàn）曰：‘狐埋之而狐搰（hú）之，是以无成功。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“俗话说：‘狐狸把东西埋下，又亲自把它掘出来，所以始终不能成事。’”\u003c/p>\n\u003cp class=\"translation\">“搰”是挖掘。\u003c/p>\n\u003cp class=\"translation\">这句比喻前面做了一件事，后面又自己把它破坏，结果前功尽弃。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今天王既封殖越国，以明闻（wén）于天下，而又刈（yì）亡之，是天王之无成劳也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今天王已经扶植、保全了越国，使这件事昭著于天下，却又要把越国像草一样割除，使它灭亡，这就使您先前的功劳不能成就了。”\u003c/p>\n\u003cp class=\"translation\">“封殖”本指培土、种植，这里比喻扶植、保全；“刈”是割草；“劳”是功劳。\u003c/p>\n\u003cp class=\"translation\">诸稽郢把劝说落在吴王自己的功名上：灭掉越国，也就亲手毁掉了此前保全越国的功劳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽四方之诸侯，则何实以事吴？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“即使是四方诸侯，又能凭借什么实在的保障来侍奉吴国呢？”\u003c/p>\n\u003cp class=\"translation\">意思是：如果已经臣服、受到保全的越国，仍会被吴国灭掉，那么其他诸侯怎么相信侍奉吴国能够得到保障？\u003c/p>\n\u003cp class=\"translation\">这里已经从越国的存亡，说到了吴国能否取信诸侯。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“敢使下臣尽辞，唯天王秉（bǐng）利度（duó）义焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以，我才冒昧派遣小臣把这些话说尽，希望天王权衡利害，斟酌合宜的做法！”\u003c/p>\n\u003cp class=\"translation\">“秉”是执持、把握；“度”是衡量；“义”在这里有合宜、适当的意思。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">这篇前后两部分要连着看：文种先说清楚求和的战略目的，诸稽郢随后把这一目的包装成极其谦卑的外交辞令。他先认罪、称恩、提出臣服条件，最后再提醒吴王：保全越国，有利于保存自己的功劳，也有利于取信其他诸侯。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/諸稽郢行成於吳\" target=\"_blank\" rel=\"noopener\">《诸稽郢行成于吴》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/國語_(四庫全書本)/卷19\" target=\"_blank\" rel=\"noopener\">《国语》四库全书本卷十九原文及旧注\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-11", "volume": 3, "volume_title": "卷三 · 周文", "number": 11, "title": "申胥谏许越成", "file": "卷三/11-申胥谏许越成.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《申胥（xū）谏许越成》\u003c/h1>\n\u003cp class=\"translation\">选自《国语·吴语》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">吴王夫差打算北上争衡齐国，准备答应越国求和。申胥即伍子胥，认为越国会利用吴国好胜的心理来养精蓄锐，因而反对议和。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴王夫差乃告诸大夫曰：“孤将有大志于齐，吾将许越成，而无拂（fú）吾虑。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴王夫差于是告诉大夫们：“我将对齐国有所大图谋，准备答应越国求和，你们不要违背我的打算。”“而”在这里通“尔”，指你们。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若越既改，吾又何求？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果越国已经改过，我还要求什么呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若其不改，反行，吾振旅焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果越国不改，我回来以后再整军讨伐它。”“振旅”是整顿军队。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>申胥（xū）谏曰：“不可许也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">申胥劝谏说：“不能答应。”申胥就是伍员、伍子胥。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫越非实忠心好吴也，又非慑（shè）畏吾甲兵之强也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“越国并不是真心亲善吴国，也不是惧怕我们兵甲强大。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大夫种勇而善谋，将还玩吴国于股掌之上，以得其志。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“大夫文种勇敢而善于谋划，打算反过来把吴国玩弄在股掌之上，以实现他的志愿。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫固知君王之盖威以好胜（hào shèng）也，故婉约其辞，以从逸（zòng yì）王志，使淫乐于诸夏之国，以自伤也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他本来就知道君王崇尚威势、喜好取胜，所以言辞委婉，来顺从放纵您的心意，使您在诸夏国家中逐胜享乐，自己损伤自己。”“从逸”是顺从并使其放纵。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使吾甲兵钝弊，民人离落，而日以憔悴，然后安受吾烬（jìn）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“使我们兵器钝损、军队疲弊，人民离散，国势日益衰弱，然后安然接收我们的残余。”“烬”本指燃烧后的余物，在这里比喻残存的国家力量。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫越王好信以爱民，四方归之，年谷时熟，日长炎炎（yán yán），及吾犹可以战也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“越王喜爱守信，又爱护百姓，四方的人归附他，年谷按时成熟，势力如火日益旺盛；现在趁我们尚能作战，应当出击。”“及”是趁着。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为虺（huǐ）弗摧，为蛇将若何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“小蛇时不摧毁，等它成为大蛇，还能怎么办呢？”“虺”是小蛇，这是申胥用来说明后患渐大的比喻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴王曰：“大夫奚隆于越？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴王说：“大夫为什么把越国看得这样重？”“隆”在这里是抬高、看重。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>越曾足以为大虞乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“越国难道值得成为大忧患吗？”“虞”是忧虑、防备。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若无越，则吾何以春秋曜吾军士？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果没有越国，我又拿什么在春秋两季展示、训练我的军队呢？”“曜”通“耀”，显耀军威。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乃许之成。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是答应与越国讲和。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>将盟，越王又使诸稽郢（zhū jī yǐng）辞曰：“以盟为有益乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">将要订盟时，越王又派诸稽郢推辞说：“如果认为盟誓有用……”诸稽郢是越国使臣，后面接着说明不必再盟。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>前盟口血未干，足以结信矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以前盟誓所歃的血尚未干，已经足以建立信任了。”这是一种外交夸饰，并非精确计算时间。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以盟为无益乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果认为盟誓没有用……”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君王舍甲兵之威以临使之，而胡重于鬼神而自轻也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“君王有甲兵的威势来统临、役使我们，却舍下不用，为什么看重鬼神，反而轻看自己呢？”这番说辞以尊崇夫差的口吻劝他免去正式盟誓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴王乃许之，荒成不盟。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴王于是答应，草率讲和而没有举行盟誓。“荒成”是草率地达成和议。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">本文的越国使者以“有益”“无益”两面设问，无论夫差选哪一面，都被引向不必再盟的结论。伍子胥对越国意图的判断是文中人物的分析；译文保留其立场，不把他每句话都当作越国方面留下的自白。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷3)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷3\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v03-12", "volume": 3, "volume_title": "卷三 · 周文", "number": 12, "title": "春王正月", "file": "卷三/12-春王正月.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《春王正（zhēng）月》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第12篇\u003cbr>选自《公羊传·隐公元年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">鲁隐公元年是公元前722年，《春秋》以“元年，春，王正月”开篇。本篇用一问一答的方式，解释这些字的含义，并由“不写隐公即位”讨论鲁隐公、鲁桓公的继承资格；这些解释代表《公羊传》的立场。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>元年者何？君之始年也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“元年”是什么意思？就是国君纪年的第一年。\u003c/p>\n\u003cp class=\"translation\">这里指鲁隐公元年。“元”是开始、第一。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>春者何？岁之始也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“春”是什么意思？是一年的开始。\u003c/p>\n\u003cp class=\"translation\">这里从一年的时序解释“春”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王者孰（shú）谓？谓文王也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“王”指的是谁？指周文王。\u003c/p>\n\u003cp class=\"translation\">“孰谓”就是“说的是谁”。\u003c/p>\n\u003cp class=\"translation\">这是《公羊传》的解释：把这里的“王”追溯到周文王所代表的王统和制度，不能理解为周文王当时还在世。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曷（hé）为先言王而后言正（zhēng）月？王正月也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么先说“王”，再说“正月”？因为这是周王所颁定历法中的正月。\u003c/p>\n\u003cp class=\"translation\">“曷为”就是为什么。“王正月”要连起来理解：王所规定的正月。\u003c/p>\n\u003cp class=\"translation\">这里的“正月”是一年中的第一个月，不宜直接套用今天农历正月的具体时间。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何言乎王正月？大一统也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么要特意说“王正月”？是为了尊崇天下共同奉行的统一秩序。\u003c/p>\n\u003cp class=\"translation\">“大”在这里有尊崇、重视的意思；“统”是统绪、共同的根本。\u003c/p>\n\u003cp class=\"translation\">就眼前这句话说，各诸侯采用周王颁定的历法，意味着共同承认周王的权威。这里的“大一统”首先联系着统一的正朔、王统，不能直接等同于后世中央集权国家的全部制度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公何以不言即位？成公意也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么经文没有写“公即位”？是为了成全鲁隐公的心意。\u003c/p>\n\u003cp class=\"translation\">“公”是鲁隐公。“不言即位”指《春秋》没有写下“公即位”几个字，并不是说他没有实际执掌国政。\u003c/p>\n\u003cp class=\"translation\">《公羊传》认为，这一处省略含有特定的褒扬之意。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何成乎公之意？公将平国而反之桓。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">怎样成全鲁隐公的心意呢？隐公打算先安定国家，然后把君位交还给桓公。\u003c/p>\n\u003cp class=\"translation\">“平国”是使国家安定；“反”通“返”，是交还；“之”指君位、国家政权。\u003c/p>\n\u003cp class=\"translation\">这里的“桓”是后来成为鲁桓公的公子允。他和鲁隐公都是鲁惠公的儿子，是同父异母的兄弟。\u003c/p>\n\u003cp class=\"translation\">用一个“反”字，已经表明了本篇的判断：桓才是应当承受君位的人，隐只是暂时执政。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曷（hé）为反之桓？桓幼而贵，隐长（zhǎng）而卑。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么要把君位交还给桓？因为桓虽然年幼，身份却尊贵；隐虽然年长，身份却较低。\u003c/p>\n\u003cp class=\"translation\">“长”指年长；“贵”“卑”说的是继承制度中的身份等级，主要与生母的身份有关，并不是说两人的品德有高下。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其为尊卑也微，国人莫知。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">不过，他们身份尊卑的区别很细微，国人并不清楚。\u003c/p>\n\u003cp class=\"translation\">“微”是细微、不显著。“国人”指国都中的人众。\u003c/p>\n\u003cp class=\"translation\">这句话也说明：在本篇的叙述中，两人的资格差别，并不是人人都能一眼看明白的。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>隐长（zhǎng）又贤，诸大夫扳（pān）隐而立之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">隐公年长，又有贤德，于是众大夫拥戴他，立他为国君。\u003c/p>\n\u003cp class=\"translation\">“扳”在这里是攀援、拥戴的意思。\u003c/p>\n\u003cp class=\"translation\">诸大夫考虑的是他的年龄和才能，而后文将提出另一套判断标准：继承资格应当由身份和长幼次序决定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>隐于是焉而辞立，则未知桓之将必得立也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">隐公如果在这个时候推辞，不肯被立为国君，也不能确定桓就一定能够被立。\u003c/p>\n\u003cp class=\"translation\">“于是焉”是在这个时候；“辞立”是推辞被立为君。\u003c/p>\n\u003cp class=\"translation\">按《公羊传》的解释，隐公担心：自己一旦拒绝，诸大夫未必就会转而拥立桓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>且如桓立，则恐诸大夫之不能相（xiàng）幼君也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">况且，即使桓被立为国君，隐公又担心诸大夫不能好好辅佐这个年幼的君主。\u003c/p>\n\u003cp class=\"translation\">“相”是辅佐。\u003c/p>\n\u003cp class=\"translation\">这一句进一步解释隐公为什么接受君位：他还担心年幼的弟弟无法得到妥善辅佐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故凡隐之立，为（wèi）桓立也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">所以，说到底，隐公接受君位，是为了桓而接受的。\u003c/p>\n\u003cp class=\"translation\">“凡”在这里有总括的意思；“为桓”是为了桓。\u003c/p>\n\u003cp class=\"translation\">这是本篇对隐公动机的明确判断：他暂时居位，是为了保住弟弟将来的继承机会。阅读时要记住，这是《公羊传》对人物心意的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>隐长（zhǎng）又贤，何以不宜立？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">隐公既年长又贤能，为什么反而不应该立他呢？\u003c/p>\n\u003cp class=\"translation\">这一问正好把前面的疑点提出来：既然他更成熟、更有能力，为什么不能正式继位？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>立适（dí）以长（zhǎng）不以贤，立子以贵不以长（zhǎng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">确立嫡子的继承次序，依据年长，不依据谁更贤能；在需要比较诸子身份时，依据身份尊贵，不单凭年龄大小。\u003c/p>\n\u003cp class=\"translation\">“适”通“嫡”。前半句说嫡子之间按长幼确定次序；后半句说诸子身份不同时，要先比较身份等级。\u003c/p>\n\u003cp class=\"translation\">这套规则的要点是：先按既定身份确定资格，再按长幼排次序，不以个人才能重新竞争君位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>桓何以贵？母贵也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">桓为什么身份尊贵？因为他的母亲身份尊贵。\u003c/p>\n\u003cp class=\"translation\">本篇以生母的身份，解释儿子的继承地位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>母贵则子何以贵？子以母贵，母以子贵。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">母亲尊贵，为什么儿子也随之尊贵呢？因为儿子可以凭母亲的身份获得尊贵地位，母亲也可以凭儿子的地位获得尊荣。\u003c/p>\n\u003cp class=\"translation\">“以”是凭借、由于。\u003c/p>\n\u003cp class=\"translation\">前一句主要说明继承资格：母亲的身份影响儿子的地位。后一句说明反过来的关系：儿子地位提高，也会使母亲受到尊崇，并不是说母子可以凭空相互抬高身份。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 继承规则：为什么不选年长又贤能的隐公？\u003c/p>\n\u003cp class=\"translation\">“立适以长不以贤”：嫡子之间，立年长的，不比较谁更贤能。例如正妻生了两个儿子，即使小儿子更能干，也应由大儿子继承。\u003c/p>\n\u003cp class=\"translation\">“立子以贵不以长”：如果没有嫡子，需要在其他儿子中选，就先看谁的母亲身份更高，不单看谁年龄大。例如一个儿子年长，但母亲地位较低；另一个儿子年幼，但母亲地位较高，就优先立后者。\u003c/p>\n\u003cp class=\"translation\">放回本篇，《公羊传》认为，隐公虽然年长又贤能，但桓公的母亲身份更高，因此桓公的继承资格优先。隐公“更能干”，不能成为改变继承次序的理由。这是在解释本篇所持的制度立场。\u003c/p>\n\u003cp class=\"translation\">### 后来真的把君位交给桓公了吗？\u003c/p>\n\u003cp class=\"translation\">桓公后来确实当了国君，但并不是隐公安定国家后，主动把君位交给他的。鲁隐公在位十一年后，被大夫羽父（公子翚，huī）派人杀害，随后鲁桓公即位。\u003c/p>\n\u003cp class=\"translation\">所以，“公将平国而反之桓”说的是《公羊传》认为隐公原本打算这样做，并不表示让位已经实现。桓公后来即位，是事情的结果；隐公是否一直真心打算让位，则是对他内心意图的解释。\u003c/p>\n\u003cp class=\"translation\">### 羽父为什么杀隐公？\u003c/p>\n\u003cp class=\"translation\">按《左传》的记载，羽父先想靠杀桓公升官，被隐公拒绝后，又怕事情败露，于是掉头勾结桓公，杀了隐公。\u003c/p>\n\u003cp class=\"translation\">原文先说：“羽父请杀桓公，将以求大宰。”他想替隐公除掉潜在的君位竞争者，以此换取“大宰”这个高位。这里称“桓公”，是用他后来成为国君后的称号称呼他，当时他还没有即位。\u003c/p>\n\u003cp class=\"translation\">隐公拒绝，说：“为其少故也，吾将授之矣……吾将老焉。”意思是：“我只是因为他年幼，才暂时居位；我准备把君位交给他，自己到菟裘养老。”\u003c/p>\n\u003cp class=\"translation\">随后原文说：“羽父惧，反谮公于桓公而请弑之。”“谮（zèn）”就是诬陷、进谗言。《左传》没有写出他具体说了什么，但记载他转而向桓公诬陷隐公，并请求杀掉隐公，随后派人行刺，拥立桓公。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>分析判断：\u003c/strong>从上下文看，羽父很可能担心桓公继位后，知道自己曾提议杀他，就会追究。因此，他先把隐公变成桓公的敌人，再以帮助桓公夺位来保全自己。这是根据记载作出的推断；原文只明确写了“羽父惧”，没有详细解释他的心理。\u003c/p>\n\u003cp class=\"translation\">### 桓公同意了吗？\u003c/p>\n\u003cp class=\"translation\">本会话最后的解释是：从事情的发展看，桓公应当是同意或默许了，但《左传》没有直接写“桓公答应”。\u003c/p>\n\u003cp class=\"translation\">原文先说羽父向桓公诬陷隐公、请求杀他，随后记载：“羽父使贼弑公于寪（wěi）氏，立桓公。”意思是羽父派刺客杀死隐公，拥立桓公。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>原文与推断的界线：\u003c/strong>不能把“桓公明确下令杀兄”当作这段原文直接记载的事实；但他接受了羽父的拥立，也没有被写成阻止这场谋杀的人。同意或默许属于据事情发展作出的判断。《公羊传》则更直接地说“桓弑隐”，把弑君的责任归到了桓公身上。\u003c/p>\n\u003cp class=\"translation\">### 经文、传文与人物动机\u003c/p>\n\u003cp class=\"translation\">经文只是“元年，春，王正月”，《公羊传》却从字序和没有写出的“即位”，解释出王权秩序、隐公让位的心意，以及继承制度。这些义理解释本身值得研究，但它们与隐公当时真实的内心动机，需要分开判断。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/春王正月\" target=\"_blank\" rel=\"noopener\">《春王正月》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/春秋左傳正義/卷03\" target=\"_blank\" rel=\"noopener\">《春秋左传正义》卷三：隐公十一年\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-13", "volume": 3, "volume_title": "卷三 · 周文", "number": 13, "title": "宋人及楚人平", "file": "卷三/13-宋人及楚人平.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《宋人及楚人平》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第13篇\u003cbr>选自《公羊传·宣公十五年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">事情发生在公元前594年，楚庄王围困宋国，双方都面临粮食短缺。本篇记述宋国大夫华元与楚国司马子反相互坦露实情，最终促成停战的经过；题目中的“平”，就是讲和。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>外平不书，此何以书？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁国以外的诸侯国之间讲和，通常不记入《春秋》，这一次为什么记载呢？\u003c/p>\n\u003cp class=\"translation\">“外”以鲁国为中心，指其他国家；“书”是记载。这是在解释《春秋》的记事方式。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大其平乎己也。何大其平乎己？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因为赞扬这次讲和出于双方大夫自己的主动。为什么要赞扬他们主动促成讲和呢？\u003c/p>\n\u003cp class=\"translation\">“大”是赞扬、推重；“乎”相当于“于”；“己”指华元和子反自己，与奉国君之命相对。\u003c/p>\n\u003cp class=\"translation\">接下来用故事回答这个问题。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄王围宋，军有七日之粮尔；尽此不胜，将去而归尔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚庄王围困宋国，楚军只剩下七天的粮食；如果粮食吃完还不能取胜，就准备撤军回国。\u003c/p>\n\u003cp class=\"translation\">“尔”相当于“耳”，是罢了；“去”是离开。\u003c/p>\n\u003cp class=\"translation\">这里先告诉读者：宋国虽然危急，楚军也不能无限期围下去。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是使司马子反乘堙（yīn）而窥（kuī）宋城。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，楚庄王派司马子反登上攻城用的土山，察看宋国都城的情况。\u003c/p>\n\u003cp class=\"translation\">“司马”是掌管军事的官职；“子反”是楚国大夫公子侧的字。“乘”是登上；“堙”指攻城时堆筑的土山。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宋华（huà）元亦乘堙而出见之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋国大夫华元也登上土山，出来与子反相见。\u003c/p>\n\u003cp class=\"translation\">“之”指子反。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子反曰：“子之国如何？”华元曰：“惫（bèi）矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反问：“贵国的情况怎么样？”华元回答：“已经困苦不堪了！”\u003c/p>\n\u003cp class=\"translation\">“子”是对对方的敬称；“惫”是疲困到了极点。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“何如？”曰：“易子而食之，析骸（hái）而炊（chuī）之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反问：“困苦到了什么程度？”华元说：“人们交换孩子来吃，劈开死人的骨骸当柴烧，生火做饭。”\u003c/p>\n\u003cp class=\"translation\">“易”是交换；“析”是劈开；“骸”是骨骸。\u003c/p>\n\u003cp class=\"translation\">这句话写的是围城造成的极端惨状：粮食和燃料都已严重匮乏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>司马子反曰：“嘻！甚矣惫！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反说：“唉！竟然已经困苦到这种地步！”\u003c/p>\n\u003cp class=\"translation\">“甚矣惫”把“甚矣”放在前面，突出惊叹，相当于“困苦得太厉害了”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽然，吾闻之也，围者，拑（qián）马而秣（mò）之，使肥者应（yìng）客，是何子之情也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虽说如此，我听说，被围困的人往往设法做出粮食充足的样子：给马口加上木衔，摆出喂粮的架势，再牵出肥马应付来使。您为什么反而向我吐露实情呢？”\u003c/p>\n\u003cp class=\"translation\">“虽然”是“虽然这样”；“围者”指被围困的一方；“拑”是钳住、约束；“秣”是喂马。\u003c/p>\n\u003cp class=\"translation\">这一套做法，是为了让敌方以为城中还有余粮。“情”在这里是实情，子反惊讶的是：华元竟然没有掩饰宋国的困境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>华元曰：“吾闻之，君子见人之厄（è），则矜（jīn）之；小人见人之厄，则幸之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">华元说：“我听说，君子看见别人遭受困厄，就会怜悯；小人看见别人遭受困厄，就会幸灾乐祸。”\u003c/p>\n\u003cp class=\"translation\">“矜”是怜悯、同情；“幸”是以别人的灾难为可喜之事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“吾见子之君子也，是以告情于子也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我看您是君子，因此才把实情告诉您。”\u003c/p>\n\u003cp class=\"translation\">华元把信任交给了子反，同时也把一个选择摆在他面前：你会同情，还是趁机加害？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>司马子反曰：“诺，勉之矣！吾军亦有七日之粮尔，尽此不胜，将去而归尔。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反说：“好，请你们再努力支撑一下！我们军中也只剩下七天的粮食，吃完这些粮食还不能取胜，就会撤军回国。”\u003c/p>\n\u003cp class=\"translation\">“勉之”在这里是劝对方再坚持一下。\u003c/p>\n\u003cp class=\"translation\">华元坦露了宋国的困境，子反也回报以楚军的实情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>揖（yī）而去之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反向华元作揖，然后离开。\u003c/p>\n\u003cp class=\"translation\">“揖”是拱手行礼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>反于庄王。庄王曰：“何如？”司马子反曰：“惫矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反回到楚庄王那里。庄王问：“情况怎么样？”子反说：“宋国已经困苦不堪了！”\u003c/p>\n\u003cp class=\"translation\">“反”通“返”，是返回。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“何如？”曰：“易子而食之，析骸而炊之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄王问：“到了什么程度？”子反回答：“交换孩子来吃，劈开骨骸烧火做饭。”\u003c/p>\n\u003cp class=\"translation\">同一句话再次出现，这一次听的人换成了楚庄王。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄王曰：“嘻！甚矣惫！虽然，吾今取此，然后而归尔。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚庄王说：“唉！确实困苦到极点了！虽然这样，我还是要攻下这座城，然后再回去。”\u003c/p>\n\u003cp class=\"translation\">“取此”是攻取宋都。\u003c/p>\n\u003cp class=\"translation\">庄王也表示惊叹，但他仍然决定继续进攻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>司马子反曰：“不可。臣已告之矣，军有七日之粮尔。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反说：“不能这样了。我已经把实情告诉他们：我们只有七天的粮食。”\u003c/p>\n\u003cp class=\"translation\">他告诉了宋人楚军即将撤退，宋人便有理由继续坚守。这个消息已经改变了双方的处境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄王怒曰：“吾使子往视之，子曷（hé）为告之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄王生气地说：“我派您去察看他们，您为什么反而把我们的情况告诉他们？”\u003c/p>\n\u003cp class=\"translation\">“曷为”就是为什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>司马子反曰：“以区区之宋，犹有不欺人之臣，可以楚而无乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反说：“像宋国这样一个小国，尚且有不欺骗人的大臣，难道以楚国这样的大国，反而可以没有吗？”\u003c/p>\n\u003cp class=\"translation\">“区区”在这里形容国家小。\u003c/p>\n\u003cp class=\"translation\">子反没有直接否认自己泄露军情，而是提出另一个判断标准：楚国的大臣也应当以诚待人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“是以告之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以，我才把实情告诉了他们。”\u003c/p>\n\u003cp class=\"translation\">“是以”是因此。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄王曰：“诺，舍而止。虽然，吾犹取此，然后归尔。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄王说：“好，这件事就放下，不再追究了。虽然如此，我仍然要攻下这里，然后回国。”\u003c/p>\n\u003cp class=\"translation\">“舍而止”是把这件事放下，不再责问。庄王不再追究子反，却仍不愿撤军。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>司马子反曰：“然则，君请处于此，臣请归尔。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子反说：“既然这样，那么请大王留在这里，允许我回去吧。”\u003c/p>\n\u003cp class=\"translation\">“处”是停留；“臣请归”是请允许我回去。\u003c/p>\n\u003cp class=\"translation\">子反以自己离开，表明不愿继续参与这场围攻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄王曰：“子去我而归，吾孰（shú）与处于此？吾亦从子而归尔。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄王说：“您离开我回去了，我还跟谁留在这里呢？我也跟您一起回去吧。”\u003c/p>\n\u003cp class=\"translation\">“吾孰与处于此”就是“吾与孰处于此”：我和谁留在这里？\u003c/p>\n\u003cp class=\"translation\">这里表现出庄王对这位军事重臣的倚重。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>引师而去之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，楚庄王率领军队撤离了宋国。\u003c/p>\n\u003cp class=\"translation\">“引师”是率领军队。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故君子大其平乎己也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">所以，君子赞扬他们主动促成了讲和。\u003c/p>\n\u003cp class=\"translation\">这句话回应篇首：因为华元、子反的主动交涉，战争才得以停止。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>此皆大夫也，其称人何？贬。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这两个人都是大夫，为什么《春秋》只称“宋人”“楚人”，不写他们的姓名、身份呢？是为了表示贬责。\u003c/p>\n\u003cp class=\"translation\">“此”指华元和子反。“称人”说的是经文“宋人及楚人平”中的两个“人”字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曷为贬？平者在下也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么贬责？因为决定讲和的权力，落在了臣下手中。\u003c/p>\n\u003cp class=\"translation\">按《公羊传》的解释，臣下主动促成和平，值得赞扬；但他们超出了臣子的权限，又应当受到贬责。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">这篇结尾很值得留意：它既赞赏两位大夫以诚相待、结束战祸，又坚持讲和应由国君作主。因此，最后两句不是突然否定前面的故事，而是同时使用了两套评价标准：一套看他们做成了什么，一套看他们有没有越过君臣之间的权限。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/宋人及楚人平\" target=\"_blank\" rel=\"noopener\">《宋人及楚人平》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part049.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文及旧评注\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.gushiwen.cn/shiwenv.aspx?id=c886ed5ae965\" target=\"_blank\" rel=\"noopener\">古文岛原文：“引师而去之”\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-14", "volume": 3, "volume_title": "卷三 · 周文", "number": 14, "title": "吴子使札来聘", "file": "卷三/14-吴子使札来聘.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《吴子使札（zhá）来聘（pìn）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第14篇\u003cbr>选自《公羊传·襄公二十九年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前544年，吴国公子季札出使鲁国，《春秋》记为“吴子使札来聘”。《公羊传》借解释这句话，追述季札让位的故事，说明为什么赞扬他；文中有关王室亲属关系的叙述，应按《公羊传》自身的说法理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴子使札来聘。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴国国君派季札到鲁国进行正式外交访问。“使”是派遣；“聘”是诸侯国之间的正式访问；“来”以鲁国为立场。这一句是《春秋》的经文，下面是《公羊传》的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴无君，无大夫，此何以有君、有大夫？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴国本来不被承认为有合乎礼制的国君和大夫，为什么这里却承认它有国君、有大夫呢？这里不是说吴国实际上没有统治者和官员，而是《公羊传》从中原礼制立场出发，不肯给予它同等的名分。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>贤季子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因为要表彰季子贤德。“贤”在这里是动词，意思是认为他贤明、赞扬他。“季子”就是季札。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何贤乎季子？让国也。其让国奈何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么赞扬季札呢？因为他辞让国君之位。他辞让王位的事情是怎样的呢？这里的“国”主要指国君之位和统治权。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谒（yè）也，余祭（yú zhài）也，夷昧（yí mèi）也，与季子同母者四。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">谒、余祭、夷昧，加上季札，是同一个母亲所生的四兄弟。“谒”通常又称诸樊；季札是其中最小的弟弟。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子弱而才，兄弟皆爱之，同欲立之以为君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札年纪小，却很有才干，哥哥们都喜爱他，都想拥立他做国君。“弱”指年少；“立”是拥立。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谒曰：“今若是迮（zé）而与季子国，季子犹不受也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">谒说：“现在如果这样仓促地把王位交给季札，他还是不会接受的。”“迮”在这里指仓促；“与”是给予。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“请无与子而与弟，弟兄迭（dié）为君，而致国乎季子。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“请大家不要把王位传给自己的儿子，而要传给弟弟，兄弟依次做国君，最后把王位传到季札手里。”“无”相当于“毋”，不要；“迭”是轮流、更替；“致”是交付。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>皆曰：“诺。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">大家都说：“好。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故诸为君者，皆轻死为勇。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，先后做国君的几个哥哥，都把死亡看得很轻，以勇敢赴险为荣。按照文中的解释，他们急于让王位早日传到季札手里，甚至不惜自己的生命。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>饮食必祝（zhù）曰：“天苟有吴国，尚速有悔于予身！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">每次饮食祭祷时，他们一定祈求：“上天如果真想保全吴国，希望灾祸赶快降到我身上吧！”“苟”是如果；“尚”表示希望；“悔”在这里指灾祸；“予”是我。这段突出哥哥们想传位的心愿，不能据此认定死亡由祈祷造成。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故谒也死，余祭也立；余祭也死，夷昧也立；夷昧也死，则国宜之季子者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，谒死后余祭即位，余祭死后夷昧即位；夷昧死后，按原来的安排，王位就应该传给季札了。“之”是到、往。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子使（shì）而亡（wáng）焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札却借出使的机会避开了继位。“使”指出使；“亡”是逃避、离开，不是死亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>僚（liáo）者，长（zhǎng）庶也，即之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">僚是庶出的长子，便登上了王位。按《公羊传》本篇及旧注，僚是季札的异母兄。“庶”指妾所生；“即之”就是即位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子使而反，至，而君之尔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札出使回来，到了吴国，便承认僚为国君，仅此而已。“反”通“返”；“君之”是把他当作国君。他没有因为原来的安排而争夺王位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>阖庐（hé lǘ）曰：“先君之所以不与子国，而与弟者，凡为（wèi）季子故也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">阖庐说：“先前几位国君之所以不把王位传给儿子，而传给弟弟，全都是为了季札。”阖庐就是公子光，按本篇旧注是谒的长子；文章用他后来的称号称呼他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“将从先君之命与（yú）！则国宜之季子者也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果遵从先君的安排，那么王位就应该归季札。”“与”通“欤”，是语气词。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“如不从先君之命与！则我宜立者也。僚恶（wū）得为君乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果不遵从先君的安排，那么就应该由我即位。僚怎么能做国君呢？”这是阖庐为自己提出的继承理由，不能直接当成已经证明的公正结论。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是使专诸刺僚，而致国乎季子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，阖庐派专诸刺杀了僚，随后要把王位交给季札。专诸是执行刺杀的刺客。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子不受，曰：“尔弑（shì）吾君，吾受尔国，是吾与尔为篡（cuàn）也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札不肯接受，说：“你杀了我的国君，如果我接受你交来的王位，那就是我与你一起篡夺王位。”“尔”是你；“弑”指臣下杀君主、子女杀父母；“篡”是以不正当手段夺取君位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“尔杀吾兄，吾又杀尔，是父子兄弟相杀，终身无已也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你杀了我的兄长，如果我再杀你，就会变成父子兄弟之间互相残杀，一辈子没有停止的时候。”按本篇的亲属关系，僚是季札的兄长，阖庐是其侄子。“已”是停止。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>去之延陵，终身不入吴国。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是季札离开，前往延陵，终身不再进入吴国朝廷。“之”是到、往。延陵本在吴国境内，旧注因而把“不入吴国”解释为不入吴国朝廷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故君子以其不受为义，以其不杀为仁。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，君子认为他不接受王位合乎道义，不杀阖庐是仁厚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>贤季子，则吴何以有君、有大夫？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">既然赞扬的是季札，那么为什么连吴国的国君和大夫也获得承认呢？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以季子为臣，则宜有君者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">既然承认季札有资格做臣子，那么相应地，也应该承认他所侍奉的国君。这是《公羊传》对君臣名分的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>札者何？吴季子之名也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“札”是什么？是吴国季子的名字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《春秋》贤者不名，此何以名？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按照《公羊传》的解释，《春秋》对贤者通常不直呼其名，为什么这里直接写“札”呢？“不名”指不用本名直称，以示尊重。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许夷狄（yí dí）者，不壹（yī）而足也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">对于被视为夷狄的人，给予认可时，不会一下子就给足全部礼遇。“许”是认可、赞许。“不壹而足”在这里指不一次给予充分认可，体现了本文的华夷等级立场。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季子者，所贤也，曷（hé）为不足乎季子？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札既然受到赞扬，为什么还不肯给他充分的礼遇呢？“曷为”是为什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许人臣者必使臣，许人子者必使子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">认可一个做臣子的人，必须让他守住臣子的名分；认可一个做儿子的人，必须让他守住儿子的名分。按旧注，不能把季札个人抬得很高，却将他的君父仍置于低下地位；褒扬仍受君臣、父子关系约束。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>你的问题：\u003c/strong>“该季札当了，他不当，还跑，才有了后来的悲剧。他有责任，为什么要表扬他？”\u003c/p>\n\u003cp class=\"translation\">《公羊传》着重赞扬个人不贪权、不受弑君之利、不继续亲族相残的操守；你的质疑则追问继位责任和政治后果。两次拒绝应分开：第一次轮到继位而退避，确实可以追问他是否放弃了稳定局面的责任；第二次拒绝弑君后送来的王位，有避免认可暴力夺位的理由。季札退避给继承争议留下空间，但刺杀由阖庐决定，也无法确定季札即位就一定避免所有争斗。个人保持清白，不能自动等同于尽到公共责任。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh/吳子使札來聘\" target=\"_blank\" rel=\"noopener\">《吴子使札来聘》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/春秋公羊傳注疏_(四庫全書本)/卷21\" target=\"_blank\" rel=\"noopener\">《公羊传注疏》卷二十一\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-15", "volume": 3, "volume_title": "卷三 · 周文", "number": 15, "title": "郑伯克段于鄢", "file": "卷三/15-郑伯克段于鄢.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《郑伯克段于鄢（yān）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第15篇\u003cbr>选自《谷梁传·隐公元年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前722年，郑庄公与弟弟共叔段发生冲突，最终在鄢地击败了他。《左传》着重叙述经过，本篇逐字解释《春秋》的经文，尤其批评郑庄公；两传对段的结局也不同，《左传》说出奔，《谷梁传》按杀弟解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>克者何？能也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“克”是什么意思？是“能够”的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何能也？能杀也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">能够做什么呢？能够杀死段。这是《谷梁传》对“克”的解释，不能与《左传》的“出奔”混为同一种记载。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何以不言杀？见（xiàn）段之有徒众也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么不直接写“杀”，而写“克”？是为了显示段拥有一批追随者。“见”是显示；“徒众”是部众。段已有势力，需要动用力量击败他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>段，郑伯弟也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">段是郑庄公的弟弟。“伯”是爵位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何以知其为弟也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">怎么知道段是郑庄公的弟弟呢？这里讨论的是如何从简短经文判断二人的关系。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>杀世子、母弟目君；以其目君，知其为弟也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按《谷梁传》理解的记事规则，杀世子或同母弟弟，要明确点出国君；这里明确写“郑伯”，所以知道段是他的弟弟。“母弟”是同母弟弟；“目君”是明确指称国君，让他直接承担责任。这是传文的解释方法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>段，弟也，而弗（fú）谓弟；公子也，而弗谓公子，贬之也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">段是国君的弟弟，却不称“弟”；是先君的儿子，却不称“公子”，是在贬斥他。“弗”是不。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>段失子弟之道矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">段已经违背做儿子、做弟弟应有的道理。这里批评他争权作乱的行为。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>贱段而甚郑伯也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">经文既贬斥段，又更严厉地责备郑庄公。“贱”是贬低；“甚”是深责、严厉谴责，已收入词表。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何甚乎郑伯？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么严厉责备郑庄公呢？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>甚郑伯之处（chǔ）心积虑，成于杀也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因为郑庄公长期存心谋划，最终要达到杀死弟弟的目的。“处心积虑”带贬义。按传文及旧注，他没有及早约束、教导，而是放任弟弟发展罪过，最后除掉他。这属于传文对人物动机的判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于鄢，远也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“在鄢地”，说明段已经逃得很远。《谷梁传》认为特意写地点，是突出段退走后仍遭追赶。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>犹曰取之其母之怀中，而杀之云尔，甚之也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这就像说，从母亲怀里把他抓出来杀掉，是在严厉谴责郑庄公。这是比喻，强调同母骨肉之亲，不是说段真的躲在母亲怀里。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>然则为郑伯者，宜奈何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">既然如此，郑庄公应该怎样处理呢？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>缓追，逸贼，亲亲之道也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">放慢追赶，让作乱者逃走，才是亲爱亲人的做法。“逸”是使他逃脱，放一条生路；“贼”指作乱的段；“亲亲”是亲爱亲人。本文主张解除叛乱威胁后，不必赶尽杀绝。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读提示\u003c/summary>\n\u003cp class=\"translation\">段作乱有罪，庄公是否也曾放任事情恶化，是本篇追问的问题。但“处心积虑”是《谷梁传》的动机判断，不能直接当成已独立证实的心理事实。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/穀梁傳/鄭伯克段于鄢\" target=\"_blank\" rel=\"noopener\">《谷梁传·郑伯克段于鄢》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.shidianguji.com/book/NA00011/chapter/1mgp8una9ujo3\" target=\"_blank\" rel=\"noopener\">《春秋谷梁注疏》卷一\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-16", "volume": 3, "volume_title": "卷三 · 周文", "number": 16, "title": "虞师晋师灭夏阳", "file": "卷三/16-虞师晋师灭夏阳.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《虞（yú）师晋师灭夏阳》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第16篇\u003cbr>选自《谷梁传·僖公二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公想攻打虢国，谋臣荀息建议用宝玉、良马换取虞国借道。虞、虢两国相互依存，宫之奇反对借道，虞公却没有听从；本文借解释《春秋》的记事用语追述此事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞师、晋师灭夏阳。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞国和晋国的军队攻陷夏阳。“师”是军队；夏阳是城邑。这一句是《春秋》经文，以下是《谷梁传》的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>非国而曰灭，重夏阳也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏阳不是国家，却用“灭”字记载，是为了突出它的重要性。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞无师，其曰师，何也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按《谷梁传》的称谓规则，虞国这样的国家，其军队通常不称“师”，这里为什么称“虞师”？不是说它实际上没有军队。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以其先晋，不可以不言师也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因为经文把虞国列在晋国前面，所以也要使用“师”这个称谓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其先晋，何也？为主乎灭夏阳也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么把虞国列在前面？是要突出它在攻灭夏阳这件事上的主要责任，不是说军事实力更强。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夏阳者，虞、虢（guó）之塞（sài）邑也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏阳是关系到虞、虢两国安全的要塞城邑。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>灭夏阳，而虞、虢举矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏阳被攻陷，虞、虢两国也就面临被攻取的命运。“举”是攻取，不是说两国当天同时灭亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞之为主乎灭夏阳，何也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">为什么要把虞国看作主要责任者呢？下面讲事情经过。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋献公欲伐虢，荀（xún）息曰：“君何不以屈（qū）产之乘（shèng）、垂棘之璧（bì），而借道乎虞也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公想攻打虢国，荀息说：“您为什么不用屈地的良马、垂棘的宝玉作礼物，向虞国借路呢？”荀息是晋国大夫。“乘”指四匹马；“璧”是玉器；“借道”是请对方允许军队过境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“此晋国之宝也。如受吾币，而不借吾道，则如之何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">献公说：“这些都是晋国的宝物。如果虞国收了礼，却不肯借路，那怎么办？”“币”是礼物。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>荀息曰：“此小国之所以事大国也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">荀息说：“这样的宝物，本来是小国用来侍奉大国的。”他的意思是，小国反而接受大国重礼，就不能不有所回报。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“彼不借吾道，必不敢受吾币。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“它如果不肯借路，就一定不敢收我们的礼物。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“如受吾币而借吾道，则是我取之中府而藏之外府，取之中厩（jiù）而置之外厩也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果它收礼并借路，那不过是把宝玉从宫内库房移到外面库房，把良马从宫内马棚移到外面马棚罢了！”荀息已经把虞国看成可以吞并的地方，宝物将来还会取回。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“宫之奇存焉，必不使受之也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">献公说：“虞国还有宫之奇，他一定不会让虞公收礼。”宫之奇是虞国大夫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>荀息曰：“宫之奇之为人也，达心而懦（nuò）；又少（shào）长（zhǎng）于君。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">荀息说：“宫之奇明白事理，却性格软弱，又是从小与虞公一起长大的。”“达心”是心思通达、看得明白。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“达心，则其言略；懦，则不能强（qiǎng）谏；少长于君，则君轻之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因为自己明白，所以说话简略；因为软弱，所以不能坚持强硬地劝谏；因为从小熟识，所以国君反而不重视他。”这是荀息对宫之奇的判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“且夫玩好（hào）在耳目之前，而患在一国之后，此中知（zhì）以上乃能虑之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且宝物的享受就在眼前，祸患却关系到整个国家以后的命运，只有中等智慧以上的人才能考虑到。”“玩好”是珍贵赏玩物；“知”通“智”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“臣料虞君中知以下也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我估计虞公的智慧还在中等以下。”荀息认为他会被眼前利益吸引。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公遂借道而伐虢。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是献公依计借道伐虢。这句先概括结果，后面再补述经过。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宫之奇谏曰：“晋国之使者，其辞卑而币重，必不便于虞。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇劝谏：“晋国使者言辞谦卑，礼物却很贵重，这件事一定对虞国不利。”“便”是有利。强国反常地谦卑、送重礼，必有所图。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞公弗（fú）听，遂受其币，而借之道。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞公不听劝，接受礼物，允许晋军过境。“弗”是不。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宫之奇又谏曰：“语曰：‘唇亡则齿寒。’其斯之谓与（yú）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇再劝：“俗话说，嘴唇没有了，牙齿就会受寒，说的不正是现在这种情况吗？”虢国如唇，虞国如齿，灭虢也会失去自己的屏障。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>挈（qiè）其妻子以奔曹。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇带着妻子和儿女，逃往曹国。“挈”是带领；“妻子”指妻子和孩子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>献公亡虢，五年，而后举虞。\u003c/strong>\u003c/p>\n\u003cp c
