<script>const DATA=[{"id": "v01-01", "volume": 1, "volume_title": "卷一 · 周文", "number": 1, "title": "郑伯克段于鄢", "file": "卷一/01-郑伯克段于鄢.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《郑伯克段于鄢（yān）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·隐公元年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋初年，郑庄公与弟弟共叔段因继承、封邑和权力发生冲突，母亲武姜偏爱共叔段。本文记述庄公击败弟弟、与母亲决裂又和好的经过，末尾附有《左传》叙述者的伦理评价。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>初，郑武公娶于申，曰武姜，生庄公及共叔段。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">起初，郑武公娶申国女子为妻，称武姜，生下庄公和共叔段。“共叔段”是段后来奔往共地后形成的称呼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄公寤（wù）生，惊姜氏，故名曰寤（wù）生，遂恶（wù）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公出生时出现“寤生”的情况，使姜氏受到惊吓，因此取名寤生，她也由此厌恶他。“寤生”旧注解释有分歧，通常理解为难产，不宜直接断言某一种具体产状。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>爱共叔段，欲立之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">武姜疼爱共叔段，想立他为继承人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>亟（qì）请于武公，公弗许。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">她多次向郑武公请求，武公没有答应。“亟”在这里是屡次。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及庄公即位，为之请制。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">等庄公即位，武姜替共叔段请求把制地作为封邑。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“制，岩邑也，虢叔死焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“制是个险要的城邑，虢叔曾死在那里。”这里以虢叔的遭遇说明制地不宜封给弟弟。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>佗邑唯命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至于其他地方，我都听您的安排。”“佗”同“他”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>请京，使居之，谓之京城大叔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">武姜请求京邑，庄公让段住在那里，人们称他为京城大叔。“大叔”即太叔。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>祭仲（zhài zhòng）曰：“都城过百雉（zhì），国之害也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">大夫祭仲说：“封邑的城墙超过一百雉，就会成为国都的祸害。”“雉”是古代计量城墙的单位，“国”在这里指国都。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>先王之制：大都不过参（sān）国之一，中五之一，小九之一。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“先王的制度规定：大城不得超过国都的三分之一，中等城不得超过五分之一，小城不得超过九分之一。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今京不度，非制也，君将不堪。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在京邑不合规定的尺度，不符制度，您将承受不了它带来的威胁。”“堪”是承受。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“姜氏欲之，焉辟（bì）害？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“这是姜氏想要的，我怎么能避开这种祸害呢？”“辟”通“避”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“姜氏何厌之有！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">祭仲回答：“姜氏哪里会满足呢！”“何厌之有”即“有何厌”，“厌”是满足。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不如早为之所，无使滋蔓，蔓难图也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不如早作处置，不要让他的势力滋长蔓延；蔓延开了，就难以对付。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>蔓草犹不可除，况君之宠弟乎！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“蔓延的野草尚且难以除掉，何况是您受宠的弟弟呢！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“多行不义，必自毙，子姑待之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“不义的事干多了，必定自己倒台，您姑且等着看。”“毙”在这里指倒下、败亡，并非明确说死亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既而大叔命西鄙北鄙贰于己。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">不久，太叔命令西部和北部边邑，在服从庄公之外也服从自己。“贰”指两属。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公子吕曰：“国不堪贰，君将若之何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">公子吕说：“一个国家不能承受两个统治中心，您准备怎么办？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>欲与大叔，臣请事之；若弗与，则请除之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果打算把国家给太叔，请允许我去侍奉他；如果不给，就请除掉他。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>无生民心。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不要让百姓产生二心。”“无”通“毋”，表示禁止。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“无庸，将自及。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“不用这样，他将自己招来灾祸。”“无庸”是不必；“及”承上文，指灾祸临身。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大叔又收贰以为己邑，至于廪（lǐn）延。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">太叔又把两属的边邑全部收为自己的领地，一直扩展到廪延。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子封曰：“可矣，厚将得众。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子封说：“可以行动了，土地扩大将使他得到更多民众。”子封就是前面的公子吕。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“不义，不暱（nì），厚将崩。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“做事不义，民众就不会亲近；地盘再大，也将崩溃。”“暱”是亲近。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大叔完聚，缮甲兵，具卒乘（zú shèng），将袭郑。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">太叔修整城防、聚集物资，修治铠甲兵器，备齐步兵和战车，准备偷袭郑国国都。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫人将启之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">武姜准备替他打开城门。“夫人”指武姜。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公闻其期，曰：“可矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公得知袭击日期，说：“现在可以了！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>命子封帅车二百乘（èr bǎi shèng）以伐京。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他命子封率领二百乘战车讨伐京邑。“乘”是计战车的单位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>京叛大叔段，段入于鄢（yān），公伐诸鄢（yān）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">京邑的人背叛太叔段，段退到鄢地，庄公又到鄢讨伐他。“诸鄢”即“之于鄢”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>五月辛丑，大叔出奔共。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">五月辛丑日，太叔逃奔共地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>书曰：“郑伯克段于鄢（yān）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">《春秋》记载：“郑伯在鄢地战胜段。”“书”在这里引出《春秋》的记载。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>段不弟，故不言弟；如二君，故曰克；称郑伯，讥失教也；谓之郑志。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">段不尽弟弟的本分，所以不称他“弟”；双方像两个国君相争，所以用“克”；称庄公为“郑伯”，是批评他没有尽到教导弟弟的责任；事情发展到这一步，正合庄公的意愿。这是《左传》对《春秋》措辞的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不言出奔，难之也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">没有写段“出奔”，是因为这种写法有难以直说之处。旧注多从段蓄意夺国、庄公也有责任来理解，不能把这一句当成额外的事件记录。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂寘（zhì）姜氏于城颍，而誓之曰：“不及黄泉，无相见也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公于是把姜氏安置在城颍，并发誓说：“不到地下黄泉，决不相见。”黄泉在这里指地下泉水，也借指死后。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既而悔之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">不久，庄公又后悔了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>颍考叔为颍谷封人，闻之，有献于公，公赐之食，食舍肉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">颍考叔任颍谷管理疆界的官员，听说此事，便向庄公进献东西；庄公赐他饭食，他吃饭时却留下肉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公问之，对曰：“小人有母，皆尝小人之食矣，未尝君之羹（gēng），请以遗（wèi）之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公问原因，颍考叔回答：“小人有母亲，她都吃过我的食物，却没有尝过国君的肉羹，请让我带回去给她。”“遗”是赠送。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“尔有母遗（wèi），繄（yī）我独无！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“你有母亲可以赠送，唉，偏偏我没有！”“繄”是感叹语；庄公并非说母亲已死，而是感叹自己不能与她往来。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>颍考叔曰：“敢问何谓也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">颍考叔说：“冒昧请问，您这话是什么意思？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公语之故，且告之悔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公告诉他原委，又告诉他自己已经后悔。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“君何患焉？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">颍考叔回答：“您担心什么呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若阙（jué）地及泉，隧而相见，其谁曰不然？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果挖地挖到泉水，修成地道再相见，谁能说这不合您的誓言？”“阙”是挖掘，“隧”在这里指通过地道。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公从之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公听从了他的建议。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公入而赋：“大隧之中，其乐也融融！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公进入地道，作诗说：“在大地道中相见，多么和乐融洽！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>姜出而赋：“大隧之外，其乐也泄泄（yì yì）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">武姜走出地道，作诗说：“在大地道之外，多么舒畅快乐！”“泄泄”在这里读yì yì，形容和乐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂为母子如初。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是母子恢复了原来的关系。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君子曰：“颍考叔，纯孝也，爱其母，施（yì）及庄公。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文中的“君子”评论说：“颍考叔是一片纯孝，他爱自己的母亲，又把这种心意推及庄公。”这是叙述者的赞语。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《诗》曰：‘孝子不匮（kuì），永锡尔类。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗经》说：‘孝子的孝心没有穷尽，长久地把善行施及你的同类。’”“锡”通“赐”，“类”指同类的人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其是之谓乎！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“说的大概就是这种情况吧！”\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">本文同时写了段的扩张和庄公的等待。“多行不义必自毙”是庄公在叙事中的话；庄公是否早有完整设局，仍需区分原文写明的举动与读者对动机的推断。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-02", "volume": 1, "volume_title": "卷一 · 周文", "number": 2, "title": "周郑交质", "file": "卷一/02-周郑交质.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《周郑交质（zhì）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·隐公三年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋初年，郑国国君兼任周王室卿士，周平王又想任用虢国国君，周郑关系因此紧张。双方交换王子为人质，仍未能阻止冲突，文章继而讨论信任能否靠人质维持。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郑武公、庄公为平王卿士。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑武公、郑庄公先后担任周平王的卿士，即王室执政大臣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王贰于虢（guó），郑伯怨王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周平王又想把权力分给虢公，郑庄公因此怨恨平王。“贰”是分属两方，并非说平王投靠另一个国家。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王曰：“无之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">平王说：“没有这回事。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故周郑交质（zhì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是周王室和郑国交换人质，作为互信的保证。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王子狐为质（zhì）于郑，郑公子忽为质（zhì）于周。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">王子狐到郑国做人质，郑国公子忽到周王室做人质。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王崩，周人将畀（bì）虢（guó）公政。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">平王去世后，周王室准备把政事交给虢公。“畀”是给予。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>四月，郑祭足（zhài zú）帅师取温之麦。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">四月，郑国大夫祭足率军夺取温地的麦子。祭足即祭仲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秋，又取成周之禾。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秋天，又夺取成周的禾谷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>周郑交恶。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周王室和郑国彼此交恶。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君子曰：“信不由中，质（zhì）无益也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文中的“君子”评论说：“信任若不发自内心，交换人质也没有用。”“中”通“衷”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>明恕而行，要之以礼，虽无有质（zhì），谁能间（jiàn）之？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以明察和体谅来行事，以礼约束彼此，即使没有人质，谁能离间双方呢？”“间”是离间。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>苟有明信，涧溪沼沚（zhǐ）之毛，苹蘩（fán）蕴藻之菜，筐筥（jǔ）锜（qí）釜之器，潢（huáng）污行潦（lǎo）之水，可荐于鬼神，可羞于王公，而况君子结二国之信，行之以礼，又焉用质（zhì）？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果真有明确的诚信，即使是山涧溪流、池沼沙洲上的草，苹、蘩、蕴藻等水菜，竹筐竹筥和锜釜等普通器具，积水坑洼中的水，也能用来祭祀鬼神、进献王公；何况君子缔结两国的信任，又按礼实行，哪里还用得着人质？”“毛”是草木；“荐”“羞”都是进献。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《风》有《采蘩（fán）》、《采苹》，《雅》有《行苇》、《泂（jiǒng）酌》，昭忠信也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗经》的《国风》中有《采蘩》《采苹》，《雅》中有《行苇》《泂酌》，都是彰明忠信的诗篇。”这是评论者援引诗篇来说明祭品的价值在诚意，而不只在贵重。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-03", "volume": 1, "volume_title": "卷一 · 周文", "number": 3, "title": "石碏谏宠州吁", "file": "卷一/03-石碏谏宠州吁.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《石碏（què）谏宠州吁（xū）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·隐公三年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋初年，卫庄公偏宠公子州吁，却不约束他好兵的行为。大夫石碏从教子、继承和君臣家族秩序出发进谏，庄公没有接受。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>卫庄公娶于齐东宫得臣之妹，曰庄姜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">卫庄公娶齐国太子得臣的妹妹为妻，称庄姜。“东宫”指太子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>美而无子，卫人所为赋《硕人》也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄姜容貌美丽，却没有儿子，卫国人为她作了《硕人》这首诗。这是本文对诗作缘起的说法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>又娶于陈，曰厉妫（guī）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公又娶陈国女子为妻，称厉妫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>生孝伯，蚤死。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">厉妫生下孝伯，孝伯很早就死了。“蚤”通“早”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其娣（dì）戴妫（guī）生桓公，庄姜以为己子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">厉妫的妹妹戴妫生下后来的卫桓公，庄姜把他当作自己的儿子。“娣”指随姐姐出嫁的妹妹。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公子州吁（xū），嬖（bì）人之子也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">公子州吁是庄公宠妾所生的儿子。“嬖人”指受宠的姬妾。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有宠而好兵（hào bīng），公弗禁，庄姜恶（wù）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">州吁受宠，又喜爱军事，庄公不加禁止，庄姜对此厌恶。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>石碏（què）谏曰：“臣闻爱子，教之以义方，弗纳于邪。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">石碏劝谏说：“我听说，爱孩子就要用合乎道义的准则教育他，不让他走入邪路。”“义方”是正当的准则。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>骄奢淫佚（yì），所自邪也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“骄傲、奢侈、放纵、安逸，是走向邪路的根由。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>四者之来，宠禄过也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这四种毛病的产生，是因为宠爱和禄赏过了头。”“禄”在这里指禄位、待遇。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>将立州吁（xū），乃定之矣；若犹未也，阶之为祸。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果打算立州吁，就把名分确定下来；如果还不打算立，这种无度的宠爱就会成为祸患的阶梯。”“阶”指导致祸患的途径。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫宠而不骄，骄而能降，降而不憾，憾而能眕（zhěn）者，鲜（xiǎn）矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“受宠却不骄纵，骄纵了却肯降低自己，降低自己却不怨恨，怨恨了还能自我安重，这样的人很少。”“眕”指克制、安重，“鲜”是少。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>且夫贱妨贵，少陵长（shào líng zhǎng），远间（jiàn）亲，新间（jiàn）旧，小加大，淫破义，所谓六逆也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“地位低的妨害地位高的，年幼的凌越年长的，疏远的离间亲近的，新来者离间旧人，小的凌驾大的，淫乱破坏道义，这就是所谓六种逆行。”这里反映的是说话者所维护的宗法等级秩序。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君义，臣行，父慈，子孝，兄爱，弟敬，所谓六顺也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“国君行义，臣子奉行职责，父亲慈爱，儿子孝顺，兄长友爱，弟弟恭敬，这就是所谓六种顺行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>去顺效逆，所以速祸也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“舍弃顺行而效法逆行，就是招致祸患的办法。”“速”是招致，不是快速。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君人者，将祸是务去，而速之，无乃不可乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“做国君的，本该专心除去祸患，却反而把祸患招来，恐怕不可以吧！”“将祸是务去”即务求除祸。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>弗听。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">卫庄公没有听从。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其子厚与州吁（xū）游，禁之，不可。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">石碏的儿子石厚与州吁交往，石碏禁止他，却没有成功。“不可”在这里指儿子不肯听。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>桓公立，乃老。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">卫桓公即位后，石碏便告老退职。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">“六逆”“六顺”是文本中的政治伦理判断，不等同于现代平等观念。本篇写到石碏退职为止，州吁弑君等后事不属于本篇正文。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-04", "volume": 1, "volume_title": "卷一 · 周文", "number": 4, "title": "臧僖伯谏观鱼", "file": "卷一/04-臧僖伯谏观鱼.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《臧（zāng）僖（xī）伯谏观鱼》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·隐公五年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前718年，鲁隐公准备到棠地观看捕鱼。大夫臧僖伯以国君的职责、军事训练与礼制为由劝阻，隐公仍然前往。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>春，公将如棠观鱼者。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">春天，鲁隐公准备到棠地观看捕鱼的人捕鱼。“公”指鲁隐公，“如”是前往。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臧（zāng）僖（xī）伯谏曰：“凡物不足以讲大事，其材不足以备器用，则君不举焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">臧僖伯劝谏说：“凡是不能用来演习国家大事、材料又不能备作礼器军器的东西，国君就不应为它采取行动。”“讲”是演习，“举”是出动、举行相关活动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君将纳民于轨物者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“国君应当引导百姓遵守规范制度。”这里的“轨物”合指制度与器物等级的规范。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故讲事以度轨量，谓之‘轨’；取材以章物采，谓之‘物’。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以，演习事务，用以衡量法度尺度，叫作‘轨’；取用材料，以彰明器物的色彩纹饰，叫作‘物’。”他是在分别解释行为规范和器物规范。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不轨不物，谓之乱政。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“行为不合法度，器物不合规范，就叫扰乱政事。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乱政亟（qì）行，所以败也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“扰乱政事的行为屡次发生，便会导致败亡。”“亟”是屡次。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故春搜、夏苗、秋狝（xiǎn）、冬狩，皆于农隙以讲事也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此春天的搜猎、夏天的苗猎、秋天的狝猎、冬天的狩猎，都是利用农闲来演习军事。”这些是四季田猎的不同名称。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>三年而治兵，入而振旅，归而饮至，以数军实（shǔ jūn shí）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“每隔三年整治军队，归来整顿队伍，回到宗庙举行饮酒告至之礼，清点军队的人员装备。”“振旅”是整顿归师，“饮至”是归来后的告庙饮酒礼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昭文章，明贵贱，辨等列，顺少长（shào zhǎng），习威仪也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“显示服饰旗帜的纹采，分明贵贱，辨别等级，使少长有序，这是在练习威仪。”这是文本所认可的礼制功能。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>鸟兽之肉不登于俎（zǔ），皮革、齿牙、骨角、毛羽不登于器，则君不射，古之制也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“鸟兽的肉若不能登上祭桌，皮革、牙齿、骨角、羽毛又不能制成器用，国君就不亲自射猎，这是古代制度。”“俎”是盛放祭肉的礼器。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若夫山林川泽之实，器用之资，皂隶（zào lì）之事，官司之守，非君所及也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至于山林河泽的物产、制作日用器具的材料，那是役人办的事务、主管官员的职责，不是国君该亲自过问的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“吾将略地焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">隐公说：“我是要到那里巡视土地。”“略地”在这里指巡视疆土。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂往，陈鱼而观之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是前往，让人陈列捕鱼的设施或所捕之鱼来观看。“陈鱼”的具体所指有不同解释，均与本次观鱼有关。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>僖（xī）伯称疾不从。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">臧僖伯称病，没有随行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>书曰：“公矢鱼于棠。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">《春秋》记载：“鲁公在棠地陈设观鱼。”“矢”旧注多释为陈设。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>非礼也，且言远地也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这样写是批评不合礼，并且点明棠地离国都较远。后一句是《左传》对《春秋》措辞的说明。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-05", "volume": 1, "volume_title": "卷一 · 周文", "number": 5, "title": "郑庄公戒饬守臣", "file": "卷一/05-郑庄公戒饬守臣.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《郑庄公戒饬（jiè chì）守臣》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·隐公十一年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前712年，鲁隐公与齐、郑联军攻下许国，许庄公出奔。郑庄公随后安排许国旧臣和郑国官员分守许地，本文保存了他对两方的告诫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秋七月，公会齐侯、郑伯伐许。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秋天七月，鲁隐公与齐僖公、郑庄公会合，攻打许国。“公”指鲁隐公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庚辰，傅（fù）于许。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庚辰日，联军迫近许国城下。“傅”是靠近、迫近。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>颍（yǐng）考叔取郑伯之旗蝥弧（máo hú）以先登，子都自下射之，颠。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">颍考叔拿着郑庄公名为“蝥弧”的旗帜率先登城，子都从下方向他放箭，他从城上跌落。“颠”是坠落；子都是郑国大夫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>瑕叔盈又以蝥弧（máo hú）登，周麾（huī）而呼曰：“君登矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国大夫瑕叔盈又拿着蝥弧旗登城，向四面挥旗呼喊：“国君登城了！”“麾”是挥动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郑师毕登。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑军全都登上了城墙。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>壬午，遂入许。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">壬午日，终于攻入许国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许庄公奔卫。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">许庄公逃往卫国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯以许让公。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐侯把许国让给鲁隐公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“君谓许不共（gōng），故从君讨之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁隐公说：“您认为许国不履行贡职，所以我跟随您来讨伐它。”“共”通“供”，指供奉职贡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许既伏其罪矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“许国已经承认自己的罪过了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虽君有命，寡人弗敢与闻（yù wén）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“即使您有这样的命令，我也不敢参与接受许国的安排。”“与闻”是参与其事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乃与郑人。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是把许国交给郑国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郑伯使许大夫百里奉许叔以居许东偏，曰：“天祸许国，鬼神实不逞于许君，而假手于我寡人，寡人唯是一二父兄不能共（gōng）亿（yì），其敢以许自为功乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑庄公让许国大夫百里辅佐许叔住在许地东部，说：“上天降祸许国，鬼神确实对许君不满，借我的手惩罚他；我连本国几位父兄的心愿都不能供给安抚，哪里敢把攻许当作自己的功劳？”许叔是许庄公之弟；“共亿”是供给、安定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>寡人有弟，不能和协，而使糊其口于四方，其况能久有许乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我有个弟弟，不能与他和睦相处，竟使他流落四方糊口，更何况能长久占有许国呢？”他指共叔段出奔一事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾子其奉许叔以抚柔此民也，吾将使获也佐吾子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您要辅佐许叔安抚这里的人民，我将让公孙获帮助您。”“抚柔”是安抚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若寡人得没（mò）于地，天其以礼悔祸于许，无宁兹许公复奉其社稷，唯我郑国之有请谒焉，如旧昏媾（hūn gòu），其能降以相从也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果我能够安然死去，上天也依礼改变降祸许国的做法，不妨让这位许君重新奉守社稷；若郑国向许国有所请求，希望仍像原有的婚姻亲国那样，肯降低身段与我们相从。”“无宁”在这里是宁可、不妨；“昏媾”即婚姻关系。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>无滋他族实逼处此，以与我郑国争此土也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不要让其他族姓势力在这里滋长、逼近居住，来与郑国争夺这块地方。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾子孙其覆亡之不暇，而况能禋（yīn）祀许乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“否则我的子孙挽救自己的覆亡尚且来不及，哪里还能祭祀、照顾许国的社稷？”“禋祀”是祭祀。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>寡人之使吾子处此，不惟许国之为，亦聊以固吾圉（yǔ）也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我让您留在这里，不只为了许国，也是姑且巩固我们郑国的边疆。”“圉”是边境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乃使公孙获处许西偏，曰：“凡而器用财贿，无置于许。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公又让公孙获驻在许地西部，告诫说：“凡是你的器具、财货，都不要安放在许国。”“而”通“尔”，是你。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我死，乃亟（jí）去之！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我一死，你就赶快离开！”这里的“亟”是赶紧。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾先君新邑于此，王室而既卑矣，周之子孙日失其序。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们的先君才不久在这里建立国都，周王室却已经衰弱，周人的后裔日渐失去应有的秩序和地位。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫许，大岳之胤（yìn）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“许国是大岳的后代。”“胤”是后嗣；这里以许国的古老世系说明它未必会轻易消亡。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>天而既厌周德矣，吾其能与许争乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果上天已经厌弃周人的德行，我们哪里还能与许国争夺呢？”这是庄公从天命和族姓关系出发的说法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君子谓郑庄公“于是乎有礼。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文中的“君子”认为：“郑庄公在这件事上是合礼的。”以下是《左传》评论，不是庄公自己的话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>礼，经国家，定社稷，序民人，利后嗣者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“礼是用来治理国家、安定社稷、安排人民秩序、有利后代的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许，无刑而伐之，服而舍之，度德而处之，量力而行之，相时而动，无累后人，可谓知礼矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“许国无法度，就攻打它；它服从了，就放过它；衡量德行来安排它，估量力量来行动，审察时势而动，不给后人留下负担，可以说懂得礼了。”\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">本篇“君子”赞许的是文中所述的处置方式。读者仍可讨论郑庄公兼顾许国与郑国的盘算，但不能把现代推测直接写成他的内心独白。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-06", "volume": 1, "volume_title": "卷一 · 周文", "number": 6, "title": "臧哀伯谏纳郜鼎", "file": "卷一/06-臧哀伯谏纳郜鼎.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《臧（zāng）哀伯谏纳郜（gào）鼎》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·桓公二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前710年，鲁桓公得到宋国送来的郜国大鼎，并将它放入太庙。臧哀伯认为这件器物与不义的政治交易有关，以礼器应当彰明德行而非公开受赂为由进谏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夏四月，取郜（gào）大鼎于宋，纳于大庙（tài miào），非礼也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏天四月，鲁国从宋国取得郜国的大鼎，放进太庙，这不合礼。“大庙”即太庙，是国君祖庙；“非礼”是叙述者的判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臧（zāng）哀伯谏曰：“君人者，将昭德塞违，以临照百官；犹惧或失之，故昭令德以示子孙。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">臧哀伯劝谏说：“做国君的，应当彰明德行、堵塞违背法度的行为，以此示范百官；即使这样，还担心有所失误，所以又把美德显示出来，传示子孙。”“令德”是美德。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是以清庙茅屋，大路越席（huó xí），大羹（tài gēng）不致，粢食（zī sì）不凿（bù zuò），昭其俭也；衮（gǔn）冕黻（fú）珽（tǐng），带裳幅（bī）舄（xì），衡紞（dǎn）纮（hóng）綖（yán），昭其度也；藻率（zǎo lǜ）鞞（bǐng）鞛（běng），鞶（pán）厉游缨，昭其数也；火龙黼（fǔ）黻（fú），昭其文也；五色比象，昭其物也；钖（yáng）鸾和铃，昭其声也；三辰旂（qí）旗，昭其明也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此，清庙屋顶以茅草为饰，祭天车上铺草席，肉羹不加调味，祭粮不精凿，用以显示俭约；衮衣、礼冠、蔽膝、玉笏，以及带、裳、绑腿、复底鞋和冠上的各种饰物，用以显示制度；玉藉、刀鞘饰、带饰、旗末与马缨，用以显示等数；火、龙、黼、黻等纹样，用以显示文饰；五种色彩依物取象，用以显示物色；马车旗帜上的各种铃铛，用以显示声节；旗上绘日月星辰，用以显示光明。”这一长句逐项说明礼制如何通过具体器物表现出来，“文”是纹饰，“数”是等级数量的规定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫德，俭而有度，登降有数。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓德，就是俭约而有制度，增减升降都有定数。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>文物以纪之，声明以发之，以临照百官，百官于是乎戒惧，而不敢易纪律。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以纹饰物色维系它，以声音光采显扬它，用来示范百官；百官因此警戒畏惧，不敢改变纲纪法度。”“声明”在这里是声音与光明，不是现代的公开声明。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今灭德立违，而置其赂器于大庙（tài miào），以明示百官。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在却泯灭德行、树立违礼之事，把受贿得来的器物放在太庙，明明白白展示给百官看。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>百官象之，其又何诛焉？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“百官效法您，再发生这种事，您又能责备谁呢？”“象”是效法，“诛”在这里是责备。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>国家之败，由官邪也；官之失德，宠赂章也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“国家的败坏来自官员邪行；官员失德，是由于受宠和收受贿赂的风气公开显露。”“章”通“彰”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郜（gào）鼎在庙，章孰甚焉？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“郜鼎放在祖庙里，还有什么比这更显眼呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>武王克商，迁九鼎于雒（luò）邑，义士犹或非之，而况将昭违乱之赂器于大庙（tài miào）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“周武王灭商，把九鼎迁到雒邑，尚且有义士批评；何况要把这种显露违礼乱政的受赂之器放进太庙！”这里借武王作比较，并非把两个事件判为完全相同。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其若之何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这该怎么办呢？”这是劝桓公正视后果。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公不听。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁桓公没有听从。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>周内史闻之，曰：“臧（zāng）孙达其有后于鲁乎！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周王室的内史听说后，说：“臧孙达在鲁国大概会有后代延续吧！”臧孙达就是臧哀伯，“其”表示推测。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君违，不忘谏之以德。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“国君有违失，他不忘用德行来劝谏。”这是内史对臧哀伯的评价。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">原文中的器物名较密集，其共同作用是说明礼制的可见规范。“大羹不致”指不调和滋味；“粢食不凿”指谷物不精舂。本文的道德评价属于叙述者和人物的判断，读者可以结合宋国内乱的背景继续讨论。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-07", "volume": 1, "volume_title": "卷一 · 周文", "number": 7, "title": "季梁谏追楚师", "file": "卷一/07-季梁谏追楚师.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《季梁谏追楚师》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·桓公六年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前706年，楚武王侵入随国，故意向随国使者示弱，想诱使对方轻敌。随国大夫季梁阻止追击，并把能否御敌归结到政事和民心上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚武王侵随，使薳（wěi）章求成焉，军于瑕以待之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚武王侵犯随国，派薳章求和，楚军驻在瑕地等候消息。“成”是讲和。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>随人使少师董成。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">随国派少师主持议和。“董”是主持、督理。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>斗伯比（dòu bó bǐ）言于楚子曰：“吾不得志于汉东也，我则使然。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国大夫斗伯比对楚王说：“我们不能在汉水以东得志，是我们自己的做法造成的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我张吾三军而被（pī）吾甲兵，以武临之，彼则惧而协以谋我，故难（nàn）间（jiàn）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们铺开三军、披戴铠甲，以武力压过去，对方就害怕，联合谋划对付我们，因此很难离间他们。”“被”通“披”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>汉东之国，随为大。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“汉水以东的国家，随国最大。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>随张，必弃小国。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“随国如果自大，就一定会抛弃小国。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>小国离，楚之利也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“小国与随国离心，对楚国便有利。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>少师侈，请羸（léi）师以张之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“少师骄纵自大，请把军队装成疲弱的样子，助长他的骄傲。”“羸师”指示弱于敌。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>熊率且比（lǜ jū bǐ）曰:“季梁在，何益？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国大夫熊率且比说：“有季梁在，这样做有什么用呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>斗伯比（dòu bó bǐ）曰:“以为后图。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">斗伯比说：“为以后的行动作打算。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>少师得其君。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“少师很得他的国君信任。”意思是仍可通过少师影响随侯。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王毁军而纳少师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚王于是撤坏军容，用残弱的面貌接待少师。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>少师归，请追楚师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">少师回国，请求追击楚军。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>随侯将许之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">随侯准备答应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>季梁止之曰：“天方授楚。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季梁阻止说：“上天正把有利的形势交给楚国。”这是季梁对时势的判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚之羸（léi），其诱我也，君何急焉？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“楚军装得疲弱，是在引诱我们，您何必急于出战呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臣闻小之能敌大也，小道大淫。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说，小国能够抵御大国，是由于小国有道、大国放纵。”“道”“淫”分别指政治得当与失度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>所谓道，忠于民而信于神也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓有道，就是对百姓尽心、对神明守信。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>上思利民，忠也；祝史正辞，信也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“在上位的人想着使百姓受益，就是忠；主管祭祀的祝史如实陈说，就是信。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今民馁（něi）而君逞欲，祝史矫举以祭，臣不知其可也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在百姓饥饿，您却放纵欲望；祝史虚报功德来祭祀，我不知道这样怎么行。”“馁”是饥饿，“矫举”指虚饰夸说。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“吾牲牷（quán）肥腯（tú），粢盛（zī chéng）丰备，何则不信？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">随侯说：“我的祭牲完整而肥壮，祭粮丰足齐备，怎么就不诚信呢？”“牷”指牲体完整，“腯”是肥壮。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“夫民，神之主也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季梁回答：“百姓才是神明所依凭的根本。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是以圣王先成民，而后致力于神。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以圣明的君王先使人民生活安定，然后才致力于祭神。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故奉牲以告曰‘博硕肥腯（tú）。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此，献祭牲时祝告‘广厚硕大、肥壮丰足’。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谓民力之普存也，谓其畜之硕大蕃滋也，谓其不疾瘯蠡（cù luǒ）也，谓其备腯（tú）咸有也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“是说民力普遍得到保存，牲畜肥大繁殖，没有瘯蠡一类的疾病，各种牲畜都完备肥壮。”这说明祭牲的好坏应有民生作基础。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>奉盛以告曰：‘洁粢丰盛。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“献祭粮时祝告‘洁净的粢粮、丰足的祭品’。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谓其三时不害而民和年丰也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“是说春夏秋三季的农事没有受到妨害，百姓和睦、年成丰收。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>奉酒醴（lǐ）以告曰：‘嘉栗旨酒。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“奉献酒醴时祝告‘美好清洁的美酒’。”“栗”在这里通洁。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谓其上下皆有嘉德而无违心也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“是说上下都有美好的德行，没有彼此违背的心意。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>所谓馨香，无谗慝（chán tè）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所谓祭品馨香，就是没有谗言与邪恶。”“慝”是邪恶。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故务其三时，修其五教，亲其九族，以致其禋（yīn）祀。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以应当专心于三季农事，修明五种人伦教化，使九族亲睦，以此举行诚敬的祭祀。”“禋祀”是祭祀。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是乎民和而神降之福，故动则有成。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这样百姓和睦，神才降福，所以有所行动就能成功。”这是季梁所提出的民事与祭祀关系。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今民各有心，而鬼神乏主，君虽独丰，其何福之有？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在百姓各怀心思，鬼神失去依凭，您即使独自享用丰盛的祭品，又会有什么福呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君姑修政而亲兄弟之国，庶免于难（nàn）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您姑且整治政事，与兄弟之国亲善，或许能够免于灾难。”“姑”是暂且，“庶”是或许、希望。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>随侯惧而修政，楚不敢伐。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">随侯感到警惧，修明政事，楚国便不敢攻打。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">“民，神之主”没有否定神明，而是把祭祀是否有效与百姓的生活、政治状况联系起来。天命、降福等说法应放在文中人物的思想框架里理解。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-08", "volume": 1, "volume_title": "卷一 · 周文", "number": 8, "title": "曹刿论战", "file": "卷一/08-曹刿论战.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《曹刿（guì）论战》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·庄公十年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前684年，齐国攻打鲁国，鲁庄公准备迎战。曹刿请求参与，从战前的政治条件、战中的士气和追击时机三个方面提出判断。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>十年春，齐师伐我。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁庄公十年春天，齐军攻打鲁国。“我”是《左传》所依据的鲁国叙事立场。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公将战。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁庄公准备迎战。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曹刿（guì）请见。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿请求进见。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其乡人曰：“肉食者谋之，又何间（jiàn）焉？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">同乡对他说：“那些吃肉的在位者会谋划，你何必参与呢？”“肉食者”借指享有禄位的人，“间”是参与。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>刿（guì）曰：“肉食者鄙，未能远谋。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿说：“在位者见识浅陋，不能作长远打算。”“鄙”是鄙陋，不是边境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>乃入见。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是进入宫中见庄公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>问：“何以战？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿问：“您凭什么作战？”“何以”即“以何”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“衣食所安，弗敢专也，必以分人。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“使生活安适的衣食，我不敢独占，一定拿来分给别人。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“小惠未遍，民弗从也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿回答：“小恩惠没有普遍施及，百姓不会因此跟从您。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“牺牲（xī shēng）玉帛（bó），弗敢加也，必以信。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“祭祀用的牲畜、玉器和丝帛，我不敢虚夸，必定如实禀告。”“加”是夸大。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“小信未孚（fú），神弗福也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿回答：“小小的诚信还不足以使神信服，神不会因此赐福。”“孚”是使信服。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“小大之狱，虽不能察，必以情。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公说：“大大小小的诉讼案件，虽不能一一明察，也必定按实际情况处理。”“狱”是案件，“情”是实情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“忠之属也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿回答：“这是尽心为民的一类事情。”这里“忠”是尽心尽职。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>可以一战。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“凭这一点，可以打一仗。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>战则请从。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“作战时，请让我随行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公与之乘，战于长勺。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公与曹刿同乘一辆战车，在长勺与齐军交战。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公将鼓之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公准备击鼓进军。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>刿（guì）曰：“未可。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿说：“还不行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐人三鼓。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐军三次击鼓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>刿（guì）曰：“可矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿说：“可以了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐师败绩。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐军大败。“败绩”指军队溃败。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公将驰之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">庄公准备驱车追击。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>刿（guì）曰：“未可。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿说：“还不行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>下视其辙（zhé），登轼（shì）而望之，曰：“可矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他下车察看齐军车轮留下的痕迹，又登上车前横木远望，说：“可以了。”“轼”是车前横木。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂逐齐师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是追击齐军。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既克，公问其故。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">战胜以后，庄公问他这样做的缘故。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“夫战，勇气也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">曹刿回答：“作战，靠的是勇气。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>一鼓作气，再而衰，三而竭。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“第一次击鼓能振起勇气，第二次就衰减，第三次便耗尽了。”“再”是第二次。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>彼竭我盈，故克之，夫大国，难测也，惧有伏焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“对方的勇气已经衰竭，我们的正充足，所以战胜了他们；至于齐这样的大国，难以测度，我怕它有埋伏。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾视其辙（zhé）乱，望其旗靡（mǐ），故逐之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我见他们的车辙混乱、旗帜倒伏，才决定追击。”“靡”是倒下。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">文中没有给出双方兵力、伤亡等数字，不宜自行补成精确战况。“一鼓作气”也不是任何战争都应等待敌人三次进攻的固定公式，而是曹刿对当时士气和阵形的判断。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-09", "volume": 1, "volume_title": "卷一 · 周文", "number": 9, "title": "齐桓公伐楚盟屈完", "file": "卷一/09-齐桓公伐楚盟屈完.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《齐桓（huán）公伐楚盟屈（qū）完》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公四年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">齐桓公率领诸侯联军进攻蔡国，随后攻打楚国。楚国派使者交涉，后来又派大夫屈完前往联军营中，双方最终订立盟约。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>春，齐侯以诸侯之师侵蔡。蔡溃，遂伐楚。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">春天，齐桓公率领诸侯各国的军队进攻蔡国。蔡国军队溃败，联军于是接着攻打楚国。“齐侯”是齐桓公；“以”是率领；“师”是军队。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚子使与师言曰：“君处北海，寡人处南海，唯是风马牛不相及也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚成王派使者到联军中交涉，说：“您住在北方，我住在南方，我们相隔很远，即使牛马走失，也不会跑到对方境内。”这里的“楚子”指楚成王，按周王朝的爵位称他为“子”；使者用“寡人”，是在转述楚王的话。“风马牛不相及”强调双方相距遥远、互不相干，其中“风”的具体解释有不同说法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不虞（yú）君之涉吾地也，何故？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“没想到您竟然进入了我国的土地，这是为什么？”“虞”是预料；“涉”是进入。楚方开口就要求齐国说明出兵的理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>管仲对曰：“昔召（shào）康公命我先君大（tài）公曰：‘五侯九伯，女（rǔ）实征之，以夹辅周室。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">管仲回答：“从前，召康公曾命令我国先君齐太公说：‘各地诸侯，你确实可以征讨他们，来辅佐周王室。’”管仲是齐桓公的重要辅臣；召康公就是召公奭。“大公”即齐太公姜尚，“大”读 tài；“女”同“汝”，是“你”；“五侯九伯”泛指各地诸侯；“夹辅”是辅佐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“赐我先君履（lǚ），东至于海，西至于河，南至于穆陵，北至于无棣（dì）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“还授予我国先君征讨所能到达的范围：东到大海，西到黄河，南到穆陵，北到无棣。”这里的“履”指可以践履、到达的范围，结合上文，是征讨权限所及的地域，并不是说这些地方全是齐国的领土。“河”指黄河。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“尔贡苞（bāo）茅不入，王祭不共（gōng），无以缩酒，寡人是征。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你们应当进贡的成束茅草没有送来，使周天子的祭祀用品供应不足，无法进行缩酒之礼，我就是为这件事来责问你们的。”苞茅是祭祀所用的成束茅草；“共”同“供”；“缩酒”指用茅草渗滤祭酒的一种礼仪。“寡人是征”就是“寡人征是”，意思是“我所责问的正是这件事”。管仲此时代表齐桓公说话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昭王南征而不复，寡人是问。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“周昭王向南出征，没有回来，我也要追问这件事。”“复”是返回。“寡人是问”也是把所追问的事情提前说，即“我问的就是这件事”。这里是齐方提出的指责，不能据此就认定楚国应对昭王之死负责。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“贡之不入，寡君之罪也，敢不共（gōng）给（jǐ）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国使者回答：“贡品没有送到，是我国国君的过错，怎么敢不供应呢？”“寡君”是使者对本国国君的谦称；“敢不”是反问，表示愿意照办。楚方承认了没有进贡的责任。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昭王之不复，君其问诸水滨（bīn）！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至于昭王没有回来，您还是到水边去问吧！”“其”在这里带有劝说语气；“诸”相当于“之于”，即“到……去问这件事”；“水滨”是水边。这句话借昭王死于水中的说法，挡回齐方的责问：这件事不能让楚国来承担。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>师进，次于陉（xíng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">联军继续前进，驻扎在陉这个地方。“次”在这里是军队驻扎。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夏，楚子使屈（qū）完如师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏天，楚成王派大夫屈完前往联军营中。“如”是前往；“师”指诸侯联军。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>师退，次于召（shào）陵。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">联军后退，驻扎在召陵。原文记载了退军，但没有直接说明退军的具体原因。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯陈诸侯之师，与屈完乘（chéng）而观之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐桓公把诸侯的军队排列起来，和屈完同乘一辆战车，观看军阵。“陈”是排列、布阵；“之”指排列起来的联军。从后面的对话看，这次观看军阵也带有展示军力的意味。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯曰：“岂不穀（gǔ）是为（wèi）？先君之好（hǎo）是继，与不穀同好（hǎo）何如？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐桓公说：“难道我这样做，只是为了我自己吗？我是要继承先君之间的友好关系。与你们继续友好相处，怎么样？”“不穀”是诸侯的谦称，意思是“不善之人”；“岂不穀是为”即“岂为不穀”，是“难道为了我自己”；“先君之好是继”即“继先君之好”，是继承前代国君的友好关系。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“君惠徼（jiǎo）福于敝（bì）邑之社稷（jì），辱收寡君，寡君之愿也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">屈完回答：“您惠临我国，为我国社稷求福，又承蒙您接纳我国国君，这正是我国国君的愿望。”“徼福”是求福；“敝邑”是对本国的谦称；“社稷”本指土地神和谷神，这里也代表国家；“辱收”是谦敬说法，意思是承蒙接纳。屈完顺着齐桓公提出的友好关系，以礼貌措辞回应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯曰：“以此众战，谁能御（yù）之？以此攻城，何城不克？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐桓公说：“用这么多军队作战，谁能抵挡？用这些军队攻城，什么城攻不下来？”“众”指众多兵力；“御”是抵挡；“克”是攻克。这时，他把话题转到了军事实力上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“君若以德绥（suí）诸侯，谁敢不服？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">屈完回答：“您如果凭德行安抚诸侯，谁敢不服从呢？”“绥”是安抚、使之安定。屈完先承认以德服人的正当性，也给齐桓公留出了体面的余地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君若以力，楚国方城以为城，汉水以为池；虽众，无所用之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您如果要靠武力，楚国可以把方城当作城墙，把汉水当作护城河；您的军队虽然多，也没有施展的地方。”方城是楚国北部的防御屏障；“池”在这里是护城河。“方城以为城”即“以方城为城”。屈完的意思是：楚国有地势和防御条件可凭借，不会仅仅因为联军人多就屈服。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>屈完及诸侯盟。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">屈完代表楚国，与诸侯订立盟约。“及”是“与”；“盟”在这里作动词，指订立盟约。全文以双方会盟结束。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与应答方式\u003c/p>\n\u003cp class=\"translation\">题目的意思是：齐桓公攻打楚国，与楚国大夫屈完订立盟约。\u003c/p>\n\u003cp class=\"translation\">读这篇，可以留意双方怎样接话：楚方承认没有进贡，却挡回昭王之死的责问；屈完接受友好提议，却不接受武力威胁。他说话始终有礼，同时把楚国的立场守得很清楚。\u003c/p>\n\u003cp class=\"translation\">### 齐桓公为什么没有继续进兵？仅凭屈完几句话就退军了吗？\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>原文记载：\u003c/strong>按原文顺序，齐军先退到召陵，然后才有那段著名对话。“夏，楚子使屈完如师。师退，次于召陵。”在前，齐桓公展示军阵、屈完谈方城汉水在后。因此，不能说齐桓公听了“虽众，无所用之”，才决定退军。屈完到来后，双方已经开始转向谈判；此前具体谈过什么，原文没有记载。\u003c/p>\n\u003cp class=\"translation\">齐方公开追究没有进贡苞茅、昭王南征不归两件事。楚方承认前一项，答应供应贡品；对后一项拒绝承担责任，最后又派大夫与诸侯结盟。完整盟约还有什么条件，这段文字没有写。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>结合记载的分析：\u003c/strong>如果齐桓公的目的在于迫使楚国作出让步、展示领导诸侯的能力，取得这些成果就有理由收兵，未必必须攻入楚国腹地才算成功。不过，也不能断言他从一开始就完全没有继续进攻的打算。\u003c/p>\n\u003cp class=\"translation\">攻破蔡国不等于能够轻松打败楚国。屈完谈方城、汉水，有外交夸张，不能把“无所用之”当作客观军事结论；它表达的抵抗立场却很清楚。继续进攻能多获得多少利益、要付出多少代价，是齐桓公必须考虑的。现有记载不足以判定齐军一定打不赢，也不能证明它能轻松取胜。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>篇外记载及其限度：\u003c/strong>《左传》紧接着记载，陈国大夫辕涛涂担心大军返程经过陈、郑，会使两国“甚病”。这说明联军行军牵涉沿途国家的供给和利益；但这是会盟后的返程讨论，只能帮助理解战争成本，不能直接当作退兵原因。\u003c/p>\n\u003cp class=\"translation\">更符合这段记载的理解是：双方以军事实力为后盾，谈出了彼此能够接受的结果。屈完的辞令表达了立场，不能把整个战争的收束都归功于口才。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/齐桓公伐楚盟屈完\" target=\"_blank\" rel=\"noopener\">《齐桓公伐楚盟屈完》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ctext.org/chun-qiu-zuo-zhuan/xi-gong-si-nian/zhs\" target=\"_blank\" rel=\"noopener\">《左传·僖公四年》\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v01-10", "volume": 1, "volume_title": "卷一 · 周文", "number": 10, "title": "宫之奇谏假道", "file": "卷一/10-宫之奇谏假道.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《宫之奇谏（jiàn）假（jiǎ）道》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公五年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋献公再次向虞国借路，准备攻打虢国。虞国大夫宫之奇认为虞、虢相互依存，劝虞公不要同意借道。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋侯复假（jiǎ）道于虞（yú）以伐虢（guó）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋献公再次向虞国借路，准备攻打虢国。“晋侯”指晋献公；“复”是再次；“假”是借。虞、虢是两个邻近的小国。这个“复”字说明，虞国此前已经允许晋军借道。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宫之奇谏曰：“虢，虞之表也；虢亡，虞必从之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞国大夫宫之奇劝谏说：“虢国是虞国的外围屏障；虢国灭亡，虞国必定跟着灭亡。”“表”是外部屏障；“从之”是跟随它遭受同样的命运。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“晋不可启，寇不可翫（wán），一之为甚，其可再乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不能给晋国开启侵略的机会，不能轻忽这个敌人。借路一次已经很过分了，难道还可以再来一次吗？”“启”在这里是给对方开路、助长其图谋；“寇”指入侵者；“翫”同“玩”，这里是轻视、不认真防备。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“谚（yàn）所谓‘辅车（chē）相依，唇亡齿寒’者，其虞、虢之谓也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“俗话说，面颊和牙床相互依靠，嘴唇没有了，牙齿就会受寒，说的正是虞国和虢国这样的关系。”“辅”指面颊；“车”指牙床。宫之奇用身体各部分的关系说明：帮助晋国消灭虢国，也是在毁掉虞国自己的保护。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“晋，吾宗也，岂害我哉？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞公说：“晋国与我们同宗，怎么会伤害我呢？”这里的“公”是虞国国君。晋、虞两国国君都是姬姓，所以虞公认为，同宗关系可以保障自己的安全。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“大（tài）伯、虞仲，大（tài）王之昭（zhāo）也；大伯不从，是以不嗣（sì）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇回答：“太伯和虞仲，是周太王的儿子，属于太王下一代的昭位。太伯没有顺从太王的意愿，因此没有继承君位。”“大伯”“大王”分别就是太伯、太王，“大”读 tài；“嗣”是继承。至于“不从”具体指什么，历来解释有差异，这里先按没有顺从太王意愿理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虢仲、虢叔，王季之穆（mù）也；为文王卿（qīng）士，勋在王室，藏于盟府。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虢仲、虢叔是王季的儿子，属于穆位；他们做过周文王的卿士，对周王室有功，功勋的记载保存在盟府中。”王季是太王的儿子、文王的父亲；虢仲、虢叔是文王的弟弟。“卿士”是高级官员；“盟府”是保存盟约等文书的官府。“昭”“穆”是宗庙中交替安排的世代次序，不是人的名字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“将虢是灭，何爱于虞？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“晋国连虢国都准备消灭，又怎么会爱惜虞国呢？”“将虢是灭”就是“将灭虢”，把“虢”提前强调。宫之奇是在指出：虢国同样出自周王室，而且祖先有功；同宗身份并不能阻止晋国进攻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“且虞能亲于桓、庄乎？其爱之也，桓、庄之族何罪？而以为戮（lù），不唯偪（bī）乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“再说，虞国与晋献公的关系，能比桓叔、庄伯的后代更亲近吗？如果晋献公爱惜他们，那么这些族人有什么罪，竟然遭到杀戮？不就是因为他们的势力威胁到了他吗？”桓叔、庄伯分别是晋献公的曾祖父和祖父，他们的后代是献公的近亲。“偪”同“逼”，这里指形成威胁。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“亲以宠偪，犹尚害之，况以国乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至亲因为地位和势力造成威胁，他尚且要加害，何况虞国还拥有一个国家呢？”“宠”指受到尊宠所带来的地位、权势。宫之奇认为，连近亲都不能免遭杀害，虞公更不能指望远一些的同宗关系保全国家。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“吾享祀（sì）丰絜（jié），神必据我。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞公说：“我祭祀时，供品丰盛而洁净，神灵一定会保佑我。”“享祀”是祭祀；“絜”是洁净；“据”在这里是依靠、扶持。虞公又把安全的希望寄托在神灵身上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“臣闻之，鬼神非人实亲，惟德是依。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇回答：“我听说，鬼神并不是固定亲近某个人，而只依从有德的人。”“非人实亲”强调神灵不会因为某人的身份就偏爱他；“惟德是依”就是只依从有德者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“故《周书》曰：‘皇天无亲，惟德是辅。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以《周书》说：‘上天没有私自偏爱的亲近者，只辅助有德的人。’”“皇天”是对上天的尊称；“辅”是辅助、扶持。这里的《周书》指《尚书》中有关周代的篇章。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“又曰：‘黍（shǔ）稷（jì）非馨（xīn），明德惟馨。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“又说：‘黍稷这些祭品，并不是真正的芳香；美好的德行，才是真正的芳香。’”黍、稷是祭祀所用的谷物；“馨”是芳香。意思是，神灵看重的是人的德行，供品丰盛还不够。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“又曰：‘民不易物，惟德繄（yī）物。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“又说：‘人们献上的祭品并没有什么不同，神灵所享用的，却是有德者献上的祭品。’”“易”是改变；“物”指祭品；“繄”是语助词。这句话进一步强调：决定祭祀是否被接受的，是献祭者的德行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“如是，则非德，民不和，神不享矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“照这样说，如果没有德行，百姓就不会和睦，神灵也就不会享用他的祭品了。”“享”在这里是享用、接受祭祀。宫之奇把德行、百姓的状态和祭祀联系在一起。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“神所冯（píng）依，将在德矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“神灵所凭依的，应当就在于德行了。”“冯”同“凭”，读 píng。也就是说，不能仅凭祭品丰盛，就断定神灵必定保佑自己。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若晋取虞，而明德以荐馨香，神其吐之乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果晋国夺取了虞国，又修明德行，献上芳香的祭品，神灵难道会拒绝吗？”“荐”是进献；“吐”是吐弃、不接受。这是假设性的反问，并不是断言晋国一定有德。宫之奇要说明：虞公不能指望神灵只接受自己的供奉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>弗（fú）听，许晋使（shǐ）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">虞公不听宫之奇的劝谏，答应了晋国使者借道的请求。“弗”是不；“许”是答应；“使”指使者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宫之奇以其族行，曰：“虞不腊（là）矣。在此行也，晋不更（gēng）举矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宫之奇带着自己的族人离开，说：“虞国等不到年终举行腊祭了。就在晋军这一次行动中，虞国就会灭亡，晋国不需要再次出兵了。”“以”是率领；“腊”指年终祭祀；“更举”是再次发动军事行动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>冬，晋灭虢。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">冬天，晋国灭掉了虢国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>师还（huán），馆于虞，遂袭虞，灭之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋军返回时，驻扎在虞国，随即突然袭击虞国，把它也灭掉了。“馆”在这里是住宿、驻扎；“袭”是突然进攻。事情的发展，正应了宫之奇此前所说的“晋不更举”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>执虞公。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋军俘虏了虞公。“执”是捉拿、俘获。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与两次劝谏\u003c/p>\n\u003cp class=\"translation\">“假道”是借路；题目意思是：宫之奇劝谏虞国国君，不要借路给晋国攻打虢国。\u003c/p>\n\u003cp class=\"translation\">这篇可以留意虞公两次回答的变化：先相信“同宗不会害我”，再相信“神灵一定保佑我”。宫之奇则始终要求他面对实际处境：虢国是自己的屏障，晋国已经杀过近亲，而丰盛的祭品也不能代替治理和防备。\u003c/p>\n\u003cp class=\"translation\">以上是对文中论证的分析；文中有关鬼神与德行的说法，属于宫之奇用来劝谏虞公的论述。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://www.donglishuzhai.net/chapter/364.html\" target=\"_blank\" rel=\"noopener\">《古文观止·宫之奇谏假道》原文及旧注\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://doosho.com/cn/47/1/10\" target=\"_blank\" rel=\"noopener\">对照选本文字\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v01-11", "volume": 1, "volume_title": "卷一 · 周文", "number": 11, "title": "齐桓公下拜受胙", "file": "卷一/11-齐桓公下拜受胙.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《齐桓（huán）公下拜受胙（zuò）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公九年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">齐桓公与诸侯在葵丘会盟，周襄王派宰孔赐给他祭肉。天子准许齐桓公不必下阶行礼，他仍坚持下拜后再接受赏赐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>会于葵（kuí）丘，寻盟，且修好（hǎo），礼也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">诸侯在葵丘相会，重申原来的盟约，并增进友好关系，这是合乎礼的。“寻”在这里是重温、重申；“修好”是维持和增进友好关系。“礼也”是《左传》叙述者对这次会盟的评价。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王使宰（zǎi）孔赐齐侯胙（zuò），曰：“天子有事于文、武，使孔赐伯舅胙。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周襄王派宰孔赐给齐桓公祭肉。宰孔说：“天子祭祀了文王、武王，派我来赐给伯舅祭肉。”“宰”是官名，“孔”是人名；“有事”在这里指举行祭祀；“文、武”是周文王、周武王。“伯舅”是周天子对异姓诸侯的尊称，齐国国君姓姜，周王室姓姬。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯将下拜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐桓公准备走下堂上的台阶，行拜礼，感谢天子的赏赐。“下拜”包含两个动作：先下台阶，再行拜礼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>孔曰：“且有后命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宰孔说：“还有后面的命令。”意思是请齐桓公暂缓行礼，听完天子的另一个吩咐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“天子使孔曰：‘以伯舅耋（dié）老，加劳，赐一级，无下拜！’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“天子派我来时说：‘因为伯舅年事已高，加上对王室有功劳，特给予提高一等的礼遇，不必下台阶行拜礼！’”“耋老”指年老；“劳”是功劳；“级”是等级。这里的“赐一级”，结合后面的“无下拜”，是给予特殊礼遇，不宜直接理解为晋升一级官职。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“天威不违颜咫（zhǐ）尺。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐桓公回答：“天子的威严就在我的面前，近在咫尺。”“违”在这里是离开；“颜”是面容；“咫尺”形容距离很近。他的意思是：虽然天子没有亲自在场，自己仍像面对天子一样敬畏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“小白余敢贪天子之命‘无下拜’？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我小白怎么敢贪享天子所赐‘不必下拜’的特殊恩宠呢？”小白是齐桓公的名字；“余”是我。他自称名字，表示谦恭。“敢”在这里是反问，即“怎么敢”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“恐陨（yǔn）越于下，以遗（wèi）天子羞。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我怕自己仗着天子的优待，失了应有的礼数，反而让天子蒙羞。”“陨越”本义是颠坠、坠落，也可比喻失职、失败；这里结合上下文，可理解为担心自己失礼、辜负天子的优待。“遗”读 wèi，是给予、留下。古注从“颠坠”解释，此处保留其与“失礼、失职”解释的联系；“于下”宜连同全句理解，不单独断定为“臣属地位”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“敢不下拜？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我怎么敢不走下台阶行拜礼呢？”他坚持按照通常的礼节，表达对天子的敬意。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>下，拜；登，受。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">于是，齐桓公走下台阶，行拜礼；然后登上堂，接受祭肉。四个字写出四个连续动作，简洁地呈现了他坚持行礼的过程。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意\u003c/p>\n\u003cp class=\"translation\">“胙”是祭祀用过的肉；题目意思是：齐桓公走下台阶行拜礼，接受周天子赐予的祭肉。旧讲解标题作《齐桓下拜受胙》，此处沿用仓库目录的《齐桓公下拜受胙》，两者为同一篇。\u003c/p>\n\u003cp class=\"translation\">### “恐陨越于下”怎样理解？\u003c/p>\n\u003cp class=\"translation\">本会话最初把它解释成“恐怕失礼获罪，以致败落”，并把“于下”直接解释为臣属地位；后一次回答撤回了对“于下”的确定解释。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>古注与词义：\u003c/strong>古注把“陨越”解释为“颠坠”；词典也收录比喻失败、失职的意思。因此，从“坠落”引申到“败落”的解释有根据，但不必把这里具体断定为丢掉君位。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>结合上下文的白话理解：\u003c/strong>“我怕自己仗着天子的优待，失了应有的礼数，反而让天子蒙羞。”可以类比为受到长辈优待时所说：“您体谅我，可以不行礼，但我不能因此不懂规矩，让您也跟着难堪。”\u003c/p>\n\u003cp class=\"translation\">这种译法侧重表达整句话的意思，不是把每个字机械对应。“于下”宜连起来理解，不必逐字硬套；本会话也未将“担心下台阶时摔倒”作为采用的解释。\u003c/p>\n\u003cp class=\"translation\">### 坚持行礼有什么政治意义？\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>原文记载：\u003c/strong>天子准许免礼，齐桓公仍坚持行礼。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>分析判断：\u003c/strong>这也可以理解为齐桓公在诸侯面前公开尊奉周王室。他以实际行动维护天子的名分，也使自己领导诸侯的地位与周王室的权威相连接。不过，这是对其政治作用的分析，原文没有直接交代他的内心动机。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://www.donglishuzhai.net/chapter/365.html\" target=\"_blank\" rel=\"noopener\">《古文观止·齐桓下拜受胙》原文及旧注\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zdic.net/hans/陨越\" target=\"_blank\" rel=\"noopener\">汉典“陨越”\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v01-12", "volume": 1, "volume_title": "卷一 · 周文", "number": 12, "title": "阴饴甥对秦伯", "file": "卷一/12-阴饴甥对秦伯.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《阴饴（yí）甥（shēng）对秦伯》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公十五年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">秦晋在韩原交战，晋国战败，晋惠公被秦国俘虏。晋国大夫阴饴甥此次出使，关系到秦国是否释放晋惠公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>十月，晋阴饴（yí）甥（shēng）会秦伯，盟于王城。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">十月，晋国大夫阴饴甥会见秦穆公，在王城订立盟约。“秦伯”指秦穆公，按爵位称他为“伯”；“盟”是订立盟约。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秦伯曰：“晋国和乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦穆公问：“晋国内部和睦吗？”也就是问：晋国战败、国君被俘以后，国内的人意见是否一致。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“不和。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">阴饴甥回答：“不一致。”他接下来说明，晋国人对如何处理秦晋关系，有两种不同主张。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“小人耻失其君，而悼（dào）丧（sàng）其亲，不惮（dàn）征缮（shàn），以立圉（yǔ）也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“有些人以国君被俘为耻，又为亲人在战争中死去而悲痛。他们不怕征收赋税、整修军备，准备拥立太子圉为国君。”“耻”是以……为耻；“悼”是悲痛；“征缮”指征收赋税、整治军备；圉是晋惠公的太子。\u003c/p>\n\u003cp class=\"translation\">这里的“小人”“君子”，传统注解常分别解释为庶民和在位者；在这番外交辞令中，又分别承载了主张报仇与主张报德的两种声音，不宜直接套成今天所说的“坏人”和“好人”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“曰：‘必报仇，宁事戎（róng）狄（dí）。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他们说：‘一定要报仇，宁可去侍奉戎狄，也不愿向秦国低头。’”戎、狄是当时对一些族群的称呼。“事”是侍奉，在这里指依附、服从。“不愿向秦国低头”是结合上下文补出的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君子爱其君，而知其罪，不惮征缮，以待秦命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“另一些人爱护自己的国君，也知道他有过错。他们同样不怕征收赋税、整治军备，等待秦国的决定。”“其罪”指晋惠公对秦国的失信与过错；“待秦命”是等待秦国如何处理晋惠公。\u003c/p>\n\u003cp class=\"translation\">值得留意的是，两派都在准备军备，只是对秦国采取什么态度不同。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“曰：‘必报德，有死无二。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他们说：‘一定要报答秦国的恩德，即使死也不怀二心。’”“无二”是没有二心。结合这次出使的目的，这番话也在表示：如果秦国释放晋君，晋国愿意报恩。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“以此不和。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因为这些意见不同，所以说国内不一致。”阴饴甥所说的“不和”，主要是对秦政策存在分歧，并没有说晋国已经陷入内乱。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秦伯曰：“国谓君何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦穆公问：“晋国人怎样看待你们国君的处境？”“国”指国内的人；“君”指被俘的晋惠公。具体来说，秦穆公是在问：他们认为晋惠公还能不能回国？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“小人戚（qī），谓之不免；君子恕（shù），以为必归。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">阴饴甥回答：“小人忧虑，认为国君不能免于灾祸；君子推己及人，认为国君一定会回来。”“戚”是忧愁；“恕”在这里是推己及人，设想秦国也会按照情理行事。“不免”不必限定为一定被杀，可以理解为难以免祸、难以获释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“小人曰：‘我毒秦，秦岂归君？’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“小人说：‘我们伤害过秦国，秦国怎么会放国君回来呢？’”“毒”是伤害、使对方受害；“归君”是让国君回国，“归”在这里有使……返回的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君子曰：‘我知罪矣，秦必归君。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“君子说：‘我们已经承认过错了，秦国一定会让国君回来。’”这句话把晋国的认错与秦国应当释放晋君联系起来。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“贰（èr）而执之，服而舍（shě）之，德莫厚焉，刑莫威焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“对怀有二心、背弃秦国的人，就把他抓起来；对已经认错服从的人，就把他释放。没有比这样更深厚的恩德，也没有比这样更有威力的惩罚了。”“贰”是怀有二心、背叛；“执”是捉拿；“服”是服罪、服从；“舍”是释放。\u003c/p>\n\u003cp class=\"translation\">阴饴甥的意思是：俘获晋惠公已经显示了秦国惩罚背信者的力量，现在释放认错的晋惠公，又可以显示秦国的恩德。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“服者怀德，贰者畏刑。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“服从的人会感念秦国的恩德，怀有二心的人会畏惧秦国的惩罚。”“怀”是感念；“畏”是害怕。这样，秦国既能使人愿意归附，也能使人不敢背叛。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“此一役也，秦可以霸。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“凭这一次战争，秦国就可以树立霸主的威望。”“役”指此次军事行动；“霸”指成为诸侯的霸主。这是阴饴甥用来劝说秦穆公的话，不能当作秦国已因这一战成为霸主的事实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“纳而不定，废而不立，以德为怨，秦不其然。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“当初帮助我们的国君回国即位，如今却不让他的君位安定；如今把他俘虏，使他不能执政，却不把他放回去，恢复他的君位；这样会把从前的恩德变成怨仇。我想秦国不会这样做。”\u003c/p>\n\u003cp class=\"translation\">“纳”指秦国此前帮助晋惠公回国即位；“定”是使其地位安定；“废”在这里指俘虏晋君，使他不能在位执政；“立”依《古文观止》原注，指让晋惠公恢复君位，并非另立新君。“以德为怨”是把原有的恩德变成怨恨。“秦不其然”是一种委婉说法：相信秦国不会这么做，其实是在劝秦穆公不要走到这一步。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秦伯曰：“是吾心也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦穆公说：“这正是我的意思。”他表示接受阴饴甥所说的处理方式。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>改馆晋侯，馈（kuì）七牢焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦穆公给晋惠公更换了住所，并赠送七牢的食物。“馆”指居住的地方；“馈”是赠送食物；一牢包括牛、羊、猪各一头。更换住所、给予七牢，表示开始以符合诸侯身份的礼遇接待晋惠公。本文写到待遇改变为止，并未直接写出他的归国过程。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与外交辞令\u003c/p>\n\u003cp class=\"translation\">“对”是回答；题目意思是：晋国大夫阴饴甥回答秦穆公的问话。\u003c/p>\n\u003cp class=\"translation\">这篇最值得留意的是：阴饴甥把两种可能都摆出来——不放晋君，晋国有人准备继续报仇；放回晋君，秦国可以得到感恩与威望。他既承认晋国的过错，也让秦穆公看到，释放晋惠公对秦国同样有利。这是结合对话所作的分析。\u003c/p>\n\u003cp class=\"translation\">### “废而不立”：另立新君不是对晋惠公更不利吗？\u003c/p>\n\u003cp class=\"translation\">本会话初次讲解把“立”解释为另立国君，后经追问，核对《古文观止》原注后改正。原注说：“秦既执晋君，今不归而使之复立为君。”\u003c/p>\n\u003cp class=\"translation\">因此，“立”在所采用的解释中，指让晋惠公恢复君位，并非另立新君。两句合起来可以理解为：“您当初扶他上台，如今又把他抓下来；他已经认错了，您却不让他回去复位，这就把从前的恩德变成了怨仇。”这样就与前面的“服而舍之”衔接起来：既然已经服罪，就应释放，让他重新做国君。\u003c/p>\n\u003cp class=\"translation\">### 晋惠公与晋文公重耳是什么关系？\u003c/p>\n\u003cp class=\"translation\">重耳（chóng ěr）就是晋文公。“重耳”是名字，“文公”是去世后的谥号。刚才被俘的是重耳的弟弟晋惠公夷吾，并非重耳本人。\u003c/p>\n\u003cp class=\"translation\">| 人物 | 与重耳的关系 | 继位或结局 |\u003cbr>| --- | --- | --- |\u003cbr>| 晋献公 | 父亲 | 宠爱骊姬，引发继承危机 |\u003cbr>| 申生 | 哥哥，原太子 | 被陷害，自杀 |\u003cbr>| 奚齐 | 弟弟，骊姬之子 | 献公死后被立，旋即被杀 |\u003cbr>| 卓子 | 弟弟，骊姬妹妹之子 | 接着被立，又被杀 |\u003cbr>| 夷吾，即晋惠公 | 弟弟 | 借秦国帮助回国即位 |\u003cbr>| 圉，即晋怀公 | 侄子，夷吾之子 | 继承父位，后来被重耳取代 |\u003cbr>| 重耳，即晋文公 | — | 秦国支持他回国，即位 |\u003c/p>\n\u003cp class=\"translation\">### 从骊姬之乱到重耳即位\u003c/p>\n\u003cp class=\"translation\">以下是本会话已有的篇外历史补充，主要依《史记·晋世家》和《左传》相关记载整理，不是本文原句直接交代的内容。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>骊姬之乱与出逃。\u003c/strong>晋献公原本立申生为太子，后来宠爱骊姬，想让她的儿子奚齐继位。申生被诬陷后自杀，重耳、夷吾也受到牵连，先回到各自驻地。晋献公派兵攻打重耳，重耳不愿与父亲的军队交战，逃往狄；夷吾后来逃到梁。因此，重耳起初是为避祸保命而逃，并非主动出去游历。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>奚齐、卓子接连被杀。\u003c/strong>前651年，晋献公去世，临终托付大夫荀息扶持奚齐。晋国内有实力强大的反对派，里克是其中的重要人物。里克杀了奚齐；荀息又立卓子，里克再杀卓子，荀息也死了。不能把这一过程笼统说成晋国内所有人都不接受献公的安排。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>重耳拒绝，夷吾争取外援。\u003c/strong>里克等人首先派人迎接重耳。《史记》记载重耳担心被杀，拒绝回国；他对外的说法是自己没有尽到为父亲守丧的责任，不敢回去继位。里克等人于是转而迎接夷吾。夷吾也担心国内局势危险，听从谋臣建议，争取秦国援助，许诺即位后交出河西土地，同时向里克许诺封地。秦国出兵护送，齐国也参与支持，夷吾成为晋惠公。不是按兄弟长幼自然轮到夷吾，而是他争取到了国内支持和外国援助。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>惠公与秦国翻脸。\u003c/strong>按照《史记》的叙述，晋惠公即位后未兑现割地给秦国及封地给里克的承诺，后来逼里克自杀。晋国饥荒时秦国送粮，秦国饥荒时晋国却拒绝供粮，矛盾加深。前645年韩原之战，晋惠公被俘；本文的出使谈判就在这一节点，后来秦穆公确实释放了他。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>重耳继续流亡。\u003c/strong>晋惠公担心重耳被其他国家扶立，派人追杀。重耳离开长期居住的狄，前往齐国，后来辗转经过曹、宋、郑、楚等国，最后到了秦国。他身边一直有狐偃、赵衰等追随者，后来成为晋文公的重要辅臣。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>圉继位，秦国改扶重耳。\u003c/strong>晋惠公后来把太子圉送到秦国做人质，秦穆公将女儿嫁给他。圉听说父亲病重，担心错过继位机会，偷偷逃回晋国。前637年惠公去世，圉继位，为晋怀公。秦穆公对圉擅自逃走不满，转而寻求扶立重耳。怀公命追随重耳的人限期回国，威胁处罚家属，还杀了不肯召回儿子的狐突，加深了国内敌意。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>重耳回国。\u003c/strong>前636年，秦穆公出兵护送重耳进入晋国，晋国内部有人接应。怀公逃到高梁，后来被重耳派人杀死。重耳即位为晋文公，结束约十九年的流亡。这不是简单等弟弟死了再轮到哥哥，而是外国支持与国内力量共同作用的结果。\u003c/p>\n\u003cp class=\"translation\">### 秦国扶重耳即位后，秦晋关系怎样？\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>篇外记载：\u003c/strong>重耳即位后，秦晋起初继续合作，秦国参与晋文公领导的诸侯会盟。前630年，秦穆公、晋文公联合围郑；烛之武向秦穆公说明灭郑主要有利于晋国，秦穆公单独与郑结盟，留下人员帮助守卫郑国后撤军。晋国有人主张攻击秦军，晋文公顾念秦国曾帮助自己，也不愿破坏联盟，没有同意，随后撤军。这是《烛之武退秦师》的背景。\u003c/p>\n\u003cp class=\"translation\">前628年晋文公去世，晋襄公继位。留在郑国的秦方人员报告可以接应秦军偷袭，秦穆公决定远征，蹇叔劝阻未果。前627年秦军袭郑计划未成，灭滑后返回，在崤（xiáo）山遭晋军截击，秦军惨败，孟明视、西乞术、白乙丙三位主将被俘。此后两国反复交战。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>分析判断：\u003c/strong>晋文公在世时已经出现利益分歧，但他仍努力避免翻脸。他去世后，两国争夺东方利益的矛盾迅速激化。“秦晋之好”记住了婚姻关系，历史上的秦晋却既通婚、结盟，也互相作战。\u003c/p>\n\u003cp class=\"translation\">### 重耳既由秦国扶立，为什么没有成为附属？\u003c/p>\n\u003cp class=\"translation\">以下是本会话的政治分析，不是本文原文直接作出的判断。\u003c/p>\n\u003cp class=\"translation\">秦国帮助重耳取得晋国君位，却没有因此取得晋国统治权。能否持续控制重耳，取决于实际能力，并不只取决于恩情。\u003c/p>\n\u003cp class=\"translation\">晋国本来就是强国，重耳缺的是回国夺位的机会；即位后掌握的是晋国自己的土地、赋税、军队和官员，并非此后财政、军事都靠秦国维持。他又有狐偃、赵衰等自己的班底及国内支持，若一味牺牲晋国利益来报恩，也会失去这些支持。秦伯、晋侯在名分上仍是周天子之下的诸侯，扶立不会自动把秦穆公变成晋文公的上级。\u003c/p>\n\u003cp class=\"translation\">秦穆公可能希望得到一个亲秦、有实力的盟友；但“亲秦”应当到什么程度，双方未必有相同期待。不能断言秦穆公原本只想要盟友，也不能断言他一定想把晋国变成附属。重耳即位后，秦国不能轻易随时撤换他，恩情能促成合作，却不能保证服从。\u003c/p>\n\u003cp class=\"translation\">### 里克是否很有正义感？夷吾为何杀他？\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>篇外记载：\u003c/strong>里克在继位斗争中接连杀掉奚齐、卓子，后来帮助夷吾上台，夷吾即位后又逼他自杀。夷吾提出的理由是：里克杀过两位国君、一位大夫，做他的国君很危险。里克反问：“不有所废，君何以兴？”意思是：不废掉他们，你怎么能当上国君？他又指出，想杀自己，并不难找到理由。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>分析判断：\u003c/strong>春秋的大夫往往是拥有军政资源的贵族。里克能够接连改变继承安排，说明他有力量和支持者。他反对骊姬一派，有可以诉诸纠正不公的理由：申生被陷害，重耳、夷吾被迫出逃；但奚齐、卓子本人是否应当为骊姬的阴谋负责，不能混为一谈。反对不公，与杀人改变继承安排的手段是否正当，是两个问题。里克可能兼有维护旧太子一派的立场与自身利益，不能只凭这些行为认定其正义或不义。\u003c/p>\n\u003cp class=\"translation\">夷吾依靠里克清除前面的继承人得以上台，随后又拿这件事当罪名逼他自杀，确有忘恩负义的一面。他担心里克再拥立他人，这个政治顾虑可以理解，却不足以使做法正当。他对秦国求援时许诺割地、即位后不兑现，也有类似表现。这里的道德评价依据上述行为作出，不替代对事件及其政治背景的分析。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/陰飴甥對秦伯\" target=\"_blank\" rel=\"noopener\">《阴饴甥对秦伯》原文\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.donglishuzhai.net/chapter/366.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原注：“废而不立”\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.njmuseum.com/files/wshl/rbbook/gb/25/shiji/sj039.html\" target=\"_blank\" rel=\"noopener\">《史记·晋世家》\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/春秋左氏傳/僖公\" target=\"_blank\" rel=\"noopener\">《左传·僖公》：围郑、晋文公之卒及崤之战\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v01-13", "volume": 1, "volume_title": "卷一 · 周文", "number": 13, "title": "子鱼论战", "file": "卷一/13-子鱼论战.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《子鱼论战》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公二十二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">楚国攻打宋国以救郑，宋襄公决定迎战。宋国司马子鱼认为楚军强而宋军弱，主张抓住渡河与列阵之间的战机；宋襄公两次拒绝，宋军战败。本文随后记下二人关于战场规则的争论。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚人伐宋以救郑，宋公将战。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国攻打宋国，以此援救郑国，宋襄公准备迎战。“伐”，攻打；“以”，来、用来。这里的“宋公”就是宋襄公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大司马固谏（jiàn）曰：“天之弃商久矣，君将兴之，弗（fú）可赦（shè）也已。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">大司马子鱼坚决劝说道：“上天抛弃商朝已经很久了，您还想使它重新兴盛，恐怕不会得到上天的宽恕了。”大司马是主管军事的官职；子鱼名目夷，是宋襄公的庶兄。宋国是商朝后裔的封国，所以他以“商”指宋国承续的事业。“固”，坚决；“兴”，使之兴盛；“弗”，不。这是子鱼借天命表达的劝阻意见。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>弗听。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋襄公没有听从他的劝告。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及楚人战于泓（hóng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋襄公与楚军在泓水交战。“及”，与、和；“于”，在。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宋人既成列，楚人未既济（jì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋军已经排好阵势，楚军还没有全部渡过河。“既”，完毕；“列”，阵列；“济”，渡河。“未既济”，就是还没有渡完。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>司马曰：“彼众我寡（guǎ），及其未既济也，请击之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子鱼说：“敌军人多，我们人少，请趁他们还没有全部渡河，进攻他们。”这里的“及”是趁着。子鱼认为，应当利用楚军渡河、兵力尚未集中的机会出击。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“不可。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋襄公说：“不行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既济，而未成列，又以告。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚军已经全部渡过河，但还没有排好阵势，子鱼又向宋襄公提出出击的建议。“又以告”，省略了宾语，就是又把可以出击的意见报告给他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“未可。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋襄公说：“还不行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既陈（zhèn）而后击之，宋师败绩。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">等楚军排好阵势以后，宋军才发动进攻，结果宋军大败。“陈”，同“阵”，这里指排好阵势；“师”，军队；“败绩”，大败。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公伤股，门官歼（jiān）焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋襄公的大腿受了伤，随身卫士也在这场战斗中被杀尽了。“股”，大腿；“门官”，国君的卫士；“焉”，在这场战斗中。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>国人皆咎（jiù）公。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">国内的人都责怪宋襄公。“咎”，责怪、归罪。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“君子不重（chóng）伤，不禽（qín）二毛。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">宋襄公说：“君子不再次伤害已经受伤的人，不俘虏头发斑白的人。”“重伤”在这里不是伤势严重，而是再次伤害；“禽”，同“擒”，俘虏；“二毛”，黑白相间的头发，指年长者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“古之为军也，不以阻隘（ài）也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“古人用兵，不凭借敌人处在险阻狭窄之地的机会进攻。”“为军”，用兵作战；“阻隘”，险阻狭窄的地形。宋襄公是在援引他所认可的古代作战规矩。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“寡人虽亡国之余，不鼓不成列。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我虽然是亡国之后的后裔，也不进攻没有排好阵势的敌人。”“亡国之余”，指自己是已经灭亡的商朝的后裔；“鼓”，本指击鼓，这里指击鼓进军、发动进攻。宋襄公认为，自己虽然战败，却守住了君子用兵的原则。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子鱼曰：“君未知战。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子鱼说：“您不懂打仗。”这句话直接否定了宋襄公对战争的理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“勍（qíng）敌之人，隘而不列，天赞我也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“强敌的军队受困于狭窄之地，不能排好阵势，这是上天在帮助我们。”“勍”，强大；“赞”，帮助。宋襄公认为这种机会不该利用，子鱼却认为这正是有利战机。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“阻而鼓之，不亦可乎？犹有惧焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“趁他们受阻而进攻，不也是可以的吗？即使这样，我们还担心不能取胜呢！”“阻”，指敌军受到地形阻碍；“鼓之”，击鼓进攻他们；“犹”，尚且。子鱼强调：敌强我弱，即使占据有利条件，也不能保证获胜。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“且今之勍（qíng）者，皆吾敌也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且眼前这些强大的军人，都是我们的敌人。”“且”，况且，表示进一步说明。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽及胡耇（gǒu），获则取之，何有于二毛？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“即使是年纪很大的人，能够俘获，也应当俘获，对于头发斑白的人又有什么可顾忌的呢？”“胡耇”，年老的人；“获则取之”，能够捕获就把他俘虏；“何有于二毛”，是反问为什么要顾惜头发斑白的敌人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“明耻教战，求杀敌也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“使士兵懂得什么是耻辱，教他们作战，就是为了杀敌。”“明耻”，使士兵明白战败受辱是可耻的；“教战”，训练他们作战。子鱼开始从训练军队的目的，反驳宋襄公的“不重伤”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“伤未及死，如何勿重（chóng）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“敌人受了伤，却还没有死，为什么不能再次攻击他呢？”“未及死”，尚未死；“重”，再次伤害。这是子鱼提出的战争主张。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若爱重（chóng）伤，则如勿伤；爱其二毛，则如服焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果怜惜敌人，不忍心再次伤害他，那还不如一开始就不要伤害他；如果顾惜敌人头发斑白，不肯俘虏他，那还不如向他们降服。”“爱”，怜惜；“则如”，这里理解为倒不如；“服焉”，向他们降服。子鱼用两句带有讽刺意味的话，指出宋襄公的做法在他看来前后矛盾。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“三军，以利用也；金鼓，以声气也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“军队要根据有利条件来使用；军中的金鼓，是用来振作声威、鼓舞士气的。”“三军”，泛指军队；“金”，军中金属制成的响器；“声气”，这里指振作军队的声威和士气。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“利而用之，阻隘（ài）可也；声盛致志，鼓儳（chán）可也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“根据有利条件使用军队，那么趁敌人受困于险阻狭窄之处进攻，就是可以的；用盛大的声威激发士兵的战斗意志，那么进攻阵势不整齐的敌人，也是可以的。”“致志”，激发战斗意志；“儳”，参差不齐，这里指阵势不整齐的敌军。子鱼最后总结：作战应当利用有利条件，把握敌军尚未准备好的时机。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">宋襄公坚持“不再次伤害伤者、不俘虏年长者”，子鱼从敌强我弱与作战目的反驳。这是原文记载的两种主张。如何评价战争中的道德约束，不能仅凭宋军战败这一结果下结论；“不伤伤者”与“等敌人列阵才进攻”也可以分别讨论。\u003c/p>\n\u003cp class=\"translation\">原文核对：\u003ca href=\"https://zh.wikisource.org/zh-hans/子魚論戰\" target=\"_blank\" rel=\"noopener\">《左传·僖公二十二年》节录\u003c/a>。\u003c/p>\n\u003c/details>"}, {"id": "v01-14", "volume": 1, "volume_title": "卷一 · 周文", "number": 14, "title": "寺人披见文公", "file": "卷一/14-寺人披见文公.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《寺人披见文公》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公二十四年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋文公重耳刚回国即位，吕甥和郤芮谋划纵火弑君。寺人披过去曾两次奉命追杀重耳，此时请求见他，要报告这个阴谋。文公先责备披，披则以昔日奉命行事和眼前的危机回应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吕、郤（xì）畏偪（bī），将焚公宫而弑（shì）晋侯。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国大臣吕甥和郤芮害怕受到晋文公的逼迫、惩处，准备放火烧国君的宫室，杀死晋文公。“偪”，同“逼”；“弑”，臣下杀死君主。这里的晋侯，就是刚刚回国即位的重耳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>寺人披请见，公使让之，且辞焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">寺人披请求拜见晋文公，文公派人责备他，并拒绝接见。“寺人”，宫中的宦官；“披”，人名；“让”，责备；“辞”，拒绝。披以前曾奉命追杀重耳，所以文公对他怀有旧恨。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“蒲城之役，君命一宿（xiǔ），女（rǔ）即至。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文公让人传话说：“当年蒲城那件事，国君命令你过一夜到达，你却马上就到了。”当时重耳住在蒲城，晋献公派披前去攻打、追杀他。“君”，指晋献公；“女”，同“汝”，你。文公在责怪他：你执行追杀我的命令，未免太积极了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“其后余从狄（dí）君以田渭（wèi）滨，女为（wèi）惠公来求杀余。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“后来，我跟随狄国国君在渭水岸边打猎，你又替晋惠公来追杀我。”“余”，我；“田”，打猎，后来写作“畋”；“滨”，水边。晋惠公就是重耳的弟弟夷吾。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“命女（rǔ）三宿（xiǔ），女中宿（xiǔ）至。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“命令让你过三夜到达，你却第二夜就到了。”“中宿”，指三夜中间的那一夜。文公又翻出第二笔旧账：你还是提前赶来杀我。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽有君命，何其速也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“虽然有国君的命令，你为什么来得那么快呢？”言下之意是：奉命办事可以理解，但你如此急切，难道就没有自己的意思？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫（fú）袪（qū）犹在，女（rǔ）其行乎！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“当年被你砍下的那截衣袖还在，你还是走吧！”“夫”，指示词，那；“袪”，袖口，这里指被砍下的衣袖；“其”，表示劝告、命令的语气。当年重耳逃跑时，披追赶他，砍下了他的衣袖。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“臣谓君之入也，其知之矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">披回答说：“我以为您这次回国即位，应该已经懂得这个道理了。”“入”，指回国即位；“其”，表示推测。至于是什么道理，他接下来才说明。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若犹未也，又将及难（nàn）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果您还不懂，恐怕又将遭遇祸难。”“及”，遭遇。这句话既反驳文公，也暗示：眼下就有一场危险，而您还不知道。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君命无二，古之制也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“执行国君的命令，不能有二心，这是自古以来的制度。”披为自己辩解：当时我奉命行事，就应当忠于当时的国君。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“除君之恶（wù），唯力是视。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“替国君除掉他所厌恶的人，只应当看自己是否尽了全力。”“恶”，指国君厌恶的人；“唯力是视”，就是只看是否竭尽全力。这是披对自己当年行为的解释。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“蒲人狄人，余何有焉？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“至于您当时是住在蒲城的人，还是流亡狄国的人，对我来说又有什么区别呢？”“蒲人”“狄人”，都指当时处于不同境遇的重耳；“余何有焉”，意思是与我有什么私人关系、我何必有所偏向。披强调：我与你没有私仇，只是在执行君命。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今君即位，其无蒲狄乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今您即位了，难道就不会有像您当年在蒲城、狄国时那样，需要国君派人对付的人吗？”这里的“蒲狄”不再单指两处地方，而是借指类似当年重耳那样，被国君视为敌对者的人。\u003c/p>\n\u003cp class=\"translation\">这句话是在提醒文公：您现在也需要臣下执行命令。如果臣下都因害怕日后被报复而有所保留，您怎么办？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“齐桓公置射（shè）钩而使管仲相（xiàng）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“齐桓公把管仲当年射中自己衣带钩的仇怨放在一边，任命管仲做国相。”“置”，搁置、不再计较；“钩”，衣带上的钩；“相”，担任国相。管仲曾辅佐齐桓公的竞争者公子纠，后来却受到齐桓公重用。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君若易之，何辱命焉？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您如果要换一种做法，又何必劳烦您下令赶我走呢？”“易之”，改变齐桓公那种不计前嫌的做法；“辱命”，客气说法，意思是劳烦您下命令。言下之意是：您若坚持追究旧怨，我自己就会走。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“行者甚众，岂唯刑臣？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“要离开的人会很多，难道只有我这个受过刑的人吗？”“刑臣”，披的自称，指自己是受过宫刑的宦官。\u003c/p>\n\u003cp class=\"translation\">这句话把事情从个人恩怨推到了用人问题：如果文公一律追究旧主臣下过去的行为，那么许多人都会感到不安，离他而去。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公见之，以难（nàn）告。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋文公接见了披，披把即将发生的祸难告诉了他。这里省略了后一分句的主语：是披向文公报告吕甥、郤芮准备纵火弑君的阴谋。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>三月，晋侯潜会秦伯于王城。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">三月，晋文公秘密前往王城，与秦穆公会面。“潜”，秘密地；“秦伯”，就是帮助重耳回国即位的秦穆公。这里的王城是地名。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>己丑晦（huì），公宫火。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">己丑日，也就是这个月的最后一天，晋国国君的宫室起火了。“己丑”，干支纪日；“晦”，农历每月的最后一天。吕甥、郤芮按计划发动了纵火行动，但文公已经离开。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>瑕（xiá）甥、郤（xì）芮（ruì）不获公，乃如河上，秦伯诱而杀之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">瑕甥和郤芮没有抓到晋文公，就前往黄河边，秦穆公诱使他们前来，把他们杀了。“瑕甥”，就是开头的吕甥；“如”，到、往；“河”，指黄河。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">披没有否认自己曾追杀重耳，而是提出“君命无二”，并以齐桓公任用管仲为例劝文公不计旧怨。这是文中披的说法，不等于《左传》要求读者无条件认可奉命追杀的伦理。文公最终接见披，因而得知阴谋并避开宫中纵火；披的陈说也有提醒新君如何对待旧臣的意味。\u003c/p>\n\u003cp class=\"translation\">原文核对：\u003ca href=\"https://zh.wikisource.org/zh-hans/寺人披見文公\" target=\"_blank\" rel=\"noopener\">《左传·僖公二十四年》节录\u003c/a>。\u003c/p>\n\u003c/details>"}, {"id": "v01-15", "volume": 1, "volume_title": "卷一 · 周文", "number": 15, "title": "介之推不言禄", "file": "卷一/15-介之推不言禄.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《介之推不言禄（lù）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公二十四年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前636年，晋文公重耳回国即位，赏赐随他流亡的人，介之推却没有提出求赏。本文记述介之推与母亲关于功劳、俸禄和隐居的对话，以及文公后来的追念。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋侯赏从亡者，介之推不言禄（lù），禄（lù）亦弗及。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋文公赏赐跟随自己流亡的人，介之推没有提出求取禄赏，赏赐也没有落到他身上。“从亡者”是随从流亡的人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>推曰：“献公之子九人，唯君在矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">介之推说：“晋献公的九个儿子，只有国君还在了。”这是他就当时继位形势所作的概括。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>惠、怀无亲，外内弃之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“惠公、怀公没有亲附他们的人，国内国外都抛弃了他们。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>天未绝晋，必将有主。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“上天没有断绝晋国，就一定会给它安排君主。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>主晋祀者，非君而谁？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“主持晋国祭祀的，不是国君又是谁？”主持国祀在这里代表居于君位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>天实置之，而二三子以为己力，不亦诬乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“实在是上天安置了他，那几个人却把它当作自己的力量，岂不是虚妄冒认吗？”“二三子”指随从者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>窃人之财，犹谓之盗。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“偷取别人的财物，尚且叫作盗窃。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>况贪天之功，以为己力乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“何况贪占上天的功劳，把它说成自己的力量呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>下义其罪，上赏其奸。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“下面的人把这种罪过当作合义，上面的人又赏赐这种欺诈。”“义”在这里是认为合义。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>上下相蒙，难与处矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“上上下下相互蒙蔽，难以和他们相处了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其母曰：“盍（hé）亦求之？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他母亲说：“何不也去请求赏赐呢？”“盍”即何不。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以死谁怼（duì）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这样一直到死，你又能怨谁？”“怼”是怨恨。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“尤而效之，罪又甚焉！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">介之推回答：“一面指责他们，一面又效法他们，罪过不是更重吗？”“尤”是责怪。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>且出怨言，不食其食。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且已经说出怨责的话，就不该再吃他的俸禄。”“其食”指国君所给的禄食。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其母曰：“亦使知之，若何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他母亲说：“也让国君知道你的想法，怎么样？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“言，身之文也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">介之推回答：“言辞是修饰自身的东西。”“文”在这里是文饰。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>身将隐，焉用文之？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“既然自己要隐退，哪里还用得着文饰自己？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是求显也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“那就是在求显扬了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其母曰：“能如是乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他母亲说：“能做到这样吗？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>与汝偕（xié）隐。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我和你一起隐居。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂隐而死。\u00
