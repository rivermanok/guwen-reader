3c/strong>\u003c/p>\n\u003cp class=\"translation\">于是母子隐居，直到去世。本文没有写放火烧山的情节。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋侯求之，不获，以绵上为之田。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋文公寻找介之推，没有找到，便把绵上一带作为他的纪念性封田。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“以志吾过，且旌（jīng）善人。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">文公说：“用来记下我的过错，并表彰善人。”“志”是记载，“旌”是表彰。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">介之推以“天功”批评臣下自居其功，是文中人物的价值立场。后来关于寒食节、抱树焚死的故事，不见于本篇，不能混入本文译文。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-16", "volume": 1, "volume_title": "卷一 · 周文", "number": 16, "title": "展喜犒师", "file": "卷一/16-展喜犒师.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《展喜犒（kào）师》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公二十六年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前634年，齐孝公出兵攻打鲁国北部。鲁僖公派展喜前往犒劳齐军，展喜借周初盟誓与齐桓公的职责劝齐侯退兵。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夏，齐孝公伐我北鄙。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏天，齐孝公攻打鲁国北部边境。“我”指鲁国，“鄙”是边地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公使展喜犒（kào）师，使受命于展禽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁僖公派展喜犒劳齐军，让他先向展禽请教应对的辞令。展禽即柳下惠。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯未入竟（jìng），展喜从之，曰：“寡君闻君亲举玉趾（zhǐ），将辱于敝邑，使下臣犒（kào）执事。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐侯还没有进入鲁国国境，展喜就迎上去，说：“寡君听说您亲自抬动尊贵的脚步，将屈尊来到敝国，派下臣来犒劳您的左右。”“竟”通“境”；“玉趾”“辱”都是外交敬辞。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯曰：“鲁人恐乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐侯说：“鲁国人害怕吗？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“小人恐矣，君子则否。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">展喜回答：“普通百姓害怕，居位的君子却不怕。”这里按当时身份区分“小人”“君子”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯曰：“室如县（xuán）罄（qìng），野无青草，何恃而不恐？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐侯说：“你们的屋子像悬着的石磬一样空，田野连青草都没有，靠什么不害怕？”“县”通“悬”，“罄”通“磬”，比喻空乏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“恃先王之命。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">展喜回答：“靠的是先王的命令。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔周公、大公（tài gōng）股肱（gǔ gōng）周室，夹辅成王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前周公和太公像四肢一样辅佐周王室，共同扶助周成王。”周公、太公分别是鲁、齐的始封祖先；“大公”即太公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>成王劳（lào）之，而赐之盟，曰：‘世世子孙，无相害也！’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“成王慰劳他们，赐下盟约说：‘你们世世代代的子孙，不要互相伤害。’”“劳”在这里是慰劳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>载在盟府，大师（tài shī）职之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“盟辞保存在盟府，由太师掌管。”“大师”即太师，“职”是掌管。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>桓公是以纠合诸侯，而谋其不协，弥缝其阙（quē），而匡救其灾，昭旧职也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“齐桓公因此召集诸侯，调解不和，弥补缺失，匡正危难、救助灾患，是在彰明祖先的旧职。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及君即位，诸侯之望曰：‘其率桓之功。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“等您即位，诸侯期待说：‘他会继承桓公的功业。’”“率”是遵循、继承。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我敝邑用是不敢保聚，曰：‘岂其嗣世九年，而弃命废职？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“敝国正因为如此，才不敢集众守城，心想：‘难道他继位九年，竟会背弃王命、废弃职责吗？’”“保聚”是聚众守御；这是展喜的外交说辞。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其若先君何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘那又如何面对先君呢？’”先君指齐桓公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君必不然。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘您一定不会这样做。’”展喜以信任的口气约束齐侯。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>恃此而不恐。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们依靠这一点，所以不害怕。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯乃还。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐侯于是退兵回国。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">展喜没有声称鲁国军事实力强大，而是把齐国始祖、成王盟誓、桓公事业连在一起，使继续攻鲁与齐侯希望继承的地位相冲突。这是对说辞作用的分析，不等于已经掌握齐孝公退兵的全部内心原因。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v01-17", "volume": 1, "volume_title": "卷一 · 周文", "number": 17, "title": "烛之武退秦师", "file": "卷一/17-烛之武退秦师.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《烛之武退秦师》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公三十年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋文公重耳回国即位后，联合秦穆公包围郑国。郑国大夫佚之狐推荐烛之武去见秦穆公；烛之武夜里从城墙下去，向秦穆公陈说灭郑对秦国的利害。本文记下秦、晋两军先后撤离的经过。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋侯、秦伯围郑，以其无礼于晋，且贰（èr）于楚也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋文公和秦穆公联合包围郑国，因为郑国曾经对晋文公失礼，而且在亲附晋国的同时又亲附楚国。“晋侯”就是晋文公重耳；“秦伯”就是秦穆公；“贰于楚”，是说郑国在晋、楚之间两面依附。这里交代的是秦、晋出兵所提出的理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋军函（hán）陵，秦军氾（fán）南。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋军驻扎在函陵，秦军驻扎在氾南。“军”在这里作动词，是驻军；函陵、氾南都是地名。两军分开驻扎，也给烛之武单独去见秦穆公留下了机会。这里的“氾”有不同注音，本篇按读作 fán 的注本标注。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>佚（yì）之狐言于郑伯曰：“国危矣！若使烛之武见秦君，师必退。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国大夫佚之狐对郑文公说：“国家危险了！如果派烛之武去见秦国国君，秦军一定会撤退。”“郑伯”是郑文公；“师”指军队。佚之狐相信烛之武有说服秦穆公的能力。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公从之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑文公采纳了佚之狐的建议。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>辞曰：“臣之壮也，犹不如人；今老矣，无能为也已。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">烛之武推辞说：“我年轻力壮的时候，尚且比不上别人；如今老了，更没有什么能力了。”“辞”，推辞；“也已”是句末语气词。他表面说自己无能，话中也有多年未受重用的委屈。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公曰：“吾不能早用子，今急而求子，是寡人之过也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑文公说：“我没有早些任用您，如今情况紧急才来求您，这是我的过错。”“子”是对烛之武的尊称；“是”，这。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“然郑亡，子亦有不利焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“可是郑国若灭亡，对您也没有好处。”“然”，然而；“焉”在这里是句末语气词。郑文公承认了自己的过错，接着指出两人眼下有共同的利害。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">烛之武答应了这件事。“许”，答应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夜缒（zhuì）而出。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夜里，郑国人用绳子把烛之武从城墙上放下去。“缒”，用绳索拴着人或物向下放。城门外已被围困，所以他只能这样出城。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>见秦伯曰：“秦、晋围郑，郑既知亡矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">烛之武见到秦穆公，说：“秦、晋两国包围郑国，郑国已经知道自己面临灭亡了。”“既”，已经。他开口先承认郑国的危局，没有硬说郑国打得赢。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若亡郑而有益于君，敢以烦执事。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果灭掉郑国对您有好处，我怎么敢不让您为此费心呢？”“亡郑”，使郑国灭亡；“执事”是对秦穆公的委婉敬称。烛之武这样说，是为了把话题引向秦国真正能得到什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“越国以鄙（bǐ）远，君知其难也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“越过别的国家，把远方的郑国当作自己的边邑，您知道这很难。”“越国”，越过晋国；“鄙”本指边邑，这里是把……当作边邑；“远”指远方的郑国。秦国与郑国之间隔着晋国，即使灭郑，秦国也很难直接控制郑地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“焉用亡郑以陪邻？邻之厚，君之薄也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“何必要灭掉郑国，来增加邻国的实力呢？邻国强大了，您就相对削弱了。”“焉用”，何必；“陪”，增加；“邻”，指秦国的邻国晋国。烛之武点破关键：郑国的土地更可能让晋国得利。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若舍郑以为东道主，行李之往来，共（gōng）其乏困，君亦无所害。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果放过郑国，让它做秦国东方道路上的主人，秦国使者往来时，郑国可以供给他们缺少的东西，这对您也没有坏处。”“东道主”在这里指东方道路上的接待者；“行李”是出行的使者；“共”同“供”，供给。“以为”是“以之为”，把郑国作为。这里说的不是今天请客吃饭的“东道主”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“且君尝为（wèi）晋君赐矣，许君焦、瑕（xiá），朝济而夕设版焉，君之所知也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且您曾经给过晋国国君恩惠；他答应把焦、瑕两地给您，却早上渡过黄河，晚上就在那边修筑防御工事。这是您知道的事。”“为晋君赐”，对晋君施恩；“许”，答应给予；“济”，渡河；“设版”，设置筑墙用的板，引申为修筑防御工事。这里的“晋君”指先前受秦国帮助而即位的晋惠公夷吾，并非眼前的晋文公重耳。烛之武是在唤起秦穆公对晋国失信的记忆。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“夫（fú）晋，何厌（yàn）之有？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“晋国哪里会有满足的时候呢？”“夫”，那；“厌”，满足；“何厌之有”，就是“有何厌”，把宾语提前以加强反问语气。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“既东封郑，又欲肆其西封。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“它已经想在东面把郑国变成自己的边界，又会想扩张西面的疆界。”“封”在这里指疆界；“肆”，扩张。这是烛之武对晋国将来行动的推断，用来提醒秦穆公：晋国若继续向西扩张，就会碰到秦国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若不阙（quē）秦，将焉取之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果不侵损秦国，晋国又能从哪里取得西面的土地呢？”“阙”，侵损、削减；“焉”，从哪里。烛之武把“帮助晋国灭郑”与“将来秦国受损”连在一起。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“阙秦以利晋，唯君图之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“使秦国受损而让晋国得利，请您自己仔细考虑。”“唯君图之”是恳请秦穆公权衡利害。烛之武没有替他宣布决定，而是把决定交还给他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秦伯说（yuè），与郑人盟，使杞（qǐ）子、逢（páng）孙、杨孙戍（shù）之，乃还。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦穆公听了很高兴，与郑国订立盟约，派杞子、逢孙、杨孙留守郑国，然后撤回秦军。“说”同“悦”；“盟”，结盟；“戍”，驻守；“乃”，于是。结果不只是秦军撤围：秦国还转而派兵保护郑国。“逢”用作姓氏，此处读 páng。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子犯请击之，公曰：“不可。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国大夫子犯请求攻击撤退的秦军，晋文公说：“不行。”“子犯”就是狐偃，是晋文公流亡时的重要随从；“公”指晋文公；“之”指秦军。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“微夫（fú）人之力不及此。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果没有那个人的帮助，我就不会有今天。”“微”，如果没有；“夫人”在这里是“那个人”，指秦穆公，并不是今天所说的妻子。晋文公承认，自己得以回国即位，离不开秦国相助。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“因人之力而敝之，不仁；失其所与（yǔ），不知（zhì）；以乱易整，不武。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“依靠别人的力量，又反过来损害他，不合乎仁；失去自己的盟友，不明智；用混乱的局面代替原本整齐的合作关系，也不符合用兵之道。”“因”，依靠；“敝”，损害；“所与”，盟友；“知”同“智”。晋文公既讲旧恩，也讲现实利害：此时攻击秦军，会破坏晋、秦关系。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“吾其还也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们还是回去吧。”“其”，表示商量、劝告的语气。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>亦去之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋军也撤离了郑国。“去”，离开。至此，秦、晋两军先后退兵，郑国的危机暂时解除。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">烛之武的说辞依次谈到灭郑难以让秦国得地、存郑可以让秦国有东方盟友、晋国曾经失信及未来可能侵损秦国。这是从秦国利益出发的劝说；晋国日后一定侵秦并非这一篇已经发生的事实。\u003c/p>\n\u003cp class=\"translation\">“越国以鄙远”即越过晋国，把远方郑国当作秦国边邑。“鄙”由名词“边邑”用作动词，“远”指郑国。\u003c/p>\n\u003cp class=\"translation\">此篇中晋文公说“微夫人之力不及此”，说明他承认秦穆公助其即位。关于受秦扶持后晋国为何没有成为秦国附属，原文仅说明这次他因旧恩、盟友关系及军事秩序而拒绝袭秦；关于两国后续关系，应结合后续史事讨论，不能由此一句作定论。\u003c/p>\n\u003cp class=\"translation\">原文核对：\u003ca href=\"https://zh.wikisource.org/zh-hans/燭之武退秦師\" target=\"_blank\" rel=\"noopener\">《左传·僖公三十年》节录\u003c/a>。\u003c/p>\n\u003c/details>"}, {"id": "v01-18", "volume": 1, "volume_title": "卷一 · 周文", "number": 18, "title": "蹇叔哭师", "file": "卷一/18-蹇叔哭师.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《蹇（jiǎn）叔哭师》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·僖公三十二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晋文公去世后，驻在郑国的秦臣杞子建议秦穆公远袭郑国。秦国老臣蹇叔指出劳师远征和沿途暴露的危险，却没能阻止出兵。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>杞（qǐ）子自郑使告于秦曰：“郑人使我掌其北门之管。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">杞子从郑国派人报告秦国说：“郑国人让我掌管他们北门的钥匙。”“管”是锁钥。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若潜师以来，国可得也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果秘密率军前来，郑国就可以得到。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>穆公访诸蹇（jiǎn）叔。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦穆公向蹇叔征求意见。“访”是询问，“诸”相当于“之于”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>蹇（jiǎn）叔曰：“劳师以袭远，非所闻也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">蹇叔说：“让军队劳苦去袭击远方国家，我没有听说过这样的做法。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>师劳力竭，远主备之，无乃不可乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“军队疲劳、力量耗尽，远方的对手却能作好防备，恐怕不可行吧？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>师之所为，郑必知之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“军队采取的行动，郑国一定会知道。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>勤而无所，必有悖心。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“辛苦奔走却一无所得，军中必定产生怨愤失序的心思。”“悖心”指违逆、失序的意念。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>且行千里，其谁不知？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且行军千里，谁会不知道呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公辞焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">穆公拒绝了这个意见。“辞”在这里是拒绝采纳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>召孟明、西乞、白乙，使出师于东门之外。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他召集孟明、西乞、白乙，命令军队从东门之外出发。三人是秦军将领。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>蹇（jiǎn）叔哭之曰：“孟子！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">蹇叔哭着对孟明说：“孟先生！”“孟子”在这里是称孟明，不是战国的孟子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾见师之出，而不见其入也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我看见军队出去，却看不见它回来啊！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>公使谓之曰：“尔何知？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">穆公派人对蹇叔说：“你懂什么？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>中寿，尔墓之木拱（gǒng）矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“假使你只活到通常的寿数，你坟上的树早已长得两手合围了！”“中寿”指中等寿数；这是以他年老为由讥斥，并不是说蹇叔已死。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>蹇（jiǎn）叔之子与师（yù shī），哭而送之，曰：“晋人御师必于崤（xiáo）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">蹇叔的儿子也参加这支军队，他哭着送别，说：“晋国人一定会在崤山阻击军队。”“与”是参与。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>崤（xiáo）有二陵焉，其南陵，夏后皋之墓也；其北陵，文王之所辟（bì）风雨也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“崤山有南北两座山陵，南陵是夏后皋的墓地，北陵是周文王避过风雨的地方。”这些地望故事是蹇叔话中的传统记述。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>必死是间。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“你必定会死在两陵之间。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>余收尔骨焉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我到那里收你的遗骨啊！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秦师遂东。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">秦军于是向东进发。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">正文止于秦军东行，后来的崤之战属于后续事件。开头按《古文观止》的选文从杞子报信写起，不把《左传》同年的其他纪事并入本篇。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷1)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷1\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v02-01", "volume": 2, "volume_title": "卷二 · 周文", "number": 1, "title": "郑子家告赵宣子", "file": "卷二/01-郑子家告赵宣子.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《郑子家告赵宣子》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·文公十七年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">郑国夹在晋、楚两大国之间，晋国认为郑国对楚国有二心，故意冷落郑国国君。郑国大夫子家于是写信给晋国执政赵盾，为本国申辩。\u003c/p>\n\u003ch2>一、晋国拒绝接见，子家写信申辩\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晋侯合诸侯于扈（hù），平宋也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国国君召集诸侯，在扈地会盟，是为了平定宋国的内乱。这里的“晋侯”是晋灵公；“合”是召集，“平”是平定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是晋侯不见郑伯，以为贰于楚也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">在这次会盟中，晋灵公不肯接见郑国国君，因为认为他对晋国不专一，暗中又亲近楚国。“郑伯”是郑穆公；“贰”是有二心，同时依附另一方。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郑子家使执讯而与之书，以告赵宣子，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国大夫子家派遣通讯使者，把一封信交给他，让他送给赵宣子。子家名叫归生，所以后文的“归生”就是他自称；赵宣子就是晋国执政大夫赵盾。“执讯”是负责传递消息的官员，“告”在这里是陈述、告知。\u003c/p>\n\u003ch2>二、逐件说明：我们为晋国做了多少事\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>“寡君即位三年，召蔡侯而与之事君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我国国君即位第三年，就邀请蔡国国君，同他一起侍奉贵国国君。”\u003c/p>\n\u003cp class=\"translation\">“寡君”是对本国国君的谦称，指郑穆公；这里的“君”指当时在位的晋襄公。“事”是侍奉，在诸侯关系中指服从、朝见等。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>九月，蔡侯入于敝邑（bì yì）以行。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">九月，蔡侯来到我国，准备一同出发前往晋国。“敝邑”是对自己国家的谦称，这里指郑国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>敝邑以侯宣多之难（nàn），寡君是以不得与蔡侯偕（xié）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我国因为发生了侯宣多造成的祸乱，国君因此没能和蔡侯一起出发。侯宣多是郑国大夫。“以”是因为，“是以”是因此，“偕”是一起。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>十一月，克减侯宣多，而随蔡侯以朝（cháo）于执事。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">到了十一月，成功压制了侯宣多的势力，国君便接着蔡侯之后，前来朝见贵国。\u003c/p>\n\u003cp class=\"translation\">“克”是能够、成功；“减”是削弱、压制，这里不直接解释为杀死。“执事”本指办理事务的官员，在外交辞令中常用来尊称对方，避免直呼其君。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>十二年六月，归生佐寡君之嫡（dí）夷，以请陈侯于楚，而朝诸君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑穆公十二年六月，我归生辅佐我国太子夷，为陈侯朝见晋国一事，到楚国请求许可，随后又来朝见贵国国君。\u003c/p>\n\u003cp class=\"translation\">“嫡夷”指嫡子、太子夷，后来即位为郑灵公。陈国受楚国影响，不敢自行亲近晋国，所以郑国还要出面协调。“诸”相当于“之于”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>十四年七月，寡君又朝，以蒇（chǎn）陈事。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">十四年七月，我国国君又亲自前来朝见，以完成陈国与晋国交好的事情。“蒇”是完成。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>十五年五月，陈侯自敝邑往朝于君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">十五年五月，陈侯又从我国出发，前去朝见贵国国君。\u003c/p>\n\u003cp class=\"translation\">这几件事连起来，是说：郑国不但自己来朝见，还替晋国联络陈、蔡，帮助晋国维持诸侯的归附。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>往年正月，烛之武往朝夷也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">去年正月，烛之武又陪同太子夷，前来朝见贵国国君。\u003c/p>\n\u003cp class=\"translation\">这里的“朝夷”，是让夷前去朝见的意思，不能理解成“烛之武去朝见夷”。烛之武，就是《烛之武退秦师》中的那位郑国大夫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>八月，寡君又往朝。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">去年八月，我国国君又亲自前来朝见。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以陈、蔡之密迩（ěr）于楚，而不敢贰焉，则敝邑之故也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">陈国、蔡国离楚国那么近，却还不敢对晋国怀有二心，这是我国从中努力的缘故。\u003c/p>\n\u003cp class=\"translation\">“密迩”是非常接近。这里的“贰”是对晋国有二心，与开头“贰于楚”所说的关系相应。\u003c/p>\n\u003ch2>三、已经做到这个地步，为什么还要责怪我们？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>虽敝邑之事君，何以不免？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">即使只说我国自己侍奉贵国这件事，我们又有什么地方做得不够，竟然还不能免于责难呢？\u003c/p>\n\u003cp class=\"translation\">这里承接上文：替晋国联络陈、蔡的功劳暂且不说，单看郑国自身的表现，也不该受到这样的待遇。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>在位之中，一朝于襄，而再见（xiàn）于君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我国国君在位期间，曾经亲自朝见晋襄公一次，又亲自朝见现任国君两次。\u003c/p>\n\u003cp class=\"translation\">“再”是两次，不是现代汉语中泛指的“又一次”；“见”在这里读xiàn，是进见、朝见。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夷与孤之二三臣，相及于绛（jiàng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">太子夷和我国的几位大臣，也接连不断地来到晋国都城绛，向贵国朝见。\u003c/p>\n\u003cp class=\"translation\">“相及”是前后相继。“孤”是国君自称，这里转用了郑穆公的口吻；“二三臣”指几位臣子，包括子家、烛之武等。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虽我小国，则蔑（miè）以过之矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我国虽然是小国，但在侍奉贵国这件事上，已经没有办法做得更多了。“蔑”是无、没有，“过”是超过。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今大国曰：‘尔未逞（chěng）吾志。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如今贵国却还说：“你们没有使我满意。”\u003c/p>\n\u003cp class=\"translation\">“逞”是满足、使快意。前面列举了那么多事情，就是为了反问：我们究竟还要做到什么程度，你们才满意？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>敝邑有亡，无以加焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我国只有灭亡这一条路了，再也没有办法增加对贵国的奉事了。\u003c/p>\n\u003cp class=\"translation\">这句话很沉痛：能够做的，我们已经做尽；如果还不够，那就只剩把整个国家交出去。\u003c/p>\n\u003ch2>四、逼得太紧，小国也会反抗\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>古人有言曰：‘畏首畏尾，身其余几？’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">古人说：“怕了头，又怕尾，全身还剩多少地方可以不怕呢？”\u003c/p>\n\u003cp class=\"translation\">放到郑国的处境里，就是：前怕晋国，后怕楚国，做什么都可能得罪人，这个国家还怎么生存？“头尾”的比喻见篇末讨论中的后续澄清。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>又曰：‘鹿死不择音。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">又说：“鹿到了将死的时候，逃命便顾不上选择藏身的地方了。”\u003c/p>\n\u003cp class=\"translation\">“音”这里依传统注解，通“荫”，指可以庇护、藏身的地方。意思是：性命受到威胁时，首先要活下来，顾不得处处挑选。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>小国之事大国也，德，则其人也；不德，则其鹿也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">小国侍奉大国，大国如果施以恩德，小国便会像人一样，按正常的礼义关系服从；如果不施恩德，小国就会像被追赶的鹿一样，只顾逃命。\u003c/p>\n\u003cp class=\"translation\">“德”在这里作动词，是施恩、体恤。这比喻很有锋芒：你想让小国守规矩，首先要给它能够守规矩、能够生存的条件。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>铤（tǐng）而走险，急何能择？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">一旦被逼得急奔逃命，就会奔向危险之地；情势危急，哪里还能从容选择？\u003c/p>\n\u003cp class=\"translation\">“铤”是疾走的样子。“铤而走险”这个成语就见于此处，最初的语境突出的是：被逼到绝境，只能冒险求生。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>命之罔（wǎng）极，亦知亡矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">贵国向我们提出的命令、要求没有止境，我们也知道，这样下去终究会灭亡。\u003c/p>\n\u003cp class=\"translation\">“罔”是无，“极”是限度。言外之意是：既然一味服从也保不住国家，我们为什么还要无限忍让？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>将悉敝赋，以待于鯈（chóu），唯执事命之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我们将调集全国的兵力，在鯈地等候，听凭贵方作出决定。\u003c/p>\n\u003cp class=\"translation\">“悉”是全部动用；“赋”本指军赋，这里指兵力；鯈是晋、郑边境的地名。\u003c/p>\n\u003cp class=\"translation\">表面上仍说“听凭命令”，实际已经把话说到：如果贵国一定要逼迫，我们就准备在边境应战。\u003c/p>\n\u003ch2>五、夹在大国之间，求生难道也是罪？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>文公二年，朝于齐；四年，为（wèi）齐侵蔡，亦获成于楚。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">从前郑文公二年，我国朝见齐国；四年，又替齐国攻打蔡国，但后来仍然能够与楚国达成和解。\u003c/p>\n\u003cp class=\"translation\">这里的“文公”是郑文公，不是篇目出处“鲁文公十七年”中的鲁文公。“成”指讲和、和解。\u003c/p>\n\u003cp class=\"translation\">子家举这段旧事，是说：我们以前也曾服从齐国、得罪楚国，但楚国仍然能与我们和解。言下之意是，希望晋国也能体谅小国的处境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>居大国之间，而从于强令，岂其罪也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我国处在大国之间，不得不服从强国的命令，难道这也算是我们的罪过吗？\u003c/p>\n\u003cp class=\"translation\">这里已经把郑国的难处直接说出来：晋国要我们服从，楚国也要我们服从，而我们没有同时拒绝两国的实力。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大国若弗（fú）图，无所逃命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">贵国如果不替我们考虑，我们便无处逃避灭亡的命运了。\u003c/p>\n\u003cp class=\"translation\">“图”是考虑、谋划，这里有体谅郑国、为郑国生存作考虑的意思。措辞仍然恭敬，却带着强烈的悲愤。\u003c/p>\n\u003ch2>六、晋国最终讲和\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晋巩朔（gǒng shuò）行成于郑，赵穿、公婿池为质（zhì）焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国派大夫巩朔到郑国议和，并让赵穿和晋国国君的女婿池，留在郑国作人质，表示信用。\u003c/p>\n\u003cp class=\"translation\">“行成”是前往议和；“公婿池”是身份加名字，即“国君的女婿，名叫池”；“质”是人质。文章以晋国主动议和、送出人质作结。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### “畏首畏尾”是谁的头尾？（后续澄清）\u003c/p>\n\u003cp class=\"translation\">这里是把一个完整的身体拿来打比方，没有具体说是谁的头尾，也不是说害怕“头”和“尾”这两个东西。意思是：头这一处也怕出事，尾那一处也怕出事，那身体中间还能剩下多少地方不用担心？就是说处处都有顾忌，没有可以安心的地方。\u003c/p>\n\u003cp class=\"translation\">放在郑国的处境中，就是顾着晋国，又怕得罪楚国；顾着楚国，又怕得罪晋国，怎么做都有危险。但不能把“头”固定对应晋国、“尾”固定对应楚国。“其”在这里表示反问，可理解为“难道”；“余几”是还剩多少。原先“怕了头，又怕尾”的直译容易造成误解，以上采用后续澄清。\u003c/p>\n\u003cp class=\"translation\">### 晋国是强国，为什么反而送人质？（记载与分析）\u003c/p>\n\u003cp class=\"translation\">原文记载的是晋国议和、送出人质，没有直接交代决策过程。人质既可以表示服从，也可以用来取信于对方；此处可理解为给和解承诺加上担保。\u003c/p>\n\u003cp class=\"translation\">根据双方处境作出的分析是：郑国已经表明准备在边境应战，晋国若继续逼迫，可能使郑国倒向楚国，还要付出战争代价。因此，讲和并送出人质，有助于使郑国相信归附晋国能够保全自己。这是利害分析，不是原文直接记载的晋国决策动机。\u003c/p>\n\u003cp class=\"translation\">### 阅读提示（分析判断）\u003c/p>\n\u003cp class=\"translation\">子家的语气先是逐项证明郑国已经尽力，接着指出晋国要求无止境，再用困鹿作比，说明逼迫会带来反抗。信中争取的是：小国承担服从义务，大国也应给小国留下生存余地。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://www.donglishuzhai.net/chapter/373.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见的完整讲解及后续追问整理，保留原有译意与词释；开篇压缩为两句背景，讨论移至篇末。\u003c/p>\n\u003c/details>"}, {"id": "v02-02", "volume": 2, "volume_title": "卷二 · 周文", "number": 2, "title": "王孙满对楚子", "file": "卷二/02-王孙满对楚子.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《王孙满对楚子》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·宣公三年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">王孙满是周王室的大夫，“楚子”是楚庄王。楚庄王带兵来到周王室附近，询问九鼎的大小轻重，王孙满于是作出回答，这就是著名的“问鼎”。\u003c/p>\n\u003ch2>一、楚庄王陈兵周境，开口问鼎\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>楚子伐陆浑（hún）之戎（róng），遂至于雒（luò），观（guàn）兵于周疆。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚庄王攻打陆浑一带的戎人，随后来到洛水附近，在周王室的疆界上展示军队，炫耀武力。\u003c/p>\n\u003cp class=\"translation\">“陆浑之戎”是居住在今河南嵩县一带的戎人。“雒”同“洛”，指洛水。“观兵”的“观”读guàn，这里是展示兵力，让别人看见自己的军威。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>定王使王孙满劳（lào）楚子。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周定王派大夫王孙满，前去慰劳楚庄王。“劳”读lào，是慰问、犒劳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚子问鼎（dǐng）之大小轻重焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚庄王向王孙满询问九鼎的大小和重量。\u003c/p>\n\u003cp class=\"translation\">九鼎在这里是王权的象征。因此，结合前面陈兵示威的举动，这个问题带着对周天子地位的试探：鼎有多重，我能不能搬走？周朝的天下，我能不能接手？这是对“问鼎”政治意味的解释，并非楚庄王直接说出的原话。\u003c/p>\n\u003ch2>二、王孙满回答：关键在德，不在鼎\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>对曰：“在德不在鼎。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">王孙满回答：“能否拥有天下，关键在于德行，不在于鼎本身。”\u003c/p>\n\u003cp class=\"translation\">楚庄王问的是器物的重量，王孙满直接指出：你真正关心的是天下归谁，那就要谈有没有资格统治天下。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔夏之方有德也，远方图物，贡金九牧（mù），铸（zhù）鼎象物，百物而为之备，使民知神奸。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">从前夏朝正有德政的时候，远方的人把当地各种奇异事物画成图像，九州的长官进贡铜材，用这些铜铸鼎，把那些事物的形象铸在鼎上。各种事物都有所呈现，使百姓懂得辨别神异与邪恶之物，知道怎样防备。\u003c/p>\n\u003cp class=\"translation\">“图物”是描绘事物；“金”在这里指铜；“九牧”是九州的长官；“象物”是表现事物的形象；“备”含有防备的意思。\u003c/p>\n\u003cp class=\"translation\">这里讲的是王孙满引用的古代传说，用来说明：鼎最初与治理、保护百姓有关。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故民入川泽山林，不逢不若。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">所以百姓进入河流、湖泽、山林时，就能避免遭遇有害的东西。\u003c/p>\n\u003cp class=\"translation\">“不若”是“不顺”，在这里指对人不利的事物。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>螭（chī）魅（mèi）罔（wǎng）两（liǎng），莫能逢之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">那些传说中的山精水怪，也不能来侵害百姓。\u003c/p>\n\u003cp class=\"translation\">“螭魅罔两”指传说中害人的精怪，也常写作“魑魅魍魉”；这里的“之”指百姓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>用能协于上下，以承天休。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此能够使上下和谐，从而承受上天赐予的福佑。\u003c/p>\n\u003cp class=\"translation\">“用”是因此；“协”是和谐；“休”是美好、福佑。王孙满把百姓得到保护、上下和谐与获得天佑联系起来。\u003c/p>\n\u003ch2>三、九鼎的转移，取决于统治者的德行\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>桀（jié）有昏德，鼎迁于商，载祀（zǎi sì）六百。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏桀昏乱无德，九鼎便转移到商朝，在商朝传承了六百年。\u003c/p>\n\u003cp class=\"translation\">“桀”是夏朝末代君主；“载”“祀”都可以用于记年，“载祀六百”就是历经六百年。这是王孙满在答话中提出的历史叙述。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>商纣（zhòu）暴虐，鼎迁于周。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">商纣王残暴，九鼎又转移到了周朝。\u003c/p>\n\u003cp class=\"translation\">这两句是在说：鼎不会永远保住一个王朝；失去德政，即使曾经拥有鼎，也会失去天下。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>德之休明，虽小，重也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">统治者的德行政事如果美好光明，那么鼎即使小，也是沉重的，别人难以夺走。\u003c/p>\n\u003cp class=\"translation\">“休明”是美好、光明。这里的“重”已经超出了实际重量，指王权稳固，不容易被推翻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其奸回昏乱，虽大，轻也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">统治者如果奸邪昏乱，那么鼎即使很大，也是轻的，容易被别人夺走。\u003c/p>\n\u003cp class=\"translation\">“回”是邪曲。两句话合起来，就是：统治稳不稳，要看怎样治理天下；鼎铸得再大，也救不了暴政。\u003c/p>\n\u003ch2>四、周朝虽已衰弱，还轮不到你来问\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>天祚（zuò）明德，有所厎（dǐ）止。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">上天赐福给有光明德行的统治者，其赐福的期限是有所限定的。\u003c/p>\n\u003cp class=\"translation\">“祚”是赐福；“厎止”指一定的止境、期限，也有版本写作“底止”。这句话为下文所说的周朝国运期限作铺垫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>成王定鼎于郏鄏（jiá rǔ），卜（bǔ）世三十，卜年七百，天所命也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周成王把九鼎安置在郏鄏时，占卜得知周朝可以传承三十代，延续七百年，这是上天所决定的。\u003c/p>\n\u003cp class=\"translation\">“郏鄏”是周王城所在地，在今河南洛阳一带；“定鼎”是安置九鼎；“卜”是占卜。\u003c/p>\n\u003cp class=\"translation\">这里的“三十代、七百年”是王孙满援引的天命说法，不能直接当作现代意义上的历史预测。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>周德虽衰，天命未改。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周朝的德政虽然已经衰退，但上天赋予周朝统治天下的天命，还没有改变。\u003c/p>\n\u003cp class=\"translation\">他承认周朝衰弱，却坚持周天子的地位仍然有效。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>鼎之轻重，未可问也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，九鼎究竟有多重，你现在还不可以问。\u003c/p>\n\u003cp class=\"translation\">“未可问”表面上说不能询问鼎的重量，实际上是在明确拒绝楚庄王对天子权位的试探。全文就收在这句话上，没有继续记载楚庄王当场如何回应。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### “德”与“天命”（分析判断）\u003c/p>\n\u003cp class=\"translation\">王孙满先讲“德”，再讲“天命”。讲“德”，是说拥有武力还不足以取得天下；讲“天命”，则是维护周王室现有的统治地位。这番话既包含对德政的强调，也服务于他作为周王室使臣的外交立场。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://www.gushiwen.cn/shiwenv_76e40901f6dd.aspx)；[《古文观止》原文与旧注](https://www.orientsmile.com/zh-hans/guwen-guanzhi/guwenguanzhi_21/\" target=\"_blank\" rel=\"noopener\">《王孙满对楚子》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见的完整讲解整理；开篇保留两句背景，原有逐句译意与词释保留。\u003c/p>\n\u003c/details>"}, {"id": "v02-03", "volume": 2, "volume_title": "卷二 · 周文", "number": 3, "title": "齐国佐不辱命", "file": "卷二/03-齐国佐不辱命.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《齐国佐不辱命》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·成公二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">齐国在鞌（ān）之战中败给晋国等国的联军，晋军继续追击。齐顷公派国佐前去求和，晋国却提出了两个苛刻条件。\u003c/p>\n\u003ch2>一、齐国战败，派使臣求和\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晋师从齐师，入自丘舆（yú），击马陉（xíng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋军追赶齐军，从丘舆进入齐国境内，攻打马陉。“从”是追赶；丘舆、马陉都是齐国地名。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>齐侯使宾媚（mèi）人赂（lù）以纪甗（yǎn）、玉磬（qìng）与地。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐顷公派国佐，拿纪国的甗、玉磬和土地，向晋国求和。“赂”指赠送财物；甗是蒸食物的器具，磬是打击乐器。这两件宝器是齐国从纪国所得。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不可，则听客之所为。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐顷公交代：“如果对方不答应，就听任他们采取行动。”这里的“客”指晋军。意思是先求和，谈不成，也只能应付对方继续进攻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宾媚人致赂，晋人不可，曰：“必以萧同叔子为质（zhì），而使齐之封内尽东其亩。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">国佐送上财物，晋国方面不接受，说：“必须把萧同叔子送来作人质，并让齐国境内的田垄全部改为东西走向。”\u003c/p>\n\u003cp class=\"translation\">“萧同叔子”是萧国国君同叔的女儿，也就是齐顷公的母亲。“封内”是国境以内；“东其亩”是使田垄呈东西走向。按传统解释，改变田垄及相关沟渠的方向，是为了方便晋军战车从西向东进入齐国。\u003c/p>\n\u003ch2>二、扣押国君的母亲，岂不是逼人不孝？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>对曰：“萧同叔子非他，寡君之母也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">国佐回答：“萧同叔子不是别人，是我国国君的母亲。”“寡君”是使臣对本国国君的谦称。“非他”二字，是郑重提醒对方这位人质的身份。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若以匹敌，则亦晋君之母也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果按照齐、晋两国国君地位对等的关系来说，她也应当受到与晋君母亲同等的尊重。“匹敌”在这里指身份地位相当，不是说两国实力一样。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾子布大命于诸侯，而曰必质其母以为信，其若王命何？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">您向诸侯发布重大命令，却说必须扣押国君的母亲作为信用担保，这怎么符合先王的政教呢？\u003c/p>\n\u003cp class=\"translation\">“吾子”是对对方的尊称；“质其母”是以其母亲为人质；“信”是信用担保；“若……何”是“把……怎么办”，这里可理解为“如何向……交代”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>且是以不孝令也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">况且，这等于用不孝的要求来号令诸侯。你要齐国国君交出自己的母亲，岂不是逼他做不孝之子？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《诗》曰：‘孝子不匮（kuì），永锡（cì）尔类。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">《诗经》说：“孝子的孝心没有穷尽，并将这份孝德长久地推及同类。”“匮”是穷尽；“锡”通“赐”，是给予、施及；“类”指族类、同类。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若以不孝令于诸侯，其无乃非德类也乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果用不孝的要求号令诸侯，恐怕就不符合以美德施及同类的道理了吧？\u003c/p>\n\u003cp class=\"translation\">“其无乃……乎”是委婉的反问，意思是“恐怕……吧”。国佐措辞客气，实际已指出：晋国的要求违背了它应当维护的孝道。\u003c/p>\n\u003ch2>三、田地怎么耕种，应看土地条件\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>先王疆理天下，物土之宜而布其利。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">先代圣王划分、治理天下土地，是考察各地土地适合什么，再安排利用，使人们得到土地的好处。\u003c/p>\n\u003cp class=\"translation\">“疆理”是划分疆界、整理土地；“物”在这里是察看、辨别；“土之宜”是土地适宜的条件。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故《诗》曰：‘我疆我理，南东其亩。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">所以《诗经》说：“我们划定疆界，整治土地，田垄有的南北走向，有的东西走向。”\u003c/p>\n\u003cp class=\"translation\">“南东其亩”是根据地形、土壤等实际情况安排田垄方向，并不是一律朝向东南。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今吾子疆理诸侯，而曰‘尽东其亩’而已！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如今您替诸侯安排土地，却只说：“田垄全部改成东西走向！”先王因地制宜，晋国却只要求齐国一律照办。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>唯吾子戎（róng）车是利，无顾土宜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">您只图自己的战车通行方便，完全不考虑土地怎样安排才适宜耕种。\u003c/p>\n\u003cp class=\"translation\">“戎车”是战车。“唯……是……”是强调句式，这里就是“只考虑有利于您的战车”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其无乃非先王之命也乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这恐怕不符合先王治理土地的原则吧？\u003c/p>\n\u003cp class=\"translation\">这一段反驳的是第二个条件：土地安排应当考虑百姓耕种，不能只为晋国以后进攻方便。\u003c/p>\n\u003ch2>四、霸主应为诸侯办事，不能只顾自己\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>反先王则不义，何以为盟主？其晋实有阙（quē）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">违背先王的原则就是不义，又凭什么做诸侯盟主呢？这样看来，晋国确实有过失。\u003c/p>\n\u003cp class=\"translation\">“阙”通“缺”，指缺失、过错。国佐把前面两个问题归结起来，直接追问晋国作为盟主的资格。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>四王之王（wàng）也，树德而济同欲焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">古代四位圣王能够称王天下，是因为树立德政，满足人们共同的愿望。\u003c/p>\n\u003cp class=\"translation\">“四王”按传统注解指夏禹、商汤、周文王、周武王。“之王也”的“王”作动词，读wàng，指称王、统治天下；“济”是成就、满足；“同欲”是人们共同的愿望。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>五伯（bó）之霸也，勤而抚之，以役王命。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">古代五位霸主能够建立霸业，是因为勤勉地为诸侯事务操劳，安抚诸侯，奉行天子的命令。\u003c/p>\n\u003cp class=\"translation\">“伯”指诸侯之长；“抚之”的“之”指诸侯；“役王命”是为王命效力、奉行王命。这里说的是“王命”，即天子的命令。\u003c/p>\n\u003cp class=\"translation\">国佐强调：霸主能够领导诸侯，是因为承担了安抚诸侯、维护秩序的责任。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今吾子求合诸侯，以逞（chěng）无疆之欲。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如今您却想聚合诸侯，用来满足自己没有止境的欲望。\u003c/p>\n\u003cp class=\"translation\">“逞”是满足；“无疆”是没有边界。前面说古代王者“济同欲”，满足众人共同的愿望；这里说晋国“逞无疆之欲”，满足自己的无限欲望，两者形成对照。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《诗》曰：‘布政优优，百禄是遒（qiú）。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">《诗经》说：“施行政令宽厚和缓，各种福禄就会聚集而来。”\u003c/p>\n\u003cp class=\"translation\">“优优”是宽厚、和缓；“遒”是聚集。此处沿用所核对底本的文字。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子实不优，而弃百禄，诸侯何害焉？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">您实际上并不宽厚，反而自己抛弃了各种福禄，这对诸侯又有什么损害呢？\u003c/p>\n\u003cp class=\"translation\">国佐把话反过来说：您以为是在为难诸侯，其实先损害的是晋国自身的威望和福祉。\u003c/p>\n\u003ch2>五、若仍不肯和，那就再战一次\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>不然，寡君之命使臣，则有辞矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果您仍然不答应，那么我国国君交代我这个使臣的话，也已经说在前面了。\u003c/p>\n\u003cp class=\"translation\">从这里起，国佐转述齐顷公的命令，说明继续抵抗并非使臣擅自作出的决定。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：‘子以君师辱于敝邑，不腆（tiǎn）敝赋，以犒（kào）从（zòng）者。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我国国君说：“您率领贵国国君的军队，屈尊来到我国，我们用微薄的兵力，来犒劳您的随从。”\u003c/p>\n\u003cp class=\"translation\">“以”是率领；“辱”是屈尊的客套说法；“敝邑”是对本国的谦称；“腆”是丰厚；“赋”在这里指兵力。\u003c/p>\n\u003cp class=\"translation\">所谓用兵力来“犒劳”，实际是指出兵迎战。这是外交上的婉辞。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>畏君之震，师徒桡（náo）败。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">由于畏惧贵军的威势，我国军队遭到了挫败。\u003c/p>\n\u003cp class=\"translation\">“震”是威势；“师徒”是军队；“桡”通“挠”，有屈服、挫败的意思。这句话承认齐国战败，也给晋国保留体面。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾子惠徼（jiāo）齐国之福，不泯（mǐn）其社稷（jì），使继旧好（hǎo），唯是先君之敝器、土地不敢爱。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果承蒙您的恩惠，使齐国有幸免于灭亡，能够延续两国旧日的友好关系，那么先君留下的器物、土地，我们都不敢吝惜。\u003c/p>\n\u003cp class=\"translation\">“徼”是求取、求得；“泯”是灭；“社稷”代指国家；“爱”是吝惜。\u003c/p>\n\u003cp class=\"translation\">这句话再次表明求和的诚意：齐国愿意付出宝器和土地，接受战败的代价。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子又不许，请收合余烬（jìn），背（bèi）城借一。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果您仍不答应，那就请允许我们收集剩余的兵力，背靠都城，再作一次决战。\u003c/p>\n\u003cp class=\"translation\">“余烬”本指燃烧后剩余的灰烬，这里比喻战败后残余的力量；“背城借一”是依靠都城，借助剩余力量，再战一次。\u003c/p>\n\u003cp class=\"translation\">这就是齐国的底线：可以让步求和，但不能任由对方无限加码。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>敝邑之幸，亦云从也；况其不幸，敢不唯命是听！’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果我国侥幸获胜，也仍然愿意服从贵国；何况如果再战失败，哪里还敢不听从您的命令！\u003c/p>\n\u003cp class=\"translation\">表面上说“从”“听”，十分谦顺，实际意思却是：我们要先再打一仗，再谈接受您的命令。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与人物\u003c/p>\n\u003cp class=\"translation\">标题应断为“齐／国佐／不辱命”。国佐是齐国大夫，“不辱命”就是没有辜负国君交付的使命。文中的“宾媚人”，也是指国佐。\u003c/p>\n\u003cp class=\"translation\">### “以役王师”还是“以役王命”？（追问核对）\u003c/p>\n\u003cp class=\"translation\">本篇原文是“勤而抚之，以役王命”。“王命”是天子的命令，“王师”则是天子的军队，两者不同。国佐提醒晋国：过去的霸主靠为诸侯办事、维护天子的秩序建立威望，如今却只想满足自己的欲望。\u003c/p>\n\u003cp class=\"translation\">### 交涉层次（分析判断）\u003c/p>\n\u003cp class=\"translation\">国佐先分别反驳“扣押国君母亲”和“改变田垄方向”，再追问晋国是否尽到了盟主的责任，最后提出“背城借一”。他既没有否认战败，也没有一味求饶，而是把齐国愿意付出的代价和不能接受的条件，都说清楚了。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part023.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：本会话两次完整讲解合并，正文采用后一次完整版本；保留已有词释，并将“王命／王师”的追问放在篇末。\u003c/p>\n\u003c/details>"}, {"id": "v02-04", "volume": 2, "volume_title": "卷二 · 周文", "number": 4, "title": "楚归晋知罃", "file": "卷二/04-楚归晋知罃.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《楚归晋知（zhì）罃（yīng）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·成公三年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">知罃在晋楚交战时被俘，后来两国交换俘虏，楚王送他回国。临别时，楚王连续追问：你怨我吗，感激我吗，准备怎样报答我？全文围绕这几问展开。\u003c/p>\n\u003ch2>一、两国交换俘虏\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晋人归楚公子谷臣与连尹襄老之尸于楚，以求知罃。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国把楚国公子谷臣，以及连尹襄老的尸体交还楚国，用来换回知罃。\u003c/p>\n\u003cp class=\"translation\">这里要分清：谷臣是活着的俘虏，襄老已经战死，交还的是尸体。“连尹”是楚国官名，“襄老”是人名。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是荀（xún）首佐中军矣，故楚人许之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这时，荀首已经担任晋国中军副帅，所以楚国答应了交换。\u003c/p>\n\u003cp class=\"translation\">荀首就是知罃的父亲。“于是”在这里是“在这时”；“佐中军”是担任中军佐，属于晋国的重要职位。文章特意点出荀首的地位，表明楚国同意放人，也有两国政治关系上的考虑。\u003c/p>\n\u003ch2>二、第一问：你怨恨我吗？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王送知罃，曰：“子其怨我乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚王送别知罃，说：“您大概怨恨我吧？”\u003c/p>\n\u003cp class=\"translation\">这里的“王”是楚共王。“子”是对对方的尊称；“其”表示推测，相当于“大概、恐怕”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“二国治戎（róng），臣不才，不胜（shèng）其任，以为俘馘（fú guó）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">知罃回答：“两国交战，我没有才能，不能胜任自己的职责，因此成了俘虏。”\u003c/p>\n\u003cp class=\"translation\">“治戎”是从事军事、交战；“胜”是能够承担。“俘”指俘虏，“馘”本指割取敌人的左耳以计战功，这里“俘馘”合起来指被敌军俘获。\u003c/p>\n\u003cp class=\"translation\">他把被俘归因于自己没有尽好职责，没有顺着楚王的话说“怨”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>执事不以衅（xìn）鼓，使归即戮（lù），君之惠也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您的部下没有杀我，用我的血来祭鼓，而是让我回国接受本国的刑罚，这是您的恩惠。”\u003c/p>\n\u003cp class=\"translation\">“执事”本指办事人员，这里借指楚王方面；“衅鼓”是用血涂鼓祭祀；“即戮”是接受诛杀。\u003c/p>\n\u003cp class=\"translation\">这里的“归即戮”是知罃以败军被俘者的身份自谦，并不是说晋国已经决定处死他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臣实不才，又谁敢怨？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“实在是我自己没有才能，又敢怨恨谁呢？”\u003c/p>\n\u003cp class=\"translation\">“谁敢怨”就是“敢怨谁”，疑问代词“谁”提前了。知罃的回答是：被俘是自己的责任，不能因此怨恨楚王。\u003c/p>\n\u003ch2>三、第二问：那你感激我吗？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王曰：“然则德我乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚王说：“既然如此，那么您感激我吗？”\u003c/p>\n\u003cp class=\"translation\">“德”在这里作动词，意思是感激、感恩。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“二国图其社稷（jì），而求纾（shū）其民，各惩（chéng）其忿（fèn），以相宥（yòu）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">知罃回答：“两国都是为自己的国家打算，希望减轻百姓的负担，所以各自克制愤怒，彼此宽恕。”\u003c/p>\n\u003cp class=\"translation\">“图”是谋划、考虑；“社稷”代指国家；“纾”是缓解；“惩”在这里是克制，不是惩罚；“宥”是宽恕。\u003c/p>\n\u003cp class=\"translation\">他把放人的原因放回两国关系中：双方都希望缓和冲突，因此达成交换。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>两释累（léi）囚，以成其好（hǎo）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“双方释放被拘押的俘虏，以促成两国的友好关系。”\u003c/p>\n\u003cp class=\"translation\">“累”指捆绑、拘系；“累囚”就是被拘押的俘虏。晋国释放谷臣，楚国释放知罃，是双方相互履约。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>二国有好，臣不与（yù）及，其谁敢德？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“两国达成友好，我并没有参与谋划，又敢把谁当作自己的私人恩人来感激呢？”\u003c/p>\n\u003cp class=\"translation\">“与”读yù，是参与；“与及”是参与其事；“谁敢德”就是“敢德谁”。\u003c/p>\n\u003cp class=\"translation\">知罃的意思是：这是两国为各自利益达成的安排，不能由我把它认作个人受到的特殊恩惠。\u003c/p>\n\u003ch2>四、第三问：你准备怎样报答我？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王曰：“子归，何以报我？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚王说：“您回国以后，准备用什么报答我？”\u003c/p>\n\u003cp class=\"translation\">“何以”就是“以何”，用什么。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“臣不任受怨，君亦不任受德。无怨无德，不知所报。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">知罃回答：“我这方面没有什么可怨的，您也不必承当我的感恩。既没有私怨，也没有私恩，我不知道有什么需要报答的。”\u003c/p>\n\u003cp class=\"translation\">这句话承接前面的两次回答：被俘，归咎于自己；获释，是两国交换的结果。因此，他不愿在自己与楚王之间建立一笔私人恩怨。传统注解也是从“我没有怨君、君没有私恩于我”来解释这句话。\u003c/p>\n\u003ch2>五、楚王继续追问，知罃表明立场\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王曰：“虽然，必告不谷（gǔ）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚王说：“即使这样，您也一定要告诉我。”\u003c/p>\n\u003cp class=\"translation\">“虽然”在古汉语中是“虽然如此、即使如此”；“不谷”是诸侯的谦称，“谷”有善的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“以君之灵，累臣得归骨于晋，寡君之以为戮，死且不朽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">知罃回答：“托您的福，让我这个被囚的人能够回到晋国；如果我国国君因此将我处死，即使死了，我也不会忘记您的恩惠。”\u003c/p>\n\u003cp class=\"translation\">“灵”在这里指福佑；“累臣”是被囚之臣的自称；“归骨”指使自己的身骨得以回到故国，不是说他已经死了。\u003c/p>\n\u003cp class=\"translation\">这里先设想第一种结果：回国后，由晋君按照本国的法度处置自己。“死且不朽”，按此处传统注解，是说即使身死，也不忘楚王让他回国的恩惠。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若从君惠而免之，以赐君之外臣首；首其请于寡君，而以戮于宗，亦死且不朽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果我国国君顺着您的恩惠，免我一死，把我交还给您的外臣荀首；荀首再向我国国君请求，在宗庙中处死我，我即使死了，也不会忘记您的恩惠。”\u003c/p>\n\u003cp class=\"translation\">“首”就是他的父亲荀首。“外臣”是本国臣子面对别国国君时的谦称。“宗”指宗庙。\u003c/p>\n\u003cp class=\"translation\">这是第二种设想：晋君不杀他，父亲仍可能依据宗族法度处置他。两层话都在说明：回国以后，他仍须接受晋国君臣、父子秩序中的处置。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若不获命，而使嗣（sì）宗职，次及于事，而帅（shuài）偏师以修封疆，虽遇执事，其弗敢违。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果父亲未能得到处死我的许可，而让我继承宗族的职务，轮到我承担军事任务，率领一支军队守治边疆，那么即使遇到您的军队，我也不敢回避。”\u003c/p>\n\u003cp class=\"translation\">“嗣”是继承；“宗职”指宗族世代承袭的职务；“次及于事”是按次序轮到承担事务，这里指军事任务；“帅”通“率”；“偏师”指一部分军队；“修封疆”是守治边疆。\u003c/p>\n\u003cp class=\"translation\">“弗敢违”在这里是不敢回避交战。意思是：如果将来奉晋君之命与楚军相遇，他仍会履行自己的军事职责。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其竭力致死，无有二心，以尽臣礼。所以报也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我会竭尽全力，拼死作战，绝无二心，尽到臣子的职责。这就是我报答您的方式。”\u003c/p>\n\u003cp class=\"translation\">“所以报”是“用来报答的方式”，不是现代汉语表示因果的“所以”。\u003c/p>\n\u003cp class=\"translation\">这句话看似奇怪：怎么与楚国拼死作战，反而是报答楚王？从知罃的论证来看，他坚持的是：您放回的是晋国臣子，我回去尽好晋臣的职责，才不失一个臣子应有的操守。他没有答应以将来的徇私退让，作为获释的交换。\u003c/p>\n\u003ch2>六、楚王更加礼遇他\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王曰：“晋未可与争。”重为之礼而归之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚王说：“晋国目前还不能与它争胜。”于是更加隆重地礼遇知罃，让他回国。\u003c/p>\n\u003cp class=\"translation\">“未可与争”是暂时还不宜与晋国争强；“归之”是让他回去。楚王从知罃的表现中，看到了晋国臣子的操守，因此作出这样的判断。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与名字\u003c/p>\n\u003cp class=\"translation\">标题的意思是“楚国让晋国的知罃回国”。“归”在这里是使……回去；“知”作为氏名，读zhì，也写作“智”。知罃又称荀罃，是晋国大夫荀首的儿子。\u003c/p>\n\u003cp class=\"translation\">### 私人恩惠与臣子职责（分析判断）\u003c/p>\n\u003cp class=\"translation\">知罃说话始终恭敬，却没有答应承担楚王期待的私人回报。他承认获释值得感谢，同时守住自己的职责：回国之后如何处置自己，由晋国决定；将来奉命作战，也不能因为今天获释，就对楚国有所徇私。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part024.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见的完整讲解整理；保留已有译意与词释，题意移至篇末。\u003c/p>\n\u003c/details>"}, {"id": "v02-05", "volume": 2, "volume_title": "卷二 · 周文", "number": 5, "title": "吕相绝秦", "file": "卷二/05-吕相绝秦.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《吕相（xiàng）绝秦》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·成公十三年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">吕相是晋国大夫，又称魏相。晋厉公派他向秦国宣布断绝关系，辞令追溯了秦晋几代国君之间的恩怨。这是晋国为出兵秦国所发表的外交辞令，叙事站在晋国立场。\u003c/p>\n\u003ch2>一、先叙秦晋旧好：秦国有恩，晋国也已报答\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>夏四月戊午（wù wǔ），晋侯使吕相绝秦，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夏季四月戊午这一天，晋国国君派吕相，向秦国宣布断绝关系，说了下面这番话。\u003c/p>\n\u003cp class=\"translation\">“晋侯”是晋厉公；“戊午”是干支纪日。下文由吕相传达晋君的意思，因此“我”“寡人”等称呼，要按晋国或晋君的口吻理解。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔逮（dài）我献公及穆公相好（hǎo），戮（lù）力同心，申之以盟誓，重（chóng）之以昏姻。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前，我国献公与贵国穆公交好，齐心协力，用盟誓反复申明友好，再用婚姻关系加以巩固。”\u003c/p>\n\u003cp class=\"translation\">“逮”是到、及；“戮力”是合力；“申”是申明、重申；“昏姻”同“婚姻”。晋献公曾把女儿嫁给秦穆公，两国结为姻亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>天祸晋国，文公如齐，惠公如秦。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“上天降祸给晋国，文公流亡到齐国，惠公向秦国求援。”\u003c/p>\n\u003cp class=\"translation\">这里追述晋国内乱。“文公”是重耳，“惠公”是夷吾，都是用他们后来的谥号称呼。“如”是往、到。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>无禄（lù），献公即世。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不幸，献公去世了。”\u003c/p>\n\u003cp class=\"translation\">“无禄”字面是没有福禄，在这里是表示不幸的套语；“即世”是去世。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>穆公不忘旧德，俾（bǐ）我惠公用能奉祀（sì）于晋。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“穆公没有忘记旧日的情谊，使我国惠公得以回到晋国，主持宗庙祭祀。”\u003c/p>\n\u003cp class=\"translation\">“俾”是使；“用”是因此；“奉祀于晋”表面说主持祭祀，实际指成为晋国国君。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>又不能成大勋，而为韩之师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“可是，穆公又没有把这份大功完成到底，反而发动了韩原之战。”\u003c/p>\n\u003cp class=\"translation\">“勋”是功业；“韩之师”指秦晋之间的韩原之战，晋惠公在此战中被秦军俘获。\u003c/p>\n\u003cp class=\"translation\">这句话把责任归向秦国，却略去了晋惠公此前背约等因素，是本文立场鲜明的一处。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>亦悔于厥（jué）心，用集我文公，是穆之成也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“穆公后来也在心里有所悔悟，于是扶助我国文公回国即位，这是穆公成就的功业。”\u003c/p>\n\u003cp class=\"translation\">“厥”是其、他的；“集”在这里是成就、安定，指帮助重耳回国即位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>文公躬擐（huàn）甲胄（zhòu），跋履山川，逾越险阻，征东之诸侯，虞、夏、商、周之胤（yìn），而朝（cháo）诸秦，则亦既报旧德矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“文公亲自披甲戴盔，跋山涉水，越过险阻，征讨东方诸侯，使那些虞、夏、商、周的后代向秦国朝见，这也已经报答了秦国过去的恩德。”\u003c/p>\n\u003cp class=\"translation\">“躬”是亲自；“擐”是穿；“甲胄”是铠甲和头盔；“胤”是后代；“朝诸秦”就是使他们朝见于秦。\u003c/p>\n\u003cp class=\"translation\">这一段先承认秦穆公有功，再强调：晋国已经报过恩，不能永远背着这笔人情债。\u003c/p>\n\u003ch2>二、围郑之事：晋国反过来说自己有恩于秦\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>郑人怒君之疆埸（yì），我文公帅（shuài）诸侯及秦围郑。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“郑国人侵犯了贵国边境，所以我国文公率领诸侯，与秦国一起包围郑国。”\u003c/p>\n\u003cp class=\"translation\">“怒”在这里按侵犯、触犯解释；“疆埸”是边界；“帅”同“率”。\u003c/p>\n\u003cp class=\"translation\">但这句话要与《烛之武退秦师》对照着看：那篇交代晋国围郑，是因为郑国曾对晋文公无礼，又依附楚国。这里却改从秦国受侵扰说起，是在为晋国的行动安排有利的说法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>秦大夫不询于我寡君，擅及郑盟。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“秦国大夫没有征求我国国君的意见，就擅自与郑国订立盟约。”\u003c/p>\n\u003cp class=\"translation\">指的就是烛之武说动秦穆公、秦国与郑国结盟撤军这件事。文中不直斥秦穆公，而把责任落在“秦大夫”身上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>诸侯疾之，将致命于秦。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯都痛恨这件事，准备拼死进攻秦军。”\u003c/p>\n\u003cp class=\"translation\">“疾”是痛恨；“致命”在这里是拼上性命。关于诸侯都准备进攻秦军的说法，旧注也指出其有夸饰。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>文公恐惧，绥靖（suí jìng）诸侯。秦师克还（huán）无害，则是我有大造于西也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“文公担心发生冲突，安抚诸侯，使秦军得以平安撤回，没有受到损害。这样说来，我国对西边的秦国，是有大恩的。”\u003c/p>\n\u003cp class=\"translation\">“绥靖”在这里是安抚、使安定；“克”是能够；“大造”是大功、大恩。\u003c/p>\n\u003cp class=\"translation\">这里的论证很巧：秦国单独撤军，本来是秦晋合作破裂；吕相却把晋国没有攻击秦军，说成保全秦国的大恩。\u003c/p>\n\u003ch2>三、追责秦穆公：崤之战是晋国不得已\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>无禄，文公即世。穆为不吊，蔑死我君，寡我襄公，迭（dié）我殽（xiáo）地，奸（gān）绝我好（hǎo），伐我保城。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不幸，文公去世。穆公却做出不善之事，轻慢我国已故的国君，轻视新即位的襄公，侵入我国崤山一带，侵犯并断绝两国的友好关系，攻打我国的城邑。”\u003c/p>\n\u003cp class=\"translation\">“不吊”在这里是不善；“蔑”是轻视；“寡”是看作弱小、轻视；“迭”按侵突解释；“殽”同“崤”；“奸”通“干”，是侵犯。\u003c/p>\n\u003cp class=\"translation\">这一段指秦穆公派兵远袭郑国、经过晋国附近的事情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>殄（tiǎn）灭我费滑（fèi huá），散离我兄弟，挠（náo）乱我同盟，倾覆我国家。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“灭掉与我国亲近的滑国，离散我们的兄弟之国，扰乱我们的同盟，企图颠覆我们的国家。”\u003c/p>\n\u003cp class=\"translation\">“殄灭”是灭绝；“费滑”指以费为都邑的滑国；“兄弟”指同姓之国。滑国与晋国同为姬姓，所以晋国将它称为兄弟之国。\u003c/p>\n\u003cp class=\"translation\">连续出现的“我”，是把秦国的行动一项项写成对晋国利益的侵犯。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我襄公未忘君之旧勋，而惧社稷之陨（yǔn），是以有殽之师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我国襄公没有忘记穆公过去的功劳，但又担忧国家灭亡，所以才有了崤山之战。”\u003c/p>\n\u003cp class=\"translation\">“社稷”代指国家；“陨”是坠落，这里指覆亡。\u003c/p>\n\u003cp class=\"translation\">“是以有……”即“因此才发生……”。吕相反复使用这种句式，把晋国作战说成被迫应战。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>犹愿赦（shè）罪于穆公，穆公弗听，而即楚谋我。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们仍希望穆公宽恕崤山之战所造成的过节，但穆公不肯，反而接近楚国，谋划对付我国。”\u003c/p>\n\u003cp class=\"translation\">“赦罪于穆公”是希望从穆公那里得到宽恕；“即楚”是接近、联合楚国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>天诱其衷，成王陨命，穆公是以不克逞（chěng）志于我。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“上天引导了人的内心，使楚成王丧命，穆公因此没能实现对付我国的意图。”\u003c/p>\n\u003cp class=\"translation\">“成王”是楚成王，不是周成王；他被儿子商臣逼迫而死。“逞志”是实现意图。\u003c/p>\n\u003cp class=\"translation\">这里把楚国的宫廷政变说成有利于晋国的天意，是这篇外交辞令中的说法。\u003c/p>\n\u003ch2>四、追责秦康公：既是亲戚，却仍攻打晋国\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>穆、襄即世，康、灵即位。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“秦穆公、晋襄公去世后，秦康公、晋灵公分别即位。”\u003c/p>\n\u003cp class=\"translation\">“穆、康”是秦国国君，“襄、灵”是晋国国君，读时不要混在一起。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>康公，我之自出，又欲阙（jué）翦（jiǎn）我公室，倾覆我社稷，帅我蟊（máo）贼，以来荡摇我边疆。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“康公是从我国嫁出去的女子所生，却又想毁坏我国公室，颠覆我国国家，率领我国的祸患人物，前来扰乱边境。”\u003c/p>\n\u003cp class=\"translation\">秦康公的母亲是晋献公之女，所以从晋国立场说，他是“我之自出”，也就是晋国女子所生的外甥。\u003c/p>\n\u003cp class=\"translation\">“阙”通“掘”，有挖毁之意；“翦”是剪除；“公室”指国君家族；“蟊贼”本指害虫，这里贬称公子雍。\u003c/p>\n\u003cp class=\"translation\">此处又有明显的偏袒：公子雍原本是晋国一些大臣请秦国护送回国、准备拥立的人，文中却把他写成秦国带来扰乱晋国的祸患。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我是以有令（líng）狐之役。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我国因此才有了令狐之战。”\u003c/p>\n\u003cp class=\"translation\">“令狐”是地名。注意这里的令狐之战，与后文的令狐会盟，是不同的事情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>康犹不悛（quān），入我河曲，伐我涑（sù）川，俘我王官，翦我羁（jī）马。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“康公仍不改悔，又进入我国河曲，攻打涑川，俘掠王官，夺取羁马。”\u003c/p>\n\u003cp class=\"translation\">“悛”是改悔；河曲、涑川、王官、羁马都是文中涉及的地名；“俘”指俘掠当地人员，“翦”在这里指攻取。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我是以有河曲之战。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我国因此才有了河曲之战。”\u003c/p>\n\u003cp class=\"translation\">又一次强调：晋国是受到侵扰后，才出兵作战。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>东道之不通，则是康公绝我好也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“秦国与东方晋国的往来道路不再畅通，这是康公断绝了两国友好关系的结果。”\u003c/p>\n\u003cp class=\"translation\">晋国在秦国东面，所以说“东道”。这一句把秦晋关系破裂的责任归给秦康公。\u003c/p>\n\u003ch2>五、追责在位的秦桓公：趁晋国内患而进攻\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>及君之嗣（sì）也，我君景公引领西望，曰：‘庶（shù）抚我乎！’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“等到您继位，我国景公伸长脖子向西盼望，说：‘或许会来安抚、亲近我们吧！’”\u003c/p>\n\u003cp class=\"translation\">这里的“君”指当时在位的秦桓公；“景公”是晋景公。“嗣”是继位；“引领”是伸长脖子；“庶”表示希望、或许。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君亦不惠称（chèn）盟，利吾有狄难（nàn），入我河县，焚我箕郜（jī gào），芟（shān）夷我农功，虔刘我边陲（chuí）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您却不肯施惠，满足我们结盟的愿望，反而趁我国遭遇狄人之患，侵入河县，焚烧箕郜，毁坏庄稼，杀戮边境百姓。”\u003c/p>\n\u003cp class=\"translation\">“称”是符合、满足；“利”是把对方的困难当作可乘之机；河县、箕郜是地名；“芟夷”是割除、毁坏；“农功”指农作物；“虔刘”是杀戮；“边陲”是边境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我是以有辅氏之聚。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我国因此才在辅氏集结军队。”\u003c/p>\n\u003cp class=\"translation\">“聚”是集结，指聚兵抵御秦军。前面依次说“之师”“之役”“之战”，这里换成“之聚”，意思相近而措辞有变化。\u003c/p>\n\u003ch2>六、一度准备重修旧好，秦国却再次背盟\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>君亦悔祸之延，而欲徼（jiāo）福于先君献、穆，使伯车来命我景公，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您后来也悔恨两国的祸患不断延续，希望从先君献公、穆公那里求得福佑，于是派伯车来告诉我国景公，说了下面这番话。”\u003c/p>\n\u003cp class=\"translation\">“徼福”是求福；“献、穆”分别指晋献公、秦穆公；伯车是秦桓公之子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>‘吾与女（rǔ）同好（hǎo）弃恶（è），复修旧德，以追念前勋。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘我愿与你共同交好，抛弃过去的仇怨，重新恢复旧日的情谊，追念先人的功业。’”\u003c/p>\n\u003cp class=\"translation\">“女”通“汝”，是你；“恶”在这里指仇怨；“旧德”指旧日的恩德、情谊。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>言誓未就，景公即世，我寡君是以有令狐之会。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“盟誓还没有完成，景公便去世了，所以我国现任国君与您举行了令狐会盟。”\u003c/p>\n\u003cp class=\"translation\">“就”是完成；“我寡君”指晋厉公。这次会盟承接的是晋景公未完成的和好安排。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君又不祥，背（bèi）弃盟誓。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您却又做出不善之事，背弃盟誓。”\u003c/p>\n\u003cp class=\"translation\">“不祥”在这里指不善。前面追述几代恩怨，到这里才切入此次绝交的直接指控。\u003c/p>\n\u003ch2>七、白狄、楚国都来揭露秦国的两面做法\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>白狄及君同州，君之仇雠（chóu），而我之昏姻也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“白狄与贵国同处一州，是贵国的仇敌，却与我国有婚姻关系。”\u003c/p>\n\u003cp class=\"translation\">“及”是与；“仇雠”是仇敌；“昏姻”是姻亲。这里按古代九州的说法，将秦国和白狄视为同处雍州。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君来赐命曰：‘吾与女伐狄。’寡君不敢顾昏姻，畏君之威，而受命于使。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您派人来告诉我们：‘我和你一起讨伐狄人。’我国国君不敢顾念姻亲关系，畏惧您的威势，便从使者那里接受了要求。”\u003c/p>\n\u003cp class=\"translation\">“赐命”“畏君之威”都是外交辞令，表示晋国当时愿意配合秦国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君有二心于狄，曰：‘晋将伐女。’狄应且憎，是用告我。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您却又对白狄另说一套，告诉他们：‘晋国将要攻打你们。’白狄表面应答，心里却憎恶您的做法，因此把事情告诉了我国。”\u003c/p>\n\u003cp class=\"translation\">“二心”指用心不一；“是用”是因此。文中指控秦国一面邀晋攻狄，一面又向白狄通报晋国的行动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚人恶（wù）君之二三其德也，亦来告我，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“楚国人厌恶您反复无常，也来告诉我国，说了下面这番话。”\u003c/p>\n\u003cp class=\"translation\">“恶”读wù，是厌恶；“二三其德”是心意、行为反复变化，不守信用。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>‘秦背令狐之盟，而来求盟于我，昭告昊（hào）天上帝、秦三公、楚三王，曰：“余虽与晋出入，余唯利是视。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘秦国背弃令狐盟约，前来请求与我国结盟，并郑重告知上天、秦国三位先公和楚国三位先王，说：“我虽然与晋国往来，但我只看利益。”’”\u003c/p>\n\u003cp class=\"translation\">“昭告”是郑重明白地告知；“出入”指交往；“唯利是视”就是只看利益。“秦三公”按旧注指穆公、康公、共公；“楚三王”指成王、穆王、庄王。\u003c/p>\n\u003cp class=\"translation\">这里是吕相转述楚国来信，来信又引用秦国的盟誓，读时要分清说话层次。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不谷（gǔ）恶其无成德，是用宣之，以惩不一。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘我厌恶秦国没有恒定可信的操守，因此把这些话公布出来，以惩戒它用心不一。’”\u003c/p>\n\u003cp class=\"translation\">这里的“不谷”是楚共王自称，仍然属于楚国来信的内容。“成德”在这里指稳定的德行、操守；“不一”指反复无常。\u003c/p>\n\u003ch2>八、最后通牒：愿意结盟就退兵，否则继续进军\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>诸侯备闻此言，斯是用痛心疾首，昵（nì）就寡人。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯都已听到这些话，因此深感痛恨，纷纷亲近、归附寡人。”\u003c/p>\n\u003cp class=\"translation\">“备”是全部、充分；“疾首”是头痛，与“痛心”合起来形容深切的憎恶；“昵就”是亲近、靠拢。这里的“寡人”是晋厉公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>寡人帅以听命，唯好（hǎo）是求。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“寡人率领诸侯前来听候您的决定，只求两国友好。”\u003c/p>\n\u003cp class=\"translation\">表面说“听命”“求好”，实际上诸侯军队已经来到，接下来的话带有最后通牒的意味。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君若惠顾诸侯，矜（jīn）哀寡人，而赐之盟，则寡人之愿也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您如果肯施惠顾念诸侯，怜悯寡人，与我们订立盟约，那就是寡人的愿望。”\u003c/p>\n\u003cp class=\"translation\">“矜哀”是怜悯。这些谦辞给秦国留出了接受和议的余地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其承宁诸侯以退，岂敢徼（jiāo）乱？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“那么寡人便会使诸侯安定，率领他们退兵，哪里敢谋求战乱呢？”\u003c/p>\n\u003cp class=\"translation\">“宁”是使安定；“徼乱”是求取、挑起祸乱。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>君若不施大惠，寡人不佞（nìng），其不能以诸侯退矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您如果不肯施以这样的恩惠，寡人虽然没有才能，恐怕也不能率领诸侯退兵了。”\u003c/p>\n\u003cp class=\"translation\">“不佞”是没有才干的谦称。这句话真正的分量在后半句：不接受结盟条件，联军就不会撤退。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>敢尽布之执事，俾（bǐ）执事实图利之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“冒昧地把这些全部陈述给贵方，请贵方认真考虑，作出有利于自己的选择。”\u003c/p>\n\u003cp class=\"translation\">“布”是陈述、说明；“执事”是对对方的敬称；“俾”是使、请；“图”是考虑、谋划。\u003c/p>\n\u003cp class=\"translation\">最后没有直说“你必须投降”，而是说“请考虑自己的利益”。措辞仍然客气，军事压力却已摆明。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### “实图利之”是什么意思？（追问）\u003c/p>\n\u003cp class=\"translation\">“实图利之”就是认真考虑，怎样做才对自己有利。“实”是确实、切实，这里有务必认真的语气；“图”是考虑、谋划；“利之”是使自己这一方得利，这里指秦国。\u003c/p>\n\u003cp class=\"translation\">整句可译为“请贵方认真权衡，作出对秦国有利的选择”。结合前文，其压力是：结盟就退兵，不结盟就继续进军，请秦国考虑哪一种对自己有利。\u003c/p>\n\u003cp class=\"translation\">### 外交辞令的立场（分析判断）\u003c/p>\n\u003cp class=\"translation\">秦国的援助被承认，但马上说晋国已经报恩；秦国的进攻被逐项列举，晋国的作战则反复说成“我是以有……”——都是被迫应对。因此，读它既要看辞令的气势，也要留意哪些事实被强调，哪些背景被略去。\u003c/p>\n\u003cp class=\"translation\">《古文观止》的旧注也指出其中一些偏袒晋国、归罪秦国的说法，不能把本文每项指责直接当作公允的历史结论。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part025.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见完整讲解整理；保留原有译意、词释、立场提醒和“实图利之”追问。原句跨段引号作排版归并，不改变文字。\u003c/p>\n\u003c/details>"}, {"id": "v02-06", "volume": 2, "volume_title": "卷二 · 周文", "number": 6, "title": "驹支不屈于晋", "file": "卷二/06-驹支不屈于晋.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《驹（jū）支不屈于晋》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公十四年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前559年，晋国在向地举行诸侯会议，范宣子准备拘捕姜戎首领驹支。驹支当面申辩，追述本族对晋国的贡献，并否认泄漏盟会言语的指控。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>会于向，将执戎子驹（jū）支。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">诸侯在向地会盟，晋国准备拘捕戎人首领驹支。“戎子”是对其首领身份的称呼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>范宣子亲数（shǔ）诸朝。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">范宣子亲自在朝会上列举罪状责问他。“数”是逐项责备。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“来，姜戎氏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他说：“过来，姜戎氏！”这里以族名称驹支。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔秦人迫逐乃祖吾离于瓜州，乃祖吾离被苫（shān）盖，蒙荆棘，以来归我先君。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“过去秦人把你的祖先吾离赶出瓜州，你祖先穿盖茅草、冲过荆棘，前来归附我们的先君。”这番话强调姜戎当初的困境。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我先君惠公有不腆（tiǎn）之田，与女（rǔ）剖分而食之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“先君晋惠公有一点不丰厚的土地，分给你们共同取食。”“不腆”是谦称不丰厚，“女”通“汝”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今诸侯之事我寡君不如昔者，盖言语漏泄，则职女（rǔ）之由。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在诸侯侍奉我国国君不如从前，想必是机密言语泄漏，责任正在你们身上。”“职”是主要、专由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>诘（jié）朝之事，尔无与焉！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“明天的会事，你不许参加！”“诘朝”是次日早晨。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>与，将执女（rǔ）。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“参加，就拘捕你。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“昔秦人负恃其众，贪于土地，逐我诸戎。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">驹支回答：“从前秦人倚仗人多，贪图土地，驱逐我们各部戎人。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>惠公蠲（juān）其大德，谓我诸戎是四岳之裔胄（yì zhòu）也，毋是翦弃。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“惠公彰明他的大德，认为我们诸戎是四岳的后裔，不应剪除抛弃。”“蠲”在这里是显示、彰明，“裔胄”是后代。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>赐我南鄙之田，狐狸所居，豺狼所嗥。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他赐给我们南部边境的土地，那里是狐狸栖居、豺狼嚎叫的地方。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我诸戎除翦其荆棘，驱其狐狸豺狼，以为先君不侵不叛之臣，至于今不贰。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们各部戎人砍除荆棘、驱逐狐狸豺狼，成为不侵犯、不背叛先君的臣属，直到今天没有二心。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔文公与秦伐郑，秦人窃与郑盟而舍戍焉，于是乎有崤（xiáo）之师。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前文公与秦国共同攻郑，秦国暗中与郑国结盟，留下守军，于是后来发生了崤之战。”这是驹支追述秦晋冲突的来由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋御其上，戎亢（kàng）其下，秦师不复，我诸戎实然。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“晋军从高处迎击，我们戎人从低处阻截，秦军不能回去，确实有我们的功劳。”“亢”通“抗”，指抵御。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>譬如捕鹿，晋人角之，诸戎掎（jǐ）之，与晋踣（bó）之，戎何以不免？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“好比捉鹿，晋人抓住它的角，我们戎人牵住它的腿，与晋人一起把它扑倒，戎人为什么不能免于责难？”“掎”是牵住后腿，“踣”是使倒下。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自是以来，晋之百役，与我诸戎相继于时，以从执政，犹崤（xiáo）志也，岂敢离逷（tì）？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从那以后，晋国各种军事行动，我们诸戎总按时接续参加，服从执政，仍像崤之战那样忠诚，哪里敢离心疏远呢？”“逷”通“逖”，是远。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今官之师旅，无乃实有所阙，以携诸侯，而罪我诸戎。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在贵国的军政事务恐怕确有缺失，使诸侯离心，却把罪责加给我们诸戎。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我诸戎饮食衣服不与华同，贽（zhì）币不通，言语不达，何恶之能为？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们戎人的饮食衣服与华夏不同，不互通礼品，语言也不相通，能干出什么泄密坏事呢？”“贽币”是交往所用礼物。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不与于会，亦无瞢（méng）焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“即使不许我参加会盟，我也不会因此困惑怨愤。”“瞢”在这里取昏惑、闷懑之意，表现其不受威吓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>赋《青蝇》而退。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他赋诵《青蝇》后退下。这首诗警惕谗言，借以回应范宣子的指控。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宣子辞焉，使即事于会，成恺悌（kǎi tì）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">范宣子向他道歉，让他参加会盟事务，这才成就了和乐平易的德行。“恺悌”是和乐平易，后半句是叙述者的评语。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷2)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷2\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v02-07", "volume": 2, "volume_title": "卷二 · 周文", "number": 7, "title": "祁奚请免叔向", "file": "卷二/07-祁奚请免叔向.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《祁（qí）奚（xī）请免叔向》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公二十一年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">叔向的弟弟羊舌虎卷入政治斗争，被范宣子杀死，叔向也受到牵连，被囚禁。有人主动说要救他，他却不回应，反而相信已经退休的祁奚会出面。\u003c/p>\n\u003ch2>一、受到牵连，叔向却很镇定\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>栾（luán）盈出奔楚。宣子杀羊舌虎，囚叔向。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国大夫栾盈逃亡到楚国。范宣子杀了羊舌虎，又囚禁了叔向。\u003c/p>\n\u003cp class=\"translation\">“出奔”是离开本国、逃往外国。“宣子”是晋国执政大夫范宣子，并非《郑子家告赵宣子》中的赵宣子。羊舌虎是栾盈的同党，也是叔向的弟弟。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>人谓叔向曰：“子离于罪，其为不知（zhì）乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有人对叔向说：“您遭到了罪责的牵连，恐怕算不上明智吧？”\u003c/p>\n\u003cp class=\"translation\">“离”通“罹”，是遭遇；“知”通“智”。这人是在说：你平时被认为有智慧，怎么连自己都保护不了？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>叔向曰：“与其死亡若何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向说：“与死去或者逃亡相比，如今这样怎么样呢？”\u003c/p>\n\u003cp class=\"translation\">这里的“死亡”可以分开理解为“死”和“亡”：“死”是被杀，“亡”是逃亡。他的意思是：眼下虽然被囚，处境仍比丧命或流亡好。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“《诗》曰：‘优哉游哉，聊以卒岁。’知也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗》说：‘从容自在，姑且这样度过岁月。’这也是明智啊。”\u003c/p>\n\u003cp class=\"translation\">“聊”是姑且；“卒”是终、度完。“优哉游哉”在这里表现的是身处困境仍保持从容，不能简单理解成他觉得坐牢舒服。\u003c/p>\n\u003ch2>二、有人主动求情，叔向却不回应\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>乐（yuè）王鲋（fù）见叔向，曰：“吾为（wèi）子请。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国大夫乐王鲋来见叔向，说：“我替您向国君求情。”\u003c/p>\n\u003cp class=\"translation\">“为子请”是为你请求赦免。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>叔向弗应。出，不拜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向没有回应。乐王鲋离开时，叔向也没有拜谢。\u003c/p>\n\u003cp class=\"translation\">“出”的主语是乐王鲋，“不拜”的主语是叔向。叔向既没有接受他的许诺，也没有先向他表示感谢。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其人皆咎（jiù）叔向。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向身边的人都责怪他。\u003c/p>\n\u003cp class=\"translation\">“咎”作动词，是责怪。他们觉得：别人愿意救你，你怎么反而不领情？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>叔向曰：“必祁大夫。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向说：“能救我的，一定是祁大夫。”\u003c/p>\n\u003cp class=\"translation\">“祁大夫”就是祁奚。这句话省略了“能够使我获免的人”等意思。\u003c/p>\n\u003ch2>三、叔向为什么相信祁奚？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>室老闻之，曰：“乐王鲋言于君，无不行，求赦（shè）吾子，吾子不许。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">家臣之长听了，说：“乐王鲋向国君进言，没有不被采纳的。他愿意请求赦免您，您却不答应。”\u003c/p>\n\u003cp class=\"translation\">“室老”是家臣之长；“吾子”是对叔向的敬称，不是“我的儿子”。“行”指意见被实行、采纳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>祁大夫所不能也，而曰必由之，何也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“祁大夫反而没有这种影响力，您却说一定要靠他，这是为什么？”\u003c/p>\n\u003cp class=\"translation\">室老看重的是谁受国君宠信、谁说话管用。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>叔向曰：“乐王鲋，从君者也，何能行？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向说：“乐王鲋只是顺着国君心意的人，怎么能够办成救我这件事呢？”\u003c/p>\n\u003cp class=\"translation\">“从君”在这里指一味顺从国君。他虽然受宠，但如果国君有意治罪，他未必愿意逆着国君说话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“祁大夫外举不弃雠（chóu），内举不失亲，其独遗我乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“祁大夫举荐外人，不因私仇而排斥仇人；举荐自己家里的人，也不因亲属关系而遗漏贤才。难道会单单遗漏我吗？”\u003c/p>\n\u003cp class=\"translation\">“雠”同“仇”；“举”是举荐；“遗”是遗漏。这里提到祁奚曾举荐仇人解狐，也曾举荐儿子祁午，强调他判断人的标准是是否贤能。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“《诗》曰：‘有觉（jué）德行（xìng），四国顺之。’夫子，觉者也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗》说：‘有正大德行的人，四方都会顺从他。’祁大夫就是这样正直的人。”\u003c/p>\n\u003cp class=\"translation\">“觉”在这里是正大、正直；“四国”指四方之国；“夫子”是对祁奚的尊称。\u003c/p>\n\u003cp class=\"translation\">叔向判断谁可靠，依据的是对方会不会坚持自己的判断。\u003c/p>\n\u003ch2>四、乐王鲋果然没有替他说情\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晋侯问叔向之罪于乐王鲋，对曰：“不弃其亲，其有焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋平公向乐王鲋询问叔向是否有罪，乐王鲋回答：“叔向不会撇开自己的亲人，大概也参与了吧。”\u003c/p>\n\u003cp class=\"translation\">前一个“其”指叔向，后一个“其”表示推测。“有焉”指参与其事。\u003c/p>\n\u003cp class=\"translation\">他没有提出叔向参与的证据，却从兄弟关系推测叔向有罪。这与他先前主动许诺求情，形成了鲜明对照。\u003c/p>\n\u003ch2>五、祁奚出面：留下叔向，是国家的需要\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>于是祁奚老矣，闻之，乘驲（rì）而见宣子，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这时祁奚已经告老退休，听说叔向被囚，便乘驿车去见范宣子，说了下面这番话。\u003c/p>\n\u003cp class=\"translation\">“老”在这里含有告老退休的意思；“驲”是驿站传递消息所用的车。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“《诗》曰：‘惠我无疆，子孙保之。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗》说：‘给予我们的恩惠没有止境，子孙也能够长久享有。’”\u003c/p>\n\u003cp class=\"translation\">“惠”是恩惠；“疆”是边界、限度；“保”是保持、享有。祁奚先提出：有功德者的贡献，能够长久惠及后人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《书》曰：‘圣有谟（mó）勋（xūn），明征定保。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《尚书》说：‘圣哲之人有谋略功勋，应当明确考察，安定保护他们。’”\u003c/p>\n\u003cp class=\"translation\">“谟”是谋略；“勋”是功劳；“征”是验证、考察。这里引经，是为保护有功、有才能的人建立依据。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫谋而鲜（xiǎn）过，惠训不倦者，叔向有焉，社稷之固也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“谋划事情很少出错，又能不断施惠、教导别人，这些才能叔向都具备。他是使国家稳固的人。”\u003c/p>\n\u003cp class=\"translation\">“鲜”是少；“惠训”是施惠、教导；“社稷之固”是国家赖以稳固的力量。\u003c/p>\n\u003cp class=\"translation\">这是祁奚劝说的核心：叔向值得保全，因为他对国家有用。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>犹将十世宥（yòu）之，以劝能者。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“即使宽宥他的十代子孙，用来勉励有才能的人，也是应该考虑的。”\u003c/p>\n\u003cp class=\"translation\">“宥”是宽恕；“劝”是勉励。这里把功臣的功劳能够惠及后代说到很远，以加强下一句的反问。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今壹不免其身，以弃社稷，不亦惑乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今却连他本人都不能免于牵连，反而舍弃国家所倚重的人，不是太糊涂了吗？”\u003c/p>\n\u003cp class=\"translation\">“壹”是竟、却连一次；“惑”是糊涂。“弃社稷”并不是直接丢掉国家，而是说舍弃能够保障国家的人。\u003c/p>\n\u003ch2>六、亲属有罪，不能因此废弃贤才\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>鲧（gǔn）殛（jí）而禹兴。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“鲧受到了诛罚，禹却仍然被起用、兴起。”\u003c/p>\n\u003cp class=\"translation\">鲧是禹的父亲；“殛”是诛罚。这个例子的意思是：父亲有罪，并不妨碍儿子因才能而得到任用。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>伊尹（yī yǐn）放大（tài）甲而相（xiàng）之，卒（zú）无怨色。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“伊尹曾放逐太甲，后来又辅佐他，太甲始终没有因此表现出怨恨。”\u003c/p>\n\u003cp class=\"translation\">“大甲”即太甲，商代君主；“相”是辅佐；“卒”是最终、始终。按传统叙述，伊尹放逐太甲使其改过，之后迎回辅佐。这里强调，不因曾经的冲突而废弃贤臣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>管、蔡为戮（lù），周公右王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“管叔、蔡叔受到了诛罚，周公却仍然辅佐周王。”\u003c/p>\n\u003cp class=\"translation\">“右”通“佑”，是辅佐；“王”指周成王。管叔、蔡叔与周公是兄弟，祁奚借此说明：兄弟有罪，不该连带废弃另一个有才能的人。\u003c/p>\n\u003cp class=\"translation\">这里“管、蔡为戮”是概括性的表述；传统史事中，管叔被杀，蔡叔被流放，不宜据此简单说两人都被杀。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若之何其以虎也弃社稷？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“怎么能够因为羊舌虎，就舍弃国家所倚重的人呢？”\u003c/p>\n\u003cp class=\"translation\">“若之何”就是“怎么”；“以虎”是因为羊舌虎。祁奚把前面几个例子落回眼前：弟弟羊舌虎有罪，不能因此就认定哥哥叔向也该被废弃。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子为善，谁敢不勉？多杀何为？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您如果推行善政，谁敢不努力向善？何必靠多杀人来治理呢？”\u003c/p>\n\u003cp class=\"translation\">“勉”是努力；“多杀何为”就是“为什么要多杀人”。祁奚最后把问题交给范宣子：执政者应当以什么方式引导人心？\u003c/p>\n\u003ch2>七、救人之后，两人都没有把它变成私恩\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>宣子说（yuè），与之乘（chéng），以言诸公而免之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">范宣子听后很高兴，与祁奚同乘一辆车，向晋平公进言，使叔向得到赦免。\u003c/p>\n\u003cp class=\"translation\">“说”通“悦”；“诸公”是“之于公”的合音，即把这件事向国君陈说。“乘”按本会话后续订正读chéng，指同乘一车。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不见叔向而归。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">祁奚没有去见叔向，就回去了。\u003c/p>\n\u003cp class=\"translation\">他救下叔向之后，没有特意去让叔向知道自己出了多少力。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>叔向亦不告免焉而朝（cháo）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向也没有去向祁奚报告自己获免、表示谢意，便前去朝见国君。\u003c/p>\n\u003cp class=\"translation\">“焉”在这里指向祁奚。“朝”是朝见国君，意味着叔向回去履行自己的职责。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与读音订正\u003c/p>\n\u003cp class=\"translation\">“请免”是请求赦免；“叔向”是晋国大夫，题目不是“请免向叔”。“与之乘”在首次讲解中曾误标shèng，后续已明确订正为chéng；“一乘兵车”的“乘”才读shèng。\u003c/p>\n\u003cp class=\"translation\">### 为什么两人不相见？（传统解读与分析）\u003c/p>\n\u003cp class=\"translation\">文章以两人的“不相见”收尾。按上下文及传统评点，这表现的是：祁奚为国家保全贤才，叔向也以继续任职回应；他们没有把这件公事变成一笔私人恩情。这是传统评点对人物境界的解释，并非原文直接交代的内心独白。\u003c/p>\n\u003cp class=\"translation\">### 主事的是范宣子还是晋侯？（原文记载）\u003c/p>\n\u003cp class=\"translation\">晋侯是晋平公，晋国国君；范宣子名士匄（gài），是当时的执政大夫、中军将。三句连起来看：“宣子杀羊舌虎，囚叔向”说明范宣子主持实际处置；“晋侯问叔向之罪于乐王鲋”说明国君也在过问；“以言诸公而免之”说明祁奚说服范宣子后，两人再向晋平公进言，叔向最终获免。\u003c/p>\n\u003cp class=\"translation\">### 如果国君反对，范宣子还能杀吗？（分析及限度）\u003c/p>\n\u003cp class=\"translation\">按君臣名分，范宣子应当服从国君；实际能否拦住，则要看双方力量与其他卿族的支持。如果范宣子接受国君决定，处置停止；如果坚持，可能继续劝说、施压；如果公然违命，则成为政治权力冲突。\u003c/p>\n\u003cp class=\"translation\">本篇没有记载两人发生这种冲突，不能据此断定“晋侯不同意也挡不住”，也不能断定“范宣子所有杀人决定都先经过晋侯批准”。祁奚先改变主持案件者的意见，再通过国君完成赦免，避免正面冲突，是根据文章过程作出的理解。\u003c/p>\n\u003cp class=\"translation\">### 晋国国君与执政大夫怎样制衡？（背景分析）\u003c/p>\n\u003cp class=\"translation\">以晋平公、范宣子时期而言，国君拥有君位、发布君命及任用官员等权威，执政大夫主持大量军政事务；其他卿族凭职位、封邑、家臣和武装形成牵制。不能把它想象成有一张固定不变的现代职权表，也不能把国君直接等同于后世集权皇帝。\u003c/p>\n\u003cp class=\"translation\">卿大夫失去官职，其家族的土地、收入、家臣和影响力未必随之消失；国君撤换强卿，面对的是有根基的贵族家族。另一方面，范宣子居于执政首位，不等于其他卿族的力量都属于范氏：国君可以争取其他卿族，卿族也可能彼此联合限制国君。\u003c/p>\n\u003cp class=\"translation\">这种牵制依靠利益、联盟、礼制与政治名分，并无保证和平解决冲突的稳定机制。晋厉公清除三郤后又被栾书、中行偃控制，最终遭到杀害，是此前冲突的实例。后来“六卿强，公室卑”的局面，不能原样倒推到本篇所处时期。\u003c/p>\n\u003cp class=\"translation\">以上是本会话已有的制度背景分析，区别于本篇直接记载的案件过程。\u003c/p>\n\u003cp class=\"translation\">参考：\u003ca href=\"https://www.chineseclassic.com/content/749)；[《左传·成公》](https://zh.wikisource.org/wiki/春秋左氏傳/成公\" target=\"_blank\" rel=\"noopener\">《左传·襄公二十一年》\u003c/a>；\u003ca href=\"https://zh.wikisource.org/wiki/史記/卷039\" target=\"_blank\" rel=\"noopener\">《史记·晋世家》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part027.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见完整讲解及后续追问整理，采用已确认的“乘（chéng）”修订；国君与执政大夫关系的讨论保留在篇末。\u003c/p>\n\u003c/details>"}, {"id": "v02-08", "volume": 2, "volume_title": "卷二 · 周文", "number": 8, "title": "子产告范宣子轻币", "file": "卷二/08-子产告范宣子轻币.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《子产告范宣子轻币》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公二十四年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">范宣子主持晋国政务，诸侯向晋国交纳礼物的负担沉重，郑国深受其苦。郑国大夫子产写信劝他，少向诸侯索取财物，多为晋国和自己积累德行、声望。\u003c/p>\n\u003ch2>一、诸侯负担太重，子产写信劝告\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>范宣子为政，诸侯之币重，郑人病之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">范宣子主持晋国政务，各诸侯国向晋国交纳的礼物负担很重，郑国人深受其苦。\u003c/p>\n\u003cp class=\"translation\">“为政”是执政；“重”指数量多、价值高、负担重；“病”在这里是感到困苦，不是生病。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>二月，郑伯如晋。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">二月，郑国国君前往晋国。\u003c/p>\n\u003cp class=\"translation\">“郑伯”是郑简公；“如”是往、到。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产寓书于子西，以告宣子，曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产把信托付给子西，借此劝告范宣子，说了下面这番话。\u003c/p>\n\u003cp class=\"translation\">“寓”是寄托、托付；子西是陪同郑简公前往晋国的郑国大夫。子产通过他，把信转达给范宣子。\u003c/p>\n\u003ch2>二、治理国家，最该担心的是什么？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>“子为晋国，四邻诸侯，不闻令德，而闻重币，侨（qiáo）也惑之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您治理晋国，四邻诸侯没有听说您的美德，却只听说礼物负担沉重，我对此感到疑惑。”\u003c/p>\n\u003cp class=\"translation\">“子”是对范宣子的尊称；“令”是美好；“令德”是美德；“侨”是子产的名，他在信中自称其名。\u003c/p>\n\u003cp class=\"translation\">开头便将两件事摆在一起：诸侯记住的，应该是你的德政，还是你的索取？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>侨闻君子长（zhǎng）国家者，非无贿（huì）之患，而无令名之难。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说，君子治理国家，所担忧的不是没有财物，而是难以获得美好的声望。”\u003c/p>\n\u003cp class=\"translation\">“长”是主持、治理；“贿”在这里泛指财物，不专指贿赂；“令名”是好名声。\u003c/p>\n\u003cp class=\"translation\">这里的“非无贿之患”，要理解为“不以没有财物为忧患”。\u003c/p>\n\u003ch2>三、财物归公，还是归私，都可能招来离心\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>夫诸侯之贿，聚于公室，则诸侯贰（èr）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯的财物，如果集中到晋国公室，诸侯就会对晋国产生二心。”\u003c/p>\n\u003cp class=\"translation\">“公室”指晋国国君一方；“贰”是有二心、离心。诸侯长期承受盘剥，便不愿继续归附晋国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若吾子赖之，则晋国贰。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果您自己依靠这些财物获利，那么晋国人就会对您产生二心。”\u003c/p>\n\u003cp class=\"translation\">“赖之”是从中获利。上一句说财物归入国君公室，这一句说范宣子个人及其家族从中获利。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>诸侯贰，则晋国坏；晋国贰，则子之家坏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯离心，晋国的地位和安定就会受损；晋国人对您离心，您的家族就会败坏。”\u003c/p>\n\u003cp class=\"translation\">这里的“家”指范氏卿大夫家族，也包括它的政治地位与势力。\u003c/p>\n\u003cp class=\"translation\">这几句话体现了晋国公室与范氏家族各有利益，但都不能失去支持自己的力量。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>何没没（mò mò）也？将焉（yān）用贿？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“为什么要这样沉迷不悟呢？要这些财物，究竟有什么用？”\u003c/p>\n\u003cp class=\"translation\">“没没”是沉溺、昏昧；“焉”在这里是哪里、何处，“焉用”即“有什么用”。\u003c/p>\n\u003cp class=\"translation\">子产不是说财物毫无用途，而是在追问：为了财物失去诸侯和国人的支持，值得吗？\u003c/p>\n\u003ch2>四、德行是根基，好名声能使它传播\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>夫令名，德之舆（yú）也；德，国家之基也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“好名声，是传播德行的车辆；德行，是国家的根基。”\u003c/p>\n\u003cp class=\"translation\">“舆”是车。这个比喻的意思是：有了德行，又让人们知道、认可，德行的影响才能传播到远处。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有基无坏，无亦是务乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“有了稳固的根基，国家才不会败坏，难道不应该致力于这件事吗？”\u003c/p>\n\u003cp class=\"translation\">“务”是致力于；“是务”就是“务是”，以此为要务。“无亦……乎”表示委婉的反问，可理解为“不也应该……吗”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有德则乐（lè），乐则能久。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“有德政，就能使人安乐；人们安乐，国家的安定才能长久。”\u003c/p>\n\u003cp class=\"translation\">这承接“国家之基”，讲的是统治要能让人愿意支持、安心生活。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《诗》云：‘乐（lè）只（zhǐ）君子，邦家之基。’有令德也夫（fú）！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗经》说：‘令人喜爱的君子，是国家的根基。’这说的就是有美德的人啊！”\u003c/p>\n\u003cp class=\"translation\">“只”是语气助词；“邦家”是国家；“夫”在句末表示感叹。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>‘上帝临女（rǔ），无贰尔心。’有令名也夫！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗经》又说：‘上帝在上监临着你，不要使自己的心意有二。’这说的是有美好的声望啊！”\u003c/p>\n\u003cp class=\"translation\">“女”通“汝”，是你；“临”是从上监视、察看。子产借这句诗强调德行应当真诚、专一，并将它与可信的声望联系起来。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>恕思以明德，则令名载（zài）而行之，是以远至迩（ěr）安。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以体谅别人的心来思考，彰明自己的德行，那么好名声就会像车辆一样，载着德行传播，因此远方的人前来归附，近处的人安居。”\u003c/p>\n\u003cp class=\"translation\">“恕”是推己及人、体谅别人；“明德”在这里是彰明德行；“迩”是近。\u003c/p>\n\u003cp class=\"translation\">这句接续前面的比喻：德行通过声望传播，才会产生“远至迩安”的政治效果。\u003c/p>\n\u003ch2>五、让人说你养活我们，还是搜刮我们？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>毋（wú）宁使人谓子：“子实生我”，而谓“子浚（jùn）我以生”乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“难道不宁可让人说您‘确实使我们得以生存’，而要让人说您‘搜刮我们来养活自己’吗？”\u003c/p>\n\u003cp class=\"translation\">“毋宁”在这里有“何不、宁可”的意思；“生我”是使我们生存；“浚”本指深挖，在这里指搜取、榨取。\u003c/p>\n\u003cp class=\"translation\">“子实生我”是你让我们能够生活；“子浚我以生”是你靠搜刮我们供养自己。子产要范宣子选择，究竟希望诸侯怎样评价自己。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>象有齿以焚（fén）其身，贿也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“大象因为有象牙，反而招致杀身之祸，就是因为象牙具有财货价值。”\u003c/p>\n\u003cp class=\"translation\">“齿”指象牙；“焚”在这里按毁灭、丧身解释，不是说大象被火烧死。“贿也”是说：象牙能成为财货，所以引来猎杀。\u003c/p>\n\u003cp class=\"translation\">用这句话收尾，已经带着警告：财物可能成为人们争夺的目标，也可能成为拥有者的祸根。\u003c/p>\n\u003ch2>六、范宣子接受劝告\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>宣子说（yuè），乃轻币。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">范宣子听后很高兴，于是减轻了诸侯的礼物负担。\u003c/p>\n\u003cp class=\"translation\">“说”通“悦”；“轻币”是使礼物负担减轻。文章以劝告取得效果作结。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### “币”是什么意思？\u003c/p>\n\u003cp class=\"translation\">“轻币”是减轻诸侯向晋国交纳的礼物负担。“币”在这里指外交往来中的财帛、礼物，不是今天说的货币。范宣子就是《祁奚请免叔向》中的执政大夫。\u003c/p>\n\u003cp class=\"translation\">### 子产与申不害是不是同一个人？（追问）\u003c/p>\n\u003cp class=\"translation\">子产名公孙侨，是春秋时期的郑国人，主持郑国政务。申不害是战国时期的人，原为郑国人，后来在韩国担任国相，以讲求君主驾驭臣下的“术”著称。会话中“在韩国执政”的疑问，后来明确指的是申不害，不能把两人混同。\u003c/p>\n\u003cp class=\"translation\">### 劝告何以有力？（分析判断）\u003c/p>\n\u003cp class=\"translation\">子产没有只讲郑国付不起，而是让范宣子考虑：财物增加以后，晋国会更稳固，范氏会更安全吗？他把小国眼前的负担，与大国及执政者长远的利益联系起来，因而更有说服力。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part028.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见完整讲解整理，保留已有译意和词释；人物辨析放在篇末，开篇背景为两句。\u003c/p>\n\u003c/details>"}, {"id": "v02-09", "volume": 2, "volume_title": "卷二 · 周文", "number": 9, "title": "晏子不死君难", "file": "卷二/09-晏子不死君难.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《晏（yàn）子不死君难（nàn）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公二十五年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">晏子就是齐国大夫晏婴。齐庄公与崔杼之妻私通，崔杼杀死庄公，晏子前往崔氏家中。文章讨论臣子是否必须无条件随国君殉死。\u003c/p>\n\u003ch2>一、齐庄公因私情被杀\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>崔武子见棠（táng）姜而美之，遂取（qǔ）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">崔武子见到棠姜，认为她很美，于是娶了她。\u003c/p>\n\u003cp class=\"translation\">崔武子就是齐国大夫崔杼（zhù）；棠姜原是齐国棠公的妻子，棠公去世后，崔杼娶了她。“美之”是认为她美；“取”通“娶”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>庄公通焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">齐庄公与棠姜私通。\u003c/p>\n\u003cp class=\"translation\">“庄公”是齐庄公；“通”在这里指私通；“焉”指与棠姜。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>崔子弑（shì）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">崔杼杀了齐庄公。\u003c/p>\n\u003cp class=\"translation\">“弑”专用于臣下杀国君、子女杀父母等行为。虽然前文交代庄公有过失，文章仍然用“弑”字记述崔杼的行为。\u003c/p>\n\u003ch2>二、随从三问：殉死、逃亡，还是回家？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晏子立于崔氏之门外。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晏子站在崔氏家门外。\u003c/p>\n\u003cp class=\"translation\">齐庄公死在崔杼家中，晏子前来，但此时门还没有打开。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其人曰：“死乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晏子的随从问：“要为国君殉死吗？”\u003c/p>\n\u003cp class=\"translation\">“其人”指晏子身边的人。“死乎”省略了“为国君而死”的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“独吾君也乎哉？吾死也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晏子说：“难道他只是我一个人的国君吗？为什么要我为他而死？”\u003c/p>\n\u003cp class=\"translation\">这是连续反问。晏子先质疑：不能一见国君被杀，就认定自己必须殉死。至于该不该死，下面还要进一步说明理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“行乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">随从问：“那么离开齐国、逃亡吗？”\u003c/p>\n\u003cp class=\"translation\">“行”在这里结合下文，指离开本国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“吾罪也乎哉？吾亡也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晏子说：“难道是我犯了罪吗？为什么要我逃亡？”\u003c/p>\n\u003cp class=\"translation\">“亡”是逃亡。国君被杀，并不是晏子犯下的罪，他不认为自己应该以逃亡来回应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“归乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">随从又问：“那么回家吗？”\u003c/p>\n\u003cp class=\"translation\">既不殉死，也不逃走，是否就直接回家？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“君死，安归？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晏子说：“国君死了，怎么能就这样回去？”\u003c/p>\n\u003cp class=\"translation\">“安”是哪里、怎么。晏子认为自己仍有臣子的职责，不能连应尽的丧礼都不管，就转身回家。\u003c/p>\n\u003ch2>三、君臣关系的根本，在于国家\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>君民者，岂以陵（líng）民？社稷是主。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“做百姓君主的人，难道只是为了高居百姓之上
