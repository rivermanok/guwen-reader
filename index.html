吗？应当主持、维护国家才是。”\u003c/p>\n\u003cp class=\"translation\">“君民”是做百姓的君主，“君”作动词；“陵”是居于其上，这里带有凌驾的意味；“社稷”本指土神、谷神，这里代指国家。\u003c/p>\n\u003cp class=\"translation\">“社稷是主”可理解为“主社稷”，强调国君的职责在于国家。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臣君者，岂为（wèi）其口实？社稷是养。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“做国君臣子的人，难道只是为了自己的衣食俸禄吗？应当奉养、维护国家才是。”\u003c/p>\n\u003cp class=\"translation\">“臣君”是做国君的臣子，“臣”作动词；“口实”指供口腹之用的食物，这里指俸禄、生计；“养”是奉养、维护。\u003c/p>\n\u003cp class=\"translation\">这两句是全文的根本：国君不能只顾自己的欲望，臣子也不能只为自己的俸禄；两者都有维护国家的责任。\u003c/p>\n\u003ch2>四、是否跟随国君赴死，要看国君为何而死\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>故君为社稷死，则死之；为社稷亡，则亡之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以，国君如果为了国家而死，臣子就应当为他而死；国君如果为了国家而流亡，臣子就应当随他流亡。”\u003c/p>\n\u003cp class=\"translation\">“死之”是为他而死；“亡之”是随他逃亡。\u003c/p>\n\u003cp class=\"translation\">晏子并不否认臣子有赴死、追随的义务，但给这种义务提出了条件：国君的遭遇是否出于维护国家。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若为己死，而为己亡，非其私昵（nì），谁敢任（rèn）之？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果国君是为了自己的私事而死，为了自己的私事而逃亡，那么除了他的私人亲信，谁应当承担这种责任呢？”\u003c/p>\n\u003cp class=\"translation\">“己”指国君自己；“私昵”是私人亲近、宠信的人；“任”是承担。\u003c/p>\n\u003cp class=\"translation\">结合前文，齐庄公被杀，与他同崔杼妻子的私情有关。晏子认为，不能把这种私事造成的后果，直接变成所有臣子必须殉死的理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>且人有君而弑之，吾焉（yān）得死之，而焉得亡之？将庸何归？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“况且，别人身为臣子，却杀了自己的国君，我为什么就必须为此而死，又为什么必须因此逃亡？但我又怎么能够就这样回家呢？”\u003c/p>\n\u003cp class=\"translation\">这里前一个“人”指崔杼；“有君而弑之”是说他本有自己应当侍奉的国君，却将国君杀死。\u003c/p>\n\u003cp class=\"translation\">“焉得”是怎么能够、为什么应当；“将庸何归”承接前面的“归乎”，再次说明自己不能一走了之。\u003c/p>\n\u003cp class=\"translation\">这一句收拢了前面的三个选择：不殉死，不逃亡，也不立即回家；接下来要做的是尽到吊丧的礼节。\u003c/p>\n\u003ch2>五、入内哭君，尽礼而出\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>门启而入，枕（zhèn）尸股而哭。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">门打开后，晏子走进去，让齐庄公的尸体头枕在自己的大腿上，放声哭泣。\u003c/p>\n\u003cp class=\"translation\">“股”是大腿。“枕尸股”是省略的说法，意思是使尸体的头枕在自己腿上，并不是晏子把头枕在尸体上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>兴，三踊（yǒng）而出。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">哭过之后，晏子站起身，顿足跳踊三次，然后退出。\u003c/p>\n\u003cp class=\"translation\">“兴”是起身；“踊”是跳踊，是古代丧礼中表达悲痛的动作。\u003c/p>\n\u003cp class=\"translation\">晏子以行动表明：不为国君的私事殉死，并不妨碍自己对国君表达哀悼、尽到臣礼。\u003c/p>\n\u003ch2>六、崔杼为什么没有杀他？\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>人谓崔子：“必杀之！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">有人对崔杼说：“一定要杀掉晏子！”\u003c/p>\n\u003cp class=\"translation\">晏子公开前来哭君，显然没有把弑君之事当作可以漠然接受的事情。不过，原文没有进一步交代劝杀者的具体理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>崔子曰：“民之望也，舍（shě）之得民。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">崔杼说：“他是百姓所仰望的人，放过他，可以取得民心。”\u003c/p>\n\u003cp class=\"translation\">“望”指受到敬重、寄予希望的人；“舍”是放过。\u003c/p>\n\u003cp class=\"translation\">原文给出的理由很明确：崔杼顾忌晏子的声望，也希望借保全晏子争取民心。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意与臣子责任（分析判断）\u003c/p>\n\u003cp class=\"translation\">“君难”是国君遭遇的灾难；“死君难”是为国君的灾难而死。晏子既承认君臣之礼，也为臣子的责任划定界限：国君为国家而死，臣子应当承担责任；国君因私人欲望遭祸，臣子不必以自己的生命替他负责。而该尽的哀悼之礼，他仍然完成。\u003c/p>\n\u003cp class=\"translation\">### 是不是杀了三位史官的那次事件？（原文补充）\u003c/p>\n\u003cp class=\"translation\">是同一次崔杼弑齐庄公的事件，但《古文观止》本篇节选没有收入史官这一段。《左传·襄公二十五年》原文为：\u003c/p>\n\u003cp class=\"translation\">&gt; 大史书曰：“崔杼弑其君。”崔子杀之。其弟嗣书，而死者二人。其弟又书，乃舍之。南史氏闻大史尽死，执简以往，闻既书矣，乃还。\u003c/p>\n\u003cp class=\"translation\">“大史”也常写作“太史”。最先记录的太史被杀，接着续写而被杀的弟弟有两人，再一个弟弟继续写，才被放过，所以共三人被杀。\u003c/p>\n\u003cp class=\"translation\">### 南史氏为什么赶来？（原文与解释界线）\u003c/p>\n\u003cp class=\"translation\">南史氏也是史官。他听说“大史尽死”，拿着简册前往；听说已经有人记下此事，便返回。可见他前往是为了接续记录，并确保这件事没有被隐去。\u003c/p>\n\u003cp class=\"translation\">“闻大史尽死”是他听到的消息，不等于太史兄弟实际全部死亡。“闻既书矣，乃还”表明已有记录，他才不必接替。\u003c/p>\n\u003cp class=\"translation\">本会话早先将“南史氏”直接解释为氏族称号；但原文没有交代个人姓名、与太史兄弟的亲属关系，以及该称呼具体如何形成。此处不将“南史氏”当作所有史官的统一官名，也不把氏称来源的解释列为原文确证事实。\u003c/p>\n\u003cp class=\"translation\">### 崔杼想改成什么？（未载与推测）\u003c/p>\n\u003cp class=\"translation\">《左传》这段没有记载崔杼要求改成哪句话，只记太史写“崔杼弑其君”，崔杼便杀了他。从反应可以推断，他不愿留下责任人和“弑君”性质的明确记录。至于是否希望隐去责任人、改写经过或另找开脱说法，都只是推测，没有原文依据。\u003c/p>\n\u003cp class=\"translation\">齐庄公与崔杼妻子的私情，可以解释崔杼为什么杀人，却不能在当时君臣名分下自动取消弑君之责。\u003c/p>\n\u003cp class=\"translation\">### 史官为何敢写？（制度背景与分析）\u003c/p>\n\u003cp class=\"translation\">史官是国家正式官员，不是崔杼的私人家臣。史职有家族传承背景，但不能由太史兄弟的接续就推断所有史职一律世袭。\u003c/p>\n\u003cp class=\"translation\">本事件恰好说明史官没有可靠的免死保障：崔杼确实能杀人。太史兄弟继续写，南史氏准备接替，使杀死记录者不等于消灭记录。崔杼最后放过续写者的具体内心理由，原文没有交代。\u003c/p>\n\u003cp class=\"translation\">对于“为什么坚持真理”，本会话提出三层理解：尽职可能关系个人身份与家族荣誉；“弑”字维护君臣名分；记录指向后世，权臣未必能控制后世的评价。这些是解释线索，不是史官内心的直接史料，也不能据此说当时所有史官都如此。\u003c/p>\n\u003cp class=\"translation\">### 国君有过失，史官也写吗？（记载与限度）\u003c/p>\n\u003cp class=\"translation\">《左传》同时保存“庄公通焉”与“崔子弑之”：国君的过失与臣子的罪责可以同时成立。但不能证明“庄公通焉”一定由那位被杀的太史亲笔记录，原文没有交代这条材料的来源过程。\u003c/p>\n\u003cp class=\"translation\">理想中的直书是不替国君隐瞒过失，也不替臣子开脱罪责；实际史料仍受威胁、避讳、散失及后世编纂取舍影响，不能视作毫无遗漏的全部事实。\u003c/p>\n\u003cp class=\"translation\">### 春秋史官制度（已有背景讨论）\u003c/p>\n\u003cp class=\"translation\">周王室、诸侯国各有记录系统。史官兼管国家大事记录、典籍文书保存，并与谱系、历日及部分礼仪事务相联系。韩宣子在鲁国太史处见到《易象》《鲁春秋》，是保存典籍的一个例子。\u003c/p>\n\u003cp class=\"translation\">后世整理的《周礼》列有大史、小史、内史、外史等职，但不能直接当作崔杼时代齐国的现行官制表。史职有家族传承和专业训练背景，实际职掌也随国家、时期而异。\u003c/p>\n\u003cp class=\"translation\">当时的直书并不完全等于现代的事实报道，还包含按礼制和职位追究责任。董狐将赵盾记为弑君责任人，而实际动手者为赵穿，是这种名分责任判断的例子。这些记录能形成声誉和责任上的约束，却不能像军队、司法机关一样直接制止强权。\u003c/p>\n\u003cp class=\"translation\">参考：\u003ca href=\"https://ctext.org/chun-qiu-zuo-zhuan/xiang-gong-er-shi-wu-nian/zhs)；[《左传·昭公二年》](https://ctext.org/chun-qiu-zuo-zhuan/zhao-gong-er-nian/zhs\" target=\"_blank\" rel=\"noopener\">《左传·襄公二十五年》\u003c/a>；\u003ca href=\"https://ctext.org/chun-qiu-zuo-zhuan/xuan-gong-er-nian/zhs)；[《周礼·春官宗伯》](https://zh.wikisource.org/wiki/周禮/春官宗伯\" target=\"_blank\" rel=\"noopener\">《左传·宣公二年》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part029.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见完整讲解整理；篇末合并史官相关追问，标明原文、推测与制度背景的界线；未将史官补充段混入本篇节选正文。\u003c/p>\n\u003c/details>"}, {"id": "v02-10", "volume": 2, "volume_title": "卷二 · 周文", "number": 10, "title": "季札观周乐", "file": "卷二/10-季札观周乐.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《季札观周乐（yuè）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公二十九年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">季札是吴国公子，吴王寿梦的小儿子。这篇记载他访问鲁国，观看周代礼乐，并逐一发表评价。当时的“乐”包括歌唱、器乐和舞蹈，也与祭祀、政治教化相联系。\u003c/p>\n\u003ch2>一、季札访问鲁国，请求观看周乐\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>吴公子札来聘（pìn）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴国公子季札前来鲁国访问。\u003c/p>\n\u003cp class=\"translation\">“聘”是诸侯国之间正式的外交访问。《左传》以鲁国为叙事中心，所以说“来”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>请观于周乐。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札请求观赏周代的礼乐。\u003c/p>\n\u003cp class=\"translation\">这里的“周乐”包括周代礼乐体系中保存、演出的各地乐歌及历代乐舞。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使工为（wèi）之歌《周南》《召（shào）南》。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁国让乐工为他演唱《周南》《召南》。\u003c/p>\n\u003cp class=\"translation\">“工”指乐工；“为之”是为季札。《周南》《召南》是今本《诗经》开头的两组诗歌，当时也是可以演唱的乐歌。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“美哉！始基之矣，犹未也，然勤而不怨矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札说：“真美啊！已经开始奠定教化的根基，只是尚未完全实现；但百姓已经能够勤劳而不怨恨了。”\u003c/p>\n\u003cp class=\"translation\">“基”是奠定基础；“犹未”是尚未完成。按传统解释，这是把《二南》与周初德化的形成联系起来。\u003c/p>\n\u003ch2>二、评论各地的《国风》\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>为之歌《邶（bèi）》《鄘（yōng）》《卫》。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工为他演唱《邶风》《鄘风》《卫风》。\u003c/p>\n\u003cp class=\"translation\">这三组乐歌都与卫国及其所辖地区有关。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“美哉！渊乎！忧而不困者也。吾闻卫康叔、武公之德如是，是其《卫风》乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札说：“真美啊！深沉啊！有忧思，却没有陷入困顿。我听说卫康叔、卫武公的德行就是这样，这大概是卫国的乐歌吧？”\u003c/p>\n\u003cp class=\"translation\">“渊”是深；“困”在这里可理解为被忧愁压倒、陷入困窘。他把音乐中的深厚气象，与卫国先君留下的德化联系起来。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《王》。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工为他演唱《王风》。\u003c/p>\n\u003cp class=\"translation\">这里的“王”指周王室所在地区，不是某一个诸侯国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>曰：“美哉！思而不惧，其周之东乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札说：“真美啊！有所忧思，却不恐惧，这大概是周王室东迁以后的乐歌吧？”\u003c/p>\n\u003cp class=\"translation\">“周之东”指周王室东迁。季札从音乐中感受到忧思，又认为其中仍保有一定的安定气象。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《郑》。曰：“美哉！其细已甚，民弗堪也，是其先亡乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《郑风》。季札说：“真美啊！但未免过于细碎了，百姓难以承受，这个国家恐怕会较早灭亡吧？”\u003c/p>\n\u003cp class=\"translation\">“细”指音乐细碎，并由此联想到政令烦琐；“已甚”是太过分；“堪”是承受。\u003c/p>\n\u003cp class=\"translation\">这里明显从音乐评价转入政治推断。“先亡”是文中季札的判断，不能据此当作已经证实的历史规律。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《齐》。曰：“美哉！泱泱（yāng yāng）乎！大风也哉！表东海者，其大（tài）公乎？国未可量（liáng）也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《齐风》。季札说：“真美啊！气象多么宏大，真是大国的风范！成为东海一带表率的，大概就是太公吧？这个国家的前途不可限量。”\u003c/p>\n\u003cp class=\"translation\">“泱泱”是宏大的样子；“表”是表率；“大公”即姜太公。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《豳（bīn）》。曰：“美哉！荡乎！乐（lè）而不淫，其周公之东乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《豳风》。季札说：“真美啊！气象开阔！欢乐而不过度，大概与周公东征有关吧？”\u003c/p>\n\u003cp class=\"translation\">“荡”是广大、开阔；“淫”是过度，不专指男女之事；“周公之东”按传统解释指周公东征。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《秦》。曰：“此之谓夏声。夫能夏则大，大之至也，其周之旧乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《秦风》。季札说：“这就是所谓的华夏之声。能够具有华夏的礼乐气象，就能广大，广大到了这样的程度，大概是承继了周朝故地的传统吧？”\u003c/p>\n\u003cp class=\"translation\">“夏”在这里指华夏，也借用其“大”的含义；“周之旧”指秦国所据的西周故地及其遗风。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《魏》。曰：“美哉！渢渢（fēng fēng）乎！大而婉，险而易行，以德辅此，则明主也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《魏风》。季札说：“真美啊！乐声多么悠扬！宏大而婉转，曲折险峻却又流畅易行；如果再以德政相辅，就可以成为明君了。”\u003c/p>\n\u003cp class=\"translation\">“渢渢”形容乐声；“婉”是婉转、和顺。这一句把音乐的特点与统治者的德行联系起来。\u003c/p>\n\u003cp class=\"translation\">这里的魏，是春秋时期的魏地及其乐歌背景，不能直接等同于后来三家分晋形成的战国魏国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《唐》。曰：“思深哉！其有陶唐氏之遗民乎？不然，何忧之远也？非令德之后，谁能若是？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《唐风》。季札说：“思虑多么深沉！这里大概还保有陶唐氏的遗民传统吧？不然，为什么忧虑这样深远？如果不是美德传统的继承者，谁能如此呢？”\u003c/p>\n\u003cp class=\"translation\">“唐风”主要是晋地的乐歌；“陶唐氏”指尧；“令德”是美德。季札将当地深远的忧思，解释为古老德化的遗存。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《陈》。曰：“国无主，其能久乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《陈风》。季札说：“国家没有真正主持政事的人，能够长久吗？”\u003c/p>\n\u003cp class=\"translation\">“国无主”不一定是没有在位国君，而是说缺乏能够治理国家、维持秩序的主导力量。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自郐（kuài）以下无讥焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">从《郐风》以下，季札没有再作评论。\u003c/p>\n\u003cp class=\"translation\">“讥”在这里是评论、评议，不只指讥讽。原文没有明说他为什么不再评论。\u003c/p>\n\u003ch2>三、评论《小雅》《大雅》《颂》\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>为之歌《小雅》。曰：“美哉！思而不贰，怨而不言，其周德之衰乎？犹有先王之遗民焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《小雅》。季札说：“真美啊！有所忧思却没有二心，有所怨恨却没有放纵地表达，大概是周朝德政衰微时的作品吧？其中仍保有先王时代留下的民风。”\u003c/p>\n\u003cp class=\"translation\">“贰”是二心、离心。“怨而不言”不能机械地理解为歌词完全不表达怨意，而是赞其怨而有节制。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《大雅》。曰：“广哉！熙熙（xī xī）乎！曲而有直体，其文王之德乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《大雅》。季札说：“博大啊！多么和乐光明！表达曲折委婉，却有正直的根本，大概体现了周文王的德行吧？”\u003c/p>\n\u003cp class=\"translation\">“熙熙”是和乐的样子；“直体”指正直的本质。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>为之歌《颂》。曰：“至矣哉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">乐工演唱《颂》。季札说：“达到极高的境界了！”\u003c/p>\n\u003cp class=\"translation\">《颂》主要用于宗庙祭祀、歌颂功德。下文是一连串赞语。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“直而不倨（jù），曲而不屈；迩（ěr）而不逼，远而不携。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“正直却不傲慢，婉转却不屈服；亲近却不逼迫，疏远却不离心。”\u003c/p>\n\u003cp class=\"translation\">“倨”是傲慢；“迩”是近；“携”在这里指离散、离心。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“迁而不淫，复而不厌；哀而不愁，乐而不荒。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“变化却不过度，反复却不令人厌倦；悲哀却不陷入愁苦，欢乐却不流于荒纵。”\u003c/p>\n\u003cp class=\"translation\">“迁”是变化；“复”是反复；“荒”是荒废、放纵。这些话赞赏情感和变化都有节制。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“用而不匮（kuì），广而不宣；施而不费，取而不贪。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“运用而不穷尽，广大而不张扬；施予而不造成耗损，获取而不陷于贪求。”\u003c/p>\n\u003cp class=\"translation\">“匮”是穷尽；“宣”在这里按宣扬理解。这些描述兼有音乐感受与德行评价的意味。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“处而不底（zhǐ），行而不流。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“安处却不停滞，运行却不流荡失控。”\u003c/p>\n\u003cp class=\"translation\">“底”在这里指停滞；“流”是流荡、失去约束。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“五声和，八风平，节有度，守有序，盛德之所同也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“五声和谐，八方之气平正，节奏有法度，各部分保持次序，这些都是盛大德行所共同具有的特点。”\u003c/p>\n\u003cp class=\"translation\">“五声”指宫、商、角、徵（zhǐ）、羽；“八风”按传统解释指八方之风气，体现古人将音乐与天地秩序相联系的观念；“守有序”是各部分各守位置、不相混乱。\u003c/p>\n\u003cp class=\"translation\">这段赞语反复强调：正直、欢乐、哀伤、变化，都有适当的分寸。\u003c/p>\n\u003ch2>四、观看历代乐舞\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>见舞《象箾（xiāo）》《南籥（yuè）》者，曰：“美哉！犹有憾。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">季札看到表演《象箾》《南籥》的舞者，说：“真美啊！不过仍有遗憾。”\u003c/p>\n\u003cp class=\"translation\">按传统解释，这两种乐舞与周文王有关；“犹有憾”被解释为文王虽有盛德，却尚未完成天下太平的事业。这是旧注的说明，原文本身没有展开理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>见舞《大武》者，曰：“美哉！周之盛也，其若此乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">看到表演《大武》，季札说：“真美啊！周朝的盛大气象，大概就是这样吧？”\u003c/p>\n\u003cp class=\"translation\">《大武》是与周武王克商功业相关的乐舞。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>见舞《韶濩（sháo hù）》者，曰：“圣人之弘也，而犹有惭德，圣人之难也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">看到表演《韶濩》，季札说：“圣人的德行真是广大，但仍然有引以为惭的地方，圣人处世真不容易啊！”\u003c/p>\n\u003cp class=\"translation\">《韶濩》传统上被认为是商汤的乐舞；“弘”是广大。所谓“惭德”，按旧解，是商汤虽讨伐暴君，仍以臣伐君，对此不能毫无愧意。\u003c/p>\n\u003cp class=\"translation\">这反映了文中对德行、征伐与君臣名分之间矛盾的思考。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>见舞《大夏》者，曰：“美哉！勤而不德，非禹其谁能修之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">看到表演《大夏》，季札说：“真美啊！勤劳建功，却不自以为有德；如果不是禹，谁能成就这样的事业呢？”\u003c/p>\n\u003cp class=\"translation\">《大夏》是与禹的功业相关的乐舞。“不德”是“不自居其德”，即不夸耀自己的功德，不能译成“没有德行”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>见舞《韶箾（sháo xiāo）》者，曰：“德至矣哉！大矣，如天之无不帱（dào）也，如地之无不载（zài）也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">看到表演《韶箾》，季札说：“德行达到极致了！多么广大，如同天空没有什么不覆盖，大地没有什么不承载！”\u003c/p>\n\u003cp class=\"translation\">《韶箾》传统上被认为是舜的乐舞；“帱”是覆盖。季札用天地来比喻其中广大、包容的德行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽甚盛德，其蔑（miè）以加于此矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“即使再盛大的德行，恐怕也没有能够超过这个境界的了！”\u003c/p>\n\u003cp class=\"translation\">“蔑”是无、没有；“加于此”是超过这里所表现的境界。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“观止矣！若有他乐，吾不敢请已！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“观赏到这里，已经达到极致了！即使还有别的乐舞，我也不敢再请求观看了！”\u003c/p>\n\u003cp class=\"translation\">“观止”不是说看腻了，而是认为已经见到了最高境界，不必再求其他。\u003c/p>\n\u003cp class=\"translation\">这就是成语“叹为观止”的出处，也与《古文观止》的书名相呼应。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 季札与夫差是什么关系？（已有世系说明及称谓待核）\u003c/p>\n\u003cp class=\"translation\">本会话按《史记·吴太伯世家》给出的世系说明为：寿梦生诸樊、季札等；诸樊生阖庐，阖庐生夫差。因此季札是夫差祖父诸樊的弟弟，比夫差高两辈。\u003c/p>\n\u003cp class=\"translation\">此前回答同时出现“曾叔祖父”和“夫差的侄孙”等不一致称谓。本次不把这些称谓当作确认事实，保留上述世系关系，并标记亲属称谓待核；未凭摘要另写世系。\u003c/p>\n\u003cp class=\"translation\">参考：\u003ca href=\"https://zh.wikisource.org/zh-hans/史記/卷031\" target=\"_blank\" rel=\"noopener\">《史记·吴太伯世家》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">### 当时就有魏国吗？不是三家分晋之后吗？（追问）\u003c/p>\n\u003cp class=\"translation\">《魏风》的“魏”，是更早的古魏国，不是三家分晋后建立的战国魏国。两个“魏”有地名上的承接关系。\u003c/p>\n\u003cp class=\"translation\">先有西周至春秋时期的古魏国，《魏风》传统上被认为是这一地区的乐歌。前661年，晋献公灭古魏国，把魏地赐给大夫毕万；毕万后代以“魏”为氏，成为晋国魏氏卿族；后来魏氏参与三家分晋，建立战国魏国。\u003c/p>\n\u003cp class=\"translation\">季札听《魏风》时，古魏国已经灭亡，当地乐歌仍保存、传唱。因此是古魏国地名、晋国魏氏氏名、战国魏国国名的承接，不能将前后两个国家当作同一个政权。\u003c/p>\n\u003cp class=\"translation\">参考：\u003ca href=\"https://www.chinakongzi.org/kzsf/wxxs/mingpian/shiji/200705/t20070524_25202.htm\" target=\"_blank\" rel=\"noopener\">《史记·魏世家》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">### 《陈风》说的是陈国吗？（追问）\u003c/p>\n\u003cp class=\"translation\">是陈国一带的乐歌。陈国是西周分封的诸侯国，都城宛丘，在今河南周口淮阳一带。传统记载认为开国国君陈胡公妫（guī）满是舜的后裔。\u003c/p>\n\u003cp class=\"translation\">陈国后来被楚国灭掉，不是南北朝陈霸先所建的陈朝。这里保存的是本会话已有背景补充，不是本篇原文提供的全部事实。\u003c/p>\n\u003cp class=\"translation\">### 定陶在哪里？（相关地理追问）\u003c/p>\n\u003cp class=\"translation\">定陶在今山东菏泽市定陶区，位于菏泽城区东南。古代称陶或陶丘，范蠡“陶朱公”的名号与在此经商有关。定陶与陈国都城宛丘不是同一地方：前者在山东菏泽，后者在河南周口淮阳。\u003c/p>\n\u003cp class=\"translation\">### 音乐评论与政治判断（分析判断）\u003c/p>\n\u003cp class=\"translation\">季札评价的不只是好不好听，还从音乐谈到民情、德政和国家兴衰。读这些评论，要区分音乐感受与政治判断，不能将其当作听一首歌就能准确预测国运的方法。\u003c/p>\n\u003cp class=\"translation\">本篇赞赏“勤而不怨”“乐而不淫”“直而不倨”，最终赞到“勤而不德”。本会话的阅读理解是：有力量、有情感、有功业，同时保持节制，不以力量压倒别人。\u003c/p>\n\u003cp class=\"translation\">原文核对来源：\u003ca href=\"https://ancient-china-books.github.io/guwenguanzhi/OEBPS/Text/part030.html\" target=\"_blank\" rel=\"noopener\">《古文观止》原文与旧注\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：据本会话可见完整讲解及追问整理，保留全篇原有译意与词释。世系称谓的不一致明确列为待核，不扩写新的译文。\u003c/p>\n\u003c/details>"}, {"id": "v02-11", "volume": 2, "volume_title": "卷二 · 周文", "number": 11, "title": "子产坏晋馆垣", "file": "卷二/11-子产坏晋馆垣.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《子产坏（huài）晋馆垣（yuán）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公三十一年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">子产陪同郑国国君出访晋国，晋侯尚未接见他们。本文讲子产拆墙之后通过外交辞令，使晋国承认接待失礼、改善诸侯待遇的经过。\u003c/p>\n\u003ch2>一、子产拆墙，晋国责问\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>公薨（hōng）之月，子产相（xiàng）郑伯以如晋，晋侯以我丧故，未之见也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">鲁襄公去世的那个月，子产辅佐郑简公前往晋国，晋平公因为鲁国有丧事，还没有接见他们。“薨”是诸侯去世；“相”是辅佐；“如”是前往。《左传》从鲁国立场记事，因此称鲁国的丧事为“我丧”。“未之见”就是“未见之”，尚未接见他们。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产使尽坏其馆之垣，而纳车马焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产命人把他们所住馆舍的围墙全部拆掉，将车马赶进去。“使”后面省略了执行命令的人；“焉”是“于此”，即进入馆舍里面。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>士文伯让之，曰：“敝邑以政刑之不修，寇盗充斥，无若诸侯之属辱在寡君者何。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋国大夫士文伯责备子产说：“敝国因为政事、刑罚没有整治好，盗贼到处横行，对于屈尊前来拜访我国国君的诸侯及其随行人员，我们实在不知道该怎样保障他们的安全。”\u003c/p>\n\u003cp class=\"translation\">“让”是责备。“敝邑”是对自己国家的谦称；“辱”是客套话，表示委屈对方、劳烦对方。“无若……何”是拿……没有办法。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“是以令吏人完客所馆，高其闬（hàn）闳（hóng），厚其墙垣，以无忧客使。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以才命人修整宾客住宿的馆舍，把大门修高，把围墙筑厚，使来访的宾客使者没有忧虑。”“完”是修缮、使之完好；“闬闳”指大门；“高”“厚”在这里都有使它变高、变厚的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今吾子坏之，虽从（zòng）者能戒，其若异客何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在您把围墙拆了，即使您的随从能够自行警戒，其他宾客的安全怎么办呢？”“吾子”是对对方的尊称；“异客”是其他宾客。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“以敝邑之为盟主，缮（shàn）完葺（qì）墙，以待宾客。若皆毁之，其何以共（gōng）命？寡君使匄（gài）请命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“敝国作为诸侯盟主，修整馆舍、修葺围墙，是为了接待宾客。如果都把围墙拆毁，我们还凭什么满足宾客的需要？我国国君派我来请问您这样做的缘故。”\u003c/p>\n\u003cp class=\"translation\">“共”通“供”，供给；“匄”是士文伯的名字，他在这里自称其名。“请命”在这里是请问这样做的理由。\u003c/p>\n\u003ch2>二、子产说明自己的困境\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>对曰：“以敝邑褊（biǎn）小，介于大国，诛求无时，是以不敢宁居，悉索敝赋，以来会时事。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产回答：“因为敝国土地狭小，夹在大国之间，大国对我们索取财物又没有定时，所以我们不敢安居，只能竭力搜集国内的财物，前来参加朝会，履行应尽的事务。”\u003c/p>\n\u003cp class=\"translation\">“介”是夹在中间；“诛求”是责求、索取；“悉索”是尽力搜集。“敝赋”指敝国征集的财物。这番话表面谦恭，也点出了小国承担的负担。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“逢执事之不闲，而未得见；又不获闻命，未知见时。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“碰上贵国主事者没有空闲，我们未能得到接见；又没有接到通知，不知道什么时候才能见到国君。”“执事”原指办事的人，这里是对晋国有关方面的客气称呼。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不敢输币，亦不敢暴（pù）露。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们既不敢擅自把礼物交上去，也不敢将礼物放在露天。”“输”是送交；“币”指用于外交礼仪的财物；“暴露”在这里指露天存放。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“其输之，则君之府实也，非荐陈之，不敢输也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这些财物一旦送交，就成为贵国国君府库里的财物；但不经过正式的进献、陈列仪式，我们不敢擅自交付。”\u003c/p>\n\u003cp class=\"translation\">“荐陈”是按礼仪进献、陈列。子产说明：礼物已经带来，但接见仪式没有安排，不能随便卸下就走。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“其暴露之，则恐燥湿之不时而朽蠹（dù），以重（zhòng）敝邑之罪。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果将它们放在露天，又担心气候干湿不定，使礼物腐烂、虫蛀，从而加重敝国的罪过。”“蠹”是虫蛀；“重”在这里是加重。\u003c/p>\n\u003ch2>三、追述晋文公如何待客\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>“侨闻文公之为盟主也，宫室卑庳（bēi），无观（guàn）台榭（xiè），以崇大诸侯之馆，馆如公寝。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说晋文公担任盟主时，自己的宫室低矮，没有高大的楼观台榭，却把接待诸侯的馆舍修得高大宽敞，如同国君的寝宫。”\u003c/p>\n\u003cp class=\"translation\">“侨”是子产的名，他在这里自称。“文公”是晋文公重耳；“卑庳”是低矮；“公寝”是国君居住的宫室。这里是子产用晋国先君的做法，劝说当时的晋国主政者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“库厩（jiù）缮修，司空以时平易道路，圬（wū）人以时塓（mì）馆宫室。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“仓库、马棚修缮完好，司空按时平整道路，泥水工匠按时粉刷馆舍房屋。”“司空”是掌管工程等事务的官；“平易”在这里是平整；“圬人”是泥水工匠；“塓”是涂抹、粉刷。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“诸侯宾至，甸（diàn）设庭燎（liáo），仆人巡宫，车马有所，宾从有代。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“诸侯宾客到来，甸人就在庭院设置照明的火炬，仆人巡视馆舍，车马有安置的地方，宾客随从的劳役也有人代办。”\u003c/p>\n\u003cp class=\"translation\">“甸”指甸人，是负责有关供应事务的人员；“庭燎”是庭院中照明的火炬；“宾从有代”是让宾客的随从也得到休息。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“巾车脂辖（xiá），隶人、牧、圉（yǔ），各瞻其事；百官之属各展其物。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“管理车辆的人给车轴部件加油，服杂役的人、放牧的人、养马的人，各自照管本职事务；各部门的属官检查各自负责供应的物品。”\u003c/p>\n\u003cp class=\"translation\">“巾车”是管理车辆的官；“脂”作动词，指涂油；“辖”是车轴端的挡铁。“圉”指养马的人；“瞻”在这里是照管；“展”是检查。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“公不留宾，而亦无废事；忧乐同之，事则巡之，教其不知，而恤（xù）其不足。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“晋文公不让宾客久候滞留，也不耽误应办的事务；与宾客同忧同乐，有事便巡视照料，对他们不明白的事情加以指点，对他们缺少的东西给予帮助。”\u003c/p>\n\u003cp class=\"translation\">“不留宾”是及时接待、办妥事务，使宾客能够按时回去。“恤”是体恤、周济。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“宾至如归，无宁灾患；不畏寇盗，而亦不患燥湿。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“宾客来到这里，就像回到自己家一样，哪里还会有什么灾患？既不怕盗贼，也不必担心财物因干燥、潮湿而受损。”\u003c/p>\n\u003cp class=\"translation\">“无宁灾患”在这里表达：哪里还会有灾患呢。“宾至如归”这一熟悉的说法，就见于这段话。\u003c/p>\n\u003ch2>四、指出当下晋国的失礼\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>“今铜鞮（dī）之宫数里，而诸侯舍（shè）于隶人，门不容车，而不可逾越。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今，贵国的铜鞮宫绵延数里，却让诸侯住在如同仆役居所的馆舍里，大门连车都进不去，车辆又不能越墙而入。”\u003c/p>\n\u003cp class=\"translation\">“铜鞮之宫”是晋国国君的宫室；“舍”作动词，是住宿。这里用国君宫室的广大，对照宾馆的狭窄。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“盗贼公行，而天疠（lì）不戒。宾见无时，命不可知。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“盗贼公然横行，天灾疫病又没有相应的防备。宾客何时得到接见没有定期，召见的命令何时下来也无从知道。”\u003c/p>\n\u003cp class=\"translation\">“天疠”指自然灾害、疫病一类的祸患；“戒”是戒备、防备。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若又勿坏，是无所藏币以重罪也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果还不拆掉围墙，就没有地方存放礼物，反而会使我们的罪过加重。”\u003c/p>\n\u003cp class=\"translation\">子产把拆墙与前面所说的困境接起来：车进不去，礼物不能交，也不能露天放置，所以才拆墙安置车马。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“敢请执事，将何所命之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“冒昧请问贵国主事者：在这种情况下，究竟要我们怎么办？”\u003c/p>\n\u003cp class=\"translation\">“敢”是表示冒昧的客气话。这里既是询问，也把难题交回晋国方面。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“虽君之有鲁丧，亦敝邑之忧也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“贵国国君遇上鲁国的丧事，这同样也是敝国所忧伤的事。”\u003c/p>\n\u003cp class=\"translation\">子产回应开头晋侯未接见他们的理由：郑国也关切鲁国的丧事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若获荐币，修垣而行，君之惠也，敢惮（dàn）勤劳？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果能够让我们按礼仪进献礼物，我们会把围墙修好再离开。这就是贵国国君给予我们的恩惠，我们哪里敢怕辛苦？”\u003c/p>\n\u003cp class=\"translation\">“惮”是害怕。子产在结尾提出解决办法，也表示愿意承担修墙的劳作。\u003c/p>\n\u003ch2>五、晋国认错，改善接待\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>文伯复命。赵文子曰：“信。我实不德，而以隶人之垣以赢（yíng）诸侯，是吾罪也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">士文伯回去报告。赵文子说：“确实如此。我们实在缺少德行，竟然用仆役所住的房舍来接待诸侯，这是我们的过错。”\u003c/p>\n\u003cp class=\"translation\">赵文子是晋国执政大夫赵武。“信”是确实；“赢”在这里是接待；“垣”在这里借指房舍。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使士文伯谢不敏焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">赵文子派士文伯前去道歉，承认晋国方面处事不明、考虑不周。“谢”是道歉；“不敏”本指不聪敏，这里是自谦认错。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>晋侯见郑伯，有加礼，厚其宴好（hǎo）而归之。乃筑诸侯之馆。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋平公接见郑简公，给予格外隆重的礼遇，宴请和赠礼也十分优厚，然后让他回国。随后，晋国修建了接待诸侯的馆舍。\u003c/p>\n\u003cp class=\"translation\">“好”指表达友好的赠礼；“归之”是让他回去。事情的结果，既包括郑国受到礼遇，也包括晋国改善了接待诸侯的设施。\u003c/p>\n\u003ch2>六、叔向评论辞令的作用\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>叔向曰：“辞之不可以已也如是夫（fú）！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">叔向说：“外交辞令不能废弃，道理就像这件事所显示的这样啊！”\u003c/p>\n\u003cp class=\"translation\">叔向是晋国大夫。“辞”在这里指外交应对中的言辞；“已”是停止、废弃；“夫”是句末感叹词。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“子产有辞，诸侯赖之，若之何其释辞也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“子产善于辞令，各国诸侯都因此得到好处，怎么能放弃辞令呢？”\u003c/p>\n\u003cp class=\"translation\">“赖”是受益、得到帮助；“释”是舍弃。这里是叔向对事件的评价：子产的交涉，使其他诸侯也从晋国改善馆舍一事中受益。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“《诗》曰：‘辞之辑（jí）矣，民之协矣；辞之怿（yì）矣，民之莫（mò）矣。’其知之矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗经》说：‘言辞和顺，民众就能和睦；言辞使人悦服，民众就能安定。’子产大概懂得这个道理啊。”\u003c/p>\n\u003cp class=\"translation\">诗句出自《诗经·大雅·板》。“辑”是和顺；“协”是和睦；“怿”是喜悦；“莫”在这里是安定。“其知之矣”是叔向认为子产懂得恰当言辞的作用。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意\u003c/p>\n\u003cp class=\"translation\">“坏”是拆毁，“馆垣”是接待宾客的馆舍围墙。\u003c/p>\n\u003cp class=\"translation\">### 交涉的关键（讲解分析）\u003c/p>\n\u003cp class=\"translation\">子产抓住晋国作为盟主应尽的待客责任，逐项说明郑国面临的困境，再以晋文公的做法作为劝说依据，最后提出进献礼物、修墙离开的解决办法。\u003c/p>\n\u003cp class=\"translation\">### 原文记载与人物评价\u003c/p>\n\u003cp class=\"translation\">上述“叔向评论辞令的作用”保留原讲解的区分：“辞令不可废弃”及“诸侯赖之”是叔向对事件的评价。\u003c/p>\n\u003cp class=\"translation\">原文核对：\u003ca href=\"https://www.gushiwen.cn/shiwenv_08c09bd1b481.aspx\" target=\"_blank\" rel=\"noopener\">古文岛《子产坏晋馆垣》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档说明：依据本会话可完整读取的最后一版逐句讲解整理；保留已有译意和重要词释，仅调整背景、标题层级及篇末讨论。最初仅讲开头两句的版本合并，不单独收录。\u003c/p>\n\u003c/details>"}, {"id": "v02-12", "volume": 2, "volume_title": "卷二 · 周文", "number": 12, "title": "子产论尹何为邑", "file": "卷二/12-子产论尹何为邑.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《子产论尹何为邑（wéi yì）》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·襄公三十一年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋末年，郑国卿大夫子皮想让年轻的尹何治理封邑。子产认为不应拿重要政务作为初学者的试验，借操刀、裁锦和田猎等比喻劝阻。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子皮欲使尹何为邑（wéi yì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子皮想派尹何治理自己的封邑。“为邑”是担任邑的治理者。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产曰：“少（shào），未知可否。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产说：“他年轻，还不知道是否能胜任。”“少”是年少。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子皮曰：“愿，吾爱之，不吾叛也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子皮说：“他谨厚，我喜爱他，他不会背叛我。”“愿”是谨厚老实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使夫往而学焉，夫亦愈知治矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“让他去那里学习，他也就会越来越懂得治理了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产曰：“不可。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产说：“不行。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>人之爱人，求利之也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“一个人爱另一个人，总是希望使对方获益。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今吾子爱人则以政。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在您爱一个人，却把政事交给他，作为学习的机会。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>犹未能操刀而使割也，其伤实多。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这好比还不会握刀，就让他切割，那造成的伤害实在太多了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子之爱人，伤之而已，其谁敢求爱于子？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您这样爱人，不过是伤害他；还有谁敢求您喜爱呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子于郑国，栋也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您对于郑国，就像房屋的大梁。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>栋折榱（cuī）崩，侨（qiáo）将厌（yā）焉，敢不尽言？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“大梁折断、椽木崩塌，我侨也会被压在下面，怎敢不把话说尽？”侨是子产的名；“厌”通“压”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子有美锦，不使人学制焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“您有一块好锦，不会让别人拿它学习剪裁。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大官大邑，身之所庇（bì）也，而使学者制焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“重要的官职、封邑，是庇护自身的地方，却让初学的人来治理。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其为美锦，不亦多乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这不是比一块好锦贵重得多吗？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>侨（qiáo）闻学而后入政，未闻以政学者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说的是学成之后才从政，没听说拿政事来供人学习的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若果行此，必有所害。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果真这样做，必定会造成伤害。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>譬如田猎，射御贯（guàn），则能获禽；若未尝登车射御，则败绩厌（yā）覆是惧，何暇思获？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“譬如打猎，射箭驾车熟练了，才猎得到禽兽；若从未上车练过射箭驾车，就只怕车坏人覆，哪里还有工夫考虑猎获？”“贯”通“惯”，“厌覆”是倾覆压伤。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子皮曰：“善哉！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子皮说：“说得好！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虎不敏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我虎不聪敏。”虎是子皮的名，是自谦。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾闻君子务知大者、远者，小人务知小者、近者。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说君子专心了解大事、长远的事，小人专心了解细事、眼前的事。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我，小人也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我就是这种见识狭小的人。”这里是子皮自责，并非直接作身份分类。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>衣服附在吾身，我知而慎之；大官、大邑，所以庇（bì）身也，我远而慢之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“衣服贴在身上，我知道应当慎重；重要官职和封邑是庇身所依，我却觉得离自己远而轻慢了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>微子之言，吾不知也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“没有您的话，我还不知道这个道理。”“微”是如果没有。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>他日我曰：‘子为郑国，我为吾家，以庇（bì）焉，其可也。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“以前我说：‘您治理郑国，我管理自己的家，以此庇护自身，应该可以了。’”“家”在这里是卿大夫的家族封邑。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今而后知不足。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在才知道，那还不够。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自今请虽吾家，听子而行。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从今以后，即使是我的家事，也请允许我听您的意见办理。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产曰：“人心之不同，如其面焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产说：“人的心思不同，就像各人的面貌不同一样。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾岂敢谓子面如吾面乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我怎敢要求您的面貌像我的面貌呢？”意思是不会要求彼此想法全同。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>抑心所谓危，亦以告也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“只是心里认为有危险，也就告诉您罢了。”“抑”是表转折的语气词。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子皮以为忠，故委政焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子皮认为他忠诚，因此把国政委托给他。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产是以能为郑国。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产因此能够治理郑国。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷2)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷2\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v02-13", "volume": 2, "volume_title": "卷二 · 周文", "number": 13, "title": "子产却楚逆女以兵", "file": "卷二/13-子产却楚逆女以兵.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《子产却楚逆女（nǚ）以兵》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·昭公元年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">事情发生在公元前541年。子产是郑国执政大夫；楚国公子围当时担任令尹，后来成为楚灵王。这篇写的，就是双方围绕“能不能带兵入城迎亲”进行的一场交涉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚公子围聘（pìn）于郑，且娶于公孙段氏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国的公子围到郑国进行外交访问，同时要迎娶郑国大夫公孙段家的女儿。\u003c/p>\n\u003cp class=\"translation\">“聘”是诸侯国之间的正式访问。“公子围”是楚国王族，名叫围。“且”是并且，说明他这一次兼办访问和迎亲两件事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>伍举为介（jiè）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">伍举担任副使。\u003c/p>\n\u003cp class=\"translation\">伍举是楚国大夫。“介”是辅助正使办理外交事务的人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>将入馆，郑人恶（wù）之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国一行准备入住城内的宾馆，郑国人对此感到不安。\u003c/p>\n\u003cp class=\"translation\">“馆”是接待外国使者的馆舍。“恶”在这里有厌恶、忌惮的意思。联系后文，郑国担心的是这些楚国武装人员入城后会造成威胁。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使行人子羽与之言，乃馆于外。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国派负责外交的官员子羽去同楚国人交涉，于是楚国一行住在了城外。\u003c/p>\n\u003cp class=\"translation\">“行人”是外交官职的名称。“子羽”是郑国大夫公孙挥的字。这里没有写出交涉的具体内容，只交代结果：楚国人暂时没有进入城内。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>既聘，将以众逆。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">外交访问结束后，公子围准备带领大批武装随从进城迎亲。\u003c/p>\n\u003cp class=\"translation\">“既”是已经、结束以后；“以”是率领；“众”在这里指随行的武装人员；“逆”是迎接，承接前面的婚事，就是迎亲。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子产患之，使子羽辞曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产担心这件事，派子羽前去拒绝，说。\u003c/p>\n\u003cp class=\"translation\">“患”是以此为忧。“辞”是推辞、拒绝。具体出面交涉的是子羽，背后作出决策的是子产。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“以敝（bì）邑褊（biǎn）小，不足以容从（zòng）者，请墠（shàn）听命！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因为我们这个小国地方狭窄，容纳不下贵方这么多随从，请允许我们在城外清理一块场地，听候安排，举行迎亲仪式。”\u003c/p>\n\u003cp class=\"translation\">“敝邑”是对自己国家的谦称；“褊小”是狭小；“从者”是随从。“墠”是经过清理的平地，这里指在城外清理场地。\u003c/p>\n\u003cp class=\"translation\">子羽给出的表面理由是：\u003cstrong>地方太小，接待不下。\u003c/strong>实际提出的条件是：迎亲可以，在城外举行。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>令尹使太宰伯州犁对曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">令尹公子围派太宰伯州犁回答说。\u003c/p>\n\u003cp class=\"translation\">“令尹”是楚国执掌军政的最高官职，这里就是公子围。“太宰”是官名，伯州犁是担任这一官职的楚国大夫。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“君辱贶（kuàng）寡大夫围，谓围：‘将使丰氏抚有而室。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“贵国国君屈尊赐予敝国大夫围这桩婚事，对围说：‘将让丰氏的女儿成为你的妻室。’”\u003c/p>\n\u003cp class=\"translation\">“君”指郑国国君。“辱”是表示承蒙对方屈尊的客套话；“贶”是赐予；“寡大夫”是对本国大夫的谦称。\u003c/p>\n\u003cp class=\"translation\">“丰氏”指公孙段所属的家族，在这里代指他家的女儿。“抚有而室”是成为你的妻室，其中“而”通“尔”，意思是“你”。\u003c/p>\n\u003cp class=\"translation\">伯州犁先强调：这桩婚姻是郑国国君已经答应的。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“围布几（jī）筵（yán），告于庄、共（gōng）之庙而来。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“围已经摆设好祭祀用的几案和席子，在楚庄王、楚共王的宗庙里禀告过，才到这里来。”\u003c/p>\n\u003cp class=\"translation\">“几”是小桌、凭几；“筵”是席子。“庄、共”是楚庄王和楚共王。\u003c/p>\n\u003cp class=\"translation\">这句话是在增加婚事的分量：已经正式告过祖先，不能随意处置。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若野赐之，是委君贶于草莽（mǎng）也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果在郊野把新娘交给围，就是把贵国国君的赏赐丢在草丛里！”\u003c/p>\n\u003cp class=\"translation\">“野”指城外。“委”是丢弃、弃置。“君贶”指郑国国君赐予的婚姻。\u003c/p>\n\u003cp class=\"translation\">他的意思是：你们让我们在城外迎亲，连贵国国君自己的体面也受损。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“是寡大夫不得列于诸卿也！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这就使敝国大夫围不能与其他卿大夫并列了！”\u003c/p>\n\u003cp class=\"translation\">也就是：别人能够按身份、礼仪正式迎娶，围却只能在野外接亲，岂不是被降低了身份？\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不宁唯是，又使围蒙其先君，将不得为寡君老，其蔑（miè）以复矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“不仅如此，还会使围成为欺骗先君的人，将没有资格再做敝国国君的大臣，恐怕也无法回去复命了。”\u003c/p>\n\u003cp class=\"translation\">“不宁唯是”是不仅如此。“蒙”是欺骗、蒙蔽：已经向先君禀告要正式迎娶，结果却在野外接亲，便被他说成欺骗了先君。\u003c/p>\n\u003cp class=\"translation\">“寡君”指楚国国君；“老”在这里指重臣；“蔑”是无、没有；“复”是复命。\u003c/p>\n\u003cp class=\"translation\">伯州犁把后果一层层加重：从有失体面，说到辱没祖先，再说到无法继续为臣。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“唯大夫图之！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“希望大夫好好考虑这件事！”\u003c/p>\n\u003cp class=\"translation\">“大夫”是对子羽说的。“图”是考虑、谋划。这句客气话里带着施压的意味。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子羽曰：“小国无罪，恃（shì）实其罪。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子羽说：“小国本来没有罪，依赖大国，倒真成了它的罪过。”\u003c/p>\n\u003cp class=\"translation\">“恃”是依赖、倚仗。\u003c/p>\n\u003cp class=\"translation\">这句话带着反讽：\u003cstrong>我们相信大国会保护我们，难道反而因为这份相信，要遭受灾祸吗？\u003c/strong>\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“将恃大国之安靖己，而无乃包藏祸心以图之。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“本来打算依靠大国使自己安定，恐怕大国却暗藏害人的心思，来算计小国吧？”\u003c/p>\n\u003cp class=\"translation\">“安靖己”是使自己安定。“无乃……”，是“恐怕……吧”。“图之”的“图”在这里是图谋、算计，“之”指小国。\u003c/p>\n\u003cp class=\"translation\">子羽在这里点出了真正的疑虑：你们带这么多兵进来，究竟是迎亲，还是另有打算？\u003c/p>\n\u003cp class=\"translation\">但他仍用“恐怕”来表达，没有把推测直接说成已经发生的事实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“小国失恃而惩诸侯，使莫不憾（hàn）者，距违君命，而有所壅（yōng）塞不行是惧！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们担心的是：小国失去了可以依靠的大国，这件事又使其他诸侯引以为戒，人人心怀怨恨，进而抗拒、违背贵国国君的命令，最终使贵国的命令受到阻碍，不能推行。”\u003c/p>\n\u003cp class=\"translation\">这一句很长，意思是顺着推下来的：\u003c/p>\n\u003cp class=\"translation\">小国受害，便不再信任楚国；其他诸侯看到，也会警惕、怨恨楚国；楚国再发号施令，大家就不肯服从。\u003c/p>\n\u003cp class=\"translation\">“惩”是警戒、引以为戒；“憾”是怨恨；“距”通“拒”，是抗拒。\u003c/p>\n\u003cp class=\"translation\">“……是惧”是“所害怕的是……”的意思。子羽把郑国的拒绝说成了对楚国的提醒：\u003cstrong>你们今天若借婚事伤害郑国，损失的会是诸侯对楚国的信任。\u003c/strong>\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“不然，敝邑，馆人之属也，其敢爱丰氏之祧（tiāo）？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“要不是有这样的顾虑，我们小国不过是替贵国照管馆舍的人，哪里敢吝惜丰氏的宗庙，不让你们进去迎亲呢？”\u003c/p>\n\u003cp class=\"translation\">“馆人”是管理馆舍的人。把郑国说成楚国的“馆人”，是外交上的谦辞。\u003c/p>\n\u003cp class=\"translation\">“其敢”是哪里敢；“爱”是吝惜、舍不得；“祧”本指祭祀远祖的庙，这里指丰氏的宗庙，也是举行婚礼的场所。\u003c/p>\n\u003cp class=\"translation\">这句话把立场说清楚了：并非不让你们入内迎亲，郑国顾虑的是带兵入城。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>伍举知其有备也，请垂櫜（gāo）而入。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">伍举知道郑国已经有了防备，便请求让随从垂下弓袋入城。\u003c/p>\n\u003cp class=\"translation\">“其”指郑国。“櫜”是收藏弓箭等物的袋子。“垂櫜”表示收起武器、解除临战姿态，以示没有敌意。\u003c/p>\n\u003cp class=\"translation\">这时楚方作出了实际让步：要入城，就先改变武装戒备的状态。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>许之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国同意了这个请求。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 题意\u003c/p>\n\u003cp class=\"translation\">题目可以拆开理解：“却”，使退却、阻止；“逆女”，迎娶女子；“以兵”，带着武装人员。合起来就是：\u003cstrong>子产阻止楚国借迎亲之名，带兵进入郑国。\u003c/strong>“以兵”说的是楚国迎亲的方式。\u003c/p>\n\u003cp class=\"translation\">### 外交交涉的理解（分析判断）\u003c/p>\n\u003cp class=\"translation\">这篇最值得留意的是，\u003cstrong>子产守住了“入城必须消除军事威胁”这个条件，同时给迎亲留下了余地。\u003c/strong>楚方一直强调婚礼、身份、祖先；子羽则把交涉拉回到小国安全和大国信用上。最后，双方用“垂櫜而入”解决了眼前的冲突。\u003c/p>\n\u003cp class=\"translation\">原文核对：\u003ca href=\"https://m.gushiwen.cn/shiwenv_664e33a624c2.aspx\" target=\"_blank\" rel=\"noopener\">古文岛《子产却楚逆女以兵》\u003c/a>。\u003c/p>\n\u003cp class=\"translation\">归档核对：2026年11月15日，依据本会话可见的完整讲解及最后确认的模板样例核对。全文逐句译文和重要字词解释均予保留；题意说明移至篇末，背景保留3句。本会话没有需要另行合并的正文修订或文章追问。\u003c/p>\n\u003c/details>"}, {"id": "v02-14", "volume": 2, "volume_title": "卷二 · 周文", "number": 14, "title": "子革对灵王", "file": "卷二/14-子革对灵王.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《子革对灵王》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·昭公十二年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前530年，楚灵王率军驻扎乾溪，派兵围攻徐国以威慑吴国。楚灵王原名围，曾杀死侄子郏敖夺取王位；右尹子革名郑丹，是楚国大臣。本文记述子革如何借周穆王的故事劝楚灵王节制欲望。\u003c/p>\n\u003ch2>一、楚灵王出兵威慑吴国\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>楚子狩（shòu）于州来，次于颍（yǐng）尾。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王到州来举行冬季狩猎，把军队驻扎在颍尾。“楚子”指楚灵王。“狩”是冬天打猎；“次”是军队驻扎。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>使荡侯、潘子、司马督、嚣（xiāo）尹午、陵尹喜帅师围徐，以惧吴。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王派荡侯、潘子、司马督、嚣尹午和陵尹喜五位楚国大臣，率领军队包围徐国，以威慑吴国。徐国是一个小国，与吴国关系密切。楚灵王围攻徐国，真正想威胁的是吴国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>楚子次于乾（gān）溪，以为之援。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王自己率军驻扎在乾溪，作为围攻徐国军队的后援。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>雨（yù）雪，王皮冠，秦复陶，翠被（pī），豹舄（xì），执鞭以出。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">天下着雪。楚灵王戴着皮帽，穿着秦国赠送的羽衣，披着翠鸟羽毛装饰的披肩，脚穿豹皮鞋，手持鞭子走出来。“雨雪”的“雨”读第四声，作动词，是下雪的意思。“秦复陶”是一种羽衣。“被”在这里指披肩。“舄”是古代的鞋。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>仆析父从。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国大臣析父跟随在楚灵王身后。\u003c/p>\n\u003ch2>二、楚灵王向周天子索取鼎\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>右尹子革夕，王见之，去冠被，舍鞭，与之语曰：\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚国右尹子革傍晚来拜见楚灵王。楚灵王接见他，摘下皮帽和披肩，放下鞭子，同他谈话。“右尹”是楚国官职。子革名郑丹。“夕”在这里是傍晚进见的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔我先王熊绎（yì），与吕伋（jí）、王孙牟、燮（xiè）父、禽父，并事康王，四国皆有分，我独无有。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王说：“从前我们的先祖熊绎，与齐国的吕伋、卫国的王孙牟、晋国的燮父、鲁国的禽父，一起侍奉周康王。其他四国都得到了周天子赏赐的珍贵器物，唯独楚国没有。”熊绎是楚国最初受周王室封爵的君主。吕伋是姜太公之子，王孙牟是卫康叔之子，燮父是晋唐叔之子，禽父即鲁国的伯禽，是周公之子。“分”指周天子赏赐诸侯的礼器、珍宝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今吾使人于周，求鼎以为分，王其与我乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在我派人到周王室去，请求把鼎作为赏赐给楚国的礼器，周天子会给我吗？”鼎是古代重要礼器，也是政治权威的象征。楚灵王索鼎，反映了他想提高楚国在天下诸侯中的地位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“与君王哉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子革回答：“当然会给大王啊！”子革并没有立即反对楚灵王，而是先顺着他的意思说。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“昔我先王熊绎，辟（pì）在荆山，筚（bì）路蓝缕（lǚ），以处草莽。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前我们的先祖熊绎居住在偏僻的荆山，乘坐简陋的柴车，穿着破旧的衣服，在荒野草丛中生活。”“辟”通“僻”，偏远。“筚路”指柴车，“蓝缕”指破衣服。“筚路蓝缕”这个成语就出自这里，比喻创业艰难。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“跋涉山林，以事天子。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“他们艰难地穿行于山林之间，去侍奉周天子。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“唯是桃弧、棘（jí）矢，以共（gōng）御王事。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“当时只能拿桃木制成的弓、酸枣木制成的箭，来供奉周王室、参与王室的事务。”“弧”是弓，“矢”是箭。“共”通“供”，指供奉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“齐，王舅也；晋及鲁、卫，王母弟也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“齐国与周王室有外戚关系；晋国、鲁国、卫国则都是周王室的亲近宗族。”这里的“王舅”“王母弟”，是从周王室的姻亲和宗亲关系来解释齐、晋、鲁、卫受到优待的原因，并非说这几位国君全都是周康王本人的舅父和同母弟弟。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“楚是以无分，而彼皆有。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此楚国没有得到赏赐，而其他四国都得到了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今周与四国服事君王，将唯命是从，岂其爱鼎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今周王室和这四个国家都要服侍大王，对大王唯命是从，难道还会舍不得一个鼎吗？”这里子革明显在奉承楚灵王。事实上，周天子与诸侯并没有臣服楚国。\u003c/p>\n\u003ch2>三、楚灵王又想索取郑国土地\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王曰：“昔我皇祖伯父昆吾，旧许是宅。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王说：“从前我远祖的伯父昆吾，曾经居住在许地。”“昆吾”是传说中楚国先祖的同族人物。这里楚灵王以先祖曾经居住过许地作为索取土地的理由。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今郑人贪赖其田，而不我与。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今郑国人贪图那里的土地，不肯把土地交给我。”“不我与”是宾语前置，正常语序是“不与我”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“我若求之，其与我乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果我向郑国索取这些土地，他们会给我吗？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“与君王哉！周不爱鼎，郑敢爱田？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子革回答：“当然会给大王！周天子连鼎都不吝惜，郑国哪里敢舍不得土地呢？”“爱”在这里是吝惜、舍不得的意思。\u003c/p>\n\u003ch2>四、楚灵王炫耀军事力量\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王曰：“昔诸侯远我而畏晋。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王说：“从前诸侯们疏远楚国，却害怕晋国。”春秋中后期，晋、楚两国长期争霸。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“今我大城陈、蔡、不羹（láng），赋皆千乘（shèng），子与（yù）有劳焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今我大规模修筑陈、蔡和不羹的城池，每处都能征发一千辆兵车。你也参与了这些工程，有功劳在其中。”“不羹”分为东不羹、西不羹两处，因此实际说的是四座军事重镇。“赋”指能够征发的军队。“乘”是古代兵车的计量单位。“与”是参与。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“诸侯其畏我乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“各国诸侯现在应该害怕我了吧？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“畏君王哉！是四国者，专足畏也。又加之以楚，敢不畏君王哉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子革回答：“当然害怕大王！仅仅这四座城邑的军事力量，就足以使诸侯畏惧了。再加上整个楚国，诸侯怎么敢不害怕大王呢！”\u003c/p>\n\u003ch2>五、子革等待进谏的时机\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>工尹路请曰：“君王命剥圭（guī）以为戚（qī）柲（bì），敢请命。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">负责工匠事务的官员路前来请示：“大王曾命令我们切割玉圭，用来装饰斧柄，现在冒昧地请大王进一步指示。”“圭”是一种玉制礼器。“戚”是斧，“柲”是柄。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王入视之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王进去察看这件事情。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>析父谓子革：“吾子，楚国之望也！今与王言如响，国其若之何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">析父对子革说：“您是楚国百姓寄予厚望的人！如今您同大王说话，就像回声一样，他说什么您便附和什么，楚国将来怎么办呢？”“吾子”是尊称，相当于“您”。“如响”是像回声一样应和。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>子革曰：“摩厉（lì）以须，王出，吾刃将斩矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子革说：“我正在磨快刀刃，等待时机。等大王出来，我的刀就要砍下去了。”“摩厉”就是磨砺，“须”是等待。这里的刀不是实际的武器，而是比喻即将用来劝谏楚王的话。“摩厉以须”后来成为成语，意思是充分做好准备，等待时机。\u003c/p>\n\u003ch2>六、子革借周穆王的故事劝谏\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王出，复语。左史倚（yǐ）相趋过。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王出来后，又继续同子革谈话。这时，左史倚相从旁边快步经过。“左史”是史官的官职，“倚相”是人名。“趋”是快步走。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王曰：“是良史也，子善视之。是能读《三坟》《五典》《八索》《九丘》。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王说：“这是一个优秀的史官，你应该好好看待他。他能够阅读《三坟》《五典》《八索》《九丘》这些古书。”这些都是传说中的上古典籍，具体内容和成书情况已经难以考证。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“臣尝问焉：昔穆王欲肆（sì）其心，周行天下，将皆必有车辙马迹焉。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子革回答：“我曾经问过他：从前周穆王想要放纵自己的欲望，周游天下，想让天下各地都留下他的车辙和马蹄印。”“肆”是放纵。“周行天下”是周游天下。周穆王是西周君主，后世有许多关于他巡游天下的传说。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“祭（zhài）公谋父作《祈招（qí sháo）》之诗，以止王心。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“当时祭公谋父写了一首《祈招》诗，用来劝止周穆王放纵的心。”祭公谋父是周穆王时期的王室大臣。“止王心”就是制止君王过度的欲望。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“王是以获没（mò）于祗（zhī）宫。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“周穆王因此得以在祗宫安享晚年，寿终正寝。”“没”在这里指去世。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“臣问其诗，而不知也。若问远焉，其焉能知之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我问倚相这首诗的内容，他却不知道。连这样的诗都不知道，又怎么可能知道更久远的事情呢？”子革表面上在质疑倚相的学问，实际上已经将话题引到《祈招》这首劝谏君王的诗上。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王曰：“子能乎？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王问：“那么你知道吗？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“能。其诗曰：”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子革回答：“知道。那首诗是这样说的。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“祈招之愔愔（yīn yīn），式昭德音。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">《祈招》的乐声安详和缓，彰显君王美好的德行。“愔愔”是安静、和缓的样子。“式”是语助词。“昭”是彰显。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“思我王度，式如玉，式如金。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">想想我们君王应当遵守的法度和应有的风范，应当像玉一样温润，像黄金一样坚实。“度”指君王的法度、行为准则。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“形民之力，而无醉饱之心。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">要衡量和节制百姓的力量，不要有那种只顾满足自己欲望、如同沉醉饱食一般贪得无厌的心。“形”有衡量、规范的意思。“醉饱之心”比喻贪图满足个人欲望的心理。楚灵王不断扩张、修筑城池、发动战争，已经大量耗费民力。子革借古诗提醒他：君王的欲望不能没有限度，国家的力量也不能无限消耗。\u003c/p>\n\u003ch2>七、楚灵王听懂了，却做不到\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>王揖而入，馈（kuì）不食，寝不寐，数日。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">楚灵王向子革作揖，随后回到里面。接连几天，送来的饭菜吃不下，晚上躺着也睡不着。“馈”是进献饮食，“寝不寐”是躺下睡不着。楚灵王显然听懂了子革的劝告，并且受到很大的触动。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不能自克，以及于难。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">但是他最终不能约束自己，因此遭遇了灾难。“克”是克制，“及于难”是遭遇祸难。公元前529年，楚国发生内乱，楚灵王众叛亲离，失去王位，最终自缢而死。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>仲尼曰：“古也有志：‘克己复礼，仁也。’信善哉！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">孔子说：“古人有这样的记载：‘能够克制自己的欲望，使自己的行为回归礼的规范，这就是仁。’这句话说得真好啊！”“仲尼”就是孔子。“志”是古代的记载。“信”是确实、真正。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“楚灵王若能如是，岂其辱于乾溪？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果楚灵王能够做到克己复礼，又怎么会在乾溪遭受这样的耻辱呢？”\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 楚灵王后来攻打徐国了吗？\u003c/p>\n\u003cp class=\"translation\">不是“后来才攻打”，而是本文开头已经记载楚灵王派五位将领率军围徐，自己驻扎乾溪担任后援。翌年《左传·昭公十三年》又记载：“楚师还自徐，吴人败诸豫章，获其五帅。”也就是楚军从徐国撤回时被吴军击败，五位将领被俘。楚国内乱、楚灵王覆亡也发生在这一年。这些属于《左传》的事件记载，与对楚王失败原因的评价应当区分。\u003c/p>\n\u003cp class=\"translation\">### 子革为什么不直接告诉楚王，周天子未必给鼎、郑国未必给地？\u003c/p>\n\u003cp class=\"translation\">本次会话中的追问指出：作为楚国重臣，子革应当对事实负责，不能只提供没有根据的肯定判断。他未必知道周天子和郑国实际会如何回应，却一再说“与君王哉”。从对话结构看，他先迎合再引《祈招》劝谏，希望把问题从“能不能得到”转向“即使能够得到，是否应当无限索取”。“摩厉以须”说明他有意识地等待劝谏时机；但这是关于言辞策略的文本分析，并不能证明他掌握周、郑的真实决策。劝谏技巧有效与否，也不能代替大臣如实报告情况的责任。楚王听后受到触动，却最终未能改变行为。\u003c/p>\n\u003cp class=\"translation\">### 为什么《祈招》的篇名和第一句都叫“祈招”？\u003c/p>\n\u003cp class=\"translation\">本次会话后来修订了逐句讲解中将“祈招之愔愔”解释为乐声安详的说法。传统杜预、孔颖达注疏另作解释：“祈”是官名，“招”是人名，指任祈父之职的招；“祈招之愔愔”可理解为此人安详和缓、彰显德行。也有不同古注，将“祈招”理解为求取昭明德行。篇名沿用首句的起首二字，因此并非诗在正文中重复念出自己的标题。这里保留原会话最初的逐句译文，并在讨论中注明后来的重要修订及异说。\u003c/p>\n\u003cp class=\"translation\">### “仲尼曰”是否表明《左传》由后世儒生编纂？\u003c/p>\n\u003cp class=\"translation\">故事发生在公元前530年，当时孔子约21岁；在篇末引用孔子评语，说明《左传》传世文本的叙述者是在后来以孔子思想评价这件史事。相关讨论认为，《左传》可能经过多阶段编纂，儒家后学参与增补“仲尼曰”“孔子曰”是值得研究的假说，但尚不能单凭这一句认定整部书由某一批儒生编造。应区分历史事件、人物对话的叙事加工，以及末尾的思想评论；目前未取得一份此段无“仲尼曰”的早期写本与后世本直接对照。\u003c/p>\n\u003cp class=\"translation\">《论语·颜渊》亦有“克己复礼为仁”；《左传》则称“古也有志”，并未明确将这句话说成孔子原创。《左传》以孔子名义作出的历史论赞还有其他多处，但“评论归属孔子”与“确证孔子本人曾说”仍是不同问题。\u003c/p>\n\u003c/details>"}, {"id": "v02-15", "volume": 2, "volume_title": "卷二 · 周文", "number": 15, "title": "子产论政宽猛", "file": "卷二/15-子产论政宽猛.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《子产论政宽猛》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·昭公二十年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前522年前后，郑国子产病重，向继任者子大叔谈治理中的宽与猛。子大叔起初一味宽缓，盗患发生后转用严厉手段，文末又引“仲尼曰”讨论两者如何相济。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郑子产有疾。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国的子产生病了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>谓子大叔（tài shū）曰：“我死，子必为政。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他对子大叔说：“我死后，您一定会执掌政事。”子大叔即游吉。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>唯有德者能以宽服民，其次莫如猛。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“只有有德行的人能够用宽缓使百姓服从，其次的办法没有比严厉更有效的了。”“猛”指严厉的政令和刑罚。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫火烈，民望而畏之，故鲜（xiǎn）死焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“火很猛烈，百姓一看就害怕，所以很少有人死在火里。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>水懦弱，民狎（xiá）而玩之，则多死焉，故宽难。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“水看起来柔弱，人们亲近轻玩，死在里面的反而很多，所以宽政难行。”“狎”是轻忽地亲近。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>疾数月而卒。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子产病了几个月后去世。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大叔（tài shū）为政，不忍猛而宽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子大叔执政，不忍严厉，实行宽缓的政策。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>郑国多盗，取人于萑苻（huán fú）之泽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">郑国盗贼增多，在萑苻草泽里劫掠行人。“取人”在这里指劫取人财。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>大叔（tài shū）悔之，曰：“吾早从夫子，不及此。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">子大叔后悔，说：“我若早听从先生，就不至于这样。”先生指子产。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>兴徒兵以攻萑苻（huán fú）之盗，尽杀之，盗少止。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他征发步兵攻打草泽里的盗贼，把他们全部杀死，盗患才稍稍止息。“少”是稍微。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>仲尼曰：“善哉！\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">仲尼说：“好啊！”这里是《左传》以“仲尼曰”引出的评论。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>政宽则民慢，慢则纠之以猛。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“政令宽缓，百姓就会懈怠；懈怠了，就用严厉来纠正。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>猛则民残，残则施之以宽。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“严厉了，百姓又受到伤害；受到伤害，就应当施以宽缓。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>宽以济猛；猛以济宽，政是以和。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“用宽缓补救严厉，用严厉补救宽缓，政治因此达到调和。”“济”是补助、调节。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>《诗》曰：‘民亦劳止，汔（qì）可小康；惠此中国，以绥（suí）四方。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“《诗经》说：‘百姓已经劳苦，庶几可以稍得安宁；施惠于京师，安抚四方。’”“中国”在这首诗中指王朝中心区域。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>施之以宽也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这是说施行宽政。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>‘毋从诡随，以谨无良；式遏（è）寇虐，惨不畏明。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘不要听从欺诈苟随之人，要警惕那些无良者；遏止侵夺暴虐和那些不畏明法的人。’”“惨”在这里旧释为曾、竟，并非悲惨。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>纠之以猛也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这是说用严厉来纠正。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>‘柔远能迩（ěr），以定我王。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“‘安抚远方，亲善近处，以安定我们的王室。’”“能”在这里取亲善之意。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>平之以和也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这是说用调和使政治平定。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>又曰：‘不竞不絿（qiú），不刚不柔，布政优优，百禄是遒（qiú）。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“又说：‘不逞强，不急躁，不僵硬，不软弱，施政宽和，各种福禄都汇聚而来。’”“絿”是急，“遒”是聚集。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>和之至也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“这就是调和的最高境界。”以上诗句是评论所引的政治理想。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及子产卒，仲尼闻之，出涕曰：“古之遗爱也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">等到子产去世，仲尼听说，流泪说：“他有古代贤者遗留下来的仁爱啊。”“遗爱”是说承续古人的爱民风范。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">这里的“宽”“猛”说的是治理手段，不等于现代意义的正义与不正义。文中对镇压盗贼的叙述、借孔子之口作出的评论以及现代读者对刑罚的评价，应当分开；仅凭“仲尼曰”也不能证明这段话就是孔子的逐字实录。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷2)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷2\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v02-16", "volume": 2, "volume_title": "卷二 · 周文", "number": 16, "title": "吴许越成", "file": "卷二/16-吴许越成.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《吴许越成》\u003c/h1>\n\u003cp class=\"translation\">选自《左传·哀公元年》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前494年，吴王夫差击败越国，勾践退守会稽，托人求和。伍员以少康复国的故事劝夫差不要留下强敌，夫差没有采纳。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴王夫差败越于夫椒，报槜（zuì）李也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴王夫差在夫椒打败越军，是报复从前槜李之战的失败。夫差之父阖闾在槜李受伤后死去。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂入越。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴军于是进入越国。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>越子以甲楯（jiǎ dùn）五千保于会稽（kuài jī），使大夫种因吴太宰嚭（pǐ）以行成。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">越王勾践带着五千名披甲持盾的士兵退守会稽，派大夫文种通过吴国太宰伯嚭来求和。“因”是通过，“行成”是求和。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吴子将许之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">吴王准备答应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>伍员（yún）曰：“不可。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">伍员说：“不可以。”伍员就是伍子胥。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>臣闻之：‘树德莫如滋，去疾莫如尽。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我听说：‘培植德行，没有比使它滋长更好的；除去祸患，没有比彻底清除更好的。’”“疾”在这里指祸患。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔有过（yǒu guō）浇（ào）杀斟灌以伐斟鄩（zhēn xún），灭夏后相（hòu xiàng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“从前有过国的浇杀灭斟灌，再讨伐斟鄩，灭掉夏君相。”有过、斟灌、斟鄩都是古国名；这是人物引用的夏代传说叙事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>后缗（mín）方娠（shēn），逃出自窦（dòu），归于有仍，生少康（shào kāng）焉，为仍牧正。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“相的妻子后缗正在怀孕，从墙洞逃出，回到有仍国，生下少康；少康后来担任有仍的牧正。”牧正是主管畜牧的官员。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>惎（jì）浇（ào）能戒之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“少康把浇看作祸害，能够戒备他。”“惎”指毒害、敌害。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>浇（ào）使椒求之，逃奔有虞，为之庖（páo）正，以除其害。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“浇派椒追寻少康，少康逃到有虞国，担任庖正，从而躲开危害。”庖正主管膳食。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>虞思于是妻之（qì zhī）以二姚，而邑诸纶（lún），有田一成，有众一旅。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“有虞国国君虞思把两个女儿嫁给少康，并把纶地封给他，他有方十里的田地、五百人的民众。”“一成”“一旅”分别是土地和人数的单位。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>能布其德，而兆其谋，以收夏众，抚其官职；使女艾（rǔ ài）谍浇（ào），使季杼（zhù）诱豷（yì），遂灭过、戈，复禹之绩。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“少康能广布德惠，开始谋划复国，收集夏的遗民，整顿官职；派女艾侦察浇，派季杼诱击豷，终于灭掉过、戈两国，恢复禹的功业。”季杼是少康之子；“谍”是侦察。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>祀夏配天，不失旧物。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“祭祀夏的祖先配享上天，不失原有的基业。”“旧物”在这里指祖传的制度与事业。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今吴不如过，而越大于少康（shào kāng），或将丰之，不亦难乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今吴国不及当年的有过，越国又比少康的初起势力大，若再让越国壮大，岂不是会成为祸患吗？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>勾践能亲而务施，施不失人，亲不弃劳，与我同壤而世为仇雠（chóu chóu）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“勾践能够亲近部属、致力施惠，施惠能得其人，亲近而不抛弃有功劳者；他又与我们同处相邻的土地，世代为仇。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是乎克而弗取，将又存之，违天而长寇（zhǎng kòu）雠，后虽悔之，不可食已。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“现在战胜了却不取其国，反而还要使它保存，这是违背天赐的机会、养大仇敌；以后即使后悔，也不能收回已经作出的决定。”“食”有收回前言的意思。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>姬之衰也，日可俟（sì）也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“姬姓势力的衰败，恐怕指日可待了。”吴国王族为姬姓，这是伍员的警告。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>介在蛮夷，而长寇（zhǎng kòu）雠，以是求伯（qiú bà），必不行矣。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“吴国夹在诸夷之间，却让仇敌壮大，想靠这样称霸，一定行不通。”“伯”通“霸”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>弗听。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">夫差没有听从。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>退而告人曰：“越十年生聚，而十年教训，二十年之外，吴其为沼乎！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">伍员退下后对别人说：“越国用十年繁殖人口、积聚财力，再用十年教育训练，二十年之后，吴国恐怕要变成水泽了吧！”这里“教训”是教育训练，“为沼”比喻国家覆亡、宫室荒废。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">本篇与《申胥谏许越成》都反对吴越议和，但来自不同史书，叙事与措辞不能混作同一篇。少康故事在本篇承担劝谏的论证作用，不宜把其中每个细节都直接当作已有同时代证据证实的夏史。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷2)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷2\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003cp class=\"translation\">“浇”作为人名有读音分歧，本稿采用ào，亦见标作jiāo或依旧音标yào者。\u003c/p>\n\u003c/details>"}, {"id": "v03-01", "volume": 3, "volume_title": "卷三 · 周文", "number": 1, "title": "祭公谏征犬戎", "file": "卷三/01-祭公谏征犬戎.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《祭（zhài）公谏征犬戎（róng）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第1篇\u003cbr>选自《国语·周语上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">周穆王准备出兵犬戎，祭公谋父劝阻。祭公认为犬戎已经履行了应尽的义务，天子不能任意提高要求，再拿这个理由发动战争。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>穆王将征犬戎，祭（zhài）公谋父（fǔ）谏曰：“不可。先王耀德不观（guàn）兵。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周穆王准备征讨犬戎，祭公谋父劝他说：“不可以。先代贤明的君王彰显德行，不轻易炫耀武力。”\u003c/p>\n\u003cp class=\"translation\">“祭”是封邑名，此处读zhài；“谋父”中的“父”是古代男子的美称，读fǔ。“观兵”的“观”是展示，“兵”指兵力、武力。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫兵戢（jí）而时动，动则威；观则玩，玩则无震。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">军队平时应当收敛，到了适当的时候才出动，这样一旦出动，就有威慑力；如果经常拿来炫耀，人们就会轻慢它，轻慢了，也就不再害怕。\u003c/p>\n\u003cp class=\"translation\">“戢”是收敛、收藏；“时动”是适时出动；“玩”是轻慢；“震”是震慑、畏惧。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是故周文公之《颂》曰：“载戢干戈，载櫜（gāo）弓矢。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">所以，周文公的颂诗说：“收起盾牌和长戈，把弓箭装进袋里。”\u003c/p>\n\u003cp class=\"translation\">“周文公”就是周公旦。这里引用《诗经·周颂·时迈》，按本文的说法归于周公。“干”是盾牌；“櫜”本是收藏弓箭的袋子，此处作动词，指装入袋中收藏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“我求懿（yì）德，肆于时夏，允王保之！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我追求美好的德行，把它施行于华夏，君王确实能够因此保有天下！”\u003c/p>\n\u003cp class=\"translation\">“懿”是美好；“肆”是陈布、施行；“时”是这；“夏”按《古文观止》旧注解释为华夏；“允”是确实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>先王之于民也：茂正其德，而厚其性；阜（fù）其财求，而利其器用。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">先王对待百姓，努力端正他们的德行，使他们的性情敦厚；使他们的财物和生活所需充足，使他们使用的器具便利好用。\u003c/p>\n\u003cp class=\"translation\">“茂”在这里有勉力、努力的意思；“阜”是使丰富充足。“财求”指财物及生活所需。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>明利害之乡，以文修之，使务利而避害，怀德而畏威，故能保世以滋大。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">向百姓说明利益和祸害在哪里，用礼法教化他们，使他们努力谋求有益的事情，避开有害的事情，感念君王的恩德，敬畏君王的威严，所以王朝能够世代延续，日益壮大。\u003c/p>\n\u003cp class=\"translation\">“乡”是所在、方向；“文”指礼法教化；“怀”是感念；“滋”是更加、日益。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>昔我先世后稷（jì），以服事虞、夏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">从前，我们周人的祖先担任后稷之官，事奉虞舜和夏朝。\u003c/p>\n\u003cp class=\"translation\">“后稷”是掌管农业的官职，也用来称周人的始祖弃。这里概括的是周人祖先相继担任农官的传统，不必理解成一个人跨越两代王朝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及夏之衰也，弃稷弗务。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">到了夏朝衰落的时候，朝廷废弃农官的职守，不再重视农业。\u003c/p>\n\u003cp class=\"translation\">这里的“弃”是废弃，不能当作前面那位祖先“弃”的名字；“务”是致力于、重视。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>我先王不窋（zhú），用失其官，而自窜于戎、翟（dí）之闲。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我们的先祖不窋因此失去了官职，迁居到戎、狄各部族之间。\u003c/p>\n\u003cp class=\"translation\">“用”是因此；“窜”是逃往、迁往；“翟”同“狄”；“闲”同“间”。这里称先祖为“先王”，不表示他当时已经是天下共主。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>不敢怠业，时序其德，纂（zuǎn）修其绪，修其训典。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他们不敢荒废祖业，时常述说祖先的德行与功业，使后人记住、传承；接续经营祖先留下的事业，修明祖先的训诫和典章。\u003c/p>\n\u003cp class=\"translation\">“时”是时常、按时；“序”是陈述、述说。“纂”是继承；“绪”是前人留下的事业；“训典”是训诫与典章。“时序”在这里不是“时间顺序”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>朝夕恪（kè）勤，守以惇笃（dūn dǔ），奉以忠信。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">从早到晚恭敬勤勉，以敦厚笃实的态度守住祖业，以忠诚守信的态度奉行祖训。\u003c/p>\n\u003cp class=\"translation\">“恪”是恭敬、谨慎；“惇笃”是敦厚诚实。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>奕（yì）世载德，不忝（tiǎn）前人。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">一代又一代承继祖先的德行，不使前人蒙羞。\u003c/p>\n\u003cp class=\"translation\">“奕世”是累世、世世代代；“载”在这里是承继；“忝”是辱没。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>至于武王，昭前之光明，而加之以慈和，事神保民，莫不欣喜。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">到了周武王，又发扬前人的光明德行，并增添仁慈温和的品德，敬奉神灵，安养百姓，使大家无不欢喜。\u003c/p>\n\u003cp class=\"translation\">“昭”是彰明、发扬；“保民”是保护、安养百姓。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>商王帝辛，大恶（wù）于民，庶民弗忍，欣戴武王，以致戎于商牧。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">商王帝辛，也就是商纣王，深受百姓憎恶。百姓无法忍受，欢喜地拥戴武王，于是武王在商朝都城郊外的牧野发动战争。\u003c/p>\n\u003cp class=\"translation\">“大恶于民”是“大大地被百姓厌恶”；“戴”是拥戴；“戎”在这里指军事行动；“商牧”就是商郊牧野。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是先王非务武也；勤恤（xù）民隐，而除其害也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这说明先王并不是一心追求武力，而是深切体恤百姓的痛苦，为他们除去祸害。\u003c/p>\n\u003cp class=\"translation\">“务武”是专力于用武；“恤”是体恤、忧虑；“隐”在这里是痛苦。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫先王之制：邦内甸（diàn）服，邦外侯服，侯、卫宾服，蛮、夷要（yāo）服，戎、翟荒服。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按照先王的制度：王畿以内属于甸服，王畿以外较近的地区属于侯服，再向外属于宾服，蛮夷地区属于要服，更远的戎狄地区属于荒服。\u003c/p>\n\u003cp class=\"translation\">“服”指服事天子的关系，以及相应承担的职责。这一段提出的是以王畿为中心、按远近区分义务的制度观念。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>甸服者祭，侯服者祀，宾服者享，要服者贡，荒服者王（wàng）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">甸服地区供给日祭所需，侯服地区供给月祀所需，宾服地区供给时享所需，要服地区承担进贡义务，荒服地区则按规定前来朝见天子。\u003c/p>\n\u003cp class=\"translation\">“祭、祀、享”在这里对应不同的祭祀供奉。“王”作动词，指朝见天子，读wàng。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>日祭、月祀、时享、岁贡、终王，先王之训也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">按日供祭，按月供祀，按四时供享，每年进贡，世代交替时前来朝见，这是先王留下的训令。\u003c/p>\n\u003cp class=\"translation\">“时”是四时，即四季。“终王”按旧注解释，是一世终结、君位更替时履行朝见义务。其原则是：距离越远，要求越疏。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>有不祭，则修意；有不祀，则修言；有不享，则修文；有不贡，则修名；有不王，则修德。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如果有人不履行供祭的义务，天子先端正自己的心意；不履行供祀义务，就检讨自己的号令；不履行供享义务，就修明典章；不进贡，就整饬有关名分和职贡的规定；不来朝见，就修养自己的德行。\u003c/p>\n\u003cp class=\"translation\">这里连续五个“修”，先要求天子反省自身，检讨政令和制度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>序成而有不至，则修刑。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这些事情依次整顿完成以后，如果仍有人不履行义务，再制定相应的惩戒办法。\u003c/p>\n\u003cp class=\"translation\">“序成”指前面各项依次修整完备；“刑”在这里泛指惩戒的法度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是乎有刑不祭，伐不祀，征不享，让不贡，告不王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，对于不供祭的施以刑罚，对于不供祀的出兵攻伐，对于不供享的加以征讨，对于不进贡的予以责备，对于不朝见的则用文告晓谕。\u003c/p>\n\u003cp class=\"translation\">“让”是责备；“告”是告诫、晓谕。这里的处置也分远近轻重：对最远的荒服，用文告劝谕。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>于是乎有刑罚之辟（bì），有攻伐之兵，有征讨之备，有威让之令，有文告之辞。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，才有施行刑罚的法律、用于攻伐的军队、用于征讨的准备、严厉责备的命令，以及告知劝谕的文辞。\u003c/p>\n\u003cp class=\"translation\">“辟”是法律、刑法；“兵”是军队；“威让”是严厉责备。这五项与上一句的五种处置一一对应。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>布令陈辞，而又不至，则又增修于德，无勤民于远。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">命令已经颁布，劝谕的话也已经说明，如果远方的人仍不来，就进一步修养自己的德行，不要为了远方的事情劳苦百姓。\u003c/p>\n\u003cp class=\"translation\">“勤”在这里是使……劳苦；“无”相当于“毋”，不要。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是以近无不听，远无不服。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">因此，近处的人没有不听从的，远方的人没有不归服的。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>今自大毕、伯士之终也，犬戎氏以其职来王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">如今，自从犬戎的两位君长大毕、伯士去世以后，他们的继承者已经按照应尽的职责，前来朝见天子。\u003c/p>\n\u003cp class=\"translation\">大毕、伯士按旧注是犬戎的两位君长；“终”是去世。祭公在这里强调：犬戎已经履行了荒服的义务。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>天子曰：“予必以不享征之，且观（guàn）之兵。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">可是天子却说：“我一定要以他们不履行享礼为理由征讨他们，还要向他们展示武力。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>其无乃废先王之训，而王（wàng）几（jī）顿乎？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">这样做，恐怕是废弃先王的训令，使远方各族朝见天子的礼制也濒于败坏吧？\u003c/p>\n\u003cp class=\"translation\">“无乃……乎”是“恐怕……吧”；“顿”是败坏。这里的“王”承接“来王”，按《古文观止》旧注解释为朝见天子的礼制。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>吾闻夫犬戎树惇（dūn），能帅（shuài）旧德，而守终纯固；其有以御我矣。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">我听说犬戎崇尚敦厚，能够遵循祖先传下来的德行，并且始终专一、坚定地守住它；他们是有凭借来抵御我们的。\u003c/p>\n\u003cp class=\"translation\">“树”是树立；“惇”是敦厚；“帅”同“率”，这里是遵循；“纯固”是专一坚定；“有以”是有可以凭借的条件。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王不听，遂征之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周穆王没有听从劝告，还是出兵征讨犬戎。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>得四白狼、四白鹿以归。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">得到了四只白狼、四只白鹿，就回来了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>自是荒服者不至。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">从此，荒服地区的各族不再前来朝见天子。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">### 1、“时序”是什么意思？（后续修订）\u003c/p>\n\u003cp class=\"translation\">“时序”不是“时间顺序”，要分开解释：“时”是时常、按时；“序”是陈述、述说。“时序其德”就是时常述说祖先的德行与功业，使后人记住、传承。\u003c/p>\n\u003cp class=\"translation\">初次讲解译成“不断传承、发扬祖先的德行”，比较笼统；后续解释修订为更贴近字面的“时常讲述祖先的美德”。本篇逐句释义已采用这一后续修订。\u003c/p>\n\u003cp class=\"translation\">### 2、原文所说的德治与战争理由\u003c/p>\n\u003cp class=\"translation\">“勤恤民隐而除其害”是祭公对武王伐纣的解释：他把这场战争的正当性建立在救助百姓上。“近无不听，远无不服”是祭公所描述的理想效果：依靠适当的制度和德行，使远近各方愿意服从。这些是人物的论述，应与独立核实的历史事实区分。\u003c/p>\n\u003cp class=\"translation\">“享”是宾服的义务，犬戎作为荒服，承担的是“王”，即依规定朝见。祭公认为，穆王拿另一类地区的标准来要求犬戎，缺乏正当理由。此前讲解据此分析：要求别人服从之前，天子自己也必须遵守既定的规则；犬戎是否尽责，应当按它原来承担的义务判断。\u003c/p>\n\u003cp class=\"translation\">### 3、结尾能否证明周军战败？\u003c/p>\n\u003cp class=\"translation\">原文只交代得到四白狼、四白鹿，没有详细叙述战斗经过，不能据此断言周军具体怎样胜败。\u003c/p>\n\u003cp class=\"translation\">结尾“荒服者不至”照应了祭公的担忧：出兵原本想加强威势，结果连原有的朝见关系也遭到破坏。这是结合文章结构作出的阅读分析。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cul>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/祭公諫征犬戎\" target=\"_blank\" rel=\"noopener\">《祭公谏征犬戎》通行本文字\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/zh-hans/古文觀止/卷3\" target=\"_blank\" rel=\"noopener\">《古文观止》卷三原文与旧注\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://zh.wikisource.org/wiki/國語/卷01\" target=\"_blank\" rel=\"noopener\">《国语》卷一原文与旧注\u003c/a>\u003c/li>\u003c/ul>\n\u003c/details>"}, {"id": "v03-02", "volume": 3, "volume_title": "卷三 · 周文", "number": 2, "title": "召公谏厉王止谤", "file": "卷三/02-召公谏厉王止谤.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《召公（shào gōng）谏厉王止谤》\u003c/h1>\n\u003cp class=\"translation\">选自《国语·周语上》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">西周晚期，周厉王因暴政受到国人批评，便借卫国巫者监视并杀害批评者。召公以治水比喻疏导民意，劝王让人民说话，厉王没有听从。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>厉王虐，国人谤王。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周厉王施政暴虐，国人公开批评他。“谤”在这里是批评议论，不等于现代所说的捏造事实毁谤。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>召公（shào gōng）告曰：“民不堪命矣！”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">召公告诉厉王：“百姓不能承受您的政令了！”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王怒，得卫巫，使监谤者。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">厉王发怒，找来卫国的巫者，让他监视批评国君的人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>以告，则杀之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">巫者一报告，厉王就杀掉被告发的人。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>国人莫敢言，道路以目。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">国人没有人敢再说话，在路上相遇只敢交换眼色。“道路以目”写出恐惧下的沉默。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王喜，告召公（shào gōng）曰：“吾能弭（mǐ）谤矣，乃不敢言。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">厉王很高兴，对召公说：“我能消除批评了，他们不敢再说了。”“弭”是消除。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>召公（shào gōng）曰：“是障之也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">召公说：“这只是把它堵住了。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>防民之口，甚于防川。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“堵住百姓的嘴，比堵塞河流还危险。”这里的“甚”突出后果的严重。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>川壅（yōng）而溃，伤人必多，民亦如之。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“河流被堵后决口，伤人必然很多，百姓的情形也是这样。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>是故为川者决之使导，为民者宣之使言。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以治水的人疏通河道使水流通，治理百姓的人开导言路让他们说话。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故天子听政，使公卿至于列士献诗，瞽（gǔ）献曲，史献书，师箴（zhēn），瞍（sǒu）赋，曚（méng）诵，百工谏，庶人传语，近臣尽规，亲戚补察，瞽（gǔ）、史教诲，耆（qí）、艾修之，而后王斟酌焉，是以事行而不悖。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“因此天子听取政事，让公卿直到列士献诗，盲乐师献曲，史官献书，乐师进箴，瞍者赋诗，矇者诵谏，百官进谏，平民传达意见，近臣尽力规劝，宗亲补察过失，乐官史官加以教诲，年高有德者整治修订，然后王再斟酌，所以政事能够实行而不违背道理。”这些是文本列举的多层进言渠道。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>民之有口，犹土之有山川也，财用于是乎出；犹其原隰（xí）之有衍沃也，衣食于是乎生。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“百姓有嘴，就像土地有山川，财物资用从那里产生；又像高原低地有平旷肥沃的部分，衣食从那里生长。”“隰”是低湿之地。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>口之宣言也，善败于是乎兴。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“人民开口表达意见，政治的善恶成败也由此显现。”“善败”指好的和坏的结果。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>行善而备败，其所以阜（fù）财用衣食者也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“实行善政、防备败政，正是增厚财物衣食的办法。”“阜”是增多。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>夫民虑之于心而宣之于口，成而行之，胡可壅（yōng）也？\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“百姓心里思虑而从口中表达，考虑成熟便付诸行动，怎么可以堵住呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>若壅（yōng）其口，其与能几何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果堵住他们的嘴，又能维持多久呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王不听，于是国人莫敢出言。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">厉王没有听从，于是国人没有人敢公开说话。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>三年，乃流王于彘（zhì）。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">三年以后，国人便把厉王赶到彘地。“流”在这里是放逐。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">本文要求国君允许进言，仍是在王政框架内论述，并不等同于现代制度的一整套言论自由保障。译文保留这一历史语境，同时不把“谤”误译为造谣。\u003c/p>\n\u003c/details>\n\u003cdetails class=\"notes\">\u003csummary>核对来源\u003c/summary>\n\u003cp class=\"translation\">本文为2026年11月18日新补译，不属于旧会话译文。原文按《古文观止》选篇范围校读，转为简体通行字；标点按语意整理。\u003c/p>\n\u003cp class=\"translation\">原文参照：\u003ca href=\"https://zh.wikisource.org/wiki/古文觀止/卷3)；电子语料参照：[chinese-poetry《古文观止》](https://github.com/chinese-poetry/chinese-poetry/blob/master/蒙学/guwenguanzhi.json\" target=\"_blank\" rel=\"noopener\">维基文库《古文观止》卷3\u003c/a>。译文和词释为本次新写。\u003c/p>\n\u003c/details>"}, {"id": "v03-03", "volume": 3, "volume_title": "卷三 · 周文", "number": 3, "title": "襄王不许请隧", "file": "卷三/03-襄王不许请隧.md", "text_origin": "旧译归档", "ready": true, "html": "\u003ch1>《襄王不许请隧（suì）》\u003c/h1>\n\u003cp class=\"translation\">卷三 · 周文 · 第3篇\u003cbr>选自《国语·周语中》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">公元前635年，晋文公重耳帮助周襄王平定王室内乱、恢复王位。周襄王准备赏赐土地，晋文公却请求使用天子专享的墓道礼制。周襄王如何拒绝这位有功而强大的诸侯，便是本文的主要内容。\u003c/p>\n\u003ch2>一、晋文公请隧\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>晋文公既定襄王于郏（jiá），王劳（lào）之以地，辞，请隧（suì）焉。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋文公帮助周襄王在郏地恢复王位，周襄王以土地作为赏赐，慰劳晋文公。晋文公推辞了土地赏赐，转而请求天子专用的墓道礼制。“定”是安定、使恢复王位；“劳”是慰劳；“辞”是推辞。\u003c/p>\n\u003cp class=\"translation\">这里晋文公并非不想获得赏赐，而是希望获得比土地更有象征意义的东西——天子的礼制待遇。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王弗许，曰：“昔我先王之有天下也，规方千里，以为甸（diàn）服。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周襄王不答应，说：“从前我们的先王拥有天下时，划定都城周围方圆千里的土地，作为王畿。”“规”是规划、划定；“甸服”是天子直接控制的王畿地区。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“以供上帝山川百神之祀，以备百姓兆民之用，以待不庭、不虞（yú）之患。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“用这些土地的赋税，供奉天神、山川和各种神灵，供给百官和民众所需的财物，并防备不服从王命以及意外发生的灾患。”“不庭”是不来朝、不服从王命；“不虞”是意料不到的事。\u003c/p>\n\u003cp class=\"translation\">周襄王强调：先王拥有土地，是为了履行天子的责任，不是为了个人享乐。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“其余，以均分公、侯、伯、子、男，使各有宁宇，以顺及天地，无逢其灾害。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“其余的土地，则按照制度分封给公、侯、伯、子、男各级诸侯，使他们各有安居治理的国土，能够顺应天地之道，避免灾害。”“宁宇”是安定的居处、疆土。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“先王岂有赖焉？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我们的先王难道从中谋取了什么私利吗？”“赖”在这里是利益、好处。\u003c/p>\n\u003cp class=\"translation\">这是一句反问，强调先王的制度并非为了满足个人欲望。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“内官不过九御，外官不过九品，足以供给神祇（qí）而已。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“宫廷中的女官不过九御，朝廷的官员不过九品，只求足以供奉天地神灵罢了。”“神祇”是天地神灵，其中“祇”指地神。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“岂敢厌（yàn）纵其耳目心腹，以乱百度？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“哪里敢一味满足自己的耳目口腹之欲，扰乱各种礼法制度呢？”“厌”通“餍”，是满足；“纵”是放纵；“百度”是各种法度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“亦唯是死生之服物采章，以临长（zhǎng）百姓而轻重布之，王何异之有？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“只有生前和死后的服饰、器物及其纹饰，才按等级加以区分，用来体现统治百姓的尊卑秩序。除此以外，天子还有什么特殊之处呢？”“服物”指服饰器物；“采章”指色彩纹饰；“轻重布之”是按照尊卑等级配置。\u003c/p>\n\u003cp class=\"translation\">这是第一段最关键的一句话。周襄王的意思是：天子与诸侯的区别，恰恰体现在这些礼制上。如果连天子的葬礼都可以随意赐予诸侯，那么天子与诸侯还有什么区别？\u003c/p>\n\u003ch2>二、周襄王以退为进\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>“今天降祸灾于周室，余一人仅亦守府，又不佞（nìng）以勤叔父，而班先王之大物，以赏私德。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如今上天给周王室降下灾祸，我勉强保住祖先留下的基业，又因为自己无能而劳烦叔父。如果因此把先王的重要礼制颁赐出去，用来酬谢私人恩德……”\u003c/p>\n\u003cp class=\"translation\">“余一人”是天子的自称；“不佞”是自谦无能；“叔父”是周天子对同姓诸侯的一种尊称；“班”同“颁”；“大物”在这里指天子专享的重要礼制。\u003c/p>\n\u003cp class=\"translation\">周襄王承认晋文公有恩，但他把问题从私人报恩转到了祖先制度。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“其叔父实应且憎，以非（fěi）余一人，余一人岂敢有爱也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“那么叔父实际上应当厌恶这种行为，并责备我才对。我个人哪里敢吝惜什么呢？”“非”是责备、认为不对；“爱”是吝惜。\u003c/p>\n\u003cp class=\"translation\">这句话非常巧妙：周襄王不是说“我不愿意给你”，而是说“我若给你，就是破坏祖制，你反而应该批评我”。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“先民有言曰：‘改玉改行（xíng）。’”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“古人有句话说：‘改变佩玉的等级，就要改变相应的行步礼仪。’”\u003c/p>\n\u003cp class=\"translation\">这句话强调身份地位与礼仪必须相称。身份变了，礼仪才能随之改变。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“叔父若能光裕大德，更姓改物，以创制天下，自显庸也，而缩取备物，以镇抚百姓。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果叔父能够发扬伟大的德行，改朝换代，创立天下的新制度，彰显自己的功业，那么就可以取得天子的全套礼仪器物，用来安抚天下百姓。”\u003c/p>\n\u003cp class=\"translation\">“光裕”是发扬光大；“更姓改物”是更换王朝、改变制度；“备物”是天子所用的全套礼制器物。\u003c/p>\n\u003cp class=\"translation\">注意，周襄王实际上说出了一句非常厉害的话：你如果要享受天子的礼制，除非你自己取代周王室，成为天子。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“余一人其流辟（bì）于裔（yì）土，何辞之与有？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“那我即使被流放到边远地区，又有什么可推辞的呢？”“流辟”是流放、避居；“裔土”是边远之地。\u003c/p>\n\u003cp class=\"translation\">这句话把晋文公逼到了一个尴尬的位置：如果坚持要求天子礼制，就仿佛有取代周天子的野心。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若犹是姬姓也，尚将列为公侯，以复先王之职，大物其未可改也。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果叔父仍然属于姬姓诸侯，还要继续位列公侯，履行先王规定的职守，那么这些重要礼制恐怕就不能改变。”\u003c/p>\n\u003cp class=\"translation\">晋文公与周天子同属姬姓宗族。周襄王提醒他：你既然承认自己是周王朝的诸侯，就应当遵守诸侯的礼制。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“叔父其茂昭明德，物将自至。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“叔父只要努力发扬光明的德行，应该得到的待遇自然会到来。”“茂”是勉力；“昭”是彰显。\u003c/p>\n\u003cp class=\"translation\">这句话表面是在勉励晋文公，实际是在劝他不要强求越礼之事。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“余敢以私劳变前之大章，以忝（tiǎn）天下，其若先王与百姓何？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“我怎么敢因为叔父对我个人有功劳，就改变先王制定的重要典章制度，辱没天下呢？这样又如何面对先王和天下百姓呢？”\u003c/p>\n\u003cp class=\"translation\">“私劳”是对个人的功劳；“大章”是重要制度；“忝”是辱没。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“何政令之为也？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果这样做，我还凭什么发布政令、治理天下呢？”\u003c/p>\n\u003cp class=\"translation\">这是一句反问：如果天子自己都破坏祖制，政治权威也就没有了。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>“若不然，叔父有地而隧焉，余安能知之？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“如果叔父不这样想，您有自己的土地，要在那里修建天子式的墓道，我又怎么能知道呢？”\u003c/p>\n\u003cp class=\"translation\">这是整篇最耐人寻味的一句话。周襄王并不是正式批准晋文公修建隧道，而是在说：如果你在自己领地里私自这么做，我也未必能干涉。\u003c/p>\n\u003cp class=\"translation\">其中既有原则上的坚持，也流露出周王室实力衰弱、难以约束强大诸侯的现实。\u003c/p>\n\u003ch2>三、晋文公放弃请求\u003c/h2>\n\u003cp class=\"original\">\u003cstrong>文公遂不敢请，受地而还。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">晋文公于是再也不敢请求天子的葬礼，接受周襄王赏赐的土地，返回晋国。\u003c/p>\n\u003cp class=\"translation\">一个“不敢”，就说明周襄王这番话起到了作用。\u003c/p>\n\u003cdetails class=\"notes\">\u003csummary>阅读讨论\u003c/summary>\n\u003cp class=\"translation\">\u003cstrong>礼制与权力。\u003c/strong> 本文的中心问题是：晋文公帮助天子恢复王位，能否因此获得天子专享的礼制特权？周襄王在文中坚持，生死服物等礼制正是区分天子与诸侯的标志；赏赐功劳不能变更名分。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>与《子产却楚逆女以兵》比较。\u003c/strong> 本会话曾提出，两篇都涉及弱势一方以外交辞令应对强势者的要求。子产借助大国信用，周襄王诉诸宗法礼制。这里的比较是阅读分析，不是原文直接陈述。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>“改玉改行”的潜在逻辑。\u003c/strong> 此句在文章中强调礼仪须与身份相符；从现代阅读角度，还可追问：既然更换王朝可以重新制定礼制，礼制是否绝对不可改变？这属于由原文引出的讨论，而非可直接断言的作者立场。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>“余安能知之”的两面性。\u003c/strong> 文中周襄王拒绝正式授予特权，但又以“我怎么能知道”回应在封地私行的可能。把这理解为原则与现实之间的妥协，是对话策略的分析，不等于史实证明周王允许晋文公私自僭礼。\u003c/p>\n\u003cp class=\"translation\">\u003cstrong>史料界限。\u003c/strong> 本文选自《国语》，是历史对话的传世记载；不能仅凭这篇文字断定周襄王当年逐字说过这些话。\u003c/p>\n\u003c/details>\n\u003ch2>整理说明\u003c/h2>\n\u003cp class=\"translation\">本篇依据本会话已完成的逐句注音、译文和字词解释整理，采用随后确认的2—3句背景版本；只合并段落和调整格式，没有据摘要新写缺失译文。原讲解曾提示通行文本与纸质底本未逐字校核，故本文不声称已完成逐字异文核验。\u003c/p>"}, {"id": "v03-04", "volume": 3, "volume_title": "卷三 · 周文", "number": 4, "title": "单子知陈必亡", "file": "卷三/04-单子知陈必亡.md", "text_origin": "新补译", "ready": true, "html": "\u003ch1>《单（shàn）子知陈必亡》\u003c/h1>\n\u003cp class=\"translation\">选自《国语·周语中》。\u003c/p>\n\u003ch2>背景简介\u003c/h2>\n\u003cp class=\"translation\">春秋时期，周定王派单襄公出使宋国，单襄公又借道陈国前往楚国。陈国荒废道路农事、怠慢使臣，国君却忙于到夏氏家中享乐，单襄公据此判断陈国将发生严重祸乱。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>定王使单（shàn）襄公聘于宋。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周定王派单襄公到宋国进行外交访问。单襄公是周王室卿士，名朝。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>遂假道于陈，以聘于楚。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">他于是借道陈国，准备再到楚国访问。“假道”是借路，不是虚假的道路。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>火朝觌（zhāo dí）矣，道茀（fú）不可行也。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">大火星已经在清晨出现，路上却长满野草，难以通行。这里以星象标识入冬前后的农事时节，“火”不是地上的火焰，“觌”是看见。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>候不在疆，司空不视涂，泽不陂，川不梁，野有庾（yǔ）积，场功未毕，道无列树，垦田若艺，膳宰不致饩（xì），司里不授馆，国无寄寓，县无旅舍。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">迎候官不在边境，司空不查看道路，水泽没有修堤防，河上没有架桥，谷物露积野外，打谷场的事务还未完成；路旁没有标示道路的树，开垦的田地稀疏荒芜；膳宰不送粮牲，司里不安排馆舍，城中没有客寓，郊县没有旅舍。“庾积”是露天积存谷物，“饩”是供给宾客的生粮牲畜。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>民将筑台于夏氏。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">百姓却将要到夏氏那里筑台。夏氏指陈国大夫夏征舒之家。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>及陈，陈灵公与孔宁、仪行父（háng fǔ）南冠以如夏氏，留宾不见。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">到了陈都，陈灵公与大夫孔宁、仪行父戴着楚式帽子前往夏氏，把来宾留着，不予接见。“如”是往，“南冠”指楚冠。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>单（shàn）子归，告王曰：“陈侯不有大咎，国必亡。”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">单襄公回去后告诉周王：“陈侯若不遭大祸，陈国就一定会亡。”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>王曰：“何故？”\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">周王问：“为什么呢？”\u003c/p>\n\u003cp class=\"original\">\u003cstrong>对曰：“夫辰角见而雨毕，天根见而水涸（hé），本见而草木节解，驷见而陨霜，火见而清风戒寒。\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">单襄公回答：“角星清晨出现，雨季就结束；天根出现，积水便干涸；氐星出现，草木枝叶开始脱落；房星出现，就开始降霜；大火星出现，清风便提醒人们防寒。”辰角、天根、本、驷、火都是古人用来识别时令的星象名称。\u003c/p>\n\u003cp class=\"original\">\u003cstrong>故《先王之教》曰：‘雨毕而除道，水涸（hé）而成梁，草木节解而备藏，陨霜而冬裘具，清风至而修城郭宫室。’\u003c/strong>\u003c/p>\n\u003cp class=\"translation\">“所以先王的教导说：‘雨季结束便整治道路，积水干涸便修桥，草木脱落便准备收藏，降霜便备齐冬衣，清风到来便修葺城郭宫室。’”\u003c/p>\n
